<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Composer 与运行目标 Demo</title>
<style>
/* ---- 主题 token：取自 apps/desktop/src/renderer/styles/tokens.css；composer-* 为 06 文档新增 ---- */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --bg: #f7f7f5; --surface: #ffffff; --surface-subtle: #f1f1ef; --surface-raised: #ffffff;
  --hover: #eaeae7; --selected: #e4e4e1;
  --border: #deded9; --border-strong: #8c8c85;
  --text: #20201e; --muted: #676762; --faint: #72726b; --subtle: #85857e;
  --action: #20201e; --on-action: #ffffff;
  --operational: #087a4b; --warning: #91600e; --warning-soft: #f7eedb; --danger: #c74747; --info: #3978b8;
  --operational-soft: #e5f2ea; --on-tint: #ffffff;
  --shadow-popover: 0 24px 64px rgba(20, 21, 18, 0.14);
  --composer-border: rgb(0 0 0 / 0.07);
  --composer-border-focus: rgb(0 0 0 / 0.11);
  --shadow-composer: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px -4px rgb(0 0 0 / 0.06);
  --shadow-composer-focus: 0 1px 2px rgb(0 0 0 / 0.05), 0 8px 28px -6px rgb(0 0 0 / 0.10);
  --radius: 18px;
}
:root[data-theme="dark"] {
  --bg: #181916; --surface: #242522; --surface-subtle: #292a26; --surface-raised: #30312d;
  --hover: #2a2b27; --selected: #30312d;
  --border: #353630; --border-strong: #787870;
  --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle: #787870;
  --action: #f1f1ed; --on-action: #181916;
  --operational: #36c783; --warning: #d2a14d; --warning-soft: #3e321c; --danger: #e06b6b; --info: #6ca6da;
  --operational-soft: #193a2b; --on-tint: #181916;
  --shadow-popover: 0 24px 64px rgba(0, 0, 0, 0.5);
  --composer-border: rgb(255 255 255 / 0.07);
  --composer-border-focus: rgb(255 255 255 / 0.12);
  --shadow-composer: 0 1px 2px rgb(0 0 0 / 0.30), 0 6px 20px -6px rgb(0 0 0 / 0.40);
  --shadow-composer-focus: 0 1px 2px rgb(0 0 0 / 0.35), 0 10px 32px -6px rgb(0 0 0 / 0.55);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 13px; height: 13px; }
svg.i.lg { width: 18px; height: 18px; stroke-width: 2.1; }
button { font: inherit; color: inherit; }

/* ---- demo 控制条（不属于设计本身） ---- */
.demo-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; background: var(--surface-subtle); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.demo-bar b { color: var(--text); font-weight: 600; margin-right: 4px; }
.ctl { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 9px; border-radius: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

/* ---- 舞台 ---- */
.stage { padding: 24px 16px 8px; }
.window { max-width: 980px; margin: 0 auto; height: 620px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.window-title { height: 36px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--faint); border-bottom: 1px solid var(--border); }
.col { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 24px; }
.col.initial { justify-content: center; padding-bottom: 60px; }
.greet { text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 18px; color: var(--text); }
.messages { flex: 1; min-height: 0; overflow: auto; padding: 24px 0 12px; display: flex; flex-direction: column; gap: 18px; }
.bubble { align-self: flex-end; max-width: 70%; background: var(--surface-subtle); padding: 8px 12px; border-radius: 14px; font-size: 14px; }
.reply { color: var(--text); font-size: 14px; }
.reply p { margin: 0 0 8px; }
.line { height: 9px; border-radius: 5px; background: var(--hover); margin: 9px 0; }
.thinking { font-size: 13px; color: var(--faint); display: inline-flex; gap: 6px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 9px; background: var(--operational); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.dock { flex: none; padding-bottom: 14px; }

/* ---- 运行目标行（新） ---- */
.target-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 0 0 8px 4px; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; max-width: 260px; }
.tb span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb:hover, .tb[aria-expanded="true"] { background: var(--hover); color: var(--text); }
.tb:focus-visible, .mi:focus-visible, .ib:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 1px; }
.tb .chev { opacity: .6; }
.tb .state { font-size: 12px; color: var(--faint); display: inline-flex; align-items: center; gap: 5px; }

/* ---- 状态点 ---- */
.dot { width: 7px; height: 7px; border-radius: 9px; flex: none; display: inline-block; }
.dot.connected { background: var(--operational); }
.dot.connecting { background: var(--warning); animation: pulse 1.2s infinite; }
.dot.offline { border: 1.5px solid var(--subtle); }
.dot.revoked, .dot.incompatible, .dot.removed { background: var(--danger); }

/* ---- Composer（新） ---- */
.panel { position: relative; background: var(--surface); border: 1px solid var(--composer-border); border-radius: var(--radius); box-shadow: var(--shadow-composer); transition: box-shadow .14s ease, border-color .14s ease; }
.panel:focus-within { border-color: var(--composer-border-focus); box-shadow: var(--shadow-composer-focus); }
.panel.flat, .panel.flat:focus-within { box-shadow: none; }
.panel:not(.stacked):not(.old) { border-radius: 999px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 8px; border-radius: 7px; background: var(--surface-subtle); font-size: 12px; color: var(--muted); }
.chip .x { border: 0; background: transparent; padding: 2px; border-radius: 4px; cursor: pointer; color: var(--faint); display: inline-flex; }
.chip .x:hover { background: var(--hover); color: var(--text); }
.body { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "plus mode input send"; align-items: center; column-gap: 4px; padding: 8px; min-height: 46px; }
.panel:not(.stacked):not(.old) .model-btn { display: none; }
.panel.stacked .body { grid-template-columns: auto auto auto minmax(0, 1fr) auto; grid-template-areas: "input input input input input" "plus mode model . send"; row-gap: 6px; padding: 10px 8px 8px; }
.ta { grid-area: input; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 14px; line-height: 22px; color: var(--text); padding: 3px 4px; height: 28px; max-height: 200px; overflow-y: auto; }
.panel.stacked .ta { padding: 0 6px; }
.panel.initial .ta { min-height: 44px; }
.ta::placeholder { color: var(--subtle); }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
.ib:hover, .ib[aria-expanded="true"] { background: var(--hover); color: var(--text); }
.ib.plus { grid-area: plus; }
.mode-slot { grid-area: mode; display: flex; }
.mode-chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 8px; border-radius: 999px; font-size: 13px; }
.mode-chip.plan { background: var(--warning-soft); color: var(--warning); }
.mode-chip.chat { background: var(--operational-soft); color: var(--operational); }
.mode-chip button { border: 0; background: transparent; color: inherit; padding: 2px; border-radius: 999px; display: inline-flex; cursor: pointer; opacity: .75; }
.mode-chip button:hover { opacity: 1; background: rgb(0 0 0 / .06); }
.model-btn { grid-area: model; border: 0; background: transparent; display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 6px 0 8px; border-radius: 999px; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; max-width: 180px; }
.model-btn svg { opacity: .7; } .model-btn:hover svg { opacity: 1; }
.model-btn:hover, .model-btn[aria-expanded="true"] { background: var(--hover); color: var(--text); }
.send { grid-area: send; width: 28px; height: 28px; border-radius: 999px; border: 0; background: var(--action); color: var(--on-action); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.send.plan { background: var(--warning); color: var(--on-tint); }
.send.chat { background: var(--operational); color: var(--on-tint); }
.send:disabled { opacity: .3; cursor: not-allowed; }
.send svg.i { stroke-width: 2.4; }
.send .stop { width: 10px; height: 10px; border-radius: 2px; background: currentColor; }

/* ---- 状态行（对话中，只读） ---- */
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 0; font-size: 12px; color: var(--faint); }
.status .facts { display: flex; align-items: center; gap: 6px; min-width: 0; }
.status .fact { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.status .sep { opacity: .6; }
.status .perm { margin-left: 8px; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--faint); font-size: 12px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
.status .perm:hover { background: var(--hover); color: var(--text); }
.ctx { display: inline-flex; align-items: center; gap: 6px; }
.ring { width: 12px; height: 12px; border-radius: 99px; background: conic-gradient(var(--muted) 0 42%, var(--border) 42% 100%); }

/* ---- Review strip ---- */
.review { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 6px 8px; }
.review .add { color: var(--operational); font-weight: 500; }
.review .del { color: var(--danger); font-weight: 500; }
.review button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
.review button:hover { background: var(--hover); color: var(--text); }

/* ---- 队列托盘（新：输入框上方） ---- */
.tray { background: var(--surface); border: 1px solid var(--composer-border); border-radius: 12px; margin-bottom: 6px; padding: 2px 4px; max-height: 148px; overflow-y: auto; }
.tray-paused { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 4px 0 8px; font-size: 12px; color: var(--text); border-bottom: 1px solid var(--composer-border); }
.qr { display: flex; align-items: center; gap: 4px; min-height: 34px; padding: 0 2px 0 8px; font-size: 13px; }
.qr + .qr { border-top: 1px solid var(--composer-border); }
.qr .qi { color: var(--faint); display: inline-flex; }
.qr .qt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
.qr .meta { font-size: 12px; color: var(--faint); padding: 0 4px; white-space: nowrap; }
.qr .acts { display: inline-flex; align-items: center; gap: 2px; opacity: .55; transition: opacity .12s; }
.qr:hover .acts, .qr:focus-within .acts { opacity: 1; }
.qb { border: 0; background: transparent; color: var(--muted); font-size: 12px; height: 26px; padding: 0 8px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.qb:hover { background: var(--hover); color: var(--text); }
.qb.icon { width: 26px; padding: 0; justify-content: center; }
.qr.steering .qt { color: var(--muted); }
.qr .reading { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--operational); padding: 0 4px; white-space: nowrap; }
.qr .reading i { width: 6px; height: 6px; border-radius: 9px; background: var(--operational); animation: pulse 1.4s infinite; }

/* ---- 弹层 ---- */
.pop { position: fixed; z-index: 80; background: var(--surface-raised); border: 1px solid var(--composer-border-focus); border-radius: 10px; box-shadow: var(--shadow-popover); padding: 4px; font-size: 13px; color: var(--text); animation: popin .14s ease; max-height: 360px; overflow-y: auto; }
@keyframes popin { from { opacity: 0; transform: translateY(2px) scale(.99); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } .panel { transition: none; } }
.mi { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 8px; border-radius: 6px; cursor: default; outline: none; }
.mi.active { background: var(--hover); }
.mi[aria-disabled="true"] { color: var(--subtle); }
.mi .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi .two { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.mi .two small { color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi .desc { margin-left: auto; padding-left: 12px; color: var(--faint); font-size: 12px; white-space: nowrap; }
.mi .end { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--faint); font-size: 12px; padding-left: 12px; }
.mi .chk { color: var(--text); }
.mi .ico { color: var(--muted); display: inline-flex; }
.mi .ico.agent { color: var(--info); } .mi .ico.plan { color: var(--warning); } .mi .ico.chat { color: var(--operational); }
.ml { padding: 6px 8px 3px; font-size: 11px; color: var(--faint); }
.ms { height: 1px; background: var(--border); margin: 4px 2px; }
.psearch { display: flex; align-items: center; gap: 8px; margin: -4px -4px 4px; padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--faint); }
.psearch input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 13px; color: var(--text); }
.psearch input::placeholder { color: var(--subtle); }
.pback { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.tray-pop { padding: 4px 6px 6px; border-radius: 12px; border-color: var(--composer-border-focus); box-shadow: var(--shadow-composer); max-height: 340px; }
.tray-pop .psearch { margin: 0 0 2px; padding: 4px 6px; height: 32px; border-bottom: 0; }
.tray-pop .psback { border: 0; background: transparent; color: var(--muted); display: inline-flex; padding: 2px; margin-left: -2px; border-radius: 4px; cursor: pointer; }
.tray-pop .psback:hover { background: var(--hover); color: var(--text); }
.tray-pop .mi { min-height: 28px; padding: 4px 8px; border-radius: 8px; }
.tray-pop .mi .lbl { flex: none; color: var(--muted); }
.tray-pop .mi.active .lbl { color: var(--text); }
.tray-pop .mi .desc { margin-left: 0; padding-left: 0; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.tray-pop .mi .ico { color: var(--faint); }
.tray-pop .mi .ico.plan { color: var(--warning); } .tray-pop .mi .ico.chat { color: var(--operational); }
.tray-pop .ms { margin: 4px 8px; }
.tray-pop .ml { padding: 6px 8px 2px; }
.empty { padding: 18px 8px; text-align: center; color: var(--faint); font-size: 12px; }

/* ---- 旧版（对照） ---- */
.panel.old { border-color: var(--border); box-shadow: none; border-radius: 12px; }
.panel.old:focus-within { border-color: var(--border-strong); box-shadow: none; }
.panel.old .ib.plus { background: var(--surface-subtle); width: 32px; height: 32px; }
.old-tray { margin: 12px 12px 0; border: 1px solid var(--border); background: var(--surface-subtle); border-radius: 8px; }
.old-tray header { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; font-size: 12px; color: var(--muted); }
.old-tray header b { color: var(--text); font-weight: 500; }
.old-tray ul { margin: 0; padding: 0 4px 2px; list-style: none; border-top: 1px solid var(--border); }
.old-tray li { display: flex; align-items: center; gap: 4px; min-height: 36px; padding-left: 8px; font-size: 13px; }
.old-tray li + li { border-top: 1px solid var(--border); }
.old-tray li .qt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.native { font: inherit; font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; max-width: 260px; }
.old-hint { font-size: 11px; color: var(--faint); }

/* ---- 说明区 ---- */
.notes { max-width: 980px; margin: 0 auto 40px; padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.notes section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 13px; }
.notes h3 { margin: 0 0 6px; font-size: 13px; }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted); }
.notes li { margin: 3px 0; }
.notes code { font-size: 12px; background: var(--surface-subtle); padding: 0 4px; border-radius: 4px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--action); color: var(--on-action); font-size: 12px; padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; }
.toast.show { opacity: .95; }
.tip { position: fixed; z-index: 90; background: var(--action); color: var(--on-action); font-size: 12px; padding: 5px 8px; border-radius: 6px; pointer-events: none; max-width: 280px; }
.mirror { position: absolute; visibility: hidden; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 22px; padding: 3px 4px; top: -9999px; left: -9999px; }
@media (max-width: 720px) {
  .notes { grid-template-columns: 1fr; }
  .window { height: 660px; }
  .col { padding: 0 12px; }
  .panel:not(.old) .body { grid-template-areas: "input input input input input" "plus mode . model send"; row-gap: 8px; padding: 12px 8px 8px; }
}
</style>
</head>
<body>
<header class="demo-bar" id="bar"></header>
<main class="stage">
  <div class="window">
    <div class="window-title" id="wtitle">ActSpace</div>
    <div class="col" id="col"></div>
  </div>
</main>
<div class="notes" id="notes"></div>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<div class="mirror" id="mirror"></div>

function place(pop, rect, prefer, align, gap = 6) {
  const h = pop.offsetHeight, w = pop.offsetWidth;
  let top = prefer === "above" ? rect.top - h - gap : rect.bottom + gap;
  if (prefer === "below" && top + h > innerHeight - 8) top = rect.top - h - gap;
  if (prefer === "above" && top < 8) top = rect.bottom + gap;
  let left = align === "end" ? rect.right - w : rect.left;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  pop.style.top = Math.max(8, top) + "px"; pop.style.left = left + "px";
}
function currentLevel() { return S.overlay?.sub ? "1" : "0"; }
function items(level = currentLevel()) { return [...document.querySelectorAll(`#layer .pop[data-level="${level}"] .mi:not([aria-disabled="true"])`)]; }
function syncActive(focus) {
  const o = S.overlay; if (!o) return;
  const lvl = currentLevel(); const list = items(lvl);
  document.querySelectorAll(`#layer .pop[data-level="${lvl}"] .mi.active`).forEach((el) => el.classList.remove("active"));
  if (o.sub) document.querySelector('#layer [data-sub="hosts"]')?.classList.add("active");
  const idx = lvl === "1" ? o.subActive : o.active;
  const el = list[Math.max(0, Math.min(idx, list.length - 1))];
  if (el) { el.classList.add("active"); el.scrollIntoView({ block: "nearest" }); }
  if (focus) {
    const search = document.querySelector(`#layer .pop[data-level="${lvl}"] [data-search]`);
    (search || el)?.focus();
  }
}

/* ============ 动作 ============ */
function act(name, v, el) {
  const t = S.target;
  switch (name) {
    case "open-ws": return toggle("ws");
    case "open-branch": return toggle("branch");
    case "open-loc": return toggle("location");
    case "open-plus": return toggle("palette");
    case "open-model": return toggle("model");
    case "open-old-plus": return toggle("old-palette");
    case "open-old-loc": return toggle("old-location");
    case "q-more": return S.overlay?.kind === "q-more" && S.overlay.id === Number(v) ? closeOverlay() : openOverlay("q-more", { id: Number(v), anchor: `qmore-${v}` });
    case "ws": t.ws = v; break;
    case "branch": t.branch = v; break;
    case "loc-local": S.target = { kind: "local", ws: t.ws && LOCAL_WS.some((w) => w.id === t.ws) ? t.ws : "actspace", branch: t.branch || "main", placement: "in-place" }; break;
    case "loc-sub": S.overlay.sub = S.overlay.sub ? null : "hosts"; S.overlay.subActive = 0; renderOverlay(true); return;
    case "host": { const h = hostById(v); S.target = { kind: "remote", host: v, ws: h.workspaces[0]?.id || "" }; break; }
    case "worktree": S.target = { kind: "local", ws: t.kind === "local" ? t.ws : "actspace", branch: t.branch || "main", placement: "new-worktree" }; break;
    case "mode": S.mode = v; break;
    case "mode-clear": S.mode = "agent"; break;
    case "files": S.attachments.push(S.attachments.length ? `截图-${S.attachments.length + 1}.png` : "截图.png"); break;
    case "page": S.overlay.page = v; S.overlay.query = ""; S.overlay.active = 0; renderOverlay(true); return;
    case "back": S.overlay.page = "root"; S.overlay.query = ""; S.overlay.active = 0; renderOverlay(true); return;
    case "skill": S.skills = S.skills.includes(v) ? S.skills.filter((s) => s !== v) : [...S.skills, v]; break;
    case "model": S.model = v; break;
    case "att-del": S.attachments.splice(Number(v), 1); break;
    case "skill-del": S.skills.splice(Number(v), 1); break;
    case "send": return send();
    case "stop": S.running = false; S.paused = S.queue.length > 0; break;
    case "resume": { const next = S.queue.shift(); if (next) S.messages.push(next.text); S.running = true; S.paused = false; break; }
    case "q-steer": { const i = S.queue.findIndex((q) => q.id === Number(v)); S.steering.push(...S.queue.splice(i, 1)); break; }
    case "q-unsteer": { const i = S.steering.findIndex((q) => q.id === Number(v)); S.queue.unshift(...S.steering.splice(i, 1)); break; }
    case "q-del": S.queue = S.queue.filter((q) => q.id !== Number(v)); if (!S.queue.length) S.paused = false; break;
    case "q-edit": { const i = S.queue.findIndex((q) => q.id === Number(v)); S.text = S.queue[i].text; S.queue.splice(i, 1); S.overlay = null; render(); document.getElementById("ta").focus(); return; }
    case "q-up": { const i = S.queue.findIndex((q) => q.id === Number(v)); if (i > 0) [S.queue[i - 1], S.queue[i]] = [S.queue[i], S.queue[i - 1]]; break; }
    case "toast": toast(v); if (S.overlay) closeOverlay(false); return;
    default: return;
  }
  const wasOpen = !!S.overlay; const anchor = S.overlay?.anchor;
  S.overlay = null; render();
  if (wasOpen && anchor) document.querySelector(`[data-anchor="${anchor}"]`)?.focus();
}
function toggle(kind) { if (S.overlay?.kind === kind) closeOverlay(); else openOverlay(kind); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && el.getAttribute("aria-disabled") !== "true" && !el.disabled && el.tagName !== "SELECT") { e.preventDefault(); act(el.dataset.act, el.dataset.v, el); return; }
  if (S.overlay && !e.target.closest("#layer")) closeOverlay(false);
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.act === "old-host") { const v = e.target.value; if (v === "local") applyPreset("local"); else S.target = { kind: "remote", host: v, ws: hostById(v).workspaces[0]?.id || "" }; render(); }
});
document.addEventListener("mouseover", (e) => {
  const item = e.target.closest("#layer .mi"); if (!item || !S.overlay) return;
  const lvl = item.closest(".pop").dataset.level; const list = items(lvl); const i = list.indexOf(item); if (i < 0) return;
  if (lvl === "0" && S.overlay.kind === "location") {
    if (item.dataset.sub === "hosts" && !S.overlay.sub) { S.overlay.active = i; S.overlay.sub = "hosts"; S.overlay.subActive = 0; renderOverlay(); return; }
    if (item.dataset.sub !== "hosts" && S.overlay.sub) { S.overlay.sub = null; S.overlay.active = i; renderOverlay(); return; }
  }
  if (lvl === "1") S.overlay.subActive = i; else S.overlay.active = i;
  syncActive(false);
});
document.addEventListener("keydown", (e) => {
  const o = S.overlay; if (!o) return;
  if (e.isComposing || e.keyCode === 229) return;
  const lvl = currentLevel(); const list = items(lvl);
  const key = lvl === "1" ? "subActive" : "active";
  const inSearch = e.target.matches?.("[data-search]");
  if (e.key === "Escape") { e.preventDefault(); if (o.sub) { o.sub = null; renderOverlay(true); } else if (o.page && o.page !== "root") { act("back"); } else closeOverlay(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); o[key] = (o[key] + 1) % list.length; syncActive(!inSearch); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); o[key] = (o[key] - 1 + list.length) % list.length; syncActive(!inSearch); return; }
  if (e.key === "Home" && !inSearch) { e.preventDefault(); o[key] = 0; syncActive(true); return; }
  if (e.key === "End" && !inSearch) { e.preventDefault(); o[key] = list.length - 1; syncActive(true); return; }
  const cur = list[Math.max(0, Math.min(o[key], list.length - 1))];
  if (e.key === "ArrowRight" && cur?.dataset.sub && (!inSearch || !e.target.value)) { e.preventDefault(); act(cur.dataset.act, cur.dataset.v, cur); return; }
  if (e.key === "ArrowLeft" && (!inSearch || !e.target.value)) {
    if (o.sub) { e.preventDefault(); o.sub = null; renderOverlay(true); return; }
    if (o.page && o.page !== "root") { e.preventDefault(); act("back"); return; }
  }
  if (e.key === "Backspace" && inSearch && !e.target.value && o.page && o.page !== "root") { e.preventDefault(); act("back"); return; }
  if (e.key === "Enter" || (e.key === " " && !inSearch)) { if (cur) { e.preventDefault(); act(cur.dataset.act, cur.dataset.v, cur); } }
});

/* ============ tooltip / toast ============ */
let tipEl = null;
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tipEl?.remove(); tipEl = null; return; }
  if (tipEl?.dataset.for === el.dataset.tip) return;
  tipEl?.remove(); tipEl = document.createElement("div"); tipEl.className = "tip"; tipEl.dataset.for = el.dataset.tip; tipEl.textContent = el.dataset.tip;
  document.body.appendChild(tipEl);
  const r = el.getBoundingClientRect();
  tipEl.style.left = Math.max(8, Math.min(r.left + r.width / 2 - tipEl.offsetWidth / 2, innerWidth - tipEl.offsetWidth - 8)) + "px";
  tipEl.style.top = (r.top - tipEl.offsetHeight - 6 < 8 ? r.bottom + 6 : r.top - tipEl.offsetHeight - 6) + "px";
});
let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
window.addEventListener("resize", () => { if (S.overlay) renderOverlay(); updateLayout(); });

/* URL 参数直达某个状态：?theme=dark&surface=followup&target=remote&version=old&open=location */
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("theme")) S.theme = q.get("theme");
  if (q.get("surface")) S.surface = q.get("surface");
  if (q.get("version")) S.version = q.get("version");
  if (q.get("target")) applyPreset(q.get("target"));
  if (q.get("mode")) S.mode = q.get("mode");
  if (q.get("text")) S.text = q.get("text");
  if (q.get("running") === "false") S.running = false;
  render();
  const open = q.get("open");
  if (open === "location") { openOverlay("location"); if (q.get("sub") === "hosts") { S.overlay.sub = "hosts"; renderOverlay(); } }
  else if (open === "palette") { openOverlay("palette"); if (q.get("query")) { S.overlay.query = q.get("query"); renderOverlay(); } }
})();
</script>
