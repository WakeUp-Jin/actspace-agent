<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客 P1 · 杂志目录</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="blog-prose.css">
<style>
/* P1 杂志目录：列表不再是满屏彩色大卡。最新一篇做头条（封面缩成方形小图），其余是一行一篇的目录；分类改成顶部一排标签。文章页单栏居中，不放封面。 */
.page { width: var(--site-page); margin-inline: auto; }
.list-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding: 64px 0 28px; }
.list-head h1 { font: 500 52px/1.1 var(--display); margin: 0; }
.list-head p { margin: 12px 0 0; color: var(--site-body); font-size: 16px; }
.search { display: flex; align-items: center; gap: 8px; width: 260px; height: 40px; padding: 0 14px; border: 1px solid var(--site-line); border-radius: 999px; background: var(--site-paper); color: var(--site-muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 36px; border-bottom: 1px solid var(--site-line); }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--site-line); background: transparent; color: var(--site-body); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip small { font: 11px var(--mono); color: var(--site-muted); }
.chip:hover { border-color: var(--site-line-strong); color: var(--site-ink); }
.chip[aria-pressed="true"] { background: var(--site-ink); border-color: var(--site-ink); color: #fff; }
.chip[aria-pressed="true"] small { color: rgba(255,255,255,.6); }

.feature { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 48px; align-items: center; padding: 44px 0; border-bottom: 1px solid var(--site-line); }
.feature img { width: 300px; aspect-ratio: 1; object-fit: cover; border-radius: 22px; transition: transform 200ms; }
.feature:hover img { transform: scale(1.015); }
.f-meta, .r-meta { font: 12px var(--mono); color: var(--site-muted); display: flex; gap: 12px; }
.f-meta b, .r-cat { color: var(--site-accent); font-weight: 400; font-family: var(--sans); }
.feature h2 { font: 500 36px/1.3 var(--display); margin: 16px 0 14px; max-width: 18em; }
.feature p { font-size: 17px; line-height: 1.8; color: var(--site-body); margin: 0 0 22px; max-width: 34em; }
.more { font-size: 14px; color: var(--site-ink); border-bottom: 1px solid var(--site-line-strong); padding-bottom: 2px; }
.feature:hover .more { border-color: var(--site-accent); }

.rows { padding-bottom: 120px; }
.row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 120px 72px; gap: 32px; align-items: center; padding: 26px 0; border-bottom: 1px solid var(--site-line); }
.row time { font: 13px var(--mono); color: var(--site-muted); }
.row h3 { font: 500 22px/1.4 var(--display); margin: 0 0 6px; transition: color 150ms; }
.row p { margin: 0; font-size: 14.5px; color: var(--site-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r-cat { font-size: 13px; }
.row img { width: 72px; height: 72px; object-fit: cover; border-radius: 14px; }
.row:hover h3 { color: var(--site-accent); }

/* 文章页 */
.post { width: min(700px, calc(100vw - 40px)); margin: 0 auto; padding: 56px 0 120px; }
.crumb { font-size: 13px; color: var(--site-muted); display: flex; gap: 8px; }
.crumb a:hover { color: var(--site-ink); }
.post h1 { font: 500 44px/1.28 var(--display); margin: 22px 0 18px; }
.post .desc { font-size: 19px; line-height: 1.75; color: var(--site-body); margin: 0 0 32px; }
.byline { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-top: 1px solid var(--site-line); border-bottom: 1px solid var(--site-line); margin-bottom: 48px; font-size: 14px; color: var(--site-body); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--site-accent-soft); color: var(--site-accent); display: grid; place-items: center; font: 600 13px var(--sans); }
.byline .who { color: var(--site-ink); font-weight: 500; }
.byline .dot { color: var(--site-line-strong); }
.byline button { margin-left: auto; background: none; border: 1px solid var(--site-line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--site-body); }
.byline button:hover { border-color: var(--site-line-strong); color: var(--site-ink); }
.next { margin-top: 80px; }
.next h4 { font: 12px var(--mono); color: var(--site-muted); margin: 0 0 8px; font-weight: 400; }
.next a { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-top: 1px solid var(--site-line); font: 500 19px var(--display); }
.next a span { font: 13px var(--mono); color: var(--site-muted); white-space: nowrap; }
.next a:hover { color: var(--site-accent); }

@media (max-width: 900px) { .list-head { flex-direction: column; align-items: start; } .feature { grid-template-columns: 1fr; gap: 24px; } .feature img { width: 100%; aspect-ratio: 3/2; } .row { grid-template-columns: minmax(0,1fr) 64px; gap: 16px; } .row time, .row .r-cat { display: none; } .row img { width: 64px; height: 64px; } .row p { white-space: normal; } .post h1 { font-size: 32px; } .list-head h1 { font-size: 40px; } }
</style>
</head>
<body>
<header class="site-header" data-header></header>

<main class="page" data-view="list">
  <div class="list-head">
    <div><h1>博客</h1><p>开发 ActSpace 时的设计笔记与踩坑记录。</p></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜索文章</label>
  </div>
  <div class="chips" id="chips"></div>
  <a class="feature" href="#post" id="feature"></a>
  <div class="rows" id="rows"></div>
</main>

<main class="post" data-view="post" hidden>
  <p class="crumb"><a href="#">博客</a><span>/</span><span data-post-fill="cat"></span></p>
  <h1 data-post-fill="title"></h1>
  <p class="desc" data-post-fill="desc"></p>
  <div class="byline"><span class="avatar">W</span><span class="who">WakeUp-Jin</span><span class="dot">·</span><span data-post-fill="date"></span><span class="dot">·</span><span>约 9 分钟</span><button type="button">复制链接</button></div>
  <article class="bprose" data-post-body></article>
  <div class="next"><h4>继续阅读</h4><a href="#post">给 Agent 接入 Browser Use 的设计思路<span>07-11</span></a><a href="#post">ActSpace 评估模块的设计思路<span>07-19</span></a></div>
</main>

<script src="shared.js"></script>
<script src="blog-shared.js"></script>
<script>
const counts = Object.fromEntries(CATS.map((c) => [c, POSTS.filter((p) => p.cat === c).length]));
document.getElementById("chips").innerHTML = `<button class="chip" aria-pressed="true">全部<small>${POSTS.length}</small></button>` + CATS.map((c) => `<button class="chip" aria-pressed="false">${c}<small>${counts[c]}</small></button>`).join("");
document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === b))));
const [first, ...rest] = POSTS;
document.getElementById("feature").innerHTML = `<img src="${coverSrc(first.cover)}" alt=""><div><p class="f-meta"><b>${first.cat}</b><span>${first.date}</span><span>${first.min} 分钟</span></p><h2>${besc(first.title)}</h2><p>${besc(first.desc)}</p><span class="more">阅读全文 →</span></div>`;
document.getElementById("rows").innerHTML = rest.map((p) => `<a class="row" href="#post"><time>${p.date}</time><div><h3>${besc(p.title)}</h3><p>${besc(p.desc)}</p></div><span class="r-cat">${p.cat}</span><img src="${coverSrc(p.cover)}" alt=""></a>`).join("");
bootBlog("P1");
</script>
</body>
</html>
