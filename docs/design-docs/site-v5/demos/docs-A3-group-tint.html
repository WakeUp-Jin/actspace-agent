<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档 A3 · 分组色</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="docs-a-base.css">
<style>
/* A3 分组色：A 的骨架，没有任何渐变；每个分组一种淡色（模型与上下文 = 薄荷），只用在当前项、分组标签、提示块和目录指示上。像给书页贴了一张彩色索引签。 */
:root { --g: #cfe3d2; --g-ink: #2f5a43; --g-line: #9cc5ae; }
.nav-items a[aria-current] { background: color-mix(in srgb, var(--g) 70%, var(--site-paper)); box-shadow: none; color: var(--g-ink); }
.nav-group.is-open .nav-label { color: var(--g-ink); }
.crumb span:last-child { color: var(--g-ink); background: color-mix(in srgb, var(--g) 70%, var(--site-paper)); border-radius: 999px; padding: 1px 9px; margin-top: -1px; }
.prose li::marker { color: var(--g-line); }
.note { background: color-mix(in srgb, var(--g) 45%, var(--site-paper)); border-color: transparent; color: #36433a; }
.note strong { color: var(--g-ink); }
.toc a.is-active { border-left-color: var(--g-line); color: var(--g-ink); }
.code-bar { background: color-mix(in srgb, var(--g) 25%, var(--site-paper)); }
.pager a:hover { border-color: var(--g-line); }
</style>
</head>
<body>
<header class="site-header" data-header></header>
<div class="layout">
  <aside class="sidebar"><nav data-nav aria-label="文档目录"></nav></aside>
  <main class="article">
    <p class="crumb"><span>文档</span><span>/</span><span data-fill="group"></span></p>
    <h1 data-fill="title"></h1>
    <p class="lead" data-fill="lead"></p>
    <div class="meta"><span>更新于 <span data-fill="updated"></span></span><span>约 <span data-fill="minutes"></span> 分钟</span><button class="copy" type="button">复制页面</button></div>
    <div class="prose" data-body></div>
    <nav class="pager" data-pager></nav>
    <div class="foot"><span>这页有帮助吗？</span><a href="#">在 GitHub 上编辑 ↗</a></div>
  </main>
  <aside class="toc"><p class="toc-label">本页内容</p><nav data-toc-list></nav></aside>
</div>
<script src="shared.js"></script>
<script>bootDoc("A3");</script>
</body>
</html>
