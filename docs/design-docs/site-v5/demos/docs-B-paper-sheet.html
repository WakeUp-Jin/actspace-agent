<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档 B · 纸页</title>
<link rel="stylesheet" href="shared.css">
<style>
/* B 纸页：暖纸画布上铺一张纸面（像首页舞台上的产品窗口），目录在纸外，正文和本页目录在纸里；截图放在浅色台面上。 */
.layout { width: var(--site-page); margin-inline: auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; padding: 24px 0 64px; align-items: start; }
.sidebar { position: sticky; top: calc(var(--site-header-height) + 24px); max-height: calc(100vh - var(--site-header-height) - 48px); overflow: auto; padding: 16px 8px 40px 4px; scrollbar-width: none; }
.nav-group { margin-bottom: 22px; }
.nav-label { font-size: 13px; font-weight: 600; color: var(--site-ink); margin: 0 0 4px 14px; }
.nav-items a { position: relative; display: block; padding: 5px 14px 5px 28px; font-size: 14px; line-height: 1.6; color: var(--site-body); border-radius: 8px; }
.nav-items a::before { content: ""; position: absolute; left: 15px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--site-line-strong); opacity: 0; }
.nav-items a:hover { color: var(--site-ink); }
.nav-items a:hover::before { opacity: 1; }
.nav-items a[aria-current] { color: var(--site-accent); font-weight: 500; }
.nav-items a[aria-current]::before { opacity: 1; background: var(--site-accent); box-shadow: 0 0 0 4px var(--site-accent-soft); }

.sheet { min-width: 0; background: var(--site-paper); border: 1px solid var(--site-line); border-radius: 24px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 30px 60px -48px rgba(29,28,26,.35); display: grid; grid-template-columns: minmax(0, 1fr) 196px; gap: 40px; padding: 0 40px 0 clamp(32px, 5vw, 80px); }
.article { min-width: 0; max-width: 700px; padding: 64px 0 96px; }
.crumb { display: flex; gap: 8px; align-items: center; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--site-canvas); color: var(--site-body); border: 1px solid var(--site-line); }
.tag.accent { background: var(--site-accent-soft); color: var(--site-accent); border-color: transparent; }
h1 { font: 500 42px/1.22 var(--display); margin: 22px 0 14px; }
.lead { font: 19px/1.7 var(--sans); color: var(--site-body); margin: 0 0 40px; }

.prose { color: #48453f; font-size: 16px; line-height: 1.9; }
.prose p, .prose ul { margin: 0 0 18px; }
.prose ul { padding-left: 0; list-style: none; }
.prose li { position: relative; padding-left: 20px; margin: 10px 0; }
.prose li::before { content: ""; position: absolute; left: 4px; top: .8em; width: 6px; height: 1.5px; background: var(--site-accent); }
.prose strong { color: var(--site-ink); font-weight: 600; }
.prose h2 { font: 500 27px/1.4 var(--display); color: var(--site-ink); margin: 60px 0 14px; padding-top: 28px; border-top: 1px solid var(--site-line); scroll-margin-top: 96px; }
.prose h3 { font: 600 17px/1.5 var(--sans); color: var(--site-ink); margin: 32px 0 8px; scroll-margin-top: 96px; }
.prose a { color: var(--site-accent); text-decoration: none; border-bottom: 1px solid var(--site-accent-line); }
.prose a:hover { border-bottom-color: var(--site-accent); }
.prose :not(pre) > code { font: .86em var(--mono); background: var(--site-canvas); border: 1px solid var(--site-line); border-radius: 6px; padding: 1px 6px; color: var(--site-ink); }
/* 截图台面：浅色底板 + 留白，图片不再顶满正文宽度 */
.shot { margin: 32px 0; padding: 28px; border-radius: 18px; background: var(--site-canvas); border: 1px solid var(--site-line); }
.shot-frame { max-width: 520px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--site-line), 0 22px 40px -26px rgba(29,28,26,.4); }
.shot:last-of-type .shot-frame { max-width: none; }
.shot figcaption { font-size: 13px; color: var(--site-muted); margin-top: 18px; text-align: center; }
.note { margin: 28px 0; padding: 14px 18px 14px 44px; position: relative; background: var(--site-accent-soft); border-radius: 12px; font-size: 15px; color: #4a3f6b; }
.note::before { content: "i"; position: absolute; left: 16px; top: 16px; width: 18px; height: 18px; border-radius: 50%; background: var(--site-accent); color: #fff; font: italic 600 12px/18px var(--display); text-align: center; }
.note p { margin: 0; }
.note strong { color: #3b2f63; margin-right: 8px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14.5px; margin: 24px 0; border: 1px solid var(--site-line); border-radius: 12px; overflow: hidden; }
th { text-align: left; font-weight: 600; font-size: 13px; color: var(--site-ink); padding: 11px 16px; background: var(--site-canvas); border-bottom: 1px solid var(--site-line); }
td { padding: 12px 16px; border-bottom: 1px solid var(--site-line); }
tr:last-child td { border-bottom: 0; }
.code-block { margin: 24px 0; background: #22211f; border-radius: 14px; overflow: hidden; }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 8px 16px; }
.code-lang { font: 11.5px var(--mono); color: #8f8b83; }
.code-copy { font-size: 12px; color: #c9c5bc; background: rgba(255,255,255,.06); border: 0; padding: 4px 10px; border-radius: 6px; }
.code-copy:hover { background: rgba(255,255,255,.12); }
pre { margin: 0; padding: 4px 18px 18px; overflow: auto; font: 13.5px/1.75 var(--mono); color: #ece8e0; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 72px; padding-top: 28px; border-top: 1px solid var(--site-line); }
.pager a { display: grid; gap: 4px; padding: 14px 16px; border-radius: 12px; transition: background 150ms; }
.pager a:hover { background: var(--site-canvas); }
.pager-next { text-align: right; }
.pager-dir { font-size: 12px; color: var(--site-muted); }
.pager-title { font-size: 16px; font-weight: 500; }

.toc { position: sticky; top: calc(var(--site-header-height) + 24px); align-self: start; padding: 64px 0 24px; }
.toc-label { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.toc a { display: block; padding: 5px 0; font-size: 13px; line-height: 1.5; color: var(--site-muted); }
.toc a.nested { padding-left: 14px; }
.toc a:hover { color: var(--site-ink); }
.toc a.is-active { color: var(--site-accent); font-weight: 500; }
.toc .copy { margin-top: 20px; display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--site-body); background: var(--site-canvas); border: 1px solid var(--site-line); border-radius: 8px; padding: 7px 12px; }
.toc .copy:hover { border-color: var(--site-line-strong); color: var(--site-ink); }

@media (max-width: 1180px) { .sheet { grid-template-columns: minmax(0,1fr); } .toc { display: none; } }
@media (max-width: 860px) { .layout { display: block; padding-top: 12px; } .sidebar { position: static; max-height: none; padding: 8px 0 16px; } .sidebar .nav-group:not(.is-open) { display: none; } .sheet { padding: 0 22px; border-radius: 20px; } .article { padding: 40px 0 72px; } h1 { font-size: 32px; } .shot { padding: 14px; } .pager { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site-header" data-header></header>
<div class="layout">
  <aside class="sidebar"><nav data-nav aria-label="文档目录"></nav></aside>
  <div class="sheet">
    <main class="article">
      <p class="crumb"><span class="tag">文档</span><span class="tag accent" data-fill="group"></span></p>
      <h1 data-fill="title"></h1>
      <p class="lead" data-fill="lead"></p>
      <div class="prose" data-body></div>
      <nav class="pager" data-pager></nav>
    </main>
    <aside class="toc"><p class="toc-label">本页内容</p><nav data-toc-list></nav><button class="copy" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>复制页面</button></aside>
  </div>
</div>
<script src="shared.js"></script>
<script>bootDoc("B");</script>
</body>
</html>
