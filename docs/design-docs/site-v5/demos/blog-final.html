<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客终版</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="blog-r.css">
<link rel="stylesheet" href="md-render.css">
<style>
/* 博客终版：列表 = Q2 排印封面 + 现网角色封面；文章页头部 = R3 封面色整条铺开；正文 = M2 精致卡片渲染（真实文章原文）。 */
.hero { position: relative; isolation: isolate; overflow: hidden; background: var(--cv-bg); color: var(--cv-ink); }
.cv-light .hero { border-bottom: 1px solid var(--site-line); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: 1; background: var(--stage-grain); opacity: .14; mix-blend-mode: multiply; pointer-events: none; }
.hero-in { width: min(1120px, calc(100vw - 40px)); margin: 0 auto; min-height: 420px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px; align-items: center; }
.hero .back { font-size: 13px; opacity: .72; }
.hero .back:hover { opacity: 1; }
.hero .p-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; opacity: .78; margin: 28px 0 14px; }
.hero h1 { font: 650 44px/1.28 var(--r-font); margin: 0 0 16px; letter-spacing: -.012em; }
.hero .desc { font-size: 18.5px; line-height: 1.75; margin: 0; opacity: .82; max-width: 34em; }
.hero img { -webkit-mask-image: radial-gradient(closest-side, #000 74%, transparent); mask-image: radial-gradient(closest-side, #000 74%, transparent); width: 420px; max-width: none; margin: -20px -20px -20px 0; justify-self: end; }
/* 列表只留标题，不放摘要 */
.item p { display: none; }
.item h3 { margin-bottom: 0; }
.post { width: min(720px, calc(100vw - 40px)); margin: 0 auto; padding: 64px 0 160px; }
@media (max-width: 900px) { .hero-in { grid-template-columns: 1fr; padding: 32px 0 0; } .hero img { width: 240px; margin: 0 auto -28px; justify-self: center; } .hero h1 { font-size: 31px; } }
</style>
</head>
<body>
<header class="site-header" data-header></header>

<main class="page" data-view="list" data-r-list></main>

<div data-view="post" hidden>
  <section class="hero">
    <div class="hero-in">
      <div>
        <a class="back" href="#">← 博客</a>
        <p class="p-meta"><span data-post-fill="cat"></span><span data-post-fill="date"></span><span>WakeUp-Jin</span><span>约 14 分钟</span></p>
        <h1 data-post-fill="title"></h1>
        <p class="desc" data-post-fill="desc"></p>
      </div>
      <img data-cover-img alt="">
    </div>
  </section>
  <main class="post">
    <article class="md m2" id="md"></article>
    <nav class="r-next" data-post-next></nav>
  </main>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="shared.js"></script>
<script src="blog-shared.js"></script>
<script>window.POST = POSTS.find((p) => p.slug === "write-and-edit");</script>
<script src="blog-r.js"></script>
<script src="md-source.js"></script>
<script src="md-pipeline.js"></script>
<script>
window.BLOG_ROUND = "终版";
window.BLOG_VARIANTS = [{ id: "终", name: "Q2 列表 · R3 头部 · M2 正文", file: "blog-final.html" }];
document.querySelectorAll("[data-r-list]").forEach(renderRList);
bootBlog("终");
renderMarkdown(document.getElementById("md"), MD_SRC);
document.querySelectorAll("[data-post-next]").forEach(renderNext);
document.addEventListener("click", (e) => { if (e.target.closest(".back")) { e.preventDefault(); history.pushState(null, "", location.pathname); syncBlogView(); scrollTo(0, 0); } });
coverNo = POST.cover;
paintCover();
</script>
</body>
</html>
