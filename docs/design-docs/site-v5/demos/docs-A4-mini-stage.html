<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档 A4 · 小舞台</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="docs-a-base.css">
<style>
/* A4 小舞台：D 减半。只有标题区是一块舞台，但只占正文宽、颜色调淡一半、没有胶囊和黑按钮；截图回到 A 的纸面相框。 */
.article { padding-top: 40px; }
.head-stage { position: relative; isolation: isolate; overflow: hidden; border-radius: 22px; padding: 36px 36px 30px; margin-bottom: 44px;
  background: radial-gradient(60% 90% at 90% 0%, color-mix(in srgb, var(--stage-lemon) 55%, var(--site-canvas)), transparent 62%),
              radial-gradient(70% 120% at 0% 100%, color-mix(in srgb, var(--stage-mint) 55%, var(--site-canvas)), transparent 66%),
              color-mix(in srgb, var(--stage-mint-base) 50%, var(--site-canvas)); }
.head-stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--stage-grain); opacity: .15; mix-blend-mode: multiply; }
.head-stage .crumb { color: #5b6a5f; }
.head-stage .crumb span:last-child { color: #3c4a40; }
.head-stage h1 { margin: 14px 0 10px; font-size: 40px; }
.head-stage .lead { color: #44514a; margin-bottom: 22px; font-size: 18px; }
.head-stage .meta { border: 0; padding: 0; margin: 0; color: #5b6a5f; }
.head-stage .meta .copy { background: color-mix(in srgb, var(--site-paper) 65%, transparent); border-color: transparent; }
.head-stage .meta .copy:hover { background: var(--site-paper); }
@media (max-width: 760px) { .head-stage { padding: 26px 20px 22px; } .head-stage h1 { font-size: 30px; } }
</style>
</head>
<body>
<header class="site-header" data-header></header>
<div class="layout">
  <aside class="sidebar"><nav data-nav aria-label="文档目录"></nav></aside>
  <main class="article">
    <header class="head-stage">
    <p class="crumb"><span>文档</span><span>/</span><span data-fill="group"></span></p>
    <h1 data-fill="title"></h1>
    <p class="lead" data-fill="lead"></p>
    <div class="meta"><span>更新于 <span data-fill="updated"></span></span><span>约 <span data-fill="minutes"></span> 分钟</span><button class="copy" type="button">复制页面</button></div>
    </header>
    <div class="prose" data-body></div>
    <nav class="pager" data-pager></nav>
    <div class="foot"><span>这页有帮助吗？</span><a href="#">在 GitHub 上编辑 ↗</a></div>
  </main>
  <aside class="toc"><p class="toc-label">本页内容</p><nav data-toc-list></nav></aside>
</div>
<script src="shared.js"></script>
<script>bootDoc("A4");</script>
</body>
</html>
