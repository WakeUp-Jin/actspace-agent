<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新日志 U4 · 大字日期</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="updates-shared.css">
<style>
/* U4 大字日期：最新一次放进首页那种舞台色块里单独展示；往下每次发布左边是衬线大数字日期（和博客封面上的英文大字同一种字），右边每条前面挂分类小胶囊，不再分组。 */
.page { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 160px; }
.stage { position: relative; isolation: isolate; overflow: hidden; border-radius: 26px; padding: 40px 44px 36px; margin-bottom: 72px;
  background: radial-gradient(80% 120% at 100% 0%, color-mix(in srgb, #efe3a0 60%, transparent), transparent 60%), radial-gradient(70% 100% at 0% 100%, color-mix(in srgb, #efc3a6 55%, transparent), transparent 65%), #e4ecdf; }
.stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--stage-grain); opacity: .16; mix-blend-mode: multiply; }
.stage-top { display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; }
.stage-top .num { font: 500 64px/1 var(--display); color: var(--site-ink); letter-spacing: -.02em; }
.stage-top .tag { font: 600 12px var(--r-font); color: var(--site-accent); background: rgba(255, 255, 255, .6); padding: 4px 10px; border-radius: 999px; }
.stage h2 { font: 650 30px/1.35 var(--r-font); margin: 0 0 20px; }
.stage .items { max-width: 760px; color: #3a3833; }
.rel { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; padding: 36px 0; border-top: 1px solid var(--site-line); }
.rel-date { position: sticky; top: calc(var(--site-header-height) + 28px); align-self: start; }
.rel-date .num { display: block; font: 500 44px/1 var(--display); color: var(--site-ink); letter-spacing: -.02em; }
.rel-date .y { display: block; margin-top: 8px; font: 12px var(--mono); color: var(--site-muted); }
.rel h2 { font: 650 22px/1.45 var(--r-font); margin: 0 0 14px; }
.items.tagged li { padding-left: 0; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: baseline; margin: .55em 0; }
.items.tagged li::before { display: none; }
.items.tagged .tpill { justify-content: center; }
.month { font: 500 15px var(--display); color: var(--site-muted); margin: 56px 0 0; padding-bottom: 12px; }
.month b { font: 500 26px var(--display); color: var(--site-ink); margin-right: 8px; }
@media (max-width: 760px) { .rel { grid-template-columns: 1fr; gap: 12px; } .rel-date { position: static; display: flex; align-items: baseline; gap: 10px; } .rel-date .num { font-size: 32px; } .stage { padding: 28px 22px; } .stage-top .num { font-size: 44px; } .stage h2 { font-size: 23px; } }
</style>
</head>
<body>
<header class="site-header" data-header></header>
<main class="page">
  <div class="upd-head"><div><h1>更新日志</h1><p class="sub">只记录用得到的新功能、改进和问题修复。</p></div><div class="filters" id="filters"></div></div>
  <div id="list"></div>
</main>
<script src="vendor/marked.min.js"></script>
<script src="shared.js"></script>
<script src="md-pipeline.js"></script>
<script src="updates-source.js"></script>
<script src="updates-shared.js"></script>
<script>
const MONTH_EN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const tagged = (r) => `<ul class="items tagged">${r.sections.flatMap((s) => s.items.map((x) => `<li data-type="${s.type}"><span class="tpill t-${s.type}">${TYPES[s.type].short}</span><span>${x}</span></li>`)).join("")}</ul>`;
const [latest, ...rest] = RELEASES;
let html = `<section class="stage" data-release><div class="stage-top"><span class="num">${fmtDot(latest.date).slice(5)}</span><span class="tag">最新更新</span></div><h2>${latest.title}</h2>${tagged(latest)}</section>`;
let last = latest.month;
rest.forEach((r) => {
  if (r.month !== last) { const [y, m] = r.month.split("-"); html += `<p class="month"><b>${MONTH_EN[+m - 1]}</b>${y}</p>`; last = r.month; }
  html += `<article class="rel" data-release id="${r.date}"><div class="rel-date"><span class="num">${fmtDot(r.date).slice(5)}</span><span class="y">${r.date.slice(0, 4)}</span></div><div><h2>${r.title}</h2>${tagged(r)}</div></article>`;
});
document.getElementById("list").innerHTML = html;
filterBar(document.getElementById("filters"));
bootUpd("U4");
</script>
</body>
</html>
