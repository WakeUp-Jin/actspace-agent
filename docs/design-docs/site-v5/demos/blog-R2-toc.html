<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客 R2 · 侧栏目录</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="blog-r.css">
<link rel="stylesheet" href="blog-r-prose.css">
<style>
/* R2 侧栏目录：像一张专辑页，方形封面在左、标题在右；正文右侧常驻目录，长文能随时跳。h2 悬停露出 #，代码块深色，资料列表编号像脚注。 */
.post { width: min(1080px, calc(100vw - 40px)); margin: 0 auto; padding: 56px 0 140px; }
.p-head { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 44px; align-items: end; padding-bottom: 44px; margin-bottom: 52px; border-bottom: 1px solid var(--site-line); }
.p-cover { aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: var(--cv-bg); }
.cv-light .p-cover { box-shadow: inset 0 0 0 1px rgba(29, 28, 26, .08); }
.p-cover img { width: 100%; height: 100%; display: block; }
.p-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--site-muted); margin: 0 0 14px; }
.p-meta b { color: var(--site-ink); font-weight: 500; }
.p-head h1 { font: 650 42px/1.3 var(--r-font); margin: 0 0 14px; letter-spacing: -.01em; }
.p-head .desc { font-size: 18px; line-height: 1.75; color: var(--site-body); margin: 0; max-width: 36em; }
.p-body { display: grid; grid-template-columns: minmax(0, 680px) 220px; justify-content: space-between; gap: 64px; }
.toc { position: sticky; top: calc(var(--site-header-height) + 40px); align-self: start; font-size: 13.5px; }
.toc p { font-size: 12px; color: var(--site-muted); margin: 0 0 10px; }
.toc a { display: block; padding: 6px 0 6px 14px; border-left: 2px solid var(--site-line); color: var(--site-body); line-height: 1.5; }
.toc a:hover { color: var(--site-ink); }
.toc a.is-active { border-left-color: var(--site-accent); color: var(--site-ink); font-weight: 500; }
.toc .tools { display: flex; gap: 8px; margin-top: 22px; }
.toc .tools button { flex: 1; height: 32px; border-radius: 8px; border: 1px solid var(--site-line); background: var(--site-paper); font-size: 12.5px; color: var(--site-body); }
.toc .tools button:hover { color: var(--site-ink); border-color: var(--site-line-strong); }
.rprose h2 { position: relative; }
.rprose h2::before { content: "#"; position: absolute; left: -1.05em; color: var(--site-line-strong); font-weight: 400; opacity: 0; transition: opacity 150ms; }
.rprose h2:hover::before { opacity: 1; }
.rprose .code-block { background: #1f1e1c; border: 0; }
.rprose .code-bar { border-bottom: 1px solid rgba(255, 255, 255, .08); }
.rprose .code-lang { color: #8f8b83; }
.rprose .code-copy { color: #c9c5bc; }
.rprose .code-copy:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.rprose pre { color: #ece8e0; }
.rprose .refs { counter-reset: ref; gap: 0; border-top: 1px solid var(--site-line); }
.rprose .refs li { counter-increment: ref; border-bottom: 1px solid var(--site-line); }
.rprose .ref { border: 0; background: none; border-radius: 0; padding: 12px 0; }
.rprose .ref-t::before { content: "[" counter(ref) "] "; font: 12.5px var(--mono); color: var(--site-accent); }
.rprose .callout { background: var(--site-accent-soft); border-color: transparent; }
@media (max-width: 1000px) { .p-body { grid-template-columns: 1fr; } .toc { display: none; } }
@media (max-width: 640px) { .p-head { grid-template-columns: 1fr; gap: 24px; } .p-cover { width: 140px; } .p-head h1 { font-size: 30px; } }
</style>
</head>
<body>
<header class="site-header" data-header></header>

<main class="page" data-view="list" data-r-list></main>

<main class="post" data-view="post" hidden>
  <header class="p-head">
    <div class="p-cover"><img data-cover-img alt=""></div>
    <div>
      <p class="p-meta"><b data-post-fill="cat"></b><span data-post-fill="date"></span><span>WakeUp-Jin</span><span>约 9 分钟</span></p>
      <h1 data-post-fill="title"></h1>
      <p class="desc" data-post-fill="desc"></p>
    </div>
  </header>
  <div class="p-body">
    <div>
      <article class="rprose" data-post-body></article>
      <nav class="r-next" data-post-next></nav>
    </div>
    <aside class="toc"><p>本文目录</p><div data-post-toc></div><div class="tools"><button type="button">复制链接</button><button type="button" onclick="scrollTo(0,0)">回到顶部</button></div></aside>
  </div>
</main>

<script src="shared.js"></script>
<script src="blog-shared.js"></script>
<script src="blog-r.js"></script>
<script>bootR("R2");</script>
</body>
</html>
