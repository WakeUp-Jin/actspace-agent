<title>模型连接 三个方向</title>
<!-- 文档状态：方向对比 Demo；不作为实现契约。三套视觉语言各画「列表 / 选服务商 / 填写」三屏，同一批假数据。 -->
<style>
:root {
  color-scheme: light;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
  --font-mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", monospace;
  --font-serif: "Songti SC", "Noto Serif SC", Georgia, serif;
  --page: #f2f1ee; --ink: #1b1b19; --muted: #6d6c66; --faint: #97968f;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; flex-shrink: 0; }

/* ---------- 对比页骨架 ---------- */
.docbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: rgba(242,241,238,.9); backdrop-filter: blur(8px); border-bottom: 1px solid #dedcd6; }
.docbar h1 { font-size: 13px; font-weight: 600; }
.docbar p { font-size: 12px; color: var(--muted); }
.docbar .sw { margin-left: auto; display: flex; gap: 2px; padding: 2px; border: 1px solid #dedcd6; border-radius: 8px; background: #fff; }
.docbar .sw button { height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: none; font-size: 12px; color: var(--muted); }
.docbar .sw button[aria-pressed="true"] { background: #1b1b19; color: #fff; }
.boards { display: flex; align-items: flex-start; gap: 26px; padding: 24px 20px 80px; overflow-x: auto; }
.board { flex: 0 0 auto; width: 470px; }
.board-head { padding: 0 2px 14px; }
.board-head .n { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--faint); }
.board-head h2 { margin-top: 4px; font-size: 17px; font-weight: 600; }
.board-head p { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.6; }
.cap { margin: 18px 2px 6px; font-size: 11px; color: var(--faint); letter-spacing: .04em; }
.screen { border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,20,18,.06), 0 12px 30px rgba(20,20,18,.07); }

/* =========================================================
   A · 发丝卡片 (hairline cards, air, quiet)
   ========================================================= */
.A { --bg: #f8f8f6; --surf: #fff; --stroke: #e7e5e0; --stroke2: #efedea; --tx: #1c1c1a; --tx2: #6e6d68; --tx3: #9b9a94;
      --acc: #117a4e; --acc-soft: #e7f2ec; --warn: #b3593a; background: var(--bg); color: var(--tx); padding: 22px 20px 26px; }
.A * { border-color: var(--stroke); }
.A .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.A .bar h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.A .bar .grow { flex: 1; }
.A .card { border: .5px solid var(--stroke); background: var(--surf); border-radius: 14px; padding: 14px; }
.A .stack { display: grid; gap: 10px; }
.A .conn { display: flex; align-items: center; gap: 12px; }
.A .logo { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px; background: #f4f3f0; }
.A .logo img { width: 19px; height: 19px; object-fit: contain; }
.A .nm { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
.A .meta { margin-top: 1px; font-size: 12px; color: var(--tx2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.A .meta .mono { font-family: var(--font-mono); font-size: 11px; color: var(--tx3); }
.A .tag { font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 5px; background: #f2f1ee; color: var(--tx2); }
.A .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
.A .dot.off { background: #d8d6d0; }
.A .dot.err { background: #c4574f; }
.A .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx2); white-space: nowrap; flex: none; }
.A .btn { height: 30px; padding: 0 12px; border: .5px solid var(--stroke); border-radius: 9px; background: #fff; font-size: 12.5px; font-weight: 500; }
.A .btn.solid { background: #1c1c1a; border-color: #1c1c1a; color: #fff; }
.A .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 8px; }
.A .btn.gh { border-color: transparent; background: none; color: var(--tx2); }
.A .fld { display: grid; gap: 7px; }
.A .lb { font-size: 12px; font-weight: 500; color: var(--tx2); display: flex; align-items: center; gap: 8px; }
.A .lb .sp { margin-left: auto; font-weight: 400; }
.A .in { width: 100%; height: 34px; padding: 0 11px; border: .5px solid var(--stroke); border-radius: 9px; background: #fff; font-size: 13px; }
.A .in.mono { font-family: var(--font-mono); font-size: 12.5px; }
.A .hint { font-size: 12px; color: var(--tx3); }
.A .mlist { border: .5px solid var(--stroke); border-radius: 12px; background: #fff; overflow: hidden; }
.A .mrow { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.A .mrow + .mrow { border-top: .5px solid var(--stroke2); }
.A .mt { font-size: 13.5px; font-weight: 500; }
.A .mid { font-family: var(--font-mono); font-size: 11px; color: var(--tx3); margin-top: 1px; }
.A .sw2 { margin-left: auto; width: 34px; height: 20px; flex: none; border: 0; border-radius: 999px; background: #dedcd6; position: relative; }
.A .sw2::after { content: ""; position: absolute; inset: 2px auto 2px 2px; width: 16px; border-radius: 50%; background: #fff; transition: transform .16s ease; }
.A .sw2[aria-checked="true"] { background: var(--acc); }
.A .sw2[aria-checked="true"]::after { transform: translateX(14px); }
.A .pick { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 11px; }
.A .pick:hover { background: #f4f3f0; }
.A .grp { font-size: 11px; color: var(--tx3); padding: 12px 4px 5px; }
.A .grp:first-child { padding-top: 4px; }
.A .foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; }

/* =========================================================
   B · 文档式 (typographic, no cards, paper)
   ========================================================= */
.B { --bg: #fbfaf7; --tx: #191917; --tx2: #5f5e59; --tx3: #94938c; --rule: #e4e1da; --acc: #9a3412;
      background: var(--bg); color: var(--tx); padding: 30px 28px 34px; }
.B .bar { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--tx); }
.B h3 { font-family: var(--font-serif); font-size: 25px; font-weight: 500; letter-spacing: .01em; }
.B .bar .grow { flex: 1; }
.B .txtbtn { border: 0; background: none; padding: 0; font-size: 13px; text-decoration: underline; text-decoration-color: var(--tx3); text-underline-offset: 4px; }
.B .lead { margin: 14px 0 22px; font-size: 13px; color: var(--tx2); max-width: 34em; }
.B .line { display: flex; align-items: center; gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--rule); flex-wrap: nowrap; }
.B .line:first-of-type { border-top: 1px solid var(--rule); }
.B .line .l { flex: 1; min-width: 0; }
.B .nm { font-size: 15px; }
.B .sub { margin-top: 3px; font-family: var(--font-mono); font-size: 11px; color: var(--tx3); letter-spacing: -.01em; }
.B .models { margin-top: 6px; display: flex; flex-wrap: nowrap; gap: 5px; overflow: hidden; }
.B .chip { font-size: 11.5px; color: var(--tx2); padding: 1px 7px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
.B .st { font-size: 12px; color: var(--tx2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.B .st .d { width: 5px; height: 5px; border-radius: 50%; background: #2f7d4f; }
.B .st.err { color: var(--acc); } .B .st.err .d { background: var(--acc); }
.B .arrow { color: var(--tx3); }
.B .fld { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.B .lb { font-size: 12px; color: var(--tx2); display: flex; align-items: center; gap: 10px; }
.B .lb .sp { margin-left: auto; }
.B .ul { width: 100%; height: 32px; padding: 0; border: 0; border-bottom: 1px solid var(--tx); background: none; font-size: 14px; }
.B .ul.mono { font-family: var(--font-mono); font-size: 13px; }
.B .ul::placeholder { color: var(--tx3); }
.B .hint { margin-top: 7px; font-size: 12px; color: var(--tx3); }
.B .mrow { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.B .mt { font-size: 14px; }
.B .mid { font-family: var(--font-mono); font-size: 11px; color: var(--tx3); margin-top: 2px; }
.B .ck { margin-left: auto; width: 17px; height: 17px; flex: none; border: 1.5px solid var(--tx3); border-radius: 3px; background: none; padding: 0; display: grid; place-items: center; color: #fff; }
.B .ck[aria-checked="true"] { background: var(--tx); border-color: var(--tx); }
.B .pick { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--rule); width: 100%; border-left: 0; border-right: 0; border-top: 0; background: none; text-align: left; }
.B .pick:hover .nm { color: var(--acc); }
.B .grp { margin: 24px 0 4px; font-size: 11px; letter-spacing: .16em; color: var(--tx3); }
.B .grp:first-of-type { margin-top: 8px; }
.B .bigbtn { width: 100%; height: 42px; margin-top: 26px; border: 0; border-radius: 6px; background: #191917; color: #fff; font-size: 14px; }
.B .note { margin-top: 10px; font-size: 11.5px; color: var(--tx3); text-align: center; }

/* =========================================================
   C · 终端工作室 (dark, dense, mono)
   ========================================================= */
.C { --bg: #0d0f0e; --panel: rgba(255,255,255,.028); --panel2: rgba(255,255,255,.05); --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.14);
      --tx: #e8e9e6; --tx2: #9a9c97; --tx3: #6a6c68; --amber: #d9a05b; --green: #6fcf97; --red: #e07a6a;
      background: var(--bg); color: var(--tx); padding: 18px 18px 22px; font-family: var(--font-mono); }
.C .bar { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line2); }
.C .bar b { font-family: var(--font-ui); font-size: 14px; font-weight: 600; letter-spacing: .02em; }
.C .bar .grow { flex: 1; }
.C .bar .path { font-size: 11px; color: var(--tx3); }
.C .k { font-size: 10.5px; color: var(--amber); letter-spacing: .08em; }
.C .btn { height: 26px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 2px; background: none; color: var(--tx); font-size: 11.5px; }
.C .btn.p { background: var(--amber); border-color: var(--amber); color: #16110a; font-weight: 600; }
.C .btn:hover:not(.p) { background: var(--panel2); }
.C table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.C td { padding: 0; vertical-align: middle; }
.C tr.r { border-bottom: 1px solid var(--line); }
.C tr.r:hover { background: var(--panel); }
.C tr.r td { padding: 9px 8px; }
.C .nm { font-family: var(--font-ui); font-size: 13px; }
.C .id { font-size: 11px; color: var(--tx3); }
.C .st { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--tx2); white-space: nowrap; }
.C .st i { width: 6px; height: 6px; border-radius: 1px; background: var(--green); }
.C .st.e { color: var(--red); } .C .st.e i { background: var(--red); }
.C .st.q i { background: var(--tx3); }
.C .col { text-align: right; white-space: nowrap; color: var(--tx3); font-size: 11px; }
.C .sec { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 6px; }
.C .sec .lab { font-size: 10.5px; color: var(--tx3); letter-spacing: .1em; }
.C .sec .rule { flex: 1; height: 1px; background: var(--line); }
.C .grid { display: grid; grid-template-columns: 92px 1fr; border-top: 1px solid var(--line); }
.C .grid > * { padding: 9px 8px; border-bottom: 1px solid var(--line); }
.C .grid .lab { color: var(--tx3); font-size: 11px; }
.C .in { width: 100%; height: 28px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 2px; background: rgba(0,0,0,.35); color: var(--tx); font-size: 12px; }
.C .in::placeholder { color: var(--tx3); }
.C .mr { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.C .ck { width: 14px; height: 14px; flex: none; border: 1px solid var(--line2); border-radius: 2px; background: none; padding: 0; display: grid; place-items: center; color: #0d0f0e; }
.C .ck[aria-checked="true"] { background: var(--green); border-color: var(--green); }
.C .mname { font-family: var(--font-ui); font-size: 12.5px; }
.C .mid2 { font-size: 11px; color: var(--tx3); }
.C .sp2 { margin-left: auto; }
.C .sel { display: flex; gap: 0; border: 1px solid var(--line2); border-radius: 2px; overflow: hidden; width: fit-content; }
.C .sel button { height: 24px; padding: 0 9px; border: 0; border-right: 1px solid var(--line2); background: none; color: var(--tx2); font-size: 11px; }
.C .sel button:last-child { border-right: 0; }
.C .sel button[aria-pressed="true"] { background: var(--panel2); color: var(--tx); }
.C .foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line2); font-size: 11px; color: var(--tx3); }
@media (max-width: 900px) { .boards { flex-direction: column; } .board { width: 100%; max-width: 520px; } }
</style>

<header class="docbar">
  <h1>模型连接 · 三个方向</h1>
  <p>同一批数据，同一批交互，只换视觉语言。挑一个，或者指出要混哪几处。</p>
  <div class="sw" id="themeSw" role="group" aria-label="主题"></div>
</header>

<div class="boards" id="boards"></div>

    screens: [["列表", "list"], ["选服务商", "pick"], ["填写", "form"]] },
  { key: "B", name: "文档式", en: "typographic", cls: "B", r: B,
    thesis: "没有卡片，只有横线和字。中文标题用宋体，模型用小标签成组出现，输入框只有下划线。像一个排版讲究的说明书。",

    screens: [["列表", "list"], ["选服务商", "pick"], ["填写", "form"]] },
];

function render() {
  document.getElementById("boards").innerHTML = DIRS.map((d) => `<section class="board">
    <header class="board-head"><div class="n">方向 ${d.key} · ${d.en}</div><h2>${d.name}</h2><p>${d.thesis}</p><p style="color:var(--faint);margin-top:6px">${d.note}</p></header>
    ${d.screens.map(([cap, fn]) => `<div class="cap">${cap}</div><div class="screen ${d.cls}">${d.r[fn]()}</div>`).join("")}
  </section>`).join("");
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-tog]");
  if (b) { const i = +b.dataset.tog; STATE.kimi[i].on = !STATE.kimi[i].on; return render(); }
  if (e.target.closest("[data-theme]")) return;
});
render();

const THEMES = [["light", "浅色"], ["dark", "深色"]];
const sw = document.getElementById("themeSw");
sw.innerHTML = THEMES.map(([v, l]) => `<button data-theme="${v}" aria-pressed="${v === "light"}">${l}</button>`).join("");
sw.addEventListener("click", (e) => {
  const b = e.target.closest("[data-theme]"); if (!b) return;
  const dark = b.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  sw.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
