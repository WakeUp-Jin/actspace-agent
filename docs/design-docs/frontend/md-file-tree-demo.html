<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD 文件树 Demo</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --subtle: #f1f1ef; --sidebar: #efefed;
  --selected: #e4e4e1; --hover: #eaeae7; --border: #deded9; --border-strong: #8c8c85;
  --text: #20201e; --muted: #676762; --faint: #72726b; --subtle-text: #85857e;
  --info: #3978b8; --info-soft: #e8f1f9; --ok: #087a4b; --ok-soft: #e5f2ea;
  --warn: #91600e; --warn-soft: #f7eedb;
  --code-bg: #f4f4f2; --code-border: rgba(140,140,133,.42);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: "SFMono-Regular", "JetBrains Mono", Menlo, monospace;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
}
:root[data-theme="dark"] {
  --bg: #181916; --surface: #242522; --subtle: #292a26; --sidebar: #1e1f1c;
  --selected: #30312d; --hover: #2a2b27; --border: #353630; --border-strong: #6d6d66;
  --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle-text: #787870;
  --info: #6ca6da; --info-soft: #1e3345; --ok: #36c783; --ok-soft: #173328;
  --warn: #e0b45a; --warn-soft: #3a2f17;
  --code-bg: #1f201d; --code-border: rgba(150,150,140,.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- 顶部方案切换（demo 专用） ---------- */
.demo-bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.demo-bar .title { font-weight: 600; margin-right: 8px; }
.seg { display: inline-flex; background: var(--subtle); border-radius: var(--r-md); padding: 2px; }
.seg button { padding: 4px 12px; border-radius: var(--r-sm); color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.demo-bar .hint { color: var(--faint); margin-left: auto; font-size: 12px; }

/* ---------- 应用骨架 ---------- */
.app { display: flex; height: calc(100% - 44px); }
.left { width: 220px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 14px 10px; flex-shrink: 0; }
.left .brand { font-weight: 700; padding: 4px 8px 14px; }
.left .item { padding: 6px 8px; border-radius: var(--r-sm); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.left .item.on { background: var(--selected); color: var(--text); }
.left .group { padding: 14px 8px 4px; font-size: 12px; color: var(--faint); }
.center { flex: 1; min-width: 260px; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
.center .head { height: 44px; display: flex; align-items: center; padding: 0 18px; font-weight: 600; border-bottom: 1px solid var(--border); }
.center .chat { flex: 1; padding: 22px 26px; overflow: auto; color: var(--muted); }
.bubble { background: var(--subtle); border-radius: var(--r-lg); padding: 10px 14px; margin: 0 0 14px auto; max-width: 80%; width: fit-content; color: var(--text); }
.reply { margin-bottom: 14px; line-height: 1.7; }
.deliver { display: flex; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 12px; background: var(--surface); width: fit-content; cursor: pointer; color: var(--text); }
.deliver:hover { border-color: var(--border-strong); }
.center .composer { margin: 0 18px 18px; height: 84px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }

/* ---------- 右侧面板 ---------- */
.right { width: 62%; min-width: 520px; display: flex; flex-direction: column; background: var(--surface); transition: width .2s; }
.app.full .center { display: none; }
.app.full .right { width: 100%; }
.tabs { height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--border); }
.tab { padding: 5px 10px; border-radius: var(--r-sm); color: var(--muted); }
.tab.on { background: var(--subtle); color: var(--text); }
.tabs .sp { flex: 1; }
.icon-btn { width: 28px; height: 28px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--faint); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; }

.panel { flex: 1; display: flex; min-height: 0; }

/* 文件树 */
/* 文件树放在最右侧，正文紧挨中间的聊天区 */
.tree { order: 2; width: 260px; flex-shrink: 0; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); transition: width .18s, opacity .18s; }
.tree.collapsed { width: 0; opacity: 0; overflow: hidden; border-left: 0; }
.reader { order: 1; }
.tree-head { padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 8px; }
.ws { display: flex; align-items: center; gap: 6px; font-weight: 600; padding: 0 4px; }
.ws .count { margin-left: auto; color: var(--faint); font-weight: 400; font-size: 12px; }
.search { display: flex; align-items: center; gap: 6px; height: 30px; border: 1px solid var(--border); border-radius: var(--r-md); padding: 0 8px; background: var(--bg); }
.search input { flex: 1; border: 0; outline: 0; background: none; color: var(--text); font: inherit; }
.search svg { width: 14px; height: 14px; color: var(--faint); }
.filters { display: flex; gap: 4px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; color: var(--muted); border: 1px solid var(--border); }
.chip.on { background: var(--text); color: var(--surface); border-color: var(--text); }
.tree-body { flex: 1; overflow: auto; padding: 2px 6px 12px; }
.row { display: flex; align-items: center; gap: 5px; height: 28px; padding-right: 8px; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; color: var(--text); }
.row:hover { background: var(--hover); }
.row.sel { background: var(--selected); }
.row .chev { width: 14px; height: 14px; color: var(--faint); transition: transform .12s; flex-shrink: 0; }
.row.open .chev { transform: rotate(90deg); }
.row .ico { width: 15px; height: 15px; flex-shrink: 0; color: var(--faint); }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row.dir .name { color: var(--muted); }
.row .n { font-size: 11px; color: var(--subtle-text); }
.row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
.row mark { background: var(--warn-soft); color: inherit; border-radius: 2px; }
.tree-foot { border-top: 1px solid var(--border); padding: 8px 12px; font-size: 12px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.tree-foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

/* 阅读区 */
.reader { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.reader-head { height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--border); }
.crumbs { flex: 1; min-width: 0; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--text); font-weight: 500; }
.reader-body { flex: 1; display: flex; min-height: 0; }
.doc-scroll { flex: 1; overflow: auto; }
.doc { max-width: 760px; margin: 0 auto; padding: 28px 40px 80px; font-size: 14.5px; line-height: 1.75; }
.outline { width: 200px; flex-shrink: 0; border-left: 1px solid var(--border); padding: 18px 12px; overflow: auto; font-size: 12.5px; }
.outline .t { color: var(--faint); font-size: 12px; margin-bottom: 8px; }
.outline a { display: block; color: var(--muted); text-decoration: none; padding: 3px 8px; border-left: 2px solid transparent; }
.outline a.h3 { padding-left: 20px; }
.outline a.on { color: var(--text); border-left-color: var(--text); }
.outline a:hover { color: var(--text); }
.reader-body.no-outline .outline { display: none; }

/* 大纲浮层（方案 A） */
.toc-pop { position: absolute; right: 10px; top: 40px; width: 230px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: 0 8px 28px rgba(0,0,0,.12); padding: 10px 6px; display: none; z-index: 5; }
.toc-pop.show { display: block; }
.toc-pop a { display: block; padding: 4px 10px; color: var(--muted); text-decoration: none; border-radius: var(--r-sm); }
.toc-pop a.h3 { padding-left: 22px; }
.toc-pop a:hover { background: var(--hover); color: var(--text); }

/* ---------- MD 渲染（做精的部分） ---------- */
.fm { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.fm span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--subtle); color: var(--muted); }
.fm span b { color: var(--text); font-weight: 500; }
.doc h1 { font-size: 26px; line-height: 1.3; margin: 0 0 12px; letter-spacing: -.01em; }
.doc h2 { font-size: 19px; margin: 32px 0 10px; padding-top: 4px; }
.doc h3 { font-size: 16px; margin: 22px 0 8px; }
.doc h2, .doc h3 { position: relative; scroll-margin-top: 16px; }
.doc h2:hover .anchor, .doc h3:hover .anchor { opacity: 1; }
.anchor { position: absolute; left: -20px; color: var(--faint); opacity: 0; font-weight: 400; text-decoration: none; }
.doc p { margin: 0 0 12px; }
.doc blockquote { margin: 0 0 14px; padding: 2px 14px; border-left: 3px solid var(--border); color: var(--muted); }
.doc code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: 0 4px; }
.doc pre { position: relative; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: var(--r-md); padding: 12px 14px; overflow: auto; font: 12.5px/1.6 var(--mono); margin: 0 0 14px; }
.doc pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.doc pre .lang { position: absolute; top: 6px; right: 10px; font: 11px var(--font); color: var(--faint); }
.k { color: #a3507a; } .s { color: #2f7a4a; } .c { color: var(--faint); font-style: italic; } .f { color: #3978b8; }
:root[data-theme="dark"] .k { color: #e08ab6; } :root[data-theme="dark"] .s { color: #7fcf98; } :root[data-theme="dark"] .f { color: #7fb4e6; }
.doc table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 13.5px; }
.doc th, .doc td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.doc th { background: var(--subtle); font-weight: 600; }
.doc ul, .doc ol { margin: 0 0 12px; padding-left: 22px; }
.doc li { margin: 3px 0; }
.task { list-style: none; margin-left: -22px; display: flex; gap: 8px; align-items: baseline; }
.task i { width: 14px; height: 14px; border: 1.5px solid var(--border-strong); border-radius: 4px; display: inline-block; flex-shrink: 0; transform: translateY(2px); }
.task.done i { background: var(--ok); border-color: var(--ok); }
.task.done span { color: var(--faint); text-decoration: line-through; }
.callout { border-radius: var(--r-md); padding: 10px 14px; margin: 0 0 14px; border: 1px solid; }
.callout .ct { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.callout.note { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.callout.note .ct { color: var(--info); }
.callout.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.callout.warn .ct { color: var(--warn); }
.mermaid { border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; margin: 0 0 14px; display: flex; justify-content: center; background: var(--bg); }
.mermaid svg text { fill: var(--text); font: 12px var(--font); }
.mermaid svg rect { fill: var(--surface); stroke: var(--border-strong); }
.mermaid svg path { stroke: var(--border-strong); fill: none; }
.doc a { color: var(--info); text-decoration: none; }
.doc a:hover { text-decoration: underline; }
.doc hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }

/* 空态 */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--faint); gap: 6px; }

/* 外部打开提示（toast） */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--surface); padding: 8px 14px; border-radius: var(--r-md); font-size: 12.5px; opacity: 0; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

      </div>
    </div>
  </section>
</div>

const open = new Set(["docs", "docs/design-docs", "docs/design-docs/自进化的方案设计"]);
let selected = "docs/design-docs/自进化的方案设计/README.md";
let query = "", filter = "all", variant = "A";

const ICON_CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 4 4 4-4 4"/></svg>';
const ICON_DIR = '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.4 1.5h6a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>';
const ICON_MD = '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 1.5h5.5L13 5v9a.5.5 0 0 1-.5.5h-8.5A.5.5 0 0 1 3.5 14V2a.5.5 0 0 1 .5-.5Z"/><path d="M9.5 1.5V5H13M5.5 8.5h5M5.5 11h3.5"/></svg>';

function countMd(node) { return node.f ? (node.f === "…" ? 0 : 1) : (node.n ?? node.c.reduce((n, c) => n + countMd(c), 0)); }
function hasSession(node) { return node.f ? !!node.s : node.c.some(hasSession); }
function matches(node) {
  if (node.f) return node.f !== "…" && node.f.toLowerCase().includes(query.toLowerCase());
  return node.c.some(matches);
}
function esc(s) { return s.replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[m]); }
function hl(name) {
  if (!query) return esc(name);
  const i = name.toLowerCase().indexOf(query.toLowerCase());
  return i < 0 ? esc(name) : esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + query.length)) + "</mark>" + esc(name.slice(i + query.length));
}

function renderTree() {
  const out = [];
  const walk = (nodes, depth, prefix) => {
    const sorted = [...nodes].sort((a, b) => (a.d ? 0 : 1) - (b.d ? 0 : 1));
    for (const node of sorted) {
      if (filter === "session" && !hasSession(node)) continue;
      if (query && !matches(node)) continue;
      const path = prefix + (node.d || node.f);
      const pad = 6 + depth * 14;
      if (node.d) {
        const isOpen = open.has(path) || !!query || filter === "session";
        out.push(`<div class="row dir ${isOpen ? "open" : ""}" data-dir="${path}" style="padding-left:${pad}px">${ICON_CHEV}${ICON_DIR}<span class="name">${hl(node.d)}</span><span class="n">${countMd(node)}</span></div>`);
        if (isOpen) walk(node.c, depth + 1, path + "/");
      } else {
        if (node.f === "…") { out.push(`<div class="row" style="padding-left:${pad + 19}px;color:var(--faint);cursor:default">… 展开时按需加载</div>`); continue; }
        out.push(`<div class="row ${path === selected ? "sel" : ""}" data-file="${path}" style="padding-left:${pad + 19}px" title="${esc(path)}">${ICON_MD}<span class="name">${hl(node.f)}</span>${node.s ? '<span class="dot" title="本会话改过"></span>' : ""}</div>`);
      }
    }
  };
  walk(TREE, 0, "");
  document.getElementById("treeBody").innerHTML = out.join("") || '<div style="padding:16px;color:var(--faint)">没有匹配的 MD 文件</div>';
}

// ---------- 文档内容 ----------
const README = `
<div class="fm"><span>status <b>V1 已实施</b></span><span>owner <b>Harness</b></span><span>updated <b>2026-11-01</b></span></div>
<h1>Harness 自进化方案设计</h1>
<p>ActSpace 的一切都是插件。自进化就是让 Agent 在运行中<b>新增、修改、替换</b>自己的插件，并且每一次变化都可评估、可回退。</p>
<div class="callout note"><div class="ct">ⓘ 阅读顺序</div>先读 01 和 05 了解边界，再读 10 了解 V1 怎么用。V2 的触发方式见 11。</div>
<h2 id="h-status"><a class="anchor" href="#h-status">#</a>当前状态</h2>
<table><thead><tr><th>阶段</th><th>能力</th><th>状态</th></tr></thead><tbody>
<tr><td>V1</td><td>会话内新增与修改工具</td><td>✅ 已上线</td></tr>
<tr><td>V2</td><td>失败触发派生 + 沙箱评估</td><td>🚧 设计中</td></tr>
<tr><td>V3</td><td>Actor 长成与记忆</td><td>— 未开始</td></tr></tbody></table>
<h2 id="h-flow"><a class="anchor" href="#h-flow">#</a>进化流程</h2>
<div class="mermaid"><svg width="520" height="96" viewBox="0 0 520 96">
<rect x="4" y="30" width="96" height="36" rx="8"/><text x="52" y="52" text-anchor="middle">运行失败</text>
<rect x="140" y="30" width="96" height="36" rx="8"/><text x="188" y="52" text-anchor="middle">派生新版本</text>
<rect x="276" y="30" width="96" height="36" rx="8"/><text x="324" y="52" text-anchor="middle">沙箱评估</text>
<rect x="412" y="30" width="100" height="36" rx="8"/><text x="462" y="52" text-anchor="middle">HMR 切换</text>
<path d="M100 48h36M236 48h36M372 48h36"/><path d="M131 43l5 5-5 5M267 43l5 5-5 5M403 43l5 5-5 5"/>
</svg></div>
<h3 id="h-trigger"><a class="anchor" href="#h-trigger">#</a>触发条件</h3>
<ul><li>同一工具连续失败 3 次；</li><li>用户明确说「换个做法」；</li><li>评估分数低于基线。</li></ul>
<h3 id="h-plugin"><a class="anchor" href="#h-plugin">#</a>插件声明示例</h3>
<pre><span class="lang">ts</span><code><span class="k">export const</span> manifest = <span class="f">defineBuiltinPluginManifest</span>({
  pluginId: <span class="s">"tool-plugin-manager"</span>,
  title: { zh: <span class="s">"插件管理工具"</span>, en: <span class="s">"Plugin manager tool"</span> },
  scope: <span class="s">"session"</span>, <span class="c">// 会话插件：由 Agent 预设按会话组成</span>
})</code></pre>
<div class="callout warn"><div class="ct">⚠ 边界</div>进化只能发生在沙箱里。任何派生版本在通过评估之前，不会替换正在运行的版本。</div>
<h2 id="h-todo"><a class="anchor" href="#h-todo">#</a>待办</h2>
<ul><li class="task done"><i></i><span>V1：会话内新增与修改工具</span></li><li class="task done"><i></i><span>HMR 与运行时版本切换</span></li><li class="task"><i></i><span>V2：失败触发派生</span></li><li class="task"><i></i><span>评估模块与基线分数</span></li></ul>
<hr><p style="color:var(--faint)">相关：<a href="#">05-总体架构与DSH借鉴边界.md</a> · <a href="#">10-V1实现与使用说明.md</a></p>`;

function genericDoc(path) {
  const name = path.split("/").pop().replace(/\.md$/, "");
  return `<h1>${esc(name)}</h1><p style="color:var(--faint)">${esc(path)}</p>
<h2 id="g1"><a class="anchor" href="#g1">#</a>背景</h2><p>这是 demo 占位内容。真实实现里，点击文件时才读取并渲染这一篇，不会预先读取整个目录。</p>
<h2 id="g2"><a class="anchor" href="#g2">#</a>结论</h2><p>文件树本身只保存文件名和目录结构，开销很小；正文按需加载，切换文件时释放上一篇。</p>`;
}

function renderDoc() {
  const doc = document.getElementById("doc");
  doc.innerHTML = selected.endsWith("自进化的方案设计/README.md") ? README : genericDoc(selected);
  const parts = selected.split("/");
  document.getElementById("crumbs").innerHTML = parts.slice(0, -1).map(esc).join(" / ") + (parts.length > 1 ? " / " : "") + "<b>" + esc(parts.at(-1)) + "</b>";
  const heads = [...doc.querySelectorAll("h2[id], h3[id]")];
  const links = heads.map((h) => `<a href="#${h.id}" class="${h.tagName === "H3" ? "h3" : ""}" data-id="${h.id}">${esc(h.textContent.replace(/^#/, ""))}</a>`).join("");
  document.getElementById("outline").innerHTML = '<div class="t">本页大纲</div>' + links;
  document.getElementById("tocPop").innerHTML = links || '<div style="padding:4px 10px;color:var(--faint)">没有标题</div>';
  document.getElementById("docScroll").scrollTop = 0;
}

// ---------- 交互 ----------
document.getElementById("treeBody").addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (!row) return;
  if (row.dataset.dir) { open.has(row.dataset.dir) ? open.delete(row.dataset.dir) : open.add(row.dataset.dir); renderTree(); }
  if (row.dataset.file) { selected = row.dataset.file; renderTree(); renderDoc(); }
});
document.getElementById("q").addEventListener("input", (e) => { query = e.target.value.trim(); renderTree(); });
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
  filter = c.dataset.f; document.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === c)); renderTree();
}));
document.getElementById("treeBtn").addEventListener("click", () => document.getElementById("tree").classList.toggle("collapsed"));
document.getElementById("fullBtn").addEventListener("click", () => document.getElementById("app").classList.toggle("full"));
document.getElementById("tocBtn").addEventListener("click", (e) => { e.stopPropagation(); document.getElementById("tocPop").classList.toggle("show"); });
document.addEventListener("click", (e) => { if (!e.target.closest("#tocPop")) document.getElementById("tocPop").classList.remove("show"); });
document.getElementById("tocPop").addEventListener("click", (e) => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.id)?.scrollIntoView({ behavior: "smooth" }); });
document.getElementById("outline").addEventListener("click", (e) => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.id)?.scrollIntoView({ behavior: "smooth" }); });
document.getElementById("docScroll").addEventListener("scroll", () => {
  const heads = [...document.querySelectorAll("#doc h2[id], #doc h3[id]")];
  const top = document.getElementById("docScroll").getBoundingClientRect().top + 40;
  let cur = heads[0]?.id;
  for (const h of heads) if (h.getBoundingClientRect().top < top) cur = h.id;
  document.querySelectorAll("#outline a").forEach((a) => a.classList.toggle("on", a.dataset.id === cur));
});
document.querySelector(".deliver").addEventListener("click", (e) => {
  selected = e.currentTarget.dataset.open;
  "docs docs/design-docs docs/design-docs/自进化的方案设计".split(" ").forEach((p) => open.add(p));
  renderTree(); renderDoc();
});
let toastTimer;
document.querySelectorAll(".ext").forEach((b) => b.addEventListener("click", () => {
  const t = document.getElementById("toast"); t.textContent = b.dataset.msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}));
document.querySelectorAll("#variant button").forEach((b) => b.addEventListener("click", () => {
  variant = b.dataset.v;
  document.querySelectorAll("#variant button").forEach((x) => x.classList.toggle("on", x === b));
  document.getElementById("readerBody").classList.toggle("no-outline", variant === "A");
  document.getElementById("tocBtn").style.display = variant === "A" ? "" : "none";
}));
document.querySelectorAll("#theme button").forEach((b) => b.addEventListener("click", () => {
  document.documentElement.dataset.theme = b.dataset.t;
  document.querySelectorAll("#theme button").forEach((x) => x.classList.toggle("on", x === b));
}));

document.getElementById("mdCount").textContent = TREE.reduce((n, c) => n + countMd(c), 0) + " 篇";
renderTree(); renderDoc();
</script>
