<style>
:root {

  --text: #20201e; --muted: #676762; --faint: #72726b; --subtle: #9a9a93;
  --action: #20201e; --action-hover: #343430; --on-action: #ffffff;
  --operational: #087a4b; --operational-soft: #e5f2ea; --warning: #91600e; --warning-soft: #f7eedb;
  --danger: #c74747; --on-danger: #a93a3a; --danger-soft: #f8e9e9;
  --toggle-off: #d3d3ce; --toggle-on: #087a4b; --knob: #ffffff; --focus: #4d4d48;
  --scrim: rgba(24, 24, 22, 0.36);
  --shadow-pop: 0 1px 2px rgba(31, 45, 61, 0.06), 0 12px 32px rgba(31, 45, 61, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #181916; --sidebar: #1e1f1c; --surface: #222320; --surface-subtle: #292a26; --selected: #30312d; --hover: #282925;
    --line: #353630; --line-soft: #2d2e29; --line-strong: #787870;
    --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle: #6f6f68;
    --action: #f1f1ed; --action-hover: #dbdbd5; --on-action: #181916;
    --operational: #36c783; --operational-soft: #193a2b; --warning: #d2a14d; --warning-soft: #3e321c;
    --danger: #e06b6b; --on-danger: #f08a8a; --danger-soft: #452525; --toggle-off: #4a4b45; --toggle-on: #36c783; --focus: #c8c8c0;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow-pop: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #181916; --sidebar: #1e1f1c; --surface: #222320; --surface-subtle: #292a26; --selected: #30312d; --hover: #282925;
  --line: #353630; --line-soft: #2d2e29; --line-strong: #787870;
  --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle: #6f6f68;
  --action: #f1f1ed; --action-hover: #dbdbd5; --on-action: #181916;
  --operational: #36c783; --operational-soft: #193a2b; --warning: #d2a14d; --warning-soft: #3e321c;
  --danger: #e06b6b; --on-danger: #f08a8a; --danger-soft: #452525; --toggle-off: #4a4b45; --toggle-on: #36c783; --focus: #c8c8c0;
  --scrim: rgba(0, 0, 0, 0.6);

}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--focus) 45%, transparent); outline-offset: 2px; }
svg { display: block; flex-shrink: 0; }
code, .mono { font-family: var(--font-mono); }

/* ---------- Shell ---------- */
.app { display: flex; flex-direction: column; height: 100%; }
.titlebar { height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--sidebar); border-bottom: 1px solid var(--line); }
.titlebar i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.tb-title { margin-left: 10px; font-size: 12px; color: var(--faint); }

.body { flex: 1; min-height: 0; display: flex; }
.nav { width: 216px; flex-shrink: 0; overflow-y: auto; background: var(--sidebar); border-right: 1px solid var(--line); padding: 10px 10px 16px; }
.nav-back { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; margin-bottom: 6px; border: 0; background: none; border-radius: 6px; color: var(--muted); font-size: 12px; }
.nav-grp { padding: 14px 10px 4px; font-size: 11px; font-weight: 500; color: var(--faint); }

.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 10px; border: 0; background: none; border-radius: 6px; color: var(--muted); font-size: 13px; text-align: left; }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--selected); color: var(--text); font-weight: 500; }
.nav-item svg { color: var(--faint); }
.nav-item[aria-current="page"] svg { color: var(--text); }
main { flex: 1; min-width: 0; overflow-y: auto; }
.page { width: 100%; max-width: 736px; margin: 0 auto; padding: 32px 48px 120px; }

/* ---------- Page & section ---------- */
.crumb { display: inline-flex; align-items: center; gap: 2px; margin: -6px 0 10px -6px; height: 26px; padding: 0 8px 0 4px; border: 0; background: none; border-radius: 6px; color: var(--muted); font-size: 12px; }
.crumb:hover { background: var(--hover); color: var(--text); }
.page-head { display: flex; align-items: center; gap: 12px; }
.page-head .grow { flex: 1; min-width: 0; }
.page-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; text-wrap: balance; }
.page-head h2.sm { font-size: 17px; }

.section { margin-top: 32px; }

.section-head p { margin-top: 2px; font-size: 12px; color: var(--muted); max-width: 58ch; }
.section-head .acts { display: flex; gap: 6px; flex-shrink: 0; }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: visible; }
.group > * + * { border-top: 1px solid var(--line-soft); }
.group > :first-child { border-top-left-radius: 9px; border-top-right-radius: 9px; }
.group > :last-child { border-bottom-left-radius: 9px; border-bottom-right-radius: 9px; }
.row { display: flex; align-items: center; gap: 16px 24px; min-height: 52px; padding: 10px 16px; }
.row .label { flex: 1 1 220px; min-width: 0; }
.row .t { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.row .d { margin-top: 2px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.row .d.mono, .mono-s { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); word-break: break-all; }
.row .ctl { position: relative; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
.row.link { cursor: pointer; transition: background-color 120ms var(--ease); }
.row.link:hover { background: var(--hover); }
.subhead { padding: 9px 16px 6px; font-size: 11px; font-weight: 500; color: var(--faint); background: var(--surface-subtle); }
.val { font-size: 13px; color: var(--muted); max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.val.mono { font-family: var(--font-mono); font-size: 12px; }
.chev { color: var(--subtle); }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 11px; white-space: nowrap; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--text); font-size: 12.5px; font-weight: 500; transition: background-color 120ms var(--ease), border-color 120ms var(--ease), transform 120ms var(--ease); }
.btn:hover:not(:disabled) { border-color: var(--line-strong); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; }
.btn.primary { background: var(--action); border-color: var(--action); color: var(--on-action); }
.btn.primary:hover:not(:disabled) { background: var(--action-hover); }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); }
.btn.quiet:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: transparent; }
.btn.danger { color: var(--on-danger); }
.btn.danger:hover:not(:disabled) { border-color: color-mix(in srgb, var(--danger) 50%, transparent); background: var(--danger-soft); }
.btn.danger-fill { background: var(--danger-soft); border-color: transparent; color: var(--on-danger); }
.btn.icon { width: 28px; padding: 0; }
.btn.lg { height: 32px; padding: 0 14px; font-size: 13px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.linkbtn:hover { color: var(--text); }

.in { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 13px; outline: none; }
.in::placeholder { color: var(--subtle); }
.in:hover { border-color: var(--line-strong); }
.in:focus, .sel select:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 16%, transparent); outline: none; }
.in.mono-in { font-family: var(--font-mono); font-size: 12.5px; }
.in.num { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
.in.mid { width: 220px; max-width: 100%; }
.sel { position: relative; display: inline-flex; }
.sel select { appearance: none; -webkit-appearance: none; height: 30px; min-width: 190px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 13px; cursor: pointer; max-width: 100%; }
.sel svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--faint); }
.sel.sm select { min-width: 110px; }

.tg { position: relative; width: 32px; height: 18px; flex-shrink: 0; border: 0; border-radius: 999px; background: var(--toggle-off); transition: background-color 160ms var(--ease); }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 160ms var(--ease); }
.tg[aria-checked="true"] { background: var(--toggle-on); }
.tg[aria-checked="true"]::after { transform: translateX(14px); }

.seg { display: flex; flex-wrap: wrap; padding: 2px; border-radius: 8px; background: var(--surface-subtle); border: 1px solid var(--line-soft); gap: 2px; }
.seg button { flex: 1 1 auto; height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--line-soft); }
.seg.lg button { height: 28px; font-size: 12.5px; }
.seg.ver button { height: 24px; padding: 0 12px; }

.stepper { display: inline-flex; align-items: center; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.stepper button { width: 28px; height: 100%; border: 0; background: none; color: var(--faint); display: grid; place-items: center; font-size: 15px; }
.stepper button:hover { color: var(--text); }
.stepper output { min-width: 56px; text-align: center; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.status .dot { width: 6px; height: 6px; border-radius: 50%; }
.status.ok .dot { background: var(--operational); }
.status.off .dot { border: 1.5px solid var(--line-strong); width: 7px; height: 7px; }
.status.err { color: var(--on-danger); }
.status.err .dot { background: var(--danger); }
.pill { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--surface-subtle); color: var(--muted); border: 1px solid var(--line-soft); white-space: nowrap; }
.pill.warn { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
.pill.ok { background: var(--operational-soft); color: var(--operational); border-color: transparent; }
.tile { width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-subtle); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.tile.lg { width: 40px; height: 40px; border-radius: 10px; font-size: 13px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: transparent; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--line-strong); } * { transition: none !important; } }

.editor { padding: 12px 16px 14px; background: var(--surface-subtle); display: grid; gap: 8px; }
.editor-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.editor-foot .hint { font-size: 12px; color: var(--faint); }
.editor-foot .btns { display: flex; gap: 6px; margin-left: auto; }

/* ---------- New: create form ---------- */
.stack { display: grid; gap: 16px; margin-top: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
.card.locked { background: transparent; border-style: dashed; }
.card.locked .card-head p { color: var(--faint); }
.card-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card-head h3 { font-size: 13px; font-weight: 600; }
.card-head p { margin-top: 2px; font-size: 12px; color: var(--muted); }
.card-head .count { font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 6px; }
.lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.help { font-size: 12px; color: var(--faint); line-height: 1.5; display: flex; align-items: flex-start; gap: 5px; }
.help svg { margin-top: 2px; }
.help.err { color: var(--on-danger); }
.help.okc { color: var(--operational); }
.req { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.req code { font-size: 11.5px; color: var(--text); background: var(--surface-subtle); border: 1px solid var(--line-soft); padding: 1px 6px; border-radius: 4px; word-break: break-all; }
.fixed { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; height: 34px; font-size: 13px; }
.keybox { display: flex; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.keybox:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 16%, transparent); }
.keybox input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 0; background: none; outline: none; font-family: var(--font-mono); font-size: 12.5px; }
.keybox input::placeholder { color: var(--subtle); font-family: var(--font-ui); font-size: 13px; }
.keybox button { width: 34px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--faint); display: grid; place-items: center; border-radius: 0 7px 7px 0; }
.keybox button:hover { color: var(--text); background: var(--hover); }
.more { border-top: 1px solid var(--line-soft); padding-top: 12px; }
.more-toggle { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 2px 0; font-size: 13px; font-weight: 500; text-align: left; }
.more-toggle .sum { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--faint); text-align: right; }
.more-toggle svg { color: var(--faint); transition: transform 160ms var(--ease); }
.more-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.more-body { display: grid; gap: 16px; margin-top: 12px; padding: 14px; border-radius: 8px; background: var(--surface-subtle); }
.line { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.line .t { font-size: 13px; font-weight: 500; }
.line .d { margin-top: 2px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.test-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line-soft); padding-top: 14px; flex-wrap: wrap; }
.test-l { display: grid; gap: 6px; flex: 1 1 260px; min-width: 0; }
.res { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.res svg { margin-top: 2px; }
.res b { font-weight: 600; color: var(--text); }
.res p { margin-top: 2px; font-size: 12px; color: var(--muted); }
.res.ok > svg { color: var(--operational); }
.res.fail > svg, .res.fail b { color: var(--on-danger); }
.res.warn > svg { color: var(--warning); }
.res.run { align-items: center; }
.steps { display: flex; align-items: center; gap: 10px; list-style: none; padding: 0; margin-top: 18px; font-size: 12.5px; color: var(--faint); flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; border: 1px solid var(--line-strong); }
.steps li.on { color: var(--text); font-weight: 500; }
.steps li.on span { background: var(--action); border-color: var(--action); color: var(--on-action); }
.steps li.done span { background: var(--operational-soft); border-color: transparent; color: var(--operational); }
.steps .bar { width: 28px; height: 1px; background: var(--line); }

.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--subtle); pointer-events: none; }
.search .in { padding-left: 30px; }
.mlist { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mrow { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; }
.mrow + .mrow { border-top: 1px solid var(--line-soft); }
.mrow.sel { background: color-mix(in srgb, var(--surface-subtle) 55%, transparent); }
.ck { width: 16px; height: 16px; margin-top: 1px; flex-shrink: 0; border: 1.5px solid var(--line-strong); border-radius: 4px; background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--on-action); }
.ck[aria-checked="true"] { background: var(--action); border-color: var(--action); }
.mmain { flex: 1; min-width: 0; }
.mt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.mid { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); word-break: break-all; }
.mmeta { margin-top: 2px; font-size: 12px; color: var(--muted); }
.mctl { flex-shrink: 0; display: flex; align-items: center; gap: 4px; margin-top: -3px; }
.mrow.pick { cursor: pointer; align-items: center; }
.mrow.pick:hover { background: var(--hover); }
.mrow.pick .ck { margin-top: 0; }
.mrow .hov { opacity: 0; transition: opacity 120ms var(--ease); }
.mrow:hover .hov, .mrow:focus-within .hov, .mrow:focus .hov { opacity: 1; }
@media (hover: none) { .mrow .hov { opacity: 1; } }
.mrow .mctl { margin-top: 0; }
.bill { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
.bill .t { font-size: 13px; font-weight: 500; }
.bill .d { margin-top: 2px; font-size: 12px; color: var(--muted); }
.okc { color: var(--operational); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px 0 8px; border: 1px dashed var(--line-strong); border-radius: 999px; background: none; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.chip:hover { border-style: solid; color: var(--text); background: var(--hover); }
.add-line { display: flex; gap: 8px; }
.add-line .in { flex: 1; }
.example { font-size: 12px; color: var(--muted); background: var(--surface-subtle); border-radius: 7px; padding: 9px 11px; line-height: 1.55; }
.foot { position: sticky; bottom: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 20px; padding-block: 12px; background: var(--bg); border-top: 1px solid var(--line); }

    ${row('协议格式', '决定认证头、请求体与接口路径。', 'Anthropic Messages', false)}
    ${row('基础地址', 'Anthropic 请填写站点根地址，不要带 /v1。', c.base, true, true)}
    ${row('实际请求地址', '连接测试和模型调用使用的最终接口。', req, false, true, dbl ? iss(4) : '')}
    ${row('代理', '仅此连接使用。', c.proxy ? '已开启' : '关闭', true)}
    ${row('Prompt Cache', '短缓存会为系统提示、最后一个工具定义和最近用户消息添加缓存断点。', c.cache ? '短缓存' : '关闭', true)}
    ${row('默认模型', '连接测试和未显式选择模型时使用。', c.def, false, true)}
    <div class="row"><div class="label"><div class="t">连接测试</div><div class="d" role="status">${c.testing ? '测试中…' : c.msg ? esc(c.msg) : '发送 1 Token 的最小真实请求，不写缓存。'}</div></div><div class="ctl"><button type="button" class="btn" data-act="oTest" ${c.testing ? 'disabled' : ''}>${c.testing ? '测试中…' : '测试默认模型'}</button></div></div>
  </div></section>
  <section class="section"><div class="section-head"><div><h3>模型</h3><p>手动维护此连接可用的模型与计费单价。</p></div></div>
    <div class="o-models-top"><p>模型 ID、能力和价格均为此连接独立配置，不会从中转站自动拉取。</p><button type="button" class="btn primary" data-act="oAddModel">${ic('plus', 14)}添加模型</button></div><div class="o-mlist">${models}</div></section>
  <section class="section"><div class="section-head"><div><h3>危险操作</h3></div></div><div class="group"><div class="row"><div class="label"><div class="t">删除连接</div><div class="d">清除 Key 和连接配置；历史会话与使用统计会保留。</div></div><div class="ctl">${iss(11, true)}<button type="button" class="btn danger" data-act="oDel">删除连接</button></div></div></div></section>`;
}

/* ================= Chrome: version, tweaks, dialog ================= */
function tweaksHtml() {
  const old = S.ver === 'old';
  return `<div class="tw-head"><b>DEMO 调节</b><button type="button" data-act="twMin">${S.twMin ? '展开' : '收起'}</button></div>
  <div class="tw"><span>模拟服务端<em>影响测试结果</em></span>${seg([['ok', '正常'], ['bearer', '要求 Bearer'], ['nolist', '无模型列表'], ['badkey', 'Key 错误']], S.scen, 'scen', 'g2')}</div>
  <div class="tw ${old ? '' : 'dim'}"><span>问题标注${old ? '<em>悬停编号查看</em>' : '<em>现状生效</em>'}</span>${seg([['on', '显示'], ['off', '隐藏']], S.issues ? 'on' : 'off', 'iss')}</div>
  <div class="tw"><span>主题</span>${seg([['system', '跟随系统'], ['light', '浅色'], ['dark', '深色']], S.theme, 'theme')}</div>
  <div class="tw-acts"><button type="button" class="btn" data-act="fill">填入示例</button><button type="button" class="btn quiet" data-act="reset">重置</button></div>`;
}
function dialogHtml() {
  const d = S.dialog; if (!d) return '';
  const c = curConn();
  const t = d.kind === 'delConn' ? { h: `删除 ${c.name}？`, p: 'API Key 和这个连接下的模型会一起删除，历史会话和使用统计会保留。', ok: '删除连接' }
    : { h: `删除 ${mLabel(d.id, c.models.find((m) => m.id === d.id))}？`, p: '历史会话和使用统计会保留。', ok: '删除模型' };
  return `<div class="scrim" data-act="dlgClose"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" data-act="noop"><h3 id="dlg-t">${esc(t.h)}</h3><p>${t.p}</p><div class="btns"><button type="button" class="btn lg" data-act="dlgClose" id="dlg-cancel">取消</button><button type="button" class="btn danger-fill lg" data-act="dlgOk">${t.ok}</button></div></div></div>`;
}
function screen() {
  const old = S.ver === 'old';
  switch (S.route) {
    case 'catalog': return catalogScreen();
    case 'setup': return old ? (S.of ? oldForm() : listScreen()) : (S.nf ? newForm() : listScreen());
    case 'detail': return old ? oldDetail() : newDetail();
    case 'model': return old ? listScreen() : modelEdit();
    default: return listScreen();
  }
}
function render() {
  document.body.classList.toggle('show-iss', S.issues && S.ver === 'old');
  $('#ver').innerHTML = seg([['old', '现状'], ['new', '新方案']], S.ver, 'ver', 'ver');
  $('#main').innerHTML = `<div class="page">${screen()}</div>`;
  const tw = $('#tweaks'); tw.innerHTML = tweaksHtml(); tw.classList.toggle('min', S.twMin);
  $('#dlg').innerHTML = dialogHtml();
  if (S.dialog) $('#dlg-cancel')?.focus();
}

/* ================= Actions ================= */
const MULTS = [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.5, 2];
function stepMult(v, dir) { const i = MULTS.findIndex((x) => Math.abs(x - v) < 1e-9); const j = Math.max(0, Math.min(MULTS.length - 1, (i < 0 ? 5 : i) + (dir === '+' ? 1 : -1))); return MULTS[j]; }
function uuid() { try { return crypto.randomUUID(); } catch { return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16)); } }
function focusEd() { requestAnimationFrame(() => { const el = $('#ed-input'); if (el) { el.focus(); el.setSelectionRange?.(el.value.length, el.value.length); } }); }
function scrollToModels() { document.getElementById('models-card')?.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); }

const A = {
  noop() {},
  navOther() { toast('Demo 只演示「模型」里的连接流程'); },
  ver(a) { S.ver = a; S.menu = null; S.edit = null; S.dialog = null; if (!['list', 'catalog'].includes(S.route)) S.route = 'list'; render(); $('#main').scrollTop = 0; },
  scen(a) { S.scen = a; render(); },
  iss(a) { S.issues = a === 'on'; render(); },
  theme(a) { S.theme = a; applyTheme(); render(); },
  twMin() { S.twMin = !S.twMin; render(); },
  reset() { initState(true); applyTheme(); render(); toast('已重置示例数据'); },
  fill() {
    if (S.route !== 'setup') { toast('先进入「添加连接」里的表单'); return; }
    if (S.ver === 'old') { const o = S.of; o.key = SAMPLE_KEY; if (!o.editing) { if (!o.official) o.url = SAMPLE_URL; o.model = 'claude-sonnet-5'; } render(); return; }
    const f = S.nf; f.key = SAMPLE_KEY;
    if (f.mode !== 'official' && !f.url) f.url = SAMPLE_URL;
    invalidate(); render();
  },
  go(a) { if (a === 'detail' && !curConn()) a = 'list'; go(a); },
  openConn(a) { if (a === 'deepseek' || a === 'kimi') { toast('Demo 只演示自定义连接'); return; } S.cur = a; go('detail'); },
  pick(a) {
    if (S.ver === 'old') {
      if (a === 'anthropic') return openOldForm({ official: true, name: 'Anthropic', url: 'https://api.anthropic.com' });
      if (a === 'anthropic-compatible') return openOldForm({});
      return toast('Demo 只演示 Anthropic 相关的流程');
    }
    if (a === 'anthropic') return openNewForm('official');
    if (a === 'custom') return openNewForm('custom');
    toast('Demo 只演示 Anthropic 和自定义服务');
  },
  // new form
  proto(a) { const f = S.nf; f.protocol = a; f.protoNote = false; invalidate(); render(); },
  nfEye() { S.nf.showKey = !S.nf.showKey; render(); $('#nf-key')?.focus(); },
  nfMore() { S.nf.more = !S.nf.more; setLive('live-more', moreBlock()); },
  nfAuth(a) { S.nf.auth = a; invalidate(); render(); },
  nfProxy() { S.nf.proxy = !S.nf.proxy; setLive('live-more', moreBlock()); },
  nfTest() {
    const f = S.nf; if (!canTest() || f.test === 'running') return;
    f.test = 'running'; f.result = null; render();
    setTimeout(() => {
      if (S.nf !== f) return;
      const r = simulate(f.protocol, f.auth, f.mode === 'official');
      if (r.ok) {
        f.test = 'ok'; f.result = r; f.available = r.list || [];
        if (!f.selected.length && r.list) { const pre = r.list.filter((id) => COMMON.includes(id)); f.selected = pre.length ? pre : [r.list[0]]; f.def = f.selected.includes('claude-sonnet-5') ? 'claude-sonnet-5' : f.selected[0]; }
        if (f.mode === 'custom') f.step = 2;
      } else { f.test = 'fail'; f.result = r; if (r.openMore) f.more = true; }
      render();
      if (r.ok && f.mode === 'official') scrollToModels();
      if (r.ok && f.mode === 'custom') $('#main').scrollTop = 0;
    }, 900);
  },
  nfSkip() { const f = S.nf; f.skip = true; f.available = []; f.step = 2; render(); $('#main').scrollTop = 0; },
  nfStep(a) { S.nf.step = +a; render(); $('#main').scrollTop = 0; },
  nfPick(a) { const f = S.nf; if (!f.available.includes(a) && !f.extra.includes(a)) f.extra.push(a); nfSelect(a); render(); },
  nfDef(a) { S.nf.def = a; render(); },
  nfAdding() { S.nf.adding = true; render(); $('#nf-manual')?.focus(); },
  nfAddManual() {
    const f = S.nf, id = f.manual.trim(); if (!id) { $('#nf-manual')?.focus(); return; }
    if (!f.available.includes(id) && !f.extra.includes(id)) f.extra.push(id);
    if (!f.selected.includes(id)) nfSelect(id);
    f.manual = ''; render(); $('#nf-manual')?.focus();
    toast(CM[id] ? `已添加 ${CM[id].label}` : `已添加 ${id}，能力可在保存后补充`);
  },
  nfMult(a) { S.nf.mult = stepMult(S.nf.mult, a); render(); },
  nfSave() {
    const f = S.nf; if (!f.selected.length) return;
    const n = nfNorm(), off = f.mode === 'official';
    const c = { id: `n${Date.now()}`, name: off ? 'Anthropic' : n.host, protocol: off ? 'anthropic' : f.protocol, base: n.base, authMode: f.auth, auth: f.result?.auth || (f.auth === 'bearer' ? 'Bearer Token' : 'x-api-key'), tail: f.key.trim().slice(-4), status: f.test === 'ok' ? 'ok' : 'untested', testedAt: '刚刚', latency: '412 ms', models: f.selected.map((id) => ({ id, on: true })), def: f.def, billing: off ? 'official' : 'reference', mult: off ? 1 : f.mult, proxy: f.proxy, cache: true, official: off, msg: null };
    C().push(c); S.cur = c.id; S.nf = null; go('detail');
    toast(`已保存 ${c.name}`);
    if (c.status === 'untested') setTimeout(() => cTestRun(c), 400);
  },
  // new detail
  edit(a) { const c = curConn(); S.edit = S.edit === a ? null : a; S.editVal = a === 'url' ? c.base : a === 'name' ? c.name : ''; S.menu = null; render(); focusEd(); },
  edCancel() { S.edit = null; render(); },
  edSaveName() { const c = curConn(), v = S.editVal.trim(); if (!v) { toast('名称不能为空'); return; } c.name = v; S.edit = null; render(); toast('已保存'); },
  edSaveUrl() { const c = curConn(), n = normUrl(S.editVal, c.protocol); if (!n.base) { toast(n.error || '请填写服务地址'); return; } c.base = n.base; S.edit = null; cTestRun(c); },
  edSaveKey() { const c = curConn(), v = S.editVal.trim(); if (!v) { toast('请填写新的 API Key'); return; } c.tail = v.slice(-4); S.edit = null; cTestRun(c); },
  edAddModel() {
    const c = curConn(), id = S.editVal.trim(); if (!id) { focusEd(); return; }
    if (c.models.some((m) => m.id === id)) { toast('这个模型已在列表里'); return; }
    c.models.push({ id, on: true }); S.edit = null; render();
    toast(CM[id] ? `已添加 ${CM[id].label}` : `已添加 ${id}，点开可补充能力`);
  },
  cTest() { cTestRun(curConn()); },
  cProxy() { const c = curConn(); c.proxy = !c.proxy; render(); },
  cCache() { const c = curConn(); c.cache = !c.cache; render(); },
  cMult(a) { const c = curConn(); c.mult = stepMult(c.mult, a); render(); },
  cRefresh() {
    const c = curConn();
    if (S.scen === 'nolist' && !c.official) { toast('服务未提供模型列表，请手动添加'); return; }
    const list = c.official ? OFFICIAL : c.protocol === 'anthropic' ? RELAY : OPENAI_LIST;
    const fresh = list.filter((id) => !c.models.some((m) => m.id === id)).slice(0, 2);
    fresh.forEach((id) => c.models.push({ id, on: false, fresh: true }));
    render(); toast(fresh.length ? `发现 ${fresh.length} 个新模型，默认不启用` : '没有新模型');
  },
  menu(a) { S.menu = S.menu === a ? null : a; render(); },
  mToggle(a) { const c = curConn(), m = c.models.find((x) => x.id === a); if (m.id === c.def && m.on) { toast('默认模型不能停用'); return; } m.on = !m.on; m.fresh = false; render(); },
  mDef(a) { const c = curConn(); c.def = a; const m = c.models.find((x) => x.id === a); m.on = true; S.menu = null; render(); },
  mDel(a) { S.menu = null; S.dialog = { kind: 'delModel', id: a }; render(); },
  openModel(a) { S.menu = null; openModel(a); },
  delConn() { S.dialog = { kind: 'delConn' }; render(); },
  dlgClose() { S.dialog = null; render(); },
  dlgOk() {
    const d = S.dialog, c = curConn(); S.dialog = null;
    if (d.kind === 'delConn') { S.conns[S.ver] = C().filter((x) => x.id !== c.id); go('list'); toast(`已删除 ${c.name}`); }
    else { c.models = c.models.filter((m) => m.id !== d.id); render(); toast('已删除模型'); }
  },
  // model edit
  meOverride() { S.me.override = !S.me.override; render(); },
  meImg() { S.me.img = !S.me.img; render(); },
  meOwn() { S.me.own = !S.me.own; render(); },
  meSave() {
    const c = curConn(), m = c.models.find((x) => x.id === S.curModel), me = S.me;
    if (me.own && me.price.some((v) => v === '' || !(Number(v) >= 0))) { toast('请填完四项单价'); return; }
    m.label = me.label.trim() && me.label.trim() !== (CM[m.id]?.label || m.id) ? me.label.trim() : null;
    m.price = me.own ? [...me.price] : null;
    go('detail'); toast('已保存');
  },
  // old
  oBack() { const o = S.of; if (o?.editing) { S.cur = o.editing; go('detail'); } else go('catalog'); },
  oEye() { S.of.showKey = !S.of.showKey; render(); },
  oTog(a) { S.of[a] = !S.of[a]; render(); },
  oStripV1() { S.of.url = S.of.url.replace(/\/v1\/?$/, ''); render(); },
  oSave() {
    const o = S.of; o.err = null;
    let base;
    try { const u = new URL(o.url.trim()); if (!/^https?:$/.test(u.protocol)) throw new Error(); base = u.toString().replace(/\/$/, ''); } catch { o.err = '服务地址无效。'; render(); return; }
    if (/\/v1$/i.test(new URL(base).pathname.replace(/\/+$/, ''))) { o.err = 'Anthropic 服务地址请填写根地址，不要包含 /v1。'; render(); return; }
    if (!o.editing) {
      const int = (v) => !v.trim() || (Number.isSafeInteger(+v) && +v > 0);
      if (!int(o.ctx)) { o.err = '上下文窗口必须是正整数或留空。'; render(); return; }
      if (!int(o.max)) { o.err = '最大输出 Token必须是正整数或留空。'; render(); return; }
      if (o.price) for (const [k, l] of [['pin', '标准输入'], ['pout', '输出'], ['pcr', '缓存读取'], ['pcw', '缓存写入']]) if (!o[k].trim()) { o.err = `请填写${l}价格。`; render(); return; }
    }
    if (o.editing) {
      const c = C().find((x) => x.id === o.editing);
      c.name = o.name.trim() || c.name; c.base = base; c.proxy = o.proxy; c.cache = o.cache; c.status = 'untested'; c.msg = null;
      S.cur = c.id; S.of = null; go('detail'); return;
    }
    const id = o.cid.trim() || `custom-${uuid()}`;
    C().push({ id, name: o.name.trim() || id, base, status: 'untested', models: [{ id: o.model.trim(), on: true, label: o.mlabel.trim() || null, price: o.price, ctx: o.ctx }], def: o.model.trim(), proxy: o.proxy, cache: o.cache, official: o.official, msg: null });
    S.of = null; go('list'); toast('现状：保存后直接回到列表，没有测试，也显示「已连接」');
  },
  oEdit() { const c = curConn(); openOldForm({ editing: c.id, name: c.name, url: c.base, proxy: c.proxy, cache: c.cache }); },
  oTest() {
    const c = curConn(); c.testing = true; render();
    setTimeout(() => {
      c.testing = false;
      if (/\/v1\/messages$/i.test(c.base)) { c.status = 'unavailable'; c.msg = '请求失败（404）：接口不存在。'; }
      else if (S.scen === 'badkey' || S.scen === 'bearer') { c.status = 'unavailable'; c.msg = '认证失败（401）：请检查 API Key。'; }
      else { c.status = 'available'; c.msg = '连接成功，默认模型可用。'; }
      render();
    }, 900);
  },
  oDel() { const c = curConn(); S.conns.old = S.conns.old.filter((x) => x.id !== c.id); go('list'); toast('现状：点一下就删了，没有确认'); },
  oAddModel() { toast('现状：打开和创建页一样的完整模型表单，一次只能加一个'); },
  oTrash(a) { const c = curConn(); if (a === c.def) { toast('现状：默认模型删除失败，只在页面底部报错'); return; } c.models = c.models.filter((m) => m.id !== a); render(); toast('现状：模型点一下就删了，没有确认'); }
};

/* ================= Input handlers ================= */
const IN = {
  catQ(el) { S.q = el.value; setLive('catlist', catalogList()); },
  nf(el) {
    const f = S.nf, k = el.dataset.k; f[k] = el.value;
    if (k === 'url') {
      const n = normUrl(f.url, f.protocol);
      if (n.inferred) { f.protocol = n.inferred; f.protoNote = true; setLive('live-proto', protoField()); setLive('live-more', moreBlock()); }
      invalidate(); setLive('live-url', urlPreview());
    }
    if (k === 'key') invalidate();
    if (k === 'search') { const mc = $('#models-card'); if (mc) { mc.outerHTML = modelsCard(); const s = $('#nf-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
    if (k === 'url' || k === 'key') setLive('live-test', testRow());
    setLive('live-foot', footHtml());
  },
  ed(el) { S.editVal = el.value; if (S.edit === 'url') setLive('live-ed', edPreview()); },
  me(el) { const k = el.dataset.k; if (k === 'price') S.me.price[+el.dataset.i] = el.value; else S.me[k] = el.value; },
  o(el) { const o = S.of, k = el.dataset.k; o[k] = el.value; if (k === 'url') setLive('live-ov1', oV1()); if (k === 'model') setLive('live-oreason', oReason()); setLive('live-osave', oSaveBtn()); }
};
const CH = {
  catSel(el) { S.cat = el.value; setLive('catlist', catalogList()); },
  cAuth(el) { const c = curConn(); c.authMode = el.value; cTestRun(c); },
  cBilling(el) { curConn().billing = el.value; render(); },
  meReason(el) { S.me.reason = el.value; render(); },
  o(el) { S.of[el.dataset.k] = el.value; render(); }
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  const act = t?.dataset.act;
  if (S.menu && act !== 'menu' && !e.target.closest('.menu')) { S.menu = null; if (!act || act === 'noop') { render(); return; } }
  if (!t || !A[act]) return;
  if (t.disabled) return;
  if (act !== 'noop') e.preventDefault();
  A[act](t.dataset.arg, t, e);
});
document.addEventListener('input', (e) => { const k = e.target.dataset?.in; if (k && IN[k] && e.target.tagName !== 'SELECT') IN[k](e.target); });
document.addEventListener('change', (e) => { const k = e.target.dataset?.ch; if (k && CH[k]) CH[k](e.target); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.dialog) { S.dialog = null; render(); } else if (S.menu) { S.menu = null; render(); } return; }
  if (e.key === 'Enter' && e.target.dataset?.enter) { e.preventDefault(); A[e.target.dataset.enter](); return; }
  if ((e.key === ' ' || e.key === 'Enter') && e.target.getAttribute?.('role') === 'checkbox' && e.target.dataset.act) { e.preventDefault(); A[e.target.dataset.act](e.target.dataset.arg); }
});

initState(false);
applyTheme();
render();
</script>
