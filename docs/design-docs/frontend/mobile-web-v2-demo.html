<!doctype html>
<!-- 文档状态：讨论用交互原型（未定稿）。apps/web 手机端样式第二版，对照桌面端视觉语言。
     结构沿用 V1（列表即首页、无 tab、底部输入坞即新建入口），只改样式和交互细节。
     方向 A：贴近桌面（实底顶栏 + 发丝线、侧栏式单行、surface 详情底）；方向 B：轻玻璃（更薄的玻璃胶囊、分组卡片、右侧用户气泡）。
     颜色、圆角、阴影全部直接引用 apps/web/src/styles/tokens.css 的变量，定稿后可以 1:1 落到代码。数据是假的，动作只在页面内模拟。 -->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手机端 V2 Demo</title>
<link rel="stylesheet" href="../../../apps/web/src/styles/tokens.css" />
<style>
:root { --page: #e6e6e2; }
:root[data-theme="dark"] { --page: #0e0f0d; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--act-font-ui); background: var(--page); color: var(--act-color-text); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
code { font-family: var(--act-font-mono); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ───────── 页面工具栏 ───────── */
.top { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 24px; background: color-mix(in srgb, var(--page) 86%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--act-color-border); }
.top h1 { margin: 0 6px 0 0; font-size: 15px; font-weight: 600; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--act-radius-md); background: var(--act-color-surface-subtle); border: 1px solid var(--act-color-border); }
.seg button { height: 28px; padding: 0 12px; border-radius: var(--act-radius-sm); font-size: 13px; font-weight: 500; color: var(--act-color-text-muted); }
.seg button.on { background: var(--act-color-surface); color: var(--act-color-text); box-shadow: var(--act-shadow-xs); }
.top .note { flex-basis: 100%; font-size: 13px; color: var(--act-color-text-muted); max-width: 1180px; }

.phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px 26px; padding: 28px 20px 12px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cap { width: 412px; text-align: center; font-size: 13px; line-height: 1.55; color: var(--act-color-text-muted); }
.cap b { display: block; font-size: 14px; color: var(--act-color-text); margin-bottom: 2px; }
.cap .reset { margin-top: 4px; font-size: 12px; color: var(--act-color-text-faint); text-decoration: underline; text-underline-offset: 3px; }
.section-t { text-align: center; font-size: 15px; font-weight: 600; margin: 26px 0 0; }
.section-t span { display: block; font-size: 13px; font-weight: 400; color: var(--act-color-text-muted); margin-top: 2px; }

.cur { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; padding: 28px 20px 40px; }
.cur figure { margin: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; font-size: 12px; color: var(--act-color-text-muted); }
.cur img { width: 300px; border-radius: 24px; border: 1px solid var(--act-color-border); display: block; }
.cur img.wide { width: 620px; border-radius: 10px; }

/* ───────── 手机框 ───────── */
.phone { width: 412px; height: 866px; border-radius: 58px; padding: 11px; background: #151515; box-shadow: 0 30px 80px rgba(0, 0, 0, .22), inset 0 0 0 1.5px rgba(255, 255, 255, .08); }
.scr { --scr-bg: var(--act-color-bg); position: relative; width: 390px; height: 844px; border-radius: 47px; overflow: hidden; background: var(--scr-bg); isolation: isolate; }
.statusbar { position: absolute; inset: 0 0 auto; height: 50px; z-index: 90; display: flex; align-items: center; justify-content: space-between; padding: 4px 34px 0 40px; font-size: 16px; font-weight: 600; pointer-events: none; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 91; pointer-events: none; }
.homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--act-color-text); opacity: .85; z-index: 95; pointer-events: none; }

/* 宽屏浏览器框 */
.win { width: 1180px; height: 760px; border-radius: 12px; overflow: hidden; background: var(--act-color-bg); box-shadow: 0 30px 80px rgba(0, 0, 0, .2), 0 0 0 1px rgba(0, 0, 0, .08); display: flex; flex-direction: column; }
.wbar { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--act-color-sidebar); border-bottom: 1px solid var(--act-color-border); }
.wbar i { width: 12px; height: 12px; border-radius: 50%; background: var(--act-color-border-strong); opacity: .5; }
.wbar .url { margin: 0 auto; width: 380px; height: 24px; border-radius: var(--act-radius-sm); background: var(--act-color-surface); font-size: 12px; color: var(--act-color-text-muted); display: grid; place-items: center; }
.wbody { flex: 1; display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
.pane { --scr-bg: var(--act-color-bg); position: relative; overflow: hidden; background: var(--scr-bg); isolation: isolate; }
.pane.left { --scr-bg: var(--act-color-sidebar); border-right: 1px solid var(--act-color-border); }

/* 详情底色：A 用 surface（桌面消息区），B 保留 bg */
.dir-a .scr.detail, .dir-a .pane.detail { --scr-bg: var(--act-color-surface); }

/* ───────── 顶栏 ───────── */
.hdr { position: absolute; inset: 0 0 auto; z-index: 20; height: 93px; padding: 47px 8px 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; }
.hl { justify-self: start; } .hr { justify-self: end; } .hc { justify-self: center; min-width: 0; max-width: 100%; }
.hbtn { width: 40px; height: 40px; border-radius: var(--act-radius-pill); display: grid; place-items: center; color: var(--act-color-text-muted); transition: background var(--motion-fast); }
.hbtn:active { background: var(--act-color-hover-overlay); }
.htitle { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 250px; }
.htitle b { font-size: 15px; font-weight: 600; line-height: 20px; max-width: 100%; }
.htitle span { font-size: 11px; line-height: 14px; color: var(--act-color-text-faint); display: flex; align-items: center; gap: 4px; max-width: 100%; }
.wide .hdr { height: 52px; padding-top: 0; }

.dir-a .hdr { background: color-mix(in srgb, var(--scr-bg) 86%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); border-bottom: .5px solid var(--act-color-border); }
.dir-b .hdr::before { content: ""; position: absolute; inset: 0 0 -20px; z-index: -1; pointer-events: none; background: linear-gradient(var(--scr-bg) 55%, color-mix(in srgb, var(--scr-bg) 0%, transparent)); }
.dir-b .hbtn { width: 36px; height: 36px; color: var(--act-color-text); }
.dir-b .htitle { height: 36px; justify-content: center; padding: 0 14px; border-radius: var(--act-radius-pill); }
.dir-b .glass { background: var(--web-glass); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); box-shadow: 0 0 0 .5px var(--web-glass-edge), 0 4px 14px -6px rgba(0, 0, 0, .14); }

/* ───────── 滚动区 / 底部 ───────── */
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 101px 0 150px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.wide .scroll { padding-top: 60px; padding-bottom: 130px; }
.foot { position: absolute; inset: auto 0 0; z-index: 20; padding: 18px 12px 30px; display: flex; flex-direction: column; }
.foot::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(color-mix(in srgb, var(--scr-bg) 0%, transparent), var(--scr-bg) 30px); }
.wide .foot { padding-bottom: 16px; }
.wide .detail .foot > *, .wide .detail .msgs { width: 100%; max-width: 720px; margin-left: auto; margin-right: auto; }

/* ───────── 状态点 ───────── */
.st { width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.warn { background: var(--act-color-warning); animation: pulse 1.5s ease-in-out infinite; }
.dot.ok { background: var(--act-color-success); }
.dot.err { background: var(--act-color-danger); }
.dot.op { background: var(--act-color-operational); }
.dot.op.pulse { animation: pulse 1.5s ease-in-out infinite; }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--act-color-operational); border-top-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes pulse { 0%, 100% { transform: scale(.85); opacity: .7; } 50% { transform: scale(1); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
.shim { background: linear-gradient(90deg, var(--act-color-text-faint) 0 40%, var(--act-color-text) 50%, var(--act-color-text-faint) 60% 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shim 1.1s ease-in-out infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* ───────── 按钮 ───────── */
.btn { height: 30px; padding: 0 12px; border-radius: var(--act-radius-pill); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; flex: none; transition: background var(--motion-fast), transform var(--motion-fast); }
.btn:active { transform: scale(.97); }
.btn.xs { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.ghost { color: var(--act-color-text-muted); }
.btn.ghost:active { background: var(--act-color-hover-overlay); }
.btn.tonal { background: color-mix(in srgb, var(--act-color-text) 7%, transparent); }
.btn.accent { background: var(--act-color-accent); color: var(--act-color-on-accent); }
.btn code { font-size: 12px; font-weight: 400; }
.ib { width: 30px; height: 30px; border-radius: var(--act-radius-md); display: grid; place-items: center; color: var(--act-color-text-faint); flex: none; }
.ib:active { background: var(--act-color-hover-overlay); color: var(--act-color-text); }

/* ───────── 会话列表 ───────── */
.grp { margin-top: 14px; }
.grp:first-child { margin-top: 6px; }
.grp-h { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 4px; font-size: 12px; font-weight: 500; color: var(--act-color-text-faint); }
.rows { margin: 0 8px; }
.row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 44px; padding: 0 12px; border-radius: var(--act-radius-md); text-align: left; position: relative; transition: background var(--motion-fast); }
.row:active { background: var(--act-color-hover-overlay); }
.row.sel { background: var(--act-color-sidebar-selected); }
.row .tt { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row .tt b { font-size: 15px; font-weight: 500; color: var(--act-color-text-muted); }
.row.unread .tt b, .row.hot .tt b { color: var(--act-color-text); }
.row.unread .tt b { font-weight: 600; }
.row .ws { font-size: 12px; color: var(--act-color-text-faint); flex: none; max-width: 38%; }
.row .tm { font-size: 12px; color: var(--act-color-text-faint); min-width: 24px; text-align: right; }
.row .tm.warn { color: var(--act-color-warning); font-weight: 500; }
.row .tm.err { color: var(--act-color-on-danger); }
.wide .row { min-height: 34px; }
.wide .row .tt b { font-size: 13px; }
.wide .row .ws, .wide .row .tm { font-size: 11px; }
.wide .row .ws { max-width: 30%; }
.dir-b .rows { margin: 0 12px; background: var(--act-color-surface); border-radius: var(--act-radius-lg); box-shadow: 0 0 0 .5px var(--web-glass-edge); overflow: hidden; }
.dir-b .row { border-radius: 0; min-height: 48px; }
.dir-b .row + .row::before { content: ""; position: absolute; left: 36px; right: 0; top: 0; height: .5px; background: var(--act-color-border); }
.dir-b .wide .row { min-height: 38px; }

/* 列表底部入口（输入坞） */
.dock { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 8px 0 16px; border-radius: var(--act-radius-pill); text-align: left; width: 100%; }
.dock .ph { flex: 1; font-size: 15px; color: var(--act-color-text-subtle); }
.dock .wsb { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: var(--act-color-text-muted); max-width: 150px; }

/* ───────── 输入框 ───────── */
.comp { border-radius: 24px; transition: border-color var(--motion-fast), box-shadow var(--motion-fast); }
.dir-a .comp, .dir-a .dock, .dir-a .tray { background: var(--act-color-surface); border: 1px solid var(--act-color-composer-border); box-shadow: var(--act-shadow-composer); }
.dir-a .comp.focus { border-color: var(--act-color-composer-border-focus); box-shadow: var(--act-shadow-composer-focus); }
.dir-b .comp, .dir-b .dock, .dir-b .tray { background: var(--web-glass-strong); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border: .5px solid var(--web-glass-border); box-shadow: 0 0 0 .5px var(--web-glass-edge), var(--act-shadow-composer); }
.dir-b .comp.focus { box-shadow: 0 0 0 .5px var(--web-glass-edge), var(--act-shadow-composer-focus); }
.comp.stk { border-radius: var(--act-radius-xl); }
.cbar { display: flex; align-items: center; gap: 4px; padding: 6px; min-height: 48px; }
.comp textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; font-size: 16px; line-height: 20px; padding: 7px 4px; color: var(--act-color-text); }
.comp textarea::placeholder { color: var(--act-color-text-subtle); }
.comp.stk textarea { display: block; width: 100%; padding: 12px 14px 2px; min-height: 64px; }
.cplus { width: 34px; height: 34px; border-radius: var(--act-radius-pill); display: grid; place-items: center; color: var(--act-color-text-faint); flex: none; }
.cplus:active { background: var(--act-color-hover-overlay); }
.cmodel { height: 32px; padding: 0 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--act-color-text-muted); border-radius: var(--act-radius-pill); max-width: 150px; flex: none; }
.cmodel:active { background: var(--act-color-hover-overlay); }
.mchip { height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 2px 0 8px; border-radius: var(--act-radius-pill); font-size: 13px; font-weight: 500; flex: none; }
.mchip.plan { background: var(--act-color-warning-soft); color: var(--act-color-on-warning); }
.mchip.chat { background: var(--act-color-operational-soft); color: var(--act-color-operational); }
.mchip button { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; opacity: .75; }
.send { width: 34px; height: 34px; border-radius: var(--act-radius-pill); display: grid; place-items: center; flex: none; background: var(--act-color-accent); color: var(--act-color-on-accent); transition: background var(--motion-fast), opacity var(--motion-fast), transform var(--motion-fast); }
.send:active { transform: scale(.94); }
.send.plan { background: var(--act-color-warning); color: var(--act-color-on-warning-solid); }
.send.chat { background: var(--act-color-operational); color: var(--act-color-on-operational); }
.send.stop { background: var(--act-color-action); color: var(--act-color-on-action); }
.send.off { background: color-mix(in srgb, var(--act-color-text) 8%, transparent); color: var(--act-color-text-subtle); }

/* 输入框上方状态行 */
.srow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 22px; padding: 0 10px 6px; font-size: 12px; color: var(--act-color-text-faint); }
.srow .l { display: flex; align-items: center; gap: 6px; min-width: 0; }
.srow .l.warn { color: var(--act-color-warning); font-weight: 500; }
.srow .r { display: flex; align-items: center; gap: 4px; flex: none; }
.spill { height: 22px; padding: 0 8px; border-radius: var(--act-radius-pill); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--act-color-text-faint); }
.spill i { font-style: normal; color: var(--act-color-border-strong); }
.ring { --p: 38; width: 15px; height: 15px; border-radius: 50%; background: conic-gradient(var(--act-color-text-muted) calc(var(--p) * 1%), var(--act-color-meter-track) 0); -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5px); mask: radial-gradient(circle, transparent 4.5px, #000 5px); flex: none; }

/* 排队托盘 */
.tray { margin: 0 10px -1px; border-radius: 14px 14px 0 0 !important; border-bottom: 0 !important; padding: 2px 4px; box-shadow: none !important; }
.trow { display: flex; align-items: center; gap: 8px; min-height: 40px; padding-left: 6px; font-size: 14px; }
.trow + .trow { border-top: .5px solid var(--act-color-border); }
.trow .lead { width: 20px; height: 20px; display: grid; place-items: center; color: var(--act-color-text-faint); flex: none; }
.trow .tx { flex: 1; }
.trow.steer .tx { color: var(--act-color-text-muted); }
.trow .nr { font-size: 12px; color: var(--act-color-operational); flex: none; }
.trow .acts { display: flex; align-items: center; gap: 2px; opacity: .75; flex: none; }
.trow.paused { font-size: 12px; color: var(--act-color-text-faint); min-height: 34px; padding-left: 10px; }

/* ───────── 消息区 ───────── */
.msgs { padding: 0 18px; display: flex; flex-direction: column; }
.blk { margin-top: 14px; min-width: 0; }
.blk:first-child { margin-top: 0; }
.proc + .proc { margin-top: 5px; }
.user + .blk { margin-top: 18px; }
.blk + .user { margin-top: 30px; }
.user { font-size: 15px; line-height: 1.55; white-space: pre-wrap; animation: rise .26s ease; }
.dir-a .user { border: 1px solid var(--act-color-border); border-radius: var(--act-radius-lg); background: var(--act-color-surface); padding: 10px 14px; }
.dir-b .user { align-self: flex-end; max-width: 84%; border-radius: var(--act-radius-xl); background: var(--act-color-surface); box-shadow: 0 0 0 .5px var(--web-glass-edge); padding: 9px 14px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.md { font-size: 15px; line-height: 1.65; }
.md > * { margin: 0; }
.md > * + * { margin-top: 10px; }
.md ol, .md ul { padding-left: 1.3em; display: grid; gap: 4px; }
.md code { font-size: .88em; padding: .08em .3em; border-radius: 3px; background: var(--act-color-inline-code-bg); color: var(--act-color-inline-code-text); }
.md .caret::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; border-radius: 1px; background: var(--act-color-text-faint); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.code { border: 1px solid var(--act-color-code-border); border-radius: var(--act-radius-lg); background: linear-gradient(var(--act-color-code-bg-top), var(--act-color-code-bg-bottom)); overflow: hidden; }
.code .bar { display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 0 6px 0 12px; font: 11px var(--act-font-mono); color: var(--act-color-text-muted); }
.code pre { margin: 0; padding: 2px 12px 10px; font: 12px/1.6 var(--act-font-mono); color: var(--act-color-code-text); overflow-x: auto; }
.k { color: var(--act-json-keyword); } .s { color: var(--act-json-string); } .c { color: var(--act-color-text-faint); font-style: italic; } .f { color: var(--act-json-property); }

/* 过程行：桌面 14px/22px 无图标，手机 A 13px、B 14px */
.msgs { --row-fs: 13px; --row-lh: 20px; }
.dir-b .msgs { --row-fs: 14px; --row-lh: 22px; }
.tl { display: flex; align-items: center; gap: 6px; font-size: var(--row-fs); line-height: var(--row-lh); color: var(--act-color-text-muted); min-width: 0; width: 100%; text-align: left; }
.tl .t { color: var(--act-color-text-faint); }
.tl > span:first-child { flex: none; }
.comp textarea { overflow: hidden; }
.tl .add { color: var(--act-color-success); font-weight: 600; } .tl .del { color: var(--act-color-danger); font-weight: 600; }
.tl.err, .tl.err .t { color: var(--act-color-on-danger); }
.tl > svg { color: var(--act-color-text-faint); }
.think-body { margin-top: 7px; font-size: var(--row-fs); line-height: 1.65; color: var(--act-color-text-muted); white-space: pre-wrap; }
.bdg { border: 1px solid var(--act-color-border); border-radius: var(--act-radius-sm); padding: 0 5px; font-size: 11px; line-height: 16px; font-weight: 500; background: var(--act-color-surface-subtle); color: var(--act-color-text-faint); flex: none; }
.bdg.warn { background: var(--act-color-warning-soft); color: var(--act-color-on-warning); border-color: transparent; }
.out { margin-top: 7px; max-height: 200px; overflow: auto; border-radius: var(--act-radius-md); border: 1px solid var(--act-color-border); background: var(--act-color-surface-subtle); }

    s.queue = [{ text: "空状态文案也改成「暂无会话」" }, { text: "改完跑一下 web 的测试" }];

}

const hbtn = (icon, act, extra = "") => `<button class="hbtn glass" data-act="${act}" ${extra}>${I(icon, 20, 2)}</button>`;

const chev = (open, s = 14) => I(open ? "down" : "right", s, 2.2);

function stDot(st) {
  if (st === "running") return `<span class="st" title="运行中"><span class="spin"></span></span>`;
  if (st === "wait") return `<span class="st" title="等待审批"><span class="dot warn"></span></span>`;
  if (st === "failed") return `<span class="st" title="失败"><span class="dot err"></span></span>`;
  if (st === "unread") return `<span class="st" title="已完成"><span class="dot ok"></span></span>`;
  return `<span class="st"></span>`;
}

function sendBtn(s) {
  const has = s.input.trim().length > 0;
  if (s.running && !has && s.screen === "detail" && !s.sheet) return `<button class="send stop" data-act="stop" title="停止 Agent">${I("stop", 16)}</button>`;
  const cls = !has ? "off" : s.mode === "agent" ? "" : s.mode;
  const title = !has ? "输入消息后发送" : s.running ? "加入队列，当前运行结束后发送" : "发送消息";
  return `<button class="send ${cls}" data-act="send" title="${title}">${I("up", 16, 2.4)}</button>`;
}

function composer(s, { stacked = false, placeholder } = {}) {
  const ph = placeholder || (s.denyHint ? "告诉 Agent 应该怎么做…" : s.running ? "继续追问…" : s.mode === "chat" ? "问点什么…" : s.mode === "plan" ? "描述要规划的改动…" : "继续追问…");
  const stk = stacked || s.denyHint || s.mode !== "agent" || s.input.length > 14;
  const mode = s.mode === "agent" ? "" : `<span class="mchip ${s.mode}">${I(s.mode === "plan" ? "todo" : "msg", 14)}${s.mode === "plan" ? "Plan" : "Chat"}<button data-act="mode" data-m="agent" title="回到 Agent">${I("x", 13)}</button></span>`;
  const ta = `<textarea rows="${stk ? 2 : 1}" placeholder="${ph}" aria-label="消息输入框">${esc(s.input)}</textarea>`;
  return `<div class="comp ${stk ? "stk" : ""} ${s.focus || s.denyHint ? "focus" : ""}">${stk ? ta : ""}<div class="cbar">
    <button class="cplus" data-act="sheet" data-v="plus" title="添加上下文、工具或附件">${I("plus", 18, 2.1)}</button>${mode}
    ${stk ? `<span class="grow"></span>` : ta}
    <button class="cmodel" data-act="sheet" data-v="model"><span class="ell">${s.model}</span>${I("down", 12, 2.2)}</button>${sendBtn(s)}
  </div></div>`;
}

function statusRow(s) {
  let l;
  if (s.appr === "pending") l = `<span class="l warn"><span class="dot warn"></span>等待确认</span>`;
  else if (s.running) l = `<span class="l"><span class="spin"></span>运行中 · <span class="num">${s.session === "queue" ? "38" : "12"}s</span></span>`;

}

function tray(s) {
  if (!s.steer.length && !s.queue.length) return "";
  const steer = s.steer.map((q, i) => `<div class="trow steer"><span class="lead"><span class="dot op pulse"></span></span><span class="tx ell">${esc(q.text)}</span><span class="nr">下一步读取</span><span class="acts"><button class="btn xs ghost" data-act="unsteer" data-i="${i}">撤回</button></span></div>`).join("");
  const queue = s.queue.map((q, i) => `<div class="trow"><span class="lead">${I("lo", 14)}</span><span class="tx ell">${esc(q.text)}</span><span class="acts">${s.running ? `<button class="btn xs ghost" data-act="steer" data-i="${i}" title="让 Agent 在下一步看到这条消息">↳ 引导</button>` : ""}<button class="ib" data-act="dequeue" data-i="${i}" title="删除">${I("trash", 14)}</button></span></div>`).join("");

  return `<section class="tray" aria-label="消息队列">${steer}${queue}${paused}</section>`;
}

/* ───────── 消息块 ───────── */
const user = t => `<div class="blk user">${esc(t)}</div>`;

const editRow = (a, t, add, del) => `<div class="blk proc"><div class="tl"><span>${a}</span><span class="t ell">${t}</span><span class="add num">+${add}</span><span class="del num">-${del}</span></div></div>`;
function think(s, k, running, body) {

}
function approval(cmd) {
  return `<div class="blk appr"><div class="appr-st"><span class="dot warn"></span>等待确认</div><div class="card">

}
function extraTurns(s) {
  return s.extra.map(t => user(t.u) + (t.thinking ? `<div class="blk proc"><div class="tl"><span class="shim">思考中</span></div></div>` : t.r != null ? prose(`<p class="${t.done ? "" : "caret"}">${esc(t.r)}</p>`) : "")).join("");
}

function turns(s) {
  if (s.session === "run") {
    let h = user("手机上连不上 Host，帮我查一下原因，顺便跑一遍 web 的测试");
    h += think(s, "t1", false, "用户说手机连不上。先看 Host 的来源校验，再看 dev-host.config.json 里 allowedOrigins 是怎么写的。");
    h += row("Read", "packages/agent-host/src/server.ts", "1–180");
    h += row("Grep", "allowedOrigins", "in agent-host");
    h += row("Read", "apps/web/dev-host.config.json");
    h += prose(`<p><code>allowedOrigins</code> 里写的是 <code>https://mac.tail3f.ts.net/</code>，结尾多了一个斜杠，和 Safari 发来的 Origin 对不上，所以握手被拒。我先把配置改掉，再跑测试。</p>`);
    h += editRow("编辑", "apps/web/dev-host.config.json", 1, 1);
    const cmd = "pnpm --filter @actspace/web test";
    if (s.appr === "pending") h += approval(cmd);
    else if (s.appr === "running") h += bash(s, "b1", "Running", cmd);
    else if (s.appr === "ran") h += bash(s, "b1", "Ran", cmd) + (s.tail != null ? prose(`<p class="${s.running ? "caret" : ""}">${esc(s.tail)}</p>`) : "");

  if (s.session === "queue") {

    h += row("Read", "apps/web/src/sessions/use-session-list.ts");
    h += row("Grep", "formatRelativeTimeZh", "in desktop");
    h += prose(`<p>桌面侧栏的时间分组在 <code>sidebar-view.ts</code> 里，规则是「需要处理 → 今天 → 昨天 → 近 7 天 → 本月更早」。我把这段纯函数挪到 web 复用，列表组件只负责渲染。</p>`);
    h += s.stopped ? `<div class="blk proc"><div class="tl"><span>编辑</span><span class="t ell">apps/web/src/sessions/group-sessions.ts</span><span class="add num">+64</span><span class="del num">-0</span></div></div><div class="blk status-line">已停止</div>`
      : `<div class="blk proc"><div class="tl"><span class="shim">正在生成</span><span class="t ell">apps/web/src/sessions/group-sessions.ts</span><span class="t num" style="flex:none">· 1.2 千字符</span></div></div>`;

      <div class="tl"><span>Read</span><span class="t ell">apps/web/src/pages/settings/SettingsPage.tsx</span></div>
      <div class="tl"><span>Read</span><span class="t ell">apps/web/src/connection/connection-store.ts</span></div>
      <div class="tl"><span>编辑</span><span class="t ell">SettingsPage.tsx</span><span class="add num">+38</span><span class="del num">-2</span></div>

    h += prose(`<p>加好了。设置页最底下多了一行红色的「断开并移除」：</p>

      <div class="code"><div class="bar"><span>ts</span><button class="ib" style="width:26px;height:26px" title="复制代码">${I("copy", 13)}</button></div><pre><span class="k">async function</span> <span class="f">forget</span>() {
  <span class="k">await</span> store.forget(); <span class="c">// 清掉本机 token</span>

}</pre></div>`);
    h += `<div class="blk chg"><div class="chg-h"><span class="tile">${I("file", 18, 1.8)}</span><span class="grow"><b>已编辑 2 个文件</b><small class="num"><span class="add">+42</span> <span class="del">-2</span></small></span></div>
      <div class="chg-r"><span class="grow ell">apps/web/src/pages/settings/SettingsPage.tsx</span><span class="add num">+38</span><span class="del num">-2</span></div>
      <div class="chg-r"><span class="grow ell">apps/web/src/connection/connection-store.ts</span><span class="add num">+4</span><span class="del num">-0</span></div></div>`;
    h += `<div class="blk tail"><button class="ib" title="复制">${I("copy", 15, 1.75)}</button><button class="ib" title="重新生成">${I("retry", 15, 1.75)}</button><span class="num" style="padding:0 6px">23:44</span><button class="upill num" data-act="sheet" data-v="usage">${I("db", 15, 1.75)}用量 88K tok</button></div>`;
    return h + extraTurns(s);
  }
  return extraTurns(s);
}

  } else if (s.sheet === "usage") {
    body = `<div class="sheet-h">本轮用量<button class="ib" data-act="close">${I("x", 18)}</button></div>`
      + [["提供方 / 模型", "DeepSeek / deepseek-chat"], ["缓存命中", "72%"], ["未缓存输入", "18.4K"], ["缓存读取", "61.2K"], ["缓存写入", "0"], ["输出", "8.6K<small>其中推理 3.1K</small>"], ["花费", "¥0.12<small>预估</small>"]].map(([k, v]) => `<div class="kv"><span>${k}</span><span class="num">${v}</span></div>`).join("");
  }
  return `<div class="scrim" data-act="close"></div><div class="sheet"><div class="grab"></div>${body}</div>`;
}

/* ───────── 手机实例 ───────── */
class Phone {
  constructor(el, preset, wide = false) {
    this.el = el; this.preset = preset; this.wide = wide; this.s = initState(preset);
    if (wide) this.s.sel = "done";
    el.addEventListener("click", e => this.onClick(e));
    el.addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") { const before = this.s.input.length > 14; this.s.input = e.target.value; this.s.focus = true; if ((this.s.input.length > 14) !== before) this.render(); else this.refreshSend(); } });
    el.addEventListener("keydown", e => { if (e.target.tagName === "TEXTAREA" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.send(); } });
    el.addEventListener("focusin", e => { if (e.target.tagName === "TEXTAREA") { this.s.focus = true; e.target.closest(".comp")?.classList.add("focus"); } });
    el.addEventListener("focusout", e => { if (e.target.tagName === "TEXTAREA") { this.s.focus = false; if (!this.s.denyHint) e.target.closest(".comp")?.classList.remove("focus"); } });
    this.render(true);
  }
  reset() { this.timers?.forEach(clearTimeout); this.timers = []; this.s = initState(this.preset); if (this.wide) this.s.sel = "done"; this.render(true); }
  later(fn, ms) { (this.timers ||= []).push(setTimeout(fn, ms)); }
  refreshSend() { this.el.querySelectorAll(".send").forEach(b => { if (b.closest(".dock")) return; b.outerHTML = sendBtn(this.s); }); }
  render(toBottom = false) {
    const s = this.s;
    const sc = this.el.querySelector(".detail .scroll");
    const nearBottom = sc ? sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80 : true;
    let html;
    if (this.wide) {
      html = `<div class="win"><div class="wbar"><i></i><i></i><i></i><span class="url">mac.tail3f.ts.net</span></div><div class="wbody">
        <div class="pane left wide">${hdr("", htitle("会话", `<span class="dot op"></span>Mac mini · 在线`), hbtn("gear", "noop"))}<div class="scroll">${listBody(s, true)}</div>${dock(s)}</div>
        <div class="pane detail wide">${detailView(s, true)}${sheetView(s)}</div></div></div>`;
    } else {
      const body = s.screen === "connect" ? connectView() : s.screen === "list" ? listView(s) : s.screen === "settings" ? settingsView(s) : detailView(s);
      html = `<div class="scr ${s.screen}">${statusBar()}${body}${sheetView(s)}<div class="homebar"></div></div>`;
    }
    this.el.innerHTML = html;
    const nsc = this.el.querySelector(".detail .scroll");
    if (nsc && (toBottom || nearBottom)) nsc.scrollTop = nsc.scrollHeight;
    else if (nsc && sc) nsc.scrollTop = sc.scrollTop;
    if (s.focus) { const ta = this.el.querySelector(s.sheet === "new" ? ".sheet textarea" : ".foot textarea"); if (ta) { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  }
  onClick(e) {
    const t = e.target.closest("[data-act]"); if (!t || !this.el.contains(t)) return;
    const s = this.s, d = t.dataset;
    switch (d.act) {
      case "go": s.screen = d.v; s.sheet = null; this.render(true); break;
      case "open": s.sel = d.id; s.session = TITLE[d.id] ? d.id : "done"; setupSession(s); s.screen = "detail"; this.render(true); break;
      case "sheet": s.sheet = d.v; s.focus = d.v === "new"; this.render(); break;
      case "close": s.sheet = null; s.focus = false; this.render(); break;
      case "tog": s.open[d.k] = !s.open[d.k]; this.render(); break;
      case "ws": s.ws = d.v; this.render(); break;
      case "mode": s.mode = d.m; if (s.sheet === "plus") s.sheet = null; this.render(); break;
      case "model": s.model = d.v; s.sheet = null; this.render(); break;
      case "theme": s.theme = d.v; this.render(); break;
      case "notify": s.notify = !s.notify; this.render(); break;
      case "send": this.send(); break;
      case "stop": s.running = false; s.stopped = true; s.queue.unshift(...s.steer.splice(0)); s.extra.forEach(x => { x.thinking = false; x.done = true; if (x.r == null) x.r = ""; }); this.render(); break;
      case "resume": s.stopped = false; this.next(); break;
      case "steer": s.steer.push(...s.queue.splice(+d.i, 1)); this.render(); break;
      case "unsteer": s.queue.unshift(...s.steer.splice(+d.i, 1)); this.render(); break;
      case "dequeue": s.queue.splice(+d.i, 1); this.render(); break;
      case "deny": s.appr = "denied"; s.running = false; s.denyHint = true; s.focus = true; this.render(true); break;
      case "allow":
        s.appr = "running"; this.render(true);
        this.later(() => { s.appr = "ran"; s.tail = ""; this.render(); this.type(RAN_TAIL, v => { s.tail = v; }, () => { s.running = false; this.render(); }); }, 1600);
        break;
    }
  }
  send() {
    const s = this.s, text = s.input.trim(); if (!text) return;
    s.input = "";
    if (s.sheet === "new") { s.sheet = null; s.session = "new"; setupSession(s); s.screen = "detail"; this.pushTurn(text); return; }
    if (s.running) { s.queue.push({ text }); this.render(); return; }
    const deny = s.denyHint; s.denyHint = false;
    this.pushTurn(text, deny ? DENY_REPLY : REPLY);
  }
  pushTurn(text, reply = REPLY) {
    const s = this.s, turn = { u: text, thinking: true, r: null, done: false };
    s.extra.push(turn); s.running = true; s.stopped = false; this.render(true);
    this.later(() => {
      if (!s.running) return;
      turn.thinking = false; turn.r = ""; this.render();
      this.type(reply, v => { turn.r = v; }, () => { turn.done = true; s.running = false; this.render(); this.later(() => this.next(), 500); }, () => s.running);
    }, 900);
  }
  next() {
    const s = this.s; if (s.running) return;
    const item = s.steer.shift() || s.queue.shift();
    if (item) this.pushTurn(item.text); else this.render();
  }
  type(text, set, done, alive = () => true) {
    let i = 0;
    const tick = () => { if (!alive()) return; i = Math.min(text.length, i + 2); set(text.slice(0, i)); this.render(); if (i < text.length) this.later(tick, 35); else done(); };
    tick();
  }
}

function setDir(dir) {
  document.querySelectorAll("#dirSeg button").forEach(b => b.classList.toggle("on", b.dataset.dir === dir));

  history.replaceState(null, "", `#${dir}`);
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
document.getElementById("dirSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setDir(b.dataset.dir); });
