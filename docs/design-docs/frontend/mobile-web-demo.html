<!doctype html>
<!-- 文档状态：讨论用交互原型（未实现，未定稿）。手机 Web/PWA 端三版方向对比，只画竖屏手机：
     V1 Happy 原生移植（无 tab、玻璃胶囊顶栏、底部悬浮输入坞即新建会话）；
     V2 桌面延续（底部 tab、按工作区分组、全屏新建表单、桌面审批卡与排队托盘）；
     V3 注意力优先（首页直接处理审批、运行中卡片、时间线详情、审批吸底）。
     颜色取 apps/desktop/src/renderer/styles/tokens.css 浅/深两套值；结构参考 slopus/happy 的 packages/happy-app。
     数据全部是假的，动作只在页面内模拟。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手机端 Demo</title>
<style>
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);

  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-subtle: #f1f1ef;
  --raised: #ffffff;
  --selected: #e4e4e1;
  --hover: #eaeae7;
  --line: #deded9;
  --line-soft: rgba(0, 0, 0, .07);
  --text: #20201e;
  --muted: #676762;
  --faint: #85857e;
  --subtle: #b0b0a9;
  --action: #20201e;
  --on-action: #ffffff;
  --op: #087a4b;
  --op-soft: #e5f2ea;
  --info: #3978b8;
  --info-soft: #e8f1f9;
  --warn: #b07613;
  --warn-soft: #f7eedb;
  --on-warn: #7a500a;
  --danger: #c74747;
  --danger-soft: #f8e9e9;
  --diff-add-bg: rgba(44, 168, 105, .12);
  --diff-add: #08784f;
  --diff-add-gutter: rgba(44, 168, 105, .2);
  --diff-del-bg: rgba(225, 70, 86, .12);
  --diff-del: #a43342;
  --diff-del-gutter: rgba(225, 70, 86, .2);
  --code-bg: #f3f3f1;
  --glass: rgba(255, 255, 255, .72);
  --glass-strong: rgba(255, 255, 255, .9);
  --glass-border: rgba(255, 255, 255, .95);
  --glass-edge: rgba(0, 0, 0, .07);
  --overlay: rgba(17, 24, 39, .32);
  --shadow-pill: 0 4px 18px rgba(20, 21, 18, .07), 0 1px 2px rgba(20, 21, 18, .05);
  --shadow-composer: 0 1px 2px rgb(0 0 0 / .04), 0 8px 28px -6px rgb(0 0 0 / .12);
  --shadow-pop: 0 24px 64px rgba(20, 21, 18, .16);
  --c1: #3978b8; --c2: #4b919d; --c3: #7a68ad; --c4: #c06f52; --c5: #087a4b;
  --page: #e8e8e4;
  --bezel: #1c1c1b;
  --zoom: .8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181916; --surface: #242522; --surface-subtle: #292a26; --raised: #30312d; --selected: #30312d; --hover: #2a2b27;
    --line: #353630; --line-soft: rgba(255, 255, 255, .07); --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle: #66665f;
    --action: #f1f1ed; --on-action: #181916; --op: #36c783; --op-soft: #193a2b; --info: #6ca6da; --info-soft: #1e3345;
    --warn: #d2a14d; --warn-soft: #3e321c; --on-warn: #e2ba6b; --danger: #e06b6b; --danger-soft: #452525;
    --diff-add-bg: rgba(53, 193, 135, .14); --diff-add: #5fd49b; --diff-add-gutter: rgba(53, 193, 135, .24);
    --diff-del-bg: rgba(239, 109, 109, .16); --diff-del: #f08a8a; --diff-del-gutter: rgba(239, 109, 109, .26);
    --code-bg: #1d1f1b; --glass: rgba(36, 37, 34, .72); --glass-strong: rgba(42, 43, 40, .92); --glass-border: rgba(255, 255, 255, .1); --glass-edge: rgba(255, 255, 255, .05);
    --overlay: rgba(0, 0, 0, .55); --shadow-pill: 0 6px 20px rgba(0, 0, 0, .35); --shadow-composer: 0 1px 2px rgb(0 0 0 / .3), 0 10px 32px -6px rgb(0 0 0 / .55);
    --shadow-pop: 0 24px 64px rgba(0, 0, 0, .55);
    --c1: #6ca6da; --c2: #6fb3be; --c3: #a594d6; --c4: #dd8f73; --c5: #36c783; --page: #0f100e; --bezel: #050505;
  }
}
:root[data-theme="dark"] {
  --bg: #181916; --surface: #242522; --surface-subtle: #292a26; --raised: #30312d; --selected: #30312d; --hover: #2a2b27;
  --line: #353630; --line-soft: rgba(255, 255, 255, .07); --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle: #66665f;
  --action: #f1f1ed; --on-action: #181916; --op: #36c783; --op-soft: #193a2b; --info: #6ca6da; --info-soft: #1e3345;
  --warn: #d2a14d; --warn-soft: #3e321c; --on-warn: #e2ba6b; --danger: #e06b6b; --danger-soft: #452525;
  --diff-add-bg: rgba(53, 193, 135, .14); --diff-add: #5fd49b; --diff-add-gutter: rgba(53, 193, 135, .24);
  --diff-del-bg: rgba(239, 109, 109, .16); --diff-del: #f08a8a; --diff-del-gutter: rgba(239, 109, 109, .26);
  --code-bg: #1d1f1b; --glass: rgba(36, 37, 34, .72); --glass-strong: rgba(42, 43, 40, .92); --glass-border: rgba(255, 255, 255, .1); --glass-edge: rgba(255, 255, 255, .05);
  --overlay: rgba(0, 0, 0, .55); --shadow-pill: 0 6px 20px rgba(0, 0, 0, .35); --shadow-composer: 0 1px 2px rgb(0 0 0 / .3), 0 10px 32px -6px rgb(0 0 0 / .55);
  --shadow-pop: 0 24px 64px rgba(0, 0, 0, .55);
  --c1: #6ca6da; --c2: #6fb3be; --c3: #a594d6; --c4: #dd8f73; --c5: #36c783; --page: #0f100e; --bezel: #050505;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
textarea, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); }
svg { display: block; flex: none; }

/* ───── 页面外壳（不属于设计稿） ───── */
.demo-bar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 12px 24px;
  background: color-mix(in srgb, var(--page) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.demo-bar .brand { font-weight: 650; font-size: 15px; margin-right: 6px; }
.demo-bar .spacer { flex: 1; }
.demo-bar label { font-size: 12px; color: var(--muted); margin-right: 6px; }
.seg { display: inline-flex; background: var(--surface-subtle); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { color: var(--muted); font-size: 13px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.intro { max-width: 1240px; margin: 26px auto 0; padding: 0 24px; }
.intro h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--muted); }
.intro ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); columns: 2; column-gap: 40px; }
.intro li { margin: 3px 0; break-inside: avoid; }
.intro li b { color: var(--text); font-weight: 600; }
.phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 26px 24px 30px; }
.phone-col { zoom: var(--zoom); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.phone-cap { width: 412px; text-align: center; font-size: 14px; color: var(--muted); line-height: 1.5; }
.phone-cap b { display: block; color: var(--text); font-size: 15px; margin-bottom: 2px; }
.phone-cap .reset { margin-top: 6px; font-size: 12.5px; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; }
.shared-title { max-width: 1240px; margin: 10px auto 0; padding: 0 24px; font-size: 15px; font-weight: 600; }
.shared-title span { font-weight: 400; color: var(--muted); font-size: 13.5px; margin-left: 8px; }

/* ───── 手机外框 ───── */
.phone { width: 412px; height: 866px; border-radius: 58px; padding: 11px; background: var(--bezel); box-shadow: 0 30px 80px rgba(0, 0, 0, .22), inset 0 0 0 1.5px rgba(255, 255, 255, .08); }
.screen { position: relative; width: 390px; height: 844px; border-radius: 47px; overflow: hidden; background: var(--bg); isolation: isolate; color: var(--text); }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 90; display: flex; align-items: center; justify-content: space-between; padding: 4px 34px 0 40px; font-size: 16px; font-weight: 600; pointer-events: none; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 91; pointer-events: none; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--text); opacity: .85; z-index: 95; pointer-events: none; }
.view { position: absolute; inset: 0; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.toast { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); z-index: 99; background: var(--action); color: var(--on-action); font-size: 13.5px; padding: 8px 14px; border-radius: 999px; box-shadow: var(--shadow-pop); animation: toast 1.8s var(--ease) forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 12%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ───── 通用小件 ───── */
.gl { background: var(--glass); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6); border: 1px solid var(--glass-border); box-shadow: var(--shadow-pill), inset 0 0 0 .5px var(--glass-edge); }
.tile { --tc: var(--c1); flex: none; display: grid; place-items: center; font-weight: 700; color: var(--tc); background: color-mix(in srgb, var(--tc) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tc) 22%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.op { background: var(--op); } .dot.warn { background: var(--warn); } .dot.info { background: var(--info); }
.pulse { animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .3; } }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--op) 25%, transparent); border-top-color: var(--op); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.shimmer { background: linear-gradient(90deg, var(--text) 0%, var(--text) 38%, var(--subtle) 50%, var(--text) 62%, var(--text) 100%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -160% 0; } }
.add { color: var(--diff-add); } .del { color: var(--diff-del); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.md code { font-family: var(--font-mono); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: 5px; padding: 0 4px; }
.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }

/* diff */
.diff { font: 12px/19px var(--font-mono); overflow-x: auto; scrollbar-width: none; background: var(--surface); }
.diff::-webkit-scrollbar { display: none; }
.diff .ln { display: flex; min-width: max-content; }
.diff .g { width: 22px; flex: none; text-align: center; color: var(--subtle); user-select: none; }
.diff .c { padding-right: 14px; white-space: pre; }
.diff .a { background: var(--diff-add-bg); } .diff .a .g { background: var(--diff-add-gutter); color: var(--diff-add); }
.diff .d { background: var(--diff-del-bg); } .diff .d .g { background: var(--diff-del-gutter); color: var(--diff-del); }
.diff .more { padding: 6px 12px; color: var(--faint); font-family: var(--font-ui); font-size: 12.5px; border-top: 1px solid var(--line-soft); }

/* todo */
.todo-i { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; line-height: 20px; padding: 3px 0; }
.todo-i .box { width: 16px; height: 16px; margin-top: 2px; border-radius: 5px; border: 1.5px solid var(--subtle); display: grid; place-items: center; flex: none; }
.todo-i.done { color: var(--faint); } .todo-i.done .t { text-decoration: line-through; }
.todo-i.done .box { background: var(--op); border-color: var(--op); color: var(--surface); }
.todo-i.doing .box { border-color: var(--op); }
.todo-i.doing .box::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--op); }

/* sheet */
.scrim { position: absolute; inset: 0; background: var(--overlay); z-index: 70; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 71; background: var(--surface); border-radius: 26px 26px 0 0; padding: 8px 0 34px; max-height: 80%; overflow-y: auto; scrollbar-width: none; animation: up .26s var(--ease); box-shadow: var(--shadow-pop); }
@keyframes up { from { transform: translateY(100%); } }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 6px; }
.sheet-h b { font-size: 17px; font-weight: 600; }
.sheet-h button { font-size: 15px; color: var(--muted); }
.sheet-h .done { color: var(--text); font-weight: 600; }
.group-h { font-size: 12.5px; color: var(--faint); font-weight: 600; padding: 14px 20px 4px; display: flex; align-items: center; gap: 6px; }
.opt-row { display: flex; gap: 14px; align-items: center; min-height: 54px; padding: 7px 20px; width: 100%; text-align: left; }
.opt-row:active { background: var(--hover); }
.opt-row .t { font-size: 16px; } .opt-row .d { font-size: 13px; color: var(--muted); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.radio.on { border-color: var(--text); } .radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
.effort { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px 4px; }
.effort span { font-size: 15px; }
.seg-sm { display: inline-flex; background: var(--surface-subtle); border-radius: 10px; padding: 2px; }
.seg-sm button { font-size: 13.5px; padding: 6px 13px; border-radius: 8px; color: var(--muted); }
.seg-sm button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* ═════════ V1 · Happy 原生移植 ═════════ */
.v1 .head { position: absolute; top: 50px; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px; z-index: 20; }
.v1 .scrim-top { position: absolute; top: 0; left: 0; right: 0; height: 124px; background: linear-gradient(var(--bg) 72%, color-mix(in srgb, var(--bg) 0%, transparent)); z-index: 15; pointer-events: none; }
.v1 .scrim-bot { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 58%); z-index: 22; pointer-events: none; }
.v1 .circle { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.v1 .logo { font-weight: 800; font-size: 17px; letter-spacing: -.04em; }
.v1 .title-pill { height: 44px; border-radius: 22px; padding: 0 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 0; max-width: 232px; }
.v1 .title-pill b { font-size: 15px; font-weight: 600; line-height: 19px; max-width: 100%; }
.v1 .title-pill small { font-size: 11.5px; color: var(--muted); line-height: 14px; display: flex; gap: 5px; max-width: 100%; }
.v1 .pill-group { height: 44px; border-radius: 22px; display: flex; align-items: center; flex: none; }
.v1 .pill-group button { width: 44px; height: 44px; display: grid; place-items: center; }
.v1 .pill-group i { width: 1px; height: 20px; background: var(--line); }
.v1 .row { display: flex; gap: 12px; padding: 0 16px; width: 100%; text-align: left; }
.v1 .row:active { background: var(--hover); }
.v1 .row .tile { width: 46px; height: 46px; border-radius: 13px; font-size: 18px; margin-top: 11px; }
.v1 .row .body { flex: 1; min-width: 0; padding: 10px 0 11px; border-bottom: .5px solid var(--line); }
.v1 .row:last-of-type .body { border-bottom: 0; }
.v1 .row .top { display: flex; align-items: center; gap: 8px; }
.v1 .row .top b { font-size: 16px; font-weight: 600; line-height: 22px; flex: 1; }
.v1 .row .time { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.v1 .row .big-dot { width: 10px; height: 10px; margin-right: 3px; }
.v1 .row .l2 { font-size: 14px; color: var(--muted); line-height: 20px; }
.v1 .row .l3 { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--faint); line-height: 18px; }
.v1 .row .l3 .grow { flex: 1; }
.v1 .row .l3.warn { color: var(--warn); } .v1 .row .l3.op { color: var(--op); }
.v1 .archived { display: flex; align-items: center; gap: 12px; padding: 14px 32px; color: var(--faint); font-size: 13.5px; width: 100%; }
.v1 .archived::before, .v1 .archived::after { content: ""; flex: 1; height: .5px; background: var(--line); }
.v1 .dock { position: absolute; left: 16px; right: 16px; bottom: 28px; height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 4px; padding: 0 7px; z-index: 25; text-align: left; }
.v1 .dock .ph { flex: 1; font-size: 16px; color: var(--faint); padding-left: 4px; }
.v1 .ibtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.v1 .send { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-subtle); color: var(--subtle); transition: background .15s, color .15s; }
.v1 .send.on { background: var(--action); color: var(--on-action); }
/* V1 新建面板 */
.v1 .new { position: absolute; inset: 0; z-index: 45; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 8px 26px; background: color-mix(in srgb, var(--bg) 58%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: fade .2s ease; }
.v1 .new .close { position: absolute; top: 58px; left: 16px; }
.v1 .new .hint { text-align: center; font-size: 13px; color: var(--faint); margin: 0 0 12px; }
.v1 .env { border-radius: 24px; margin: 0 4px 10px; overflow: hidden; }
.v1 .env-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; text-align: left; }
.v1 .env-row + .env-row { border-top: .5px solid var(--line); }
.v1 .env-row .lab { font-size: 10.5px; letter-spacing: .06em; color: var(--faint); font-weight: 600; line-height: 14px; }
.v1 .env-row .val { font-size: 15px; line-height: 20px; display: flex; align-items: center; gap: 6px; }
.v1 .env-row .val small { color: var(--muted); font-size: 13px; }
.v1 .env-row .f { flex: 1; min-width: 0; }
.v1 .env-row > svg:first-child { color: var(--muted); }
/* V1 详情 */
.v1 .ts { padding: 116px 0 200px; }
.v1 .u { display: flex; justify-content: flex-end; padding: 6px 16px; }
.v1 .u .bubble { max-width: 84%; background: var(--surface-subtle); border: 1px solid var(--line-soft); border-radius: 18px 18px 6px 18px; padding: 9px 13px; font-size: 15px; line-height: 22px; }
.v1 .u.pending .bubble { opacity: .5; }
.v1 .u-cap { text-align: right; font-size: 11.5px; color: var(--faint); padding: 0 18px 4px; }
.v1 .u-cap button { text-decoration: underline; text-underline-offset: 2px; margin-left: 6px; }
.v1 .ai { padding: 6px 16px 8px; font-size: 15px; line-height: 24px; }
.v1 .trow { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 16px; color: var(--muted); font-size: 14px; width: 100%; text-align: left; }
.v1 .trow .grow { flex: 1; }
.v1 .trow .el { font: 12.5px var(--font-mono); color: var(--faint); }

    </div>`;

  home(a) {

        <div class="ac-b">想运行一条命令<div class="cmd">$ ${esc(CMD)}</div></div>
        <div class="ac-btns"><button class="bb" data-act="home-approve" data-choice="deny">拒绝</button><button class="bb primary" data-act="home-approve" data-choice="once">运行</button></div>
        <div class="ac-alt"><button data-act="home-approve" data-choice="session">本会话允许 <code class="mono">pnpm --filter …</code></button></div>
      </div>` : `<div class="done-note">${I("check", 16)}<div style="margin-top:4px">都处理完了</div></div>`;
    const runningCards = [];
    if (ha === "once" || ha === "session") runningCards.push(`<button class="acard" style="display:block;width:100%;text-align:left" data-act="open" data-id="s1"><span class="ac-h">${tile("agent")}<b class="ell">修复侧栏工作区过滤</b><span class="time mono" data-since="${s.since}">${fmt(Date.now() - s.since)}</span></span><span class="live"><span class="spin"></span><span class="ell">正在运行 pnpm … test -- sidebar</span></span><span class="prog"><span class="bar"><i style="width:66%"></i></span>待办 2/3</span></button>`);
    if (SESSIONS_NEW.v3 && s.sid === "new" && s.run === "running") runningCards.push("");
    runningCards.push(`<button class="acard" style="display:block;width:100%;text-align:left" data-act="open" data-id="s2"><span class="ac-h">${tile("agent")}<b class="ell">接入 WebSocket transport</b><span class="time mono" data-since="${S2_START}">${fmt(Date.now() - S2_START)}</span></span><span class="live"><span class="spin"></span><span class="ell">正在编辑 api/live-events.ts</span></span><span class="prog"><span class="bar"><i style="width:25%"></i></span>待办 1/4</span></button>`);
    const recent = [...(SESSIONS_NEW.v3 ? [SESSIONS_NEW.v3] : []), ...SESSIONS.filter((x) => x.state === "unread" || x.state === "idle"), ...(ha === "finished" ? [{ ...sess("s1"), state: "unread", time: "刚刚" }] : [])]
      .map((x) => `<button class="rr" data-act="open" data-id="${x.id}">${tile(x.ws, 30)}<span class="f"><b class="ell">${esc(x.title)}</b><small>${WS[x.ws].name} · ${x.time}</small></span>${x.state === "unread" ? `<span class="dot info"></span>` : ""}</button>`).join("");
    const nAttn = ha === "pending" && s.appr === "pending" ? 1 : 0;
    return `<div class="view">
      <div class="scroll" data-scroll="list"><div style="padding-bottom:170px">
        <div class="home-h"><span class="wm">ActSpace</span><button class="srv" data-act="toast" data-text="Demo：切换 / 管理服务器"><span class="dot op" style="width:7px;height:7px"></span>${SERVER}</button><button class="me" data-act="toast" data-text="Demo：进入设置">${I("gear", 17, 1.8)}</button></div>
        <div class="sec"><b>需要你处理</b><span>${nAttn}</span></div>${attn}
        <div class="sec"><b>运行中</b><span>${runningCards.filter(Boolean).length}</span></div>${runningCards.join("")}
        <div class="sec"><b>最近</b></div><div class="recent">${recent}</div>
      </div></div>
      <div class="scrim-bot"></div>
      ${this.quick(a)}
    </div>`;
  },
  quick(a) {
    const s = a.s, w = WS[s.draftWs], open = s.newOpen;
    const prog = s.progress != null ? [`在 ${SERVER} 上创建会话…`, "启动 Agent…", "打开会话…"][s.progress] : null;
    return `<div class="qbar gl ${open ? "open" : ""}">
      ${open ? `<div class="qchips">
        <button class="qchip" data-act="sheet" data-sheet="ws">${tile(s.draftWs)}${w.name}${I("down", 12)}</button>
        <button class="qchip" data-act="sheet" data-sheet="run">${s.mode} · ${s.model}${I("down", 12)}</button>
        <button class="qchip" data-act="close-new" style="margin-left:auto">${I("x", 13)}</button>
      </div>` : ""}
      ${prog ? `<div class="qprog"><span class="dot op pulse"></span>${prog}</div>` : `<div class="qrow">
        ${open ? "" : `<button class="qchip" data-act="new" style="margin:5px 0 5px 2px">${tile(s.draftWs)}${w.name}</button>`}
        <textarea data-input rows="1" placeholder="${open ? "描述一个新任务…" : "新任务…"}" ${open ? "" : 'data-act="new"'}></textarea>
        ${this.primaryBtn(a)}
      </div>`}
    </div>`;
  },
  item(a, it, last) {
    const s = a.s;
    const step = (node, nodeCls, body) => `<div class="st ${last ? "last" : ""}"><span class="node ${nodeCls}">${node}</span><div class="sb">${body}</div></div>`;
    switch (it.t) {
      case "user": return `<div class="tlu"><small>${it.steer ? "你 · ↳ 插入" : "你"}</small>${esc(it.text)}</div>`;
      case "think": return step(I("spark", 12), "", `<div class="lbl">${it.text}</div>`);
      case "explore": {
        const open = s.open[it.key];
        return step(I("search", 12), "", `<button class="lbl" data-act="toggle" data-key="${it.key}"><span>${it.label}</span>${I(open ? "down" : "right", 13)}</button>${open ? `<div class="subl">${it.items.map(([ic, t]) => `<div>${I(ic, 12)}<span class="ell">${t}</span></div>`).join("")}</div>` : ""}`);
      }
      case "ai": return step(I("chat", 11), "", `<div class="ai md"><p>${it.html}</p></div>`);
      case "edit": {
        const open = s.open[it.key];
        return step(I("edit", 12), "", `<button class="lbl" data-act="toggle" data-key="${it.key}"><span class="mono ell" style="font-size:13px">${it.path}</span><span class="add">+${it.add}</span>${it.del ? `<span class="del">−${it.del}</span>` : ""}<span class="grow"></span>${I(open ? "down" : "right", 13)}</button>${open ? `<div class="fc">${diffHtml(it.rows, it.more)}</div>` : ""}`);
      }
      case "todo": return step(I("todo", 12), "", `<div class="lbl">待办 ${it.done}/${it.total}</div><div style="margin-top:4px">${todoHtml(it.items)}</div>`);
      case "approval": {
        const d = it.decision;
        if (d === "pending") return step(I("pause", 11), "warn", `<div class="lbl" style="color:var(--warn)">等待你审批 · 运行命令</div><div class="mono" style="font-size:12.5px;color:var(--faint);margin-top:2px">${esc(it.cmd)}</div>`);
        const txt = d === "once" ? "已允许运行一次" : d === "session" ? "已在本会话允许 pnpm --filter …" : "已拒绝运行命令";
        return step(d === "deny" || d === "denied-fed" ? I("ban", 12) : I("check", 12, 2.6), d === "deny" || d === "denied-fed" ? "" : "ok", `<div class="lbl">${txt}</div>`);
      }
      case "bash": return it.state === "running"
        ? step(`<span class="spin" style="width:12px;height:12px;border-width:1.6px"></span>`, "op", `<div class="lbl" style="color:var(--text)"><span class="mono ell" style="font-size:13px">${esc(it.cmd)}</span><span class="grow"></span><span class="el" data-since="${it.since}">${fmt(Date.now() - it.since)}</span></div>`)
        : step(I("term", 12), it.state === "stopped" ? "" : "ok", `<div class="lbl"><span class="mono ell" style="font-size:13px">${esc(it.cmd)}</span><span class="grow"></span><span style="font-size:12.5px;color:${it.state === "stopped" ? "var(--faint)" : "var(--op)"}">${it.state === "stopped" ? "已停止" : it.result}</span></div>`);
      case "live": return step(`<span class="spin" style="width:12px;height:12px;border-width:1.6px"></span>`, "op", `<div class="lbl" style="color:var(--text)">${it.text}<span class="grow"></span><span class="el" data-since="${it.since}">${fmt(Date.now() - it.since)}</span></div>`);
      case "event": return step(I("ban", 12), "", `<div class="lbl">${it.text}</div>`);
    }
    return "";
  },
  detail(a) {
    const s = a.s, x = a.curSession();
    const list = script(a);
    const items = list.map((it, i) => this.item(a, it, i === list.length - 1 || list[i + 1]?.t === "user")).join("");
    const queued = s.queue.length ? s.queue.map((m) => `<div class="tlu pending"><small>你 · 本轮结束后发送</small>${esc(m)}</div>`).join("") : "";
    const waiting = s.sid === "s1" && s.appr === "pending";
    const todo = list.find((i) => i.t === "todo");
    const pill = waiting ? `<span class="spill warn"><span class="dot warn pulse" style="width:6px;height:6px"></span>等待审批</span>`
      : s.run === "running" ? `<span class="spill op"><span class="spin" style="width:10px;height:10px;border-width:1.5px"></span>运行中</span>`
      : `<span class="spill idle">${s.run === "stopped" ? "已停止" : "空闲"}</span>`;
    const pct = todo ? Math.round(todo.done / todo.total * 100) : 0;
    const strip = `<div class="strip">${pill}${todo ? `<span>待办 ${todo.done}/${todo.total}</span><span class="bar" style="height:4px;border-radius:2px;background:var(--surface-subtle);overflow:hidden;flex:1"><i style="display:block;height:100%;width:${pct}%;background:var(--op)"></i></span>` : `<span style="flex:1"></span>`}<span class="mono" ${s.run === "running" ? `data-since="${s.since}"` : ""}>${s.run === "running" ? fmt(Date.now() - s.since) : "1:12"}</span></div>`;
    const ph = s.appr === "deny" ? "告诉 Agent 应该怎么做…" : s.run === "running" ? "补充要求…" : "发消息…";
    const dock = waiting ? `<div class="apsheet gl">
        <div class="ah"><span class="dot warn pulse"></span><b>需要审批</b><span>运行命令</span></div>
        <div class="cmd">$ ${esc(CMD)}</div>
        <div class="ac-btns"><button class="bb" data-act="approve" data-choice="deny">拒绝</button><button class="bb primary" data-act="approve" data-choice="once">运行</button></div>
        <div class="ac-alt"><button data-act="approve" data-choice="session">本会话允许 <code class="mono">pnpm --filter …</code></button></div>
      </div>`
      : `${s.queue.length ? `<div class="qpill"><button data-act="unqueue" data-i="${s.queue.length - 1}">已排队 ${s.queue.length} 条 ${I("x", 12)}</button><button data-act="insert" data-i="0">${I("insert", 12)}立即插入</button></div>` : ""}
        <div class="qbar gl" style="position:static">
          <div class="runline"><button data-act="sheet" data-sheet="run">${I("sliders", 13)}${s.mode} · ${s.model} · ${s.effort}${I("down", 12)}</button><span style="flex:1"></span><button style="color:var(--faint)">上下文 ${s.sid === "s2" ? 61 : 38}%</button></div>
          <div class="qrow"><button class="qbtn plain" data-act="toast" data-text="Demo：添加文件 / @ 引用">${I("plus", 21)}</button><textarea data-input rows="1" placeholder="${ph}"></textarea>${this.primaryBtn(a)}</div>
        </div>`;
    return `<div class="view">
      <div class="scroll" data-scroll="detail"><div class="tl">${items}${queued}</div></div>
      <div class="dh"><div class="in"><button data-act="back">${I("back", 24)}</button><div class="tt"><b class="ell">${esc(x.title)}</b><small class="ell">${WS[x.ws].name} · ${SERVER}</small></div><button data-act="toast" data-text="Demo：会话信息 / 重命名 / 归档">${I("more", 22)}</button></div>${strip}</div>
      <div class="scrim-bot"></div>
      <div class="dock">${dock}</div>
    </div>`;
  },
};

  current = ver;
  apps.length = 0;
  Object.keys(SESSIONS_NEW).forEach((k) => delete SESSIONS_NEW[k]);
  const V = VERSIONS[ver];
  document.getElementById("intro").innerHTML = `<h1>${V.title}</h1><p>${V.lede}</p><ul>${V.points.map((p) => `<li>${p}</li>`).join("")}</ul>`;
  const wrap = document.getElementById("phones");
  wrap.innerHTML = V.phones.map((p, i) => `<div class="phone-col"><div class="phone" id="ph-${i}"></div><div class="phone-cap"><b>${p.cap}</b>${p.sub}<br><button class="reset" data-reset="${i}">重置这台</button></div></div>`).join("");
  V.phones.forEach((p, i) => new App(document.getElementById(`ph-${i}`), ver, p.preset));
  wrap.querySelectorAll("[data-reset]").forEach((b) => b.addEventListener("click", () => apps[+b.dataset.reset].reset()));
  const wideWrap = document.getElementById("wideWrap");
  wideWrap.hidden = ver !== "v1";
  if (ver === "v1") {
    const ww = document.getElementById("widePhones");
    ww.innerHTML = `<div class="browser-col"><div class="browser" id="ph-wide"></div><div class="phone-cap" style="width:auto"><b>浏览器宽屏</b>点左栏切换会话；点左下角输入坞新建；模型选择变成居中对话框</div></div>`;
    new App(document.getElementById("ph-wide"), "v1", { wide: true, screen: "detail", sid: "s1" });
  }
  const sw = document.getElementById("sharedPhones");
  sw.innerHTML = `<div class="phone-col"><div class="phone" id="ph-connect"></div><div class="phone-cap"><b>连接服务器</b>点「连接」看成功状态</div></div>`;
  new App(document.getElementById("ph-connect"), ver, { screen: "connect" });
  document.querySelectorAll("#verSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.ver === ver)));
  try { localStorage.setItem("mobile-demo-ver", ver); } catch {}
}
document.getElementById("verSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) mount(b.dataset.ver); });
document.getElementById("themeSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const t = b.dataset.theme;
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll("#themeSeg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
document.getElementById("zoomSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.documentElement.style.setProperty("--zoom", b.dataset.zoom);
  document.querySelectorAll("#zoomSeg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach((el) => { el.textContent = fmt(now - +el.dataset.since); });
}, 200);
let saved = location.hash.slice(1);
try { if (!VERSIONS[saved]) saved = localStorage.getItem("mobile-demo-ver") || "v1"; } catch {}
mount(VERSIONS[saved] ? saved : "v1");
</script>
</body>
</html>
