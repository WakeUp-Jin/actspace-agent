<!doctype html>
<html lang="zh-CN">
<title>Space 工作台</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Space 工作台 demo
   左栏：普通会话列表 + Actor 名册入口 + Space
   中栏：标签页（第一个是协调 Agent，其余是 Space 里的 Actor）；名册页和一对一对话也在这里
   右栏：Actor / 库 / 记忆
   颜色沿用 Ink & Emerald token：翡翠绿只用于工作中与成功，琥珀只用于等你决定，红只用于出错。
   头像：Space 与协调 Agent 用 Space 图；成熟 Actor 用桌面端现有九张角色图；Space 里生成的 Actor 用五色小球，按 id 固定分配颜色。 */

:root {
  --bg: #f7f7f5; --surface: #ffffff; --subtle: #f1f1ef; --raised: #ffffff; --sidebar: #efefed;
  --selected: #e4e4e1; --hover: #eaeae7; --line: #deded9; --line-strong: #8c8c85;
  --text: #20201e; --muted: #676762; --faint: #72726b; --subtle-text: #85857e;
  --action: #20201e; --action-hover: #343430; --on-action: #ffffff;
  --op: #087a4b; --op-soft: #e5f2ea; --info: #3978b8; --info-soft: #e8f1f9;
  --warn: #91600e; --warn-soft: #f7eedb; --danger: #c74747; --danger-soft: #f8e9e9;
  --overlay: rgba(17, 24, 39, .32);
  --shadow-pop: 0 24px 64px rgba(20, 21, 18, .14);
  --shadow-card: 0 1px 2px rgba(20, 21, 18, .06);
  /* 星空：深色是星点，浅色换成极淡的点阵 */
  --stars-o: 0; --grid-o: 1; --grid-dot: rgba(32, 32, 30, .16); --spark: #3b4a9c;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181916; --surface: #242522; --subtle: #292a26; --raised: #30312d; --sidebar: #1e1f1c;
    --selected: #30312d; --hover: #2a2b27; --line: #353630; --line-strong: #787870;
    --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle-text: #787870;
    --action: #f1f1ed; --action-hover: #dbdbd5; --on-action: #181916;
    --op: #36c783; --op-soft: #193a2b; --info: #6ca6da; --info-soft: #1e3345;
    --warn: #d2a14d; --warn-soft: #3e321c; --danger: #e06b6b; --danger-soft: #452525;
    --overlay: rgba(0, 0, 0, .55);
    --shadow-pop: 0 24px 64px rgba(0, 0, 0, .5);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .4);
    --stars-o: 1; --grid-o: 0; --spark: #eef1ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181916; --surface: #242522; --subtle: #292a26; --raised: #30312d; --sidebar: #1e1f1c;
  --selected: #30312d; --hover: #2a2b27; --line: #353630; --line-strong: #787870;
  --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle-text: #787870;
  --action: #f1f1ed; --action-hover: #dbdbd5; --on-action: #181916;
  --op: #36c783; --op-soft: #193a2b; --info: #6ca6da; --info-soft: #1e3345;
  --warn: #d2a14d; --warn-soft: #3e321c; --danger: #e06b6b; --danger-soft: #452525;
  --overlay: rgba(0, 0, 0, .55);
  --shadow-pop: 0 24px 64px rgba(0, 0, 0, .5);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .4);
  --stars-o: 1; --grid-o: 0; --spark: #eef1ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.xs { width: 12px; height: 12px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--line-strong) 40%, transparent); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--line-strong) 70%, transparent); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 头像 ---------- */
/* 头像回答「是谁」，状态由分组、光环和文字表达；图片颜色不承担状态含义 */
.av { position: relative; flex: none; display: inline-block; border-radius: 28%; }
.av > img { width: 100%; height: 100%; border-radius: inherit; display: block; object-fit: cover; }
.av16 { width: 16px; height: 16px; border-radius: 4px; } .av18 { width: 18px; height: 18px; border-radius: 5px; }
.av22 { width: 22px; height: 22px; border-radius: 6px; } .av36 { width: 36px; height: 36px; }
.av40 { width: 40px; height: 40px; } .av56 { width: 56px; height: 56px; }
/* 工作中：一圈缓慢转动的翡翠绿光环，替代转圈和状态点 */
@property --ring-a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.av.working::after {
  content: ""; position: absolute; inset: -3px; border-radius: 9px; padding: 1.5px;
  background: conic-gradient(from var(--ring-a), transparent 0 50%, var(--op) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: ring-spin 2.4s linear infinite;
}
.av18.working::after { inset: -2.5px; border-radius: 7px; }
.av36.working::after, .av40.working::after { inset: -3.5px; border-radius: 13px; padding: 2px; }
@keyframes ring-spin { to { --ring-a: 360deg; } }
.av.pop { animation: av-pop .5s cubic-bezier(.3, 1.5, .4, 1) both; }
@keyframes av-pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 星空 ---------- */
.sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 30%, transparent 100%);
  mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 30%, transparent 100%); }
.sky::before, .sky::after { content: ""; position: absolute; inset: -800px; opacity: var(--stars-o); background-repeat: repeat; }
.sky::before { animation: drift-a 200s linear infinite; }
.sky::after { animation: drift-b 300s linear infinite, twinkle 7s ease-in-out infinite; }
.sky .dots { position: absolute; inset: 0; opacity: var(--grid-o); background-image: radial-gradient(circle at 1px 1px, var(--grid-dot) 1px, transparent 1.6px); background-size: 20px 20px; }
@keyframes drift-a { to { transform: translate(520px, 520px); } }
@keyframes drift-b { to { transform: translate(-760px, 760px); } }
@keyframes twinkle { 50% { opacity: calc(var(--stars-o) * .45); } }

/* ---------- 骨架 ---------- */
.app { position: relative; display: grid; grid-template-columns: 260px minmax(0, 1fr) 0px; height: 100%; overflow: hidden; transition: grid-template-columns .26s var(--ease); }
.app.rp-open { grid-template-columns: 260px minmax(0, 1fr) clamp(340px, 30%, 440px); }
.sb { grid-column: 1; grid-row: 1; } .main { grid-column: 2; grid-row: 1; } .rp { grid-column: 3; grid-row: 1; }
.sb-scrim { display: none; position: absolute; inset: 0; background: var(--overlay); z-index: 19; }
/* 名册页和一对一对话不需要右栏 */
.app.solo [data-act="toggle-rp"] { display: none !important; }
.app.view-roster .dock { display: none; }
.app.solo .pills, .app.solo .tray { display: none; }

/* ---------- 左栏 ---------- */
.sb { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.sb-chrome { height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 10px; flex: none; }
.lights { display: flex; gap: 7px; margin-right: auto; padding-left: 2px; }
.lights i { width: 12px; height: 12px; border-radius: 99px; background: var(--line); cursor: default; }
.ib { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; position: relative; }
.ib:hover { background: var(--hover); color: var(--text); }

.sb-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 8px 12px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.sec { display: flex; flex-direction: column; gap: 1px; }
.sec-head { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 8px; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .04em; }
.sec-head .ib { width: 22px; height: 22px; margin-left: auto; }
.sec-head .grow { margin-right: auto; }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 30px; padding: 5px 8px; border-radius: 6px; width: 100%; color: var(--text); }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--selected); }
.row .ico { color: var(--muted); display: flex; justify-content: center; }
.row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row .name.plain { font-weight: 400; color: var(--muted); }
.row .right { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stack { display: flex; }
.stack .av { box-shadow: 0 0 0 1.5px var(--sidebar); }
.stack .av + .av { margin-left: -6px; }
.stack .av12 { width: 12px; height: 12px; border-radius: 3.5px; }
.badge-warn { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.unread-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--info); flex: none; }

.sb-foot { flex: none; border-top: 1px solid var(--line); padding: 6px 8px; display: flex; align-items: center; gap: 2px; }
.theme-btn { padding: 4px 8px; border-radius: 5px; font-size: 12px; color: var(--faint); }
.theme-btn:hover { background: var(--hover); color: var(--text); }
.theme-btn[aria-pressed="true"] { background: var(--selected); color: var(--text); }

/* ---------- 中栏 ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.tabbar { height: 44px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 2px; padding: 0 8px; min-width: 0; flex: none; }
.tab-strip { display: flex; align-items: center; gap: 2px; min-width: 0; margin-right: auto; position: relative; }
.tab-lead { flex: none; display: flex; padding: 4px 0 4px 3px; }
.tabs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 4px 3px; }
.tabs::-webkit-scrollbar { display: none; }
/* 放不下时，被挡住的一侧渐隐，提示还有标签 */
.tabs.fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.tabs.fade-l { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px); mask-image: linear-gradient(to right, transparent, #000 28px); }
.tabs.fade-l.fade-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
.ib[aria-expanded="true"] { background: var(--selected); color: var(--text); }
/* 全部标签菜单 */
.tab-menu { position: absolute; top: calc(100% + 2px); right: 0; z-index: 30; width: 260px; max-height: 360px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); box-shadow: var(--shadow-pop); animation: drop .16s var(--ease) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.tm-top { display: flex; align-items: center; width: 100%; height: 30px; padding: 0 8px; margin-bottom: 4px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.tm-top:hover { background: var(--hover); color: var(--text); }
.tm-sep { height: 1px; background: var(--line); margin: 0 4px 4px; }
.tm-row { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 6px 0 8px; border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
.tm-row:hover { background: var(--hover); }
.tm-row.seen { color: var(--muted); }
.tm-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-row .ck { width: 14px; display: flex; color: var(--text); flex: none; }
.tm-row .x { width: 20px; height: 20px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); flex: none; opacity: 0; }
.tm-row:hover .x { opacity: 1; }
.tm-row .x:hover { background: var(--selected); color: var(--text); }
.tab { height: 30px; padding: 0 8px 0 6px; border-radius: 7px; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; flex: none; max-width: 220px; position: relative; cursor: pointer; transition: background .14s var(--ease), color .14s var(--ease); }
.tab:hover { background: var(--hover); color: var(--text); }
.tab[aria-selected="true"] { background: var(--selected); color: var(--text); }
.tab .lbl { overflow: hidden; text-overflow: ellipsis; }
.tab .lbl.lead { font-weight: 600; }
.tab .x { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); flex: none; opacity: 0; transition: opacity .12s ease; }
.tab:hover .x, .tab[aria-selected="true"] .x { opacity: 1; }
.tab .x:hover { background: var(--hover); color: var(--text); }

.flow { flex: 1; overflow-y: auto; min-height: 0; position: relative; }
.column { max-width: 720px; margin: 0 auto; padding: 22px 20px 8px; display: flex; flex-direction: column; gap: 14px; }

.user-msg { align-self: flex-end; max-width: 88%; border: 1px solid var(--line); border-radius: 12px 12px 4px 12px; background: var(--surface); padding: 9px 14px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; box-shadow: var(--shadow-card); }
.coord-msg { font-size: 14px; line-height: 1.66; }
.coord-msg p { margin: 0; overflow-wrap: anywhere; }
.divider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--faint); padding: 2px 0; font-variant-numeric: tabular-nums; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divider .i { color: var(--op); }
.divider.task { color: var(--muted); }
.aref { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px 0 3px; margin-inline: 1px; border-radius: 6px; background: var(--subtle); font-size: 13px; line-height: 22px; color: var(--text); vertical-align: -1px; transition: background .14s var(--ease); }
.aref:hover { background: var(--hover); }
.mem-note { display: flex; align-items: flex-start; gap: 8px; padding: 7px 12px; border-radius: 8px; background: var(--subtle); font-size: 13px; color: var(--muted); }
.mem-note .i { margin-top: 2px; color: var(--op); flex: none; }
.mem-note .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mem-note .txt b { color: var(--text); font-weight: 500; }
.mem-note.undone .txt { text-decoration: line-through; color: var(--faint); }
.link-btn { font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.link-btn:hover { background: var(--hover); color: var(--text); }

.typing { display: inline-flex; gap: 3px; align-items: center; height: 22px; }
.typing i { width: 5px; height: 5px; border-radius: 99px; background: var(--faint); animation: bounce 1.1s var(--ease) infinite; }
.typing i:nth-child(2) { animation-delay: .14s; } .typing i:nth-child(3) { animation-delay: .28s; }
.caret { display: inline-block; width: 2px; height: 15px; background: var(--text); margin-left: 2px; vertical-align: -2px; animation: blink 1s step-end infinite; }
@keyframes bounce { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
@keyframes blink { 50% { opacity: 0; } }

/* 留下 Space 里生成的 Actor：星尘聚拢成角色 */
.keep { display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-card); }
.keep .txt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.55; }
.keep .txt small { display: block; font-size: 12px; color: var(--faint); }
.keep .acts { display: flex; gap: 6px; flex: none; }
.keep.quiet { background: none; box-shadow: none; border-style: dashed; }
.keep.quiet .txt { color: var(--faint); }
.grow-av { position: relative; width: 40px; height: 40px; flex: none; }
.grow-av img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 28%; }
.grow-av .to { opacity: 0; }
.grow-av.kept .from { opacity: 0; } .grow-av.kept .to { opacity: 1; }
.grow-av .sp { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 99px; background: var(--spark); box-shadow: 0 0 6px var(--spark); opacity: 0; }
.growing .from { animation: g-from .45s var(--ease) forwards; }
.growing .sp { animation: g-conv .6s var(--ease) forwards; animation-delay: calc(var(--i) * 28ms); }
.growing .to { animation: g-to .5s cubic-bezier(.3, 1.5, .4, 1) .42s forwards; }
.growing .acts { opacity: .4; pointer-events: none; }
@keyframes g-from { to { transform: scale(.5); opacity: 0; filter: blur(1px); } }
@keyframes g-conv { 0% { transform: translate(var(--x), var(--y)); opacity: 0; } 35% { opacity: 1; } 100% { transform: none; opacity: 0; } }
@keyframes g-to { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }

/* 空 Space：星空 + 成员 */
.blank-wrap { position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.blank { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 48px 24px; text-align: center; }
.blank h2 { margin: 0; font-size: 17px; font-weight: 600; }
.blank p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 46ch; }
.blank .hint2 { color: var(--faint); font-size: 12px; margin: 0; }
.crew { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.crew button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.crew .av { animation: float 5s ease-in-out infinite; }
.crew button:nth-child(2) .av { animation-delay: -1.6s; } .crew button:nth-child(3) .av { animation-delay: -3.1s; } .crew button:nth-child(4) .av { animation-delay: -.8s; }
@keyframes float { 50% { transform: translateY(-4px); } }

/* ---------- Actor 标签页 ---------- */
.agent-head { flex: none; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 12px; align-items: flex-start; }
.agent-head .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.agent-head .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.agent-head h1 { margin: 0; font-size: 15px; font-weight: 600; }
.agent-head .scene { font-size: 12px; color: var(--muted); }
.agent-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12px; color: var(--faint); }
.agent-head .meta > span { display: inline-flex; align-items: center; gap: 5px; }
.agent-head .meta b { color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { height: 20px; padding: 0 7px; border-radius: 5px; background: var(--subtle); font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; white-space: nowrap; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; }
.status-chip .dot { width: 6px; height: 6px; }
.st-run { background: var(--op-soft); color: var(--op); }
.st-result { background: var(--op-soft); color: var(--op); }
.st-wait { background: var(--warn-soft); color: var(--warn); }
.st-idle { background: var(--subtle); color: var(--muted); }
.st-fail { background: var(--danger-soft); color: var(--danger); }

.brief { border-radius: 8px; background: var(--subtle); padding: 9px 12px; font-size: 13px; line-height: 1.6; }
.brief small { display: block; font-size: 11px; color: var(--faint); margin-bottom: 3px; letter-spacing: .02em; }
.aline { font-size: 12px; color: var(--muted); display: flex; gap: 7px; flex-wrap: wrap; overflow-wrap: anywhere; align-items: baseline; }
.aline .k { color: var(--faint); flex: none; min-width: 34px; }

        ${tabDot(m)}
        ${m.unread ? '<span class="unread-dot"></span>' : ''}
        <button type="button" class="x" data-act="close-tab" data-id="${m.id}" aria-label="关闭">${ic('x', 'xs')}</button>
      </div>`;
    }).join('');
    strip.scrollLeft = left;
    // 只在切换标签时把它滚进视野，不和你手动滚动抢位置
    if (S.tab !== shownTab) { revealTab(S.tab); shownTab = S.tab; }
    updateTabOverflow();
  }
  function revealTab(id) {
    const strip = $('tabs');
    const t = strip.querySelector(`[data-id="${id}"]`);
    if (!t) return;
    const r = t.getBoundingClientRect(), b = strip.getBoundingClientRect();
    if (r.left < b.left + 28) strip.scrollLeft -= b.left + 28 - r.left;
    else if (r.right > b.right - 28) strip.scrollLeft += r.right - (b.right - 28);
  }
  // 「全部标签」按钮只在放不下时出现
  function updateTabOverflow() {
    const strip = $('tabs');
    const over = strip.scrollWidth > strip.clientWidth + 1;
    if (!over) S.tabMenu = false;
    $('tabMore').hidden = !over;
    $('tabMore').setAttribute('aria-expanded', String(!!S.tabMenu));
    strip.classList.toggle('fade-l', over && strip.scrollLeft > 1);
    strip.classList.toggle('fade-r', over && strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 1);
    renderTabMenu();
  }
  function renderTabMenu() {
    const menu = $('tabMenu');
    menu.hidden = !S.tabMenu;
    if (!S.tabMenu) { menu.innerHTML = ''; return; }
    const c = cur(), strip = $('tabs'), b = strip.getBoundingClientRect();
    // 能看到的标签灰一点，被挡住的保持正常字色
    const seen = id => {
      const t = strip.querySelector(`[data-id="${id}"]`);
      if (!t) return true;
      const r = t.getBoundingClientRect();
      return r.left >= b.left - 1 && r.right <= b.right + 1;
    };
    const check = id => `<span class="ck">${S.tab === id ? ic('check', 'xs') : ''}</span>`;
    const others = tabsOf(c).filter(id => id !== S.tab);
    menu.innerHTML = `
      ${others.length ? '<button type="button" class="tm-top" data-act="tm-close-others">关闭其他标签</button><div class="tm-sep"></div>' : ''}
      <div class="tm-row seen" data-act="tm-pick" data-id="coord">${check('coord')}${spaceAv(c, 18)}<span class="nm">${esc(c.name)}</span></div>
      ${tabsOf(c).map(id => {
        const m = member(id);
        return `<div class="tm-row${seen(id) ? ' seen' : ''}" data-act="tm-pick" data-id="${id}">${check(id)}${av(id, 18, { working: m.status === 'run' })}<span class="nm">${esc(nameOf(id))}</span>${tabDot(m)}<button type="button" class="x" data-act="tm-close" data-id="${id}" aria-label="关闭">${ic('x', 'xs')}</button></div>`;
      }).join('')}`;
  }

  /* ============ 中栏 ============ */
  function renderFlow() {
    const scroll = $('flow');
    const atBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
    if (S.view === 'roster') { scroll.innerHTML = renderRoster(); renderCards(); return; }
    if (S.view === 'chat') { scroll.innerHTML = renderSoloChat(); if (atBottom || S.stream) scroll.scrollTop = scroll.scrollHeight; S.stream = null; return; }
    const c = cur();
    if (S.tab === 'coord') {
      if (c.msgs.length === 0) { scroll.innerHTML = renderBlank(c); return; }
      scroll.innerHTML = `<div class="column">${c.msgs.map(m => renderMsg(m, c)).join('')}</div>`;
    } else {
      const m = member(S.tab);
      if (!m) { S.tab = 'coord'; return renderFlow(); }
      scroll.innerHTML = `${renderAgentHead(m)}<div class="column">
        ${m.transcript.length ? m.transcript.map(b => renderBlock(b, m)).join('') : `<div class="quiet-empty">在这个 Space 里还没有交给 ${esc(nameOf(m.id))} 的事。</div>`}
      </div>`;
    }
    if (S.stream) { S.stream = null; scroll.scrollTop = scroll.scrollHeight; }
    else if (atBottom) scroll.scrollTop = scroll.scrollHeight;
  }
  function renderMsg(m, c) {
    if (m.k === 'div') return `<div class="divider">${esc(m.t)}</div>`;
    if (m.k === 'user') return `<div class="user-msg">${esc(m.t)}</div>`;
    if (m.k === 'mem') {
      const gone = m.undone;
      return `<div class="mem-note${gone ? ' undone' : ''}">${ic('check')}<span class="txt">记下了「<b>${esc(m.t)}</b>」${gone ? ' · 已撤销' : ''}</span>${gone ? '' : `<button type="button" class="link-btn" data-act="undo-mem" data-id="${m.mid}">撤销</button>`}</div>`;
    }
    if (m.k === 'keep') return renderKeep(m);
    let body;
    if (m.typing) body = `<div class="typing"><i></i><i></i><i></i></div>`;
    else if (m.shown != null) body = `<p>${esc(m.plain.slice(0, m.shown))}<span class="caret"></span></p>`;
    else body = `<p>${renderInline(m.t)}</p>`;
    return `<div class="coord-msg">${body}</div>`;
  }
  // 协调 Agent 只问一次：要不要把这个新起的 Actor 留下
  function renderKeep(m) {
    const a = actor(m.aid);
    const name = esc(a.name);
    const sparks = Array.from({ length: 8 }, (_, i) => {
      const ang = i / 8 * Math.PI * 2;
      return `<i class="sp" style="--i:${i};--x:${(Math.cos(ang) * 26).toFixed(1)}px;--y:${(Math.sin(ang) * 26).toFixed(1)}px"></i>`;
    }).join('');
    const growAv = kept => `<div class="grow-av${kept ? ' kept' : ''}"><img class="from" src="${BALL(m.aid)}" alt=""><img class="to" src="${COMPANION(a.growImg || a.img)}" alt="">${sparks}</div>`;
    if (m.state === 'kept') return `<div class="keep">${growAv(true)}<div class="txt">留下了。<b>${name}</b> 现在在名册里，以后可以直接找它。</div><div class="acts"><button type="button" class="btn ghost" data-act="go-roster">去名册</button></div></div>`;
    if (m.state === 'declined') return `<div class="keep quiet"><div class="txt">没有留下 ${name}，它只留在这个 Space 里。</div></div>`;
    return `<div class="keep" data-keep="${m.aid}">${growAv(false)}
      <div class="txt"><b>${name}</b> 这次做完了，要不要留下它？<small>留下后它会进入名册，以后同类的事可以直接找它。</small></div>
      <div class="acts"><button type="button" class="btn ghost" data-act="decline-actor" data-id="${m.aid}">不用</button><button type="button" class="btn primary" data-act="keep-actor" data-id="${m.aid}">留下</button></div>
    </div>`;
  }
  function renderBlank(c) {
    return `<div class="blank-wrap"><div class="sky"><div class="dots"></div></div>
      <div class="blank">
        ${spaceAv(c, 56)}
        <div><h2>${esc(c.name)}</h2><p>为「${esc(c.goal || '一个还没写下的目标')}」而设</p></div>
        <div class="crew">${c.members.map(m => `<button type="button" data-act="open-agent" data-id="${m.id}">${av(m.id, 40)}${esc(nameOf(m.id))}</button>`).join('')}</div>
        <p class="hint2">说说要做什么，协调 Agent 会交给合适的 Actor。</p>
      </div></div>`;
  }
  function renderAgentHead(m) {
    const a = actor(m.id);
    return `<div class="agent-head">
      ${av(m.id, 40, { working: m.status === 'run' })}
      <div class="main-col">
        <div class="top"><h1>${esc(a.name)}</h1><span class="status-chip st-${m.status}"><span class="dot ${m.status}"></span>${STATUS[m.status]}</span></div>
        <div class="scene">${esc(a.scene)}</div>
        ${a.abilities.length ? `<div class="chips">${a.abilities.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
        <div class="meta">
          <span>${ic('folder', 'xs')} <b>${esc(m.dir)}</b></span>
          ${m.tree ? `<span>${ic('branch', 'xs')} 工作树 <b>${esc(m.tree)}</b></span>` : ''}
          ${a.nascent ? '<span>归属 <b>Space</b></span>' : `<span>${ic('brain', 'xs')} 自己的记忆 <b>${a.memN} 条</b></span>`}
        </div>
      </div>
    </div>`;
  }
  function renderBlock(b, m) {
    if (b.k === 'task') return `<div class="divider task">开始 · ${esc(b.t)} · ${esc(b.at)}</div>`;
    if (b.k === 'done') return `<div class="divider task">${ic('check', 'xs')}完成 · ${esc(b.t)} · ${esc(b.at)}</div>`;
    if (b.k === 'brief') return `<div class="brief"><small>协调 Agent 交来的事</small>${esc(b.t)}</div>`;
    if (b.k === 'line') return `<div class="aline"><span class="k">${esc(b.k1)}</span><code>${esc(b.t)}</code>${b.diff ? `<span class="diff"><span class="a">+${b.diff[0]}</span> <span class="d">−${b.diff[1]}</span></span>` : ''}</div>`;
    if (b.k === 'sync') return `<div class="sync">${esc(b.t)}</div>`;
    if (b.k === 'text') return `<div class="atext">${renderInline(b.t)}</div>`;
    if (b.k === 'approval') {
      if (m.status === 'wait' && m.approval) {
        return `<div class="approval-card">
          <div class="ac-head">${ic('shield')} 想运行一条命令</div>
          <pre>${esc(m.approval.cmd)}</pre>
          <p class="ac-why">${esc(m.approval.why)}</p>
          <div class="ac-acts">
            <button type="button" class="btn" data-act="deny-agent" data-id="${m.id}">拒绝</button>
            <button type="button" class="btn primary" data-act="run-agent" data-id="${m.id}">运行</button>
          </div>
        </div>`;
      }
      const doneTxt = m.denied ? '已拒绝这条命令，等你给别的方向。' : '已批准，继续往下做。';
      return `<div class="approval-card"><div class="ac-done">${ic(m.denied ? 'x' : 'check', 'xs')}${doneTxt}</div></div>`;
    }
    return '';
  }

  /* ============ 名册页 ============ */
  function renderRoster() {
    const n = Object.values(S.actors).filter(a => !a.nascent).length;
    return `<div class="roster">
      <div class="roster-head">
        <h1>Actor 名册</h1><span class="n">${n}</span>
        <label class="search">${ic('search')}<input id="rq" placeholder="找一个 Actor" value="${esc(S.q)}" aria-label="搜索 Actor"></label>
      </div>
      <p class="lead">Actor 在场景中长成。在 Space 里留下一个新起的 Actor，它就会出现在这里。</p>
      <div class="cards" id="cards"></div>
    </div>`;
  }
  function renderCards() {
    const el = $('cards');
    if (!el) return;
    const q = S.q.trim();
    const ids = Object.keys(S.actors).filter(id => {
      const a = S.actors[id];
      if (a.nascent) return false;
      return !q || (a.name + a.scene + a.abilities.join('')).includes(q);
    });
    el.innerHTML = ids.map(id => {
      const a = S.actors[id];
      return `<button type="button" class="card${S.freshCard === id ? ' fresh' : ''}" data-act="open-chat" data-id="${id}">
        <div class="top">${av(id, 56)}<div><div class="nm">${esc(a.name)}</div><div class="sc">${esc(a.scene)}</div></div></div>
        ${a.abilities.length ? `<div class="chips">${a.abilities.slice(0, 3).map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
        <div class="foot">${esc(a.last || '刚刚长成')} · 在 ${a.spaces || 1} 个 Space 里</div>
      </button>`;
    }).join('') || `<div class="none">没有找到「${esc(q)}」</div>`;
    S.freshCard = null;
  }

  /* ============ 一对一对话 ============ */
  function renderSoloChat() {
    const id = S.chatWith, a = actor(id);
    const msgs = S.chats[id] || [];
    const body = msgs.map(m => {
      if (m.k === 'user') return `<div class="user-msg">${esc(m.t)}</div>`;
      let inner;
      if (m.typing) inner = `<div class="typing"><i></i><i></i><i></i></div>`;
      else if (m.shown != null) inner = `<p>${esc(m.plain.slice(0, m.shown))}<span class="caret"></span></p>`;
      else inner = `<p>${esc(m.t)}</p>`;
      return `<div class="coord-msg">${inner}</div>`;
    }).join('');
    return `<div class="column">
      <div class="solo-intro">${av(id, 56)}<h2>${esc(a.name)}</h2><p>${esc(a.scene)}</p>
        ${a.abilities.length ? `<div class="chips" style="justify-content:center">${a.abilities.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
      </div>
      ${body}
    </div>`;
  }

  /* ============ 胶囊 ============ */
  function renderPills() {
    const c = cur();
    if (S.view !== 'space' || c.msgs.length === 0) { $('pills').innerHTML = ''; return; }
    const n = st => c.members.filter(m => m.status === st).length;
    const waitOthers = c.members.filter(m => m.status === 'wait' && m.id !== S.tab).length;
    const parts = [];
    if (waitOthers) parts.push(`<button type="button" class="pill warn" data-act="pill-wait" aria-pressed="${S.trayOpen}"><span class="dot wait"></span>${waitOthers} 等你决定</button>`);
    ['fail', 'run', 'result', 'idle'].forEach(st => { if (n(st)) parts.push(`<button type="button" class="pill" data-act="pill-other"><span class="dot ${st}"></span>${n(st)} ${STATUS[st]}</button>`); });
    $('pills').innerHTML = parts.join('');
  }

  /* ============ 审批托盘 ============ */
  // 正在看的那个 Actor 的审批已经在眼前，托盘里不再重复
  const trayList = () => pending().filter(m => m.id !== S.tab);
  function renderTray() {
    const list = S.view === 'space' ? trayList() : [];
    const open = S.trayOpen && list.length > 0;
    $('tray').classList.toggle('open', open);
    if (!open) { $('trayBody').innerHTML = ''; $('trayActs').innerHTML = ''; $('trayAv').innerHTML = ''; return; }
    S.trayIdx = Math.min(S.trayIdx, list.length - 1);
    const m = list[S.trayIdx];
    $('trayAv').innerHTML = av(m.id, 22);
    $('trayBody').innerHTML = `<div class="t1">${esc(nameOf(m.id))} 想运行一条命令</div><div class="t2">${esc(m.approval.cmd)}</div>`;
    $('trayActs').innerHTML = `
      ${list.length > 1 ? `<button type="button" class="btn nav" data-act="tray-prev" aria-label="上一个">${ic('left', 'xs')}</button><span class="pager">${S.trayIdx + 1}/${list.length}</span><button type="button" class="btn nav" data-act="tray-next" aria-label="下一个">${ic('right', 'xs')}</button>` : ''}
      <button type="button" class="btn ghost" data-act="tray-view" data-id="${m.id}">查看</button>
      <button type="button" class="btn" data-act="deny-agent" data-id="${m.id}">拒绝</button>
      <button type="button" class="btn primary" data-act="run-agent" data-id="${m.id}">运行</button>`;
  }

  /* ============ 右栏 ============ */
  function renderRight() {
    if (!S.rpOpen || S.view !== 'space') return;
    const c = cur();
    document.querySelectorAll('.rp-tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === S.rpTab));
    const idx = ['agents', 'lib', 'mem'].indexOf(S.rpTab);
    const btns = document.querySelectorAll('.rp-tab');
    const b = btns[idx];
    if (b) { const ind = $('segInd'); ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft - btns[0].offsetLeft}px)`; }

    if (S.rpTab === 'agents') {
      $('rpBody').innerHTML = ORDER.map(st => {
        const list = c.members.filter(m => m.status === st);
        if (!list.length) return '';
        const closed = !!S.collapsed[st];
        return `<div class="group${closed ? ' closed' : ''}" data-group="${st}">
          <button type="button" class="group-head" data-act="toggle-group" data-v="${st}" aria-expanded="${!closed}">
            <span class="chev">${ic('chev', 'xs')}</span><span>${STATUS[st]}</span><span class="n">${list.length}</span>
          </button>
          <div class="group-body"><div class="group-inner">${list.map(agentRow).join('')}</div></div>
        </div>`;
      }).join('') || `<div class="empty">${ic('users')}<div>这个 Space 还没有成员。</div></div>`;
    } else if (S.rpTab === 'lib') {
      const arts = c.library.filter(f => f.kind === 'artifact');
      const added = c.library.filter(f => f.kind === 'added');
      const row = f => `<button type="button" class="lrow" data-act="lib-open" data-id="${f.id}">
        <span class="ico">${ic(f.kind === 'artifact' ? 'file' : 'book')}</span>
        <span class="nm">${esc(f.name)}${f.src ? `<small>来自 ${esc(f.src)}</small>` : ''}</span>
        <span class="dt">${esc(f.date)}</span></button>`;
      $('rpBody').innerHTML = `
        <div class="lib-bar"><span class="grow" style="font-size:12px;color:var(--faint)">${c.library.length} 个文件</span><button type="button" class="btn ghost" data-act="lib-add">${ic('plus', 'xs')} 添加</button></div>
        ${arts.length ? `<div class="lib-folder">${ic('file', 'xs')} Actor 产出</div>${arts.map(row).join('')}` : ''}
        ${added.length ? `<div class="lib-folder">${ic('book', 'xs')} 你放进去的</div>${added.map(row).join('')}` : ''}
        ${c.library.length ? '' : `<div class="empty">${ic('lib')}<div>库还是空的。</div></div>`}
        <div class="hint">库就是 <code>spaces/&lt;id&gt;/library/</code> 这个真实目录。Actor 的产出写进 <code>artifacts/</code>，代码本身不会复制进来。</div>`;
    } else {
      const rows = c.memory.map(m => `<div class="mitem">
        <div class="body"><p>${esc(m.t)}</p><small>${esc(m.src)}</small></div>
        <div class="acts"><button type="button" class="ib" data-act="mem-forget" data-id="${m.id}" title="忘记">${ic('trash', 'xs')}</button></div>
      </div>`).join('');
      $('rpBody').innerHTML = `
        <div class="mem-sec">
          <h4>${ic('book', 'xs')} 指令 <small>每个 Actor 开工前都会读</small></h4>
          <div class="instr${c.instructions ? '' : ' empty'}">${c.instructions ? esc(c.instructions) : '还没写指令。'}</div>
          <div style="margin-top:8px"><button type="button" class="btn ghost" data-act="edit-instr">${ic('pencil', 'xs')} 编辑</button></div>
        </div>
        <div class="mem-sec">
          <h4>${ic('brain', 'xs')} Space 记忆 <small>${c.memory.length} 条</small></h4>
          <p class="desc">只有协调 Agent 会写。Actor 自己的记忆跟着 Actor 走，在它的标签页里看。</p>
          ${rows || `<div class="empty">${ic('brain')}<div>还没有记忆。</div></div>`}
        </div>`;
    }
  }

  // 一行：头像 + 名字 + 说明 + 待办进度（有 todo 时）+ 时间（有时）
  // 分组表示 Actor 现在的状态，说明表示它最近一件事
  function ring(done, total) {
    const C = 2 * Math.PI * 5;
    const off = C * (1 - (total ? done / total : 0));
    return `<svg class="ring" viewBox="0 0 13 13" aria-hidden="true"><circle class="bg" cx="6.5" cy="6.5" r="5"/><circle class="fg" cx="6.5" cy="6.5" r="5" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/></svg>`;
  }
  function describe(m) {
    if (m.status === 'wait' || m.status === 'fail') return { html: `<span>${esc(m.ask || '')}</span>`, txt: m.ask || '' };
    if (m.status === 'run') return { html: `<span>${esc(m.task)}</span>`, txt: m.task };
    if (m.status === 'result') return { html: `${ic('check', 'xs')}<span>${esc(m.task)}</span>`, txt: '完成：' + m.task };
    const t = m.note || (m.last ? '上次：' + m.last : '还没有任务');
    return { html: `<span>${esc(t)}</span>`, txt: t, faint: true };
  }
  function agentRow(m) {
    const d = describe(m);
    const showTodo = m.todo && (m.status === 'run' || m.status === 'wait' || m.status === 'result');
    return `<button type="button" class="arow${m.unread ? ' unread' : ''}" data-act="open-agent" data-id="${m.id}" data-row="${m.id}" aria-current="${S.tab === m.id}" title="${esc(nameOf(m.id) + ' · ' + d.txt)}">
      ${av(m.id, 22, { working: m.status === 'run' })}
      <span class="title">${esc(nameOf(m.id))}</span>
      <span class="sub${d.faint ? ' faint' : ''}">${d.html}</span>
      ${m.unread ? '<span class="unread-dot" aria-label="未读"></span>' : ''}
      ${showTodo ? `<span class="todo" title="待办 ${m.todo[0]}/${m.todo[1]}">${ring(m.todo[0], m.todo[1])}${m.todo[0]}/${m.todo[1]}</span>` : ''}
      ${m.time ? `<span class="time">${esc(m.time)}</span>` : ''}
    </button>`;
  }

  /* ============ 渲染总入口 ============ */
  function render() {
    const app = $('app');
    app.classList.toggle('rp-open', S.rpOpen && S.view === 'space');
    app.classList.toggle('solo', S.view !== 'space');
    app.classList.toggle('view-roster', S.view === 'roster');
    renderSidebar();
    renderTabs();
    renderFlow();
    renderPills();
    renderTray();
    renderRight();
    const ph = S.view === 'chat' ? `和${nameOf(S.chatWith)}说…` : S.tab === 'coord' ? '接下来做什么？' : `对${nameOf(S.tab)}说…`;
    $('input').placeholder = ph;
    document.querySelectorAll('.theme-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.theme));
  }

  /* ============ 动效：行在分组间平移 ============ */
  function captureRows() {
    const m = {};
    document.querySelectorAll('[data-row]').forEach(el => { m[el.dataset.row] = el.getBoundingClientRect().top; });
    return m;
  }
  function playRows(before, lit = []) {
    document.querySelectorAll('[data-row]').forEach(el => {
      const id = el.dataset.row;
      if (lit.includes(id)) el.classList.add('lit');
      if (before[id] == null) { el.classList.add('fresh'); return; }
      const dy = before[id] - el.getBoundingClientRect().top;
      if (!dy) return;
      el.classList.add('flip');
      el.style.transform = `translateY(${dy}px)`;
      requestAnimationFrame(() => { el.style.transform = ''; });
      el.addEventListener('transitionend', () => { el.classList.remove('flip'); el.style.transform = ''; }, { once: true });
    });
  }

  /* ============ 打字机 ============ */
  function streamReply(list, idx, onEnd) {
    const m = list[idx];
    if (!m) return;
    m.typing = false; m.shown = 0; m.plain = m.plain || m.t;
    clearInterval(S.timer);
    S.timer = setInterval(() => {
      const msg = list[idx];
      if (!msg || msg.shown == null) { clearInterval(S.timer); return; }
      msg.shown += 3;
      if (msg.shown >= msg.plain.length) { msg.shown = null; clearInterval(S.timer); onEnd && onEnd(msg); }
      S.stream = true;
      render();
    }, 26);
  }
  function scheduleApproval() {
    const sid = S.spaceId;
    setTimeout(() => {
      if (S.spaceId !== sid) return;
      const c = cur();
      const target = c.members.find(m => m.status === 'run' && !m.approval);
      if (!target) return;
      const before = captureRows();
      target.status = 'wait';
      target.ask = '想跑带覆盖率的测试'; target.time = '刚刚'; if (target.todo) target.todo[0] = 1;
      target.approval = { cmd: 'pnpm test --coverage', why: '需要跑带覆盖率的完整测试，耗时约 2 分钟，会写入 coverage/ 目录。' };
      target.transcript.push({ k: 'approval' });
      render();
      playRows(before);
      const pill = document.querySelector('.pill.warn');
      if (pill && !S.trayOpen) { pill.classList.add('flash'); setTimeout(() => pill.classList.remove('flash'), 1200); }
    }, 3600);
  }

  /* ============ 交互 ============ */
  function send() {
    const el = $('input');
    const text = el.value.trim();
    if (!text) return;
    el.value = ''; el.style.height = 'auto'; $('send').disabled = true;
    if (S.view === 'chat') return sendSolo(text);
    if (S.view !== 'space') return;
    const c = cur();
    c.msgs.push({ k: 'user', t: text });
    // 先找空闲的成熟 Actor；名册里没有合适的，就在这个 Space 里新起一个
    const idle = c.members.find(m => m.status === 'idle' && !actor(m.id).nascent);
    const nid = 'n' + rnd(5);
    S.actors[nid] = { name: '排查现有实现', nascent: true, growImg: 1 + Math.floor(Math.random() * 9), scene: '把现有实现摸清楚。', abilities: [] };
    const short = text.length > 16 ? text.slice(0, 16) + '…' : text;
    const t = idle
      ? `先让新起的 [[${nid}]] 摸清现有实现，[[${idle.id}]] 同步准备测试。`
      : `名册里没有合适的，新起了 [[${nid}]] 先摸清现有实现。`;
    c.msgs.push({ k: 'coord', t, plain: plainOf(t), typing: true });
    const idx = c.msgs.length - 1;
    S.tab = 'coord';
    render();
    const sid = c.id;
    setTimeout(() => {
      if (S.spaceId !== sid) return;
      streamReply(c.msgs, idx, () => {
        const before = captureRows();
        const lit = [nid];
        if (idle) {
          Object.assign(idle, { status: 'run', task: short, todo: [0, 3], time: '', note: null });
          idle.transcript.push({ k: 'task', t: short, at: '刚刚' }, { k: 'brief', t: '为「' + text + '」准备测试，等排查结论出来再补实现相关的用例。' }, { k: 'text', t: '开始了，先列要覆盖的场景。' });
          lit.push(idle.id);
        }
        c.members.unshift({ id: nid, status: 'run', task: '排查现有实现', todo: [0, 3], dir: c.dirs[0] || 'checkout-web', transcript: [
          { k: 'task', t: '排查现有实现', at: '刚刚' },
          { k: 'brief', t: text },
          { k: 'line', k1: '读取', t: 'src/' },
          { k: 'text', t: '开始了，有结论会交回协调 Agent。' }
        ] });
        render();
        playRows(before, lit);
        scheduleApproval();
      });
    }, 760);
  }
  function sendSolo(text) {
    const id = S.chatWith;
    const list = S.chats[id] = S.chats[id] || [];
    list.push({ k: 'user', t: text });
    list.push({ k: 'actor', t: '收到。这在我的场景里，我先看一下，有结论直接告诉你。', typing: true });
    const idx = list.length - 1;
    S.stream = true;
    render();
    setTimeout(() => { if (S.view === 'chat' && S.chatWith === id) streamReply(list, idx); }, 700);
  }

  function closeTab(id) {
    if (id === 'coord') return;
    const list = tabsOf(cur());
    const i = list.indexOf(id);
    if (i < 0) return;
    list.splice(i, 1);
    // 关掉当前标签：跳到左边那个，没有就回到协调 Agent
    if (S.tab === id) S.tab = list[i - 1] || 'coord';
    render();
  }
  function runAgent(id) {
    const m = member(id);
    if (!m || m.status !== 'wait') return;
    const before = captureRows();
    m.status = 'run'; m.ask = null; m.time = ''; m.denied = false;
    if (m.todo && m.todo[0] < m.todo[1]) m.todo[0]++;
    S.trayIdx = 0;
    if (trayList().length === 0) S.trayOpen = false;
    render();
    playRows(before);
    toast('已批准，' + nameOf(id) + ' 继续了');
  }
  function denyAgent(id) {
    const m = member(id);
    if (!m || m.status !== 'wait') return;
    const before = captureRows();
    m.status = 'idle'; m.last = m.task; m.note = '命令被拒绝，等你给方向'; m.time = '刚刚'; m.denied = true; m.ask = null;
    S.trayIdx = 0;
    if (trayList().length === 0) S.trayOpen = false;
    render();
    playRows(before);
    toast('已拒绝，' + nameOf(id) + ' 等你给别的方向');
  }
  function openAgentTab(id) {
    if (S.view !== 'space') return;
    const m = member(id);
    if (!m) return;
    m.unread = false;
    const list = tabsOf(cur());
    if (!list.includes(id)) list.push(id);
    S.tab = id;
    render();
    // 看过「有结果」之后，它滑到「空闲」
    if (m.status === 'result') {
      const sid = S.spaceId;
      setTimeout(() => {
        if (S.spaceId !== sid || m.status !== 'result') return;
        const before = captureRows();
        m.status = 'idle'; m.last = m.task; m.task = null;
        render();
        playRows(before);
      }, 1400);
    }
  }

  function keepActor(id, btn) {
    const c = cur();
    const msg = c.msgs.find(x => x.k === 'keep' && x.aid === id);
    const card = btn.closest('.keep');
    if (!msg || !card) return;
    card.classList.add('growing');
    setTimeout(() => {
      const a = actor(id);
      a.nascent = false; a.img = a.growImg; a.abilities = ['环境检查', '健康探测']; a.memN = 1; a.last = '刚刚长成'; a.spaces = 1;
      msg.state = 'kept';
      S.freshCard = id;
      render();
      document.querySelectorAll(`.rp [data-av="${id}"], .tabs [data-av="${id}"]`).forEach(el => el.classList.add('pop'));
      toast(a.name + ' 进入了名册');
    }, 950);
  }

  function openModal(html) {
    $('modalRoot').innerHTML = `<div class="scrim" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  }
  function closeModal() { $('modalRoot').innerHTML = ''; }

  function newSpaceModal() {
    const ids = Object.keys(S.actors).filter(id => !S.actors[id].nascent);
    openModal(`
      <h2>新建 Space <button type="button" class="ib" data-act="close-modal" aria-label="关闭">${ic('x')}</button></h2>
      <div class="field"><span class="lbl">名字</span><input class="input" id="nsName" placeholder="比如：支付链路提速"></div>
      <div class="field"><span class="lbl">要解决的问题</span><input class="input" id="nsGoal" placeholder="一句话，比如：把 checkout 的 p75 降到 200ms 以内"></div>
      <div class="field"><span class="lbl">成员 <small>从名册里选，之后也能加</small></span>
        <div class="pick-crew">${ids.map((id, i) => `<button type="button" data-act="pick-crew" data-id="${id}" aria-pressed="${i < 2}">${av(id, 22)}${esc(nameOf(id))}</button>`).join('')}</div>
      </div>
      <div class="field"><span class="lbl">相关目录 <small>选填</small></span><input class="input" id="nsDirs" placeholder="payments-api, checkout-web"></div>
      <div class="modal-foot">
        <button type="button" class="btn" data-act="close-modal">取消</button>
        <button type="button" class="btn primary" data-act="create-space">创建</button>
      </div>`);
    setTimeout(() => $('nsName')?.focus(), 40);
  }

  function helpModal() {
    openModal(`
      <h2>这是什么 <button type="button" class="ib" data-act="close-modal" aria-label="关闭">${ic('x')}</button></h2>
      <p style="margin:0;font-size:13px;line-height:1.65;color:var(--muted)">Space 把几个 Actor 聚在一起解决一个问题。你只和协调 Agent 说话，它把事交给合适的 Actor；每个 Actor 在中间开成一个标签页。</p>
      <ol class="steps">
        <li>在输入框发一句话，协调 Agent 会交给<b>空闲的 Actor</b>；名册里没有合适的，就<b>新起一个</b>（小球头像，头部写着「归属 Space」）。</li>
        <li>右栏被交到事的那一行会<b>亮一下</b>，头像外出现翡翠绿光环：工作中。</li>
        <li>几秒后有 Actor 要跑命令，<b>琥珀色胶囊</b>亮起。点它展开托盘，就地运行或拒绝。</li>
        <li>点右栏「有结果」里的<b>性能分析</b>，看过之后它会滑到「空闲」。</li>
        <li>协调 Agent 问要不要留下「环境巡检」，点<b>留下</b>，看它长成。</li>
        <li>左栏「Actor 名册」看所有 Actor；「结算页重构」是刚建好、还没开始的 Space。</li>
      </ol>
      <div class="modal-foot"><button type="button" class="btn primary" data-act="close-modal">知道了</button></div>`);
  }

  /* ============ 事件 ============ */
  document.addEventListener('click', e => {
    // 点菜单外面就收起
    if (S.tabMenu && !e.target.closest('#tabMenu, #tabMore')) { S.tabMenu = false; updateTabOverflow(); }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
    if (t.classList.contains('scrim') && e.target !== t) return;
    switch (act) {
      case 'pick-space': if (S.view === 'space' && S.spaceId === id) break; switchSpace(id); S.view = 'space'; S.trayOpen = false; S.trayIdx = 0; $('app').classList.remove('sb-open'); render(); break;
      case 'go-roster': S.view = 'roster'; S.trayOpen = false; $('app').classList.remove('sb-open'); render(); break;
      case 'open-chat':
        S.view = 'chat'; S.chatWith = id; S.chats[id] = S.chats[id] || [];
        S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 3);
        $('app').classList.remove('sb-open');
        render(); $('input').focus(); break;
      case 'pick-tab': S.tab = id; render(); break;
      case 'close-tab': e.stopPropagation(); closeTab(id); break;
      case 'tab-more': S.tabMenu = !S.tabMenu; updateTabOverflow(); break;
      case 'tm-pick': S.tabMenu = false; S.tab = id; render(); break;
      case 'tm-close': closeTab(id); break;
      case 'tm-close-others': cur().openTabs = S.tab === 'coord' ? [] : [S.tab]; S.tabMenu = false; render(); break;
      case 'open-agent': openAgentTab(id); break;
      case 'toggle-rp': S.rpOpen = !S.rpOpen; render(); break;
      case 'open-sb': $('app').classList.add('sb-open'); break;
      case 'back-main': $('app').classList.remove('sb-open'); break;
      case 'rp-tab': S.rpTab = v; renderRight(); break;
      case 'toggle-group': {
        const g = t.closest('.group');
        S.collapsed[v] = !S.collapsed[v];
        g.classList.toggle('closed', S.collapsed[v]);
        t.setAttribute('aria-expanded', String(!S.collapsed[v]));
        break;
      }
      case 'pill-wait': S.trayOpen = !S.trayOpen; renderTray(); renderPills(); break;
      case 'pill-other': S.rpOpen = true; S.rpTab = 'agents'; render(); break;
      case 'tray-prev': S.trayIdx = (S.trayIdx - 1 + trayList().length) % trayList().length; renderTray(); break;
      case 'tray-next': S.trayIdx = (S.trayIdx + 1) % trayList().length; renderTray(); break;
      case 'tray-view': S.trayOpen = false; openAgentTab(id); break;
      case 'run-agent': runAgent(id); break;
      case 'deny-agent': denyAgent(id); break;
      case 'keep-actor': keepActor(id, t); break;
      case 'decline-actor': {
        const m = cur().msgs.find(x => x.k === 'keep' && x.aid === id);
        if (m) m.state = 'declined';
        render();
        break;
      }
      case 'undo-mem': {
        const c = cur();
        const m = c.msgs.find(x => x.k === 'mem' && x.mid === id);
        if (m) m.undone = true;
        c.memory = c.memory.filter(x => x.id !== id);
        render();
        toast('撤销了这条记忆');
        break;
      }
      case 'mem-forget': {
        const c = cur();
        c.memory = c.memory.filter(x => x.id !== id);
        renderRight();
        toast('已忘记');
        break;
      }
      case 'send': send(); break;
      case 'new-space': newSpaceModal(); break;
      case 'pick-crew': t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')); break;
      case 'new-chat': toast('演示里只做 Space 和 Actor，普通会话不展开'); break;
      case 'noop-chat': toast('演示里普通会话不展开'); break;
      case 'search': toast('演示里省略搜索'); break;
      case 'lib-add': toast('演示里省略：从磁盘添加文件'); break;
      case 'lib-open': toast('演示里省略：预览文件'); break;
      case 'edit-instr': toast('演示里省略：编辑指令'); break;
      case 'help': helpModal(); break;
      case 'close-modal': case 'create-space':
        if (act === 'create-space') {
          const name = ($('nsName')?.value || '').trim() || '未命名 Space';
          const goal = ($('nsGoal')?.value || '').trim();
          const dirs = ($('nsDirs')?.value || '').split(/[,，\s]+/).filter(Boolean);
          const crew = [...document.querySelectorAll('[data-act="pick-crew"][aria-pressed="true"]')].map(b => b.dataset.id);
          const nid = 'sp' + rnd(5);
          S.spaces.push({ id: nid, name, goal, img: SPACE_COLORS[S.spaces.length % SPACE_COLORS.length], dirs, instructions: '',
            members: crew.map(aid => ({ id: aid, status: 'idle', dir: dirs[0] || 'checkout-web', transcript: [] })),
            msgs: [], memory: [], library: [] });
          switchSpace(nid); S.view = 'space'; S.trayOpen = false;
          toast('创建了「' + name + '」');
        }
        closeModal();
        render();
        break;
      case 'theme': {
        S.theme = v;
        const root = document.documentElement;
        if (v === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v);
        try { localStorage.setItem('space-demo-theme', v); } catch (_) {}
        render();
        break;
      }
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'input') {
      const el = e.target;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
      $('send').disabled = !el.value.trim();
    }
    if (e.target.id === 'rq') { S.q = e.target.value; renderCards(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'input' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    if (e.key === 'Escape') { closeModal(); $('app').classList.remove('sb-open'); if (S.tabMenu) { S.tabMenu = false; updateTabOverflow(); } }
  });

  /* ============ 星空：生成两层星点 ============ */
  (function stars() {
    let s = 7;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const layer = (n, tile, size) => Array.from({ length: n }, () => {
      const d = (size * (0.5 + r())).toFixed(1);
      return `radial-gradient(${d}px ${d}px at ${Math.round(r() * tile)}px ${Math.round(r() * tile)}px, rgba(238,241,255,${(0.35 + r() * 0.6).toFixed(2)}), transparent)`;
    }).join(',');
    const st = document.createElement('style');
    st.textContent = `.sky::before{background-image:${layer(42, 520, 1.6)};background-size:520px 520px}
      .sky::after{background-image:${layer(16, 760, 2.6)};background-size:760px 760px}`;
    document.head.appendChild(st);
  })();

  /* ============ 启动 ============ */
  try {
    const saved = localStorage.getItem('space-demo-theme');
    if (saved === 'light' || saved === 'dark') { S.theme = saved; document.documentElement.setAttribute('data-theme', saved); }
  } catch (_) {}
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('space')) S.spaceId = h.get('space');
  if (h.get('tab')) { S.tab = h.get('tab'); cur().openTabs = h.get('tab').split(','); S.tab = cur().openTabs.at(-1); }
  if (h.get('tray')) S.trayOpen = true;
  if (h.get('rp')) S.rpTab = h.get('rp');
  if (h.get('view')) S.view = h.get('view');
  if (h.get('chat')) { S.view = 'chat'; S.chatWith = h.get('chat'); S.recent = [S.chatWith]; }
  if (h.get('theme')) { S.theme = h.get('theme'); document.documentElement.setAttribute('data-theme', S.theme); }
  render();
  $('send').disabled = true;
  window.addEventListener('resize', () => { if (S.rpOpen && S.rpTab) renderRight(); });
  // 标签栏变宽变窄（窗口缩放、右栏开合）时，重新判断放不放得下，并让当前标签留在视野里
  new ResizeObserver(() => { revealTab(S.tab); updateTabOverflow(); }).observe($('tabs'));
  // 标签栏：滚轮横向滚动，不显示滚动条
  $('tabs').addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    $('tabs').scrollLeft += e.deltaY;
  }, { passive: false });
  $('tabs').addEventListener('scroll', () => updateTabOverflow());
  window.__S = S;
})();
</script>
</html>
