<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件页 Demo</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --subtle: #f1f1ef; --sidebar: #efefed;
  --selected: #e4e4e1; --hover: #eaeae7; --border: #deded9; --border-strong: #8c8c85;
  --text: #20201e; --muted: #676762; --faint: #72726b; --subtle-text: #85857e;
  --ok: #087a4b; --ok-soft: #e5f2ea; --warn: #91600e; --warn-soft: #f7eedb;
  --toggle-on: #10a36b;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: "SFMono-Regular", "JetBrains Mono", Menlo, monospace;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
}
:root[data-theme="dark"] {
  --bg: #181916; --surface: #242522; --subtle: #292a26; --sidebar: #1e1f1c;
  --selected: #30312d; --hover: #2a2b27; --border: #353630; --border-strong: #6d6d66;
  --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle-text: #787870;
  --ok: #36c783; --ok-soft: #173328; --warn: #e0b45a; --warn-soft: #3a2f17;
  --toggle-on: #2fb87c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.demo-bar { position: sticky; top: 0; z-index: 5; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.demo-bar .title { font-weight: 600; margin-right: 8px; }
.seg { display: inline-flex; background: var(--subtle); border-radius: var(--r-md); padding: 2px; }
.seg button { padding: 4px 12px; border-radius: var(--r-sm); color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.demo-bar .hint { color: var(--faint); margin-left: auto; font-size: 12px; }

.page { max-width: 920px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 22px; }
@media (max-width: 600px) { .page { padding: 20px 16px 48px; } .demo-bar .hint { display: none; } }

.search { height: 40px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--subtle); padding: 0 14px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; }
.search svg { width: 15px; height: 15px; color: var(--faint); }
.tabs { display: flex; gap: 8px; }
.tabs button { height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.tabs button.on { border-color: var(--border-strong); background: var(--selected); color: var(--text); font-weight: 500; }

.summary { color: var(--faint); font-size: 12px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group-head { display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
.group-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.group-head .count { color: var(--faint); font-size: 12px; }
.group-head p { margin: 0; color: var(--faint); font-size: 12px; }
.group-desc { margin: -4px 4px 2px; color: var(--faint); font-size: 12px; }

.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.sub { padding: 10px 14px 4px; font-size: 11.5px; color: var(--subtle-text); font-family: var(--mono); }
.row { display: flex; align-items: center; gap: 14px; padding: 11px 14px; }
.row + .row, .sub + .row { border-top: 1px solid var(--border); }
.list .sub:not(:first-child) { border-top: 1px solid var(--border); }
.row .main { flex: 1; min-width: 0; }
.row .name { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.row .desc { color: var(--faint); font-size: 12px; margin-top: 1px; }
.dir { font-family: var(--mono); font-size: 11px; color: var(--subtle-text); background: var(--subtle); border-radius: 999px; padding: 1px 8px; font-weight: 400; }
.badge { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.pending { font-size: 11.5px; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }

.toggle { width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; flex-shrink: 0; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle.on { background: var(--toggle-on); }
.toggle.on::after { transform: translateX(16px); }

.detail { margin: 0 14px 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--subtle); color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
.detail .line { display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.btn { height: 28px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); width: fit-content; }

/* 方案 B：可关的放最上面，内置的折叠 */
.optional-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.fold { display: flex; align-items: center; gap: 8px; padding: 11px 14px; width: 100%; text-align: left; color: var(--muted); }
.fold:hover { background: var(--hover); }
.fold svg { width: 14px; height: 14px; transition: transform .15s; }
.fold.open svg { transform: rotate(90deg); }
.empty { padding: 40px 0; text-align: center; color: var(--faint); }
</style>
</head>
<body>
<div class="demo-bar">
  <span class="title">插件页</span>
  <div class="seg" id="variant">
    <button data-v="A" class="on">方案 A 两组平铺</button>
    <button data-v="B">方案 B 可关的在上</button>
  </div>
  <div class="seg" id="theme">
    <button data-t="light" class="on">浅色</button>
    <button data-t="dark">深色</button>
  </div>
  <span class="hint">点开关试试“重启后生效”和展开的设置</span>
</div>

<main class="page">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜索插件…" aria-label="搜索插件">
  </label>
  <div class="tabs" role="tablist"><button class="on">插件</button><button>Skills</button><button>MCP</button></div>
  <div id="root"></div>
</main>

<script>
const G = [
  ["actspace-runtime","运行时底座","启动 ActSpace、装配插件、管理生命周期","core"],
  ["session-journal","会话日志","把会话里发生的事按类型记成日志","session"],
  ["session-persistence","会话持久化","读写会话日志的统一接口","session"],
  ["session-jsonl","会话文件存储","把会话保存为本机的 JSONL 文件","session"],
  ["session-projection","会话视图","把日志整理成界面和 Agent 能读的状态","session"],
  ["session-runtime","会话运行时","新建、恢复和归档会话","core"],
  ["session-checkpoint-policy","检查点","决定什么时候给会话存检查点","session"],
  ["llm-service","模型服务","连接模型提供商并转发请求","llm"],
  ["todo-projection","待办视图","把 Agent 的待办整理给界面显示","todo"],
  ["core-agent","Agent 注册表","管理 Agent 与子 Agent 的身份","core"],
  ["agent-runtime","Agent 运行时","为每个会话挂载 Harness 并运行","core"],
  ["desktop-app","桌面接线","桌面端的会话与界面接口","host"],
  ["side-chat","侧边对话","不打断主对话，在旁边提问","side-chat"],
  ["english-learning","英语学习","双语回答、生词与朗读","english-learning", true],
];
const S = [
  ["agent-factory","Agent 循环","每一轮调用模型和工具的主循环","core"],
  ["tools-runtime","工具运行时","注册工具、执行并记录结果","core"],
  ["tools-approval","审批","危险操作前先征求你的同意","approval"],
  ["auto-review","自动审批","用模型判断低风险操作能否直接放行","approval"],
  ["sandbox","沙箱","限制命令能访问的文件和网络","sandbox"],
  ["sandbox-seatbelt","沙箱：Seatbelt","macOS 上的沙箱实现","sandbox"],
  ["sandbox-nono","沙箱：nono","跨平台的沙箱实现","sandbox"],
  ["context-engine","上下文引擎","组装每一轮发给模型的上下文","context"],
  ["prompt-runtime","提示词","系统提示词的模板与渲染","context"],
  ["context-system","系统说明","把 ActSpace 的基本说明放进上下文","context"],
  ["context-rules","规则","把 AGENTS.md 等规则文件放进上下文","context"],
  ["context-skills","Skill 目录","告诉 Agent 有哪些 Skill 可用","context"],
  ["context-runtime","运行环境","告诉 Agent 时间、系统和工作区","context"],
  ["context-conversation","对话历史","把之前的对话放进上下文","context"],
  ["context-tools","工具说明","告诉 Agent 每个工具怎么用","context"],
  ["context-background-tasks","后台任务状态","把正在运行的后台任务告诉 Agent","context"],
  ["context-disclosure","上下文披露","按需把工作区路径和文件摘要告诉 Agent","context"],
  ["compaction-runtime","上下文压缩","上下文快满时压缩较早的历史","context"],
  ["filesystem-read","读文件","读取工作区里的文件","fs"],
  ["filesystem-search","搜索文件","按文件名和内容搜索工作区","fs"],
  ["filesystem-write","写文件","新建和修改工作区里的文件","fs"],
  ["shell-tools","命令行","运行 Bash 命令","shell"],
  ["background-tasks","后台任务","让命令在后台运行并查看输出","background-tasks"],
  ["web-tools","网页","搜索网页、读取网页内容","web"],
  ["image-generation","生成图片","按描述生成图片","image"],
  ["image-inspection","看图片","让 Agent 看懂图片内容","image"],
  ["todo-tools","待办","拆分任务并跟踪进度","todo"],
  ["subagent-tools","子 Agent","把任务交给子 Agent 去做","subagent"],
  ["plugin-manager","插件开发","帮 Agent 编写和安装插件","harness-evolution"],
  ["browser-tools","操控浏览器","通过 Chrome 扩展操作网页","browser", true],
];
// loaded = 本次启动的状态；enabled = 设置里的值
const state = { "english-learning": { loaded: false, enabled: false }, "browser-tools": { loaded: true, enabled: true } };
let variant = "A", query = "", builtinOpen = { global: false, session: false };

const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function detail(id) {
  if (id === "browser-tools") return `<div class="detail"><div class="line"><span class="dot"></span>Chrome 扩展已连接 · 2 个标签页</div><button class="btn">打开扩展管理</button></div>`;
  return `<div class="detail"><div class="line">目标会话：全部会话 · 朗读声音：Minimax 女声</div><button class="btn">配置语音</button></div>`;
}
function row([id, title, desc, dir, can]) {
  let right;
  if (can) {
    const s = state[id];
    const pend = s.enabled !== s.loaded ? `<span class="pending">${s.enabled ? "重启后开启" : "重启后关闭"}</span>` : "";
    right = `${pend}<button class="toggle ${s.enabled ? "on" : ""}" role="switch" aria-checked="${s.enabled}" aria-label="${title}" data-id="${id}"></button>`;
  } else right = `<span class="badge">内置</span>`;
  const extra = can && state[id].loaded && state[id].enabled ? detail(id) : "";
  return `<div class="row"><div class="main"><div class="name">${esc(title)}<span class="dir">${dir}/</span></div><div class="desc">${esc(desc)}</div></div>${right}</div>${extra}`;
}
const match = r => !query || (r[1] + r[2] + r[3] + r[0]).toLowerCase().includes(query);
function groupA(key, name, desc, rows) {
  const list = rows.filter(match);
  if (!list.length) return "";
  return `<section class="group"><div class="group-head"><h2>${name}</h2><span class="count">${list.length}</span></div><p class="group-desc">${desc}</p><div class="list">${list.map(row).join("")}</div></section>`;
}
function groupB(key, name, desc, rows) {
  const list = rows.filter(match);
  if (!list.length) return "";
  const opt = list.filter(r => r[4]), builtin = list.filter(r => !r[4]);
  const open = query || builtinOpen[key];
  return `<section class="group"><div class="group-head"><h2>${name}</h2><span class="count">${list.length}</span></div><p class="group-desc">${desc}</p>
    <div class="list">${opt.map(row).join("")}
    <button class="fold ${open ? "open" : ""}" data-fold="${key}" ${opt.length ? 'style="border-top:1px solid var(--border)"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>内置插件 ${builtin.length} 个，不能关闭</button>
    ${open ? builtin.map(row).join("").replace(/^<div class="row">/, '<div class="row" style="border-top:1px solid var(--border)">') : ""}</div></section>`;
}
function render() {
  const g = variant === "A" ? groupA : groupB;
  const html = g("global", "全局插件", "ActSpace 启动时加载，所有会话共用。", G) + g("session", "会话插件", "每个会话里加载一份，决定 Agent 能做什么。", S);
  const n = G.filter(match).length + S.filter(match).length;
  document.getElementById("root").innerHTML = `<p class="summary">插件 · ${n}</p><div style="display:flex;flex-direction:column;gap:26px;margin-top:10px">${html || '<p class="empty">没有找到匹配的插件。</p>'}</div>`;
}
document.getElementById("root").addEventListener("click", e => {
  const t = e.target.closest("[data-id]"); if (t) { state[t.dataset.id].enabled = !state[t.dataset.id].enabled; render(); return; }
  const f = e.target.closest("[data-fold]"); if (f) { builtinOpen[f.dataset.fold] = !builtinOpen[f.dataset.fold]; render(); }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
document.getElementById("variant").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; variant = b.dataset.v; for (const x of e.currentTarget.children) x.classList.toggle("on", x === b); render(); });
document.getElementById("theme").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; document.documentElement.dataset.theme = b.dataset.t; for (const x of e.currentTarget.children) x.classList.toggle("on", x === b); });
render();
</script>
</body>
</html>
