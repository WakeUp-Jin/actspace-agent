/* ================= Helpers ================= */
function host(u) { try { return new URL(u).host; } catch { return u; } }
function ago(t) {
  const m = Math.round((Date.now() - t) / MIN);
  if (m < 1) return "刚刚";
  if (m < 60) return `${m} 分钟前`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} 小时前` : `${Math.round(h / 24)} 天前`;
}
function tile(c, lg) {
  const src = c.mark && MARKS[c.mark];
  const inner = src ? `<img${MONO_MARKS.includes(c.mark) ? ' class="mono"' : ""} alt="" src="${src}">` : ic("plug", lg ? 18 : 16);
  return `<span class="tile${lg ? " lg" : ""}">${inner}</span>`;
}
function endpoint(url, proto) {
  const base = (url || "").trim().replace(/\/+$/, "");
  if (!base) return "";
  if (proto === "anthropic-messages") return base + (/\/v1$/.test(base) ? "/messages" : "/v1/messages");
  return base + (proto === "openai-responses" ? "/responses" : "/chat/completions");
}
/* 粘贴完整请求地址时剥掉接口后缀、据此定协议——只发生这一次；之后协议以用户的选择为准。 */
function recognize(url) {
  const rules = [
    [/\/v1\/messages\/?$/, "anthropic-messages", "/v1/messages"], [/\/messages\/?$/, "anthropic-messages", "/messages"],
    [/\/chat\/completions\/?$/, "openai-completions", "/chat/completions"], [/\/responses\/?$/, "openai-responses", "/responses"],
  ];
  for (const [re, proto, suffix] of rules) if (re.test(url)) return { url: url.replace(re, ""), proto, suffix };
  return null;
}

    let resolved = null;
    if (x.proto === "anthropic-messages" && bearer) {

    if (list && x.cat === "custom" && /nomodels/i.test(x.url)) return res({ ok: true, resolved, nolist: true });
    const c = cat(x.cat);
    res({ ok: true, resolved, models: x.cat === "custom" ? RELAY_MODELS[x.proto].map((id) => M(id, "")) : [...c.models, ...c.extra] });

function applyProbe(x, r) {

  x.status = "run"; render();

async function runFetch(x) {

  if (need) { x.need = need; S.focusK = need; return render(); }
  x.fetch = { state: "run" }; render();
  const r = await probe(x, true);
  applyProbe(x, r);
  if (!r.ok) x.fetch = { state: "fail" };
  else if (r.nolist) x.fetch = { state: "nolist" };

  <div class="page-head">${tile(c, true)}<div class="grow"><h2 class="sm">${esc(x.name)}</h2><p>${custom ? `<span>${PROTO[x.proto]}</span><span class="sep">·</span><span>${esc(host(x.url))}</span><span class="sep">·</span>` : ""}${statusHtml(x, true)}</p></div>
    <button class="btn" type="button" data-act="test" ${x.status === "run" ? "disabled" : ""}>测试连接</button></div>
  ${x.status === "err" ? `<div class="res fail banner">${ic("alert")}<div><b>${esc(x.err)}</b><p>${esc(x.hint || "")}</p>${x.fix === "bearer" ? '<button class="btn" type="button" data-act="fixBearer">改用 Bearer 重试</button>' : ""}</div></div>` : ""}
  ${modelsSection(x)}
  <section class="section"><div class="section-head"><div><h3>连接</h3></div></div><div class="group">
    ${r("key", `<div class="row"><div class="label"><div class="t">API Key</div></div><div class="ctl"><span class="val mono">${esc(x.keyMask)}</span><button class="btn" type="button" data-act="edit" data-arg="key">更换</button></div></div>`)}
    ${r("url", `<div class="row"><div class="label"><div class="t">地址</div>${urlD}</div><div class="ctl">${!custom && x.url !== c.url ? '<button class="btn quiet" type="button" data-act="resetUrl">恢复官方</button>' : ""}<button class="btn" type="button" data-act="edit" data-arg="url">编辑</button></div></div>`)}
    ${custom ? `<div class="row"><div class="label"><div class="t">协议</div></div><div class="ctl">${selHtml("proto", x.proto, Object.entries(PROTO), "协议")}</div></div>` : ""}
    ${authRow(x)}
    <div class="row"><div class="label"><div class="t">代理</div>${x.proxy ? `<div class="d mono">${esc(x.proxyUrl || "未填代理地址")}</div>` : ""}</div><div class="ctl">${x.proxy ? '<button class="btn" type="button" data-act="edit" data-arg="proxyUrl">编辑</button>' : ""}${tg(x.proxy, "proxy", "", "代理")}</div></div>
    ${S.edit === "proxyUrl" ? editorRow("proxyUrl", x) : ""}
    ${custom ? r("name", `<div class="row"><div class="label"><div class="t">名称</div></div><div class="ctl"><span class="val">${esc(x.name)}</span><button class="btn" type="button" data-act="edit" data-arg="name">编辑</button></div></div>`) : ""}
  </div></section>
  <section class="section"><div class="section-head"><div><h3>计费</h3></div></div><div class="group">${billingRows(x)}</div></section>
  <section class="section"><div class="group"><div class="row"><div class="label"><div class="t">删除连接</div><div class="d">用到它的会话需要换一个模型。</div></div><div class="ctl"><button class="btn danger" type="button" data-act="del">删除</button></div></div></div></section>`;
}

function dialogHtml() {
  if (S.dlg !== "del") return "";
  const x = curConn();
  return `<div class="scrim" data-act="dlgBg"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">删除「${esc(x.name)}」？</h3><p>Key 会从本机删掉。用到这条连接的会话，下次发消息前需要换一个模型。</p>
    <div class="btns"><button class="btn" type="button" data-act="dlgNo">取消</button><button class="btn danger-fill" type="button" data-act="delOk">删除</button></div></div></div>`;
}

function render() {
  const a = document.activeElement;
  const fk = S.focusK || (a && a.dataset ? a.dataset.k : null);
  const pos = a && typeof a.selectionStart === "number" && !S.focusK ? a.selectionStart : null;
  S.focusK = null;
  const page = S.route === "pick" ? pickPage() : S.route === "new" ? newPage() : S.route === "conn" ? connPage() : listPage();
  document.getElementById("main").innerHTML = `<div class="page">${page}</div>`;
  document.getElementById("dlg").innerHTML = dialogHtml();
  if (fk) {
    const el = document.querySelector(`[data-k="${fk}"]`);
    if (el) { el.focus({ preventScroll: true }); if (pos !== null) try { el.setSelectionRange(pos, pos); } catch {} }
  }
}

/* ================= Actions ================= */
const target = () => (S.route === "new" ? S.d : curConn());
function go(r) {
  S.edit = null; S.dlg = null;
  if (r.startsWith("conn:")) { S.route = "conn"; S.id = r.slice(5); }
  else { S.route = r; if (r === "pick") { S.q = ""; S.focusK = "q"; } }
  render(); window.scrollTo(0, 0);
}
function pick(cid) {
  const has = cid !== "custom" && connOf(cid);
  /* 同一家服务商只能有一把 Key：已经连过就直接去它的详情页。 */
  if (has) { go("conn:" + has.id); return toast(`已经连过 ${cat(cid).label}，要换 Key 在这里点「更换」`); }
  const c = cat(cid), custom = cid === "custom";
  S.d = { cat: cid, name: "", key: "", keyShow: false, url: custom ? "" : c.url, proto: custom ? "anthropic-messages" : c.proto, auth: "auto",
    models: custom ? [] : c.models.map((m) => ({ ...m, on: true })), fetch: { state: "idle" }, status: "idle",
    more: false, billing: "reference", mult: custom ? 0.3 : 1, proxy: false, proxyUrl: "", need: null, recog: null, addId: "" };
  S.route = "new"; S.focusK = custom ? "url" : "key";
  render(); window.scrollTo(0, 0);
}
function save() {
  const d = S.d;
  if (saveBlock(d)) return;
  const conn = {
    id: "c" + Date.now(), cat: d.cat, name: d.name.trim() || (d.cat === "custom" ? host(d.url) : cat(d.cat).label),
    keyMask: mask(d.key.trim()), key: d.key.trim(), url: d.url.trim(), proto: d.proto, auth: d.auth, resolved: d.resolved,
    models: d.models.map(({ id, label, on, manual }) => ({ id, label, on, manual })), fetch: { state: "idle" },
    status: d.status === "run" ? "idle" : d.status, err: d.err, hint: d.hint, fix: d.fix, checked: d.checked,
    billing: d.billing, mult: d.mult, proxy: d.proxy, proxyUrl: d.proxyUrl,
  };
  S.conns.push(conn); S.d = null;
  go("list");
  if (conn.status === "ok") toast(`已连接 ${conn.name}，${onModels(conn).length} 个模型可以在输入框里选了`);
  else if (conn.status === "err") toast(`已保存 ${conn.name}，但连接测试没通过，用之前记得回来改`);
  else { toast(`已保存 ${conn.name}，正在后台测试连接…`); conn.status = "run"; render(); probe(conn, false).then((r) => { applyProbe(conn, r); render(); if (!r.ok) toast(`${conn.name} 连接测试没通过：${r.err}`); }); }
}
function addModel(x) {
  const id = (x.addId || "").trim();
  if (!id) return;
  const hit = x.models.find((m) => m.id === id);
  if (hit) hit.on = true; else x.models.push({ id, label: "", on: true, manual: true });
  x.addId = ""; S.focusK = "addId"; render();
}
/* 详情页：改了地址 / Key / 协议 / 认证 / 代理之后自动重测一次。 */
function changed(x) { stale(x); if (S.route === "conn") runTest(x); else render(); }
function editSave() {
  const x = curConn(), v = S.editVal.trim(), kind = S.edit;
  if (!v && kind !== "name") return;
  S.edit = null;
  if (kind === "key") { x.key = v; x.keyMask = mask(v); x.needsBearer = /bearer/i.test(v); return changed(x); }
  if (kind === "url") { const r = recognize(v); x.url = r ? r.url : v; if (r && x.cat === "custom") x.proto = r.proto; return changed(x); }
  if (kind === "proxyUrl") { x.proxyUrl = v; return changed(x); }
  x.name = v || host(x.url); render();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if ((act === "dlgBg") && e.target !== el) return;
  if (el.tagName === "A") e.preventDefault();
  const x = target();
  switch (act) {
    case "noop": return toast("Demo：这里会在浏览器里打开服务商的 Key 页面");
    case "nav": return toast("Demo 只做了「模型」这一页");
    case "theme": S.theme = arg; return applyTheme();
    case "go": return go(arg);
    case "pick": return pick(arg);
    case "save": return save();
    case "del": S.dlg = "del"; return render();
    case "dlgNo": case "dlgBg": S.dlg = null; return render();
    case "delOk": { const n = curConn().name; S.conns = S.conns.filter((c) => c.id !== S.id); S.dlg = null; go("list"); return toast(`已删除 ${n}`); }
    case "edit": S.edit = arg; S.editVal = arg === "key" ? "" : arg === "url" ? x.url : arg === "proxyUrl" ? x.proxyUrl : x.name; S.focusK = "editVal"; return render();
    case "editCancel": S.edit = null; return render();
    case "editSave": return editSave();
  }
  if (!x) return;
  switch (act) {
    case "eye": x.keyShow = !x.keyShow; S.focusK = "key"; break;
    case "more": x.more = !x.more; break;
    case "proto": if (x.proto !== arg) { x.proto = arg; x.recog = null; stale(x); } break;
    case "resetUrl": x.url = cat(x.cat).url; return changed(x);
    case "proxy": x.proxy = !x.proxy; if (S.route === "conn") { if (x.proxy && !x.proxyUrl) { S.edit = "proxyUrl"; S.editVal = ""; S.focusK = "editVal"; break; } return changed(x); } stale(x); if (x.proxy) S.focusK = "proxyUrl"; break;
    case "mult": { const i = MULT.indexOf(x.mult) + Number(arg); if (MULT[i] !== undefined) x.mult = MULT[i]; break; }
    case "togModel": { const m = x.models[+arg]; m.on = !m.on; break; }
    case "top": { const [m] = x.models.splice(+arg, 1); x.models.unshift(m); if (S.route === "conn") toast(`新会话默认用 ${m.label || m.id}`); break; }
    case "rmModel": x.models.splice(+arg, 1); break;
    case "addModel": return addModel(x);
    case "fetch": return runFetch(x);
    case "test": return runTest(x);
    case "fixBearer": x.auth = "bearer"; stale(x); return runTest(x);
    default: return;
  }
  render();
});

document.addEventListener("change", (e) => {
  const k = e.target.dataset && e.target.dataset.ch;
  if (!k) return;
  const x = target();
  x[k] = e.target.value;
  if (k === "auth" || k === "proto") return changed(x);
  render();
});

document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  const v = e.target.value;
  if (k === "q") { S.q = v; return render(); }
  if (k === "editVal") { S.editVal = v; return render(); }
  const x = target();
  if (k === "url" && x.cat === "custom") {
    const r = recognize(v.trim());
    if (r) { x.url = r.url; x.proto = r.proto; x.recog = r.suffix; stale(x); S.focusK = "url"; return render(); }
    x.recog = null;
  }
  x[k] = v;
  if (k === "key" || k === "url" || k === "proxyUrl") { x.need = null; stale(x); }
  render();
});

document.addEventListener("keydown", (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (e.key === "Enter" && k === "addId") { e.preventDefault(); return addModel(target()); }
  if (e.key === "Enter" && k === "editVal") { e.preventDefault(); return editSave(); }
  if (e.key === "Enter" && k === "q") { const first = document.querySelector('[data-act="pick"]'); if (first) pick(first.dataset.arg); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("more-row")) { e.preventDefault(); return e.target.click(); }
  if (e.key === "Escape") { if (S.dlg) { S.dlg = null; return render(); } if (S.edit) { S.edit = null; return render(); } }
});

/* ================= Theme ================= */
function applyTheme() {
  if (S.theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = S.theme;
  document.querySelectorAll('[data-act="theme"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.arg === S.theme)));
}
document.getElementById("ver").innerHTML = `<div class="seg" role="group" aria-label="主题">${[["auto", "跟随系统"], ["light", "浅色"], ["dark", "深色"]].map(([v, l]) => `<button type="button" data-act="theme" data-arg="${v}" aria-pressed="${v === S.theme}">${l}</button>`).join("")}</div>`;

render();
setInterval(() => { if (S.route === "list" || (S.route === "conn" && !S.edit)) { if (!document.activeElement || !document.activeElement.dataset.k) render(); } }, 30e3);
</script>
