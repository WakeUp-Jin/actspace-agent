<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>压缩精灵 Demo</title>
<style>
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --bg: #f7f7f5; --surface: #ffffff; --surface-subtle: #f1f1ef; --selected: #e4e4e1;
  --line: #deded9; --line-soft: #e9e9e5; --line-strong: #8c8c85;
  --text: #20201e; --muted: #676762; --faint: #72726b;
  --operational: #087a4b; --danger-soft: #f8e9e9; --on-danger: #a93a3a;
  --lavender: #a397d4; --lavender-eye: #20201e;
  --divider: color-mix(in srgb, var(--line-strong) 40%, var(--line));
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
:root[data-theme="dark"] {
  --bg: #181916; --surface: #242522; --surface-subtle: #292a26; --selected: #30312d;
  --line: #353630; --line-soft: #2e2f2a; --line-strong: #787870;
  --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f;
  --operational: #36c783; --danger-soft: #452525; --on-danger: #f08a8a;
  --lavender: #b9aef0; --lavender-eye: #181916;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
}
:root { --sp: var(--lavender); --sp-eye: var(--lavender-eye); --push: .8s; }
:root[data-sp="ink"] { --sp: var(--muted); --sp-eye: var(--bg); }
:root[data-sp="green"] { --sp: var(--operational); --sp-eye: var(--bg); }
:root[data-push="fast"] { --push: .6s; }
:root[data-push="slow"] { --push: 1.1s; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
code { font-size: 13px; }

.bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0 4px 0 0; font-size: 13px; font-weight: 600; }
.grp { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface-subtle); border: 1px solid var(--line); }
.seg button { padding: 2px 9px; border-radius: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--selected); }

.page { max-width: 1100px; margin: 0 auto; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 16px; }
.intro { color: var(--muted); font-size: 12.5px; margin: 0; }
.zoom2 .body { zoom: 2; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.panel header { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
.panel header b { font-size: 13.5px; font-weight: 600; }
.panel header .tag { margin-left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 11px; color: var(--muted); background: var(--surface-subtle); }
.panel header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.body { padding: 14px 20px 16px; background: var(--bg); }
.u { margin: 0 0 10px auto; width: fit-content; max-width: 86%; padding: 7px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; }
.a { font-size: 14px; line-height: 22px; margin: 0 0 6px; }
.notes { margin: 0; padding: 10px 16px 12px 32px; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); }
.notes li { margin: 2px 0; }

/* ===== 分隔线行 ===== */
.cd { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 8px 0; font-size: 12px; line-height: 16px; color: var(--faint); font-variant-numeric: tabular-nums; }
.cd .mid { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
.cd .ttl { font-weight: 500; color: var(--muted); }
.cd .ln { flex: 1; min-width: 24px; height: 1px; background: var(--divider); }
.cd .link { color: var(--muted); }
.cd.failed, .cd.failed .ttl { color: var(--on-danger); }
.cd.failed .ln { background: var(--danger-soft); }
.cd .retry { font-weight: 600; color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.fade-in { animation: fadeIn .35s ease both; }
@keyframes fadeIn { from { opacity: 0; } }

/* ===== 丝滑版：纯 CSS transform ===== */
.ps { position: relative; flex: 1; min-width: 96px; height: 16px; overflow: hidden; --dur: 90s; --ease: cubic-bezier(.2,.75,.3,1); }
.ps .rail { position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: var(--divider); }
.ps .wall { position: absolute; left: 0; bottom: 2px; width: 2px; height: 12px; background: var(--line-strong); z-index: 3; }
.ps .pile { position: absolute; left: 2px; bottom: 2px; width: 4px; height: 6px; background: var(--muted); z-index: 3; transform-origin: left center;
  animation: ps-pile var(--dur) var(--ease) var(--delay, 0s) forwards; }
@keyframes ps-pile { to { transform: scaleX(3); } }
.ps .mover { position: absolute; inset: 0; will-change: transform;
  animation: ps-travel var(--dur) var(--ease) var(--delay, 0s) forwards; }
@keyframes ps-travel { to { transform: translateX(calc(-100% + 60px)); } }
/* 消息块：一条带缝的长条，用 mask 画出长短不一的块，颜色走 token */
.ps .strip { position: absolute; left: 0; right: 24px; bottom: 2px; height: 6px; background: var(--line-strong); opacity: .6;
  -webkit-mask: var(--bricks) right center / 120px 6px repeat-x; mask: var(--bricks) right center / 120px 6px repeat-x; }
.ps .spr { position: absolute; right: 0; bottom: 2px; width: 24px; height: 14px; z-index: 2; transform-origin: 0 100%;
  animation: ps-push var(--push) ease-in-out infinite; }
.ps .spr svg { display: block; shape-rendering: crispEdges; }
.ps .spr .b { fill: var(--sp); } .ps .spr .e { fill: var(--sp-eye); }
.ps .eyes { transform-box: fill-box; transform-origin: center; animation: ps-blink 4.6s ease-in-out infinite; }
.ps .dust { position: absolute; right: -4px; bottom: 0; width: 2px; height: 2px; background: var(--line-strong); opacity: 0;
  animation: ps-dust var(--push) ease-out infinite; }
@keyframes ps-push {
  0%, 100% { transform: translateX(0) scale(1, 1); }
  45% { transform: translateX(-2px) scale(1.1, .86); }
  62% { transform: translateX(-2px) scale(1.05, .93); }
}
@keyframes ps-blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
@keyframes ps-dust { 0%, 40% { opacity: 0; transform: translate(0, 0); } 50% { opacity: .7; } 100% { opacity: 0; transform: translate(5px, -4px); } }
.ps.paused * { animation-play-state: paused !important; }
.failed .ps .spr .b { fill: var(--on-danger); } .failed .ps .spr .e { fill: var(--danger-soft); }
.failed .ps .strip, .failed .ps .pile, .failed .ps .wall { background: var(--on-danger); opacity: .35; }
.failed .ps .rail { background: var(--danger-soft); }
@media (prefers-reduced-motion: reduce) {
  .ps .spr, .ps .eyes, .ps .dust { animation: none; }
}

/* ===== 上一版：逐格（JS 重画 SVG） ===== */
.stage { flex: 1; min-width: 60px; height: 16px; position: relative; }
.stage svg { position: absolute; inset: 0; display: block; shape-rendering: crispEdges; }
svg .b { fill: var(--sp); } svg .e { fill: var(--sp-eye); }
svg .k0 { fill: var(--line-strong); opacity: .45; } svg .k1 { fill: var(--line-strong); opacity: .7; }
svg .c0 { fill: var(--muted); } svg .c1 { fill: var(--muted); opacity: .7; }
svg .tr { fill: var(--line-strong); opacity: .35; } svg .du { fill: var(--line-strong); opacity: .5; }
svg .wall { fill: var(--line-strong); opacity: .5; }
.failed svg .b { fill: var(--on-danger); } .failed svg .e { fill: var(--danger-soft); }
.failed svg .k0, .failed svg .k1, .failed svg .c0, .failed svg .c1 { fill: var(--on-danger); opacity: .35; }
svg.icon { position: static; }

/* 测性能用的单行页 */
.bench .bar, .bench .intro { display: none; }
</style>
</head>
<body>
<div class="bar">
  <h1>压缩 · 乙 推到墙角</h1>
  <div class="grp">状态 <div class="seg" data-k="state">
    <button data-v="play" aria-pressed="true">完整播放 ▶</button>
    <button data-v="running">一直进行中</button>
    <button data-v="resume">中途切回会话</button>
    <button data-v="history">历史会话</button>
    <button data-v="failed">失败</button>
  </div></div>
  <div class="grp">压缩耗时 <div class="seg" data-k="dur">
    <button data-v="8">8s</button><button data-v="20" aria-pressed="true">20s</button><button data-v="45">45s</button>
  </div></div>
  <div class="grp">推的节奏 <div class="seg" data-k="push">
    <button data-v="fast">快</button><button data-v="normal" aria-pressed="true">中</button><button data-v="slow">慢</button>
  </div></div>
  <div class="grp">精灵 <div class="seg" data-k="sp">
    <button data-v="lavender" aria-pressed="true">品牌紫</button><button data-v="ink">墨色</button><button data-v="green">运行绿</button>
  </div></div>
  <div class="grp">主题 <div class="seg" data-k="theme">
    <button data-v="light" aria-pressed="true">浅</button><button data-v="dark">深</button>
  </div></div>
  <div class="grp">放大 <div class="seg" data-k="zoom">
    <button data-v="1" aria-pressed="true">1×</button><button data-v="2">2×</button>
  </div></div>
</div>

<div class="page" id="page">
  <p class="intro">选定：乙 · 逐格。下面的连续滑动版只留作对照。</p>
  <div id="list" style="display:flex;flex-direction:column;gap:16px"></div>
</div>

<script>
const P = 2;
const SPR = {
  stand: ["....XXXXX...","..XXXXXXXXX.",".XXXXXXXXXXX","XXXXXXXXXXXX","XXEEXEEXXXXX","XXXXXXXXXXXX",".XXXX.XXXXX."],
  push:  ["............","..XXXXXX....","XXXXXXXXXX..","XXXXXXXXXXX.","XEEXEEXXXXXX","XXXXXXXXXXXX",".XXXX.XXXXX."],
  melt:  ["............","............","....XXXX....","..XXXXXXXX..",".XXXXXXXXXX.","XXXEEXXEEXXX","XXXXXXXXXXXX"],
  happy: ["....XXXX....","..XXXXXXXX..",".XXXXXXXXXX.","XXXXXXXXXXXX","XXXEEXXEEXXX","XXXXXXXXXXXX",".XXXX..XXXX."],
};

// ---------- 丝滑版 ----------
// 消息块的 mask：120×6 的一段，块宽不一，重复铺满。
const BRICKS = (() => {
  let x = 0, r = "", s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  while (x < 116) { const w = Math.min(4 + Math.floor(rnd() * 14), 118 - x); r += `<rect x='${x}' y='0' width='${w}' height='6'/>`; x += w + 2; }
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='6'>${r}</svg>`)}")`;
})();
document.documentElement.style.setProperty("--bricks", BRICKS);

function spriteSVG(name) {
  let b = "", e = "";
  SPR[name].forEach((row, j) => [...row].forEach((c, i) => {
    if (c === "X") b += `<rect class="b" x="${i}" y="${j}" width="1" height="1"/>`;
    if (c === "E") e += `<rect class="e" x="${i}" y="${j}" width="1" height="1"/>`;
  }));
  return `<svg viewBox="0 0 12 7" width="24" height="14">${b}<g class="eyes">${e}</g></svg>`;
}
function smoothStage(sprite = "stand", delay = 0) {
  return `<span class="ps" style="--delay:${-delay}s"><span class="rail"></span><span class="wall"></span><span class="pile"></span>
    <span class="mover"><span class="strip"></span><span class="spr">${spriteSVG(sprite)}<span class="dust"></span></span></span></span>`;
}
/** 完成：从当前位置一口气推到底 → 精灵跳一下淡出 → 换成完成行。只在这一刻跑几百毫秒 JS。 */
function finishSmooth(ps, onDone) {
  const mover = ps.querySelector(".mover"), pile = ps.querySelector(".pile"), spr = ps.querySelector(".spr");
  const W = ps.clientWidth;
  for (const el of [mover, pile]) { const cur = getComputedStyle(el).transform; el.style.animation = "none"; el.style.transform = cur; }
  const pileEnd = 2 + 4 * 3.6;
  mover.animate([{ transform: mover.style.transform }, { transform: `translateX(${-(W - pileEnd - 24)}px)` }], { duration: 420, easing: "cubic-bezier(.55,0,.25,1)", fill: "forwards" });
  pile.animate([{ transform: pile.style.transform }, { transform: "scaleX(3.6)" }], { duration: 420, easing: "cubic-bezier(.55,0,.25,1)", fill: "forwards" });
  setTimeout(() => {
    spr.style.animation = "none";
    spr.innerHTML = spriteSVG("happy");
    spr.animate([
      { transform: "translateY(0)", opacity: 1 },
      { transform: "translateY(-4px)", opacity: 1, offset: .25 },
      { transform: "translateY(0)", opacity: 1, offset: .5 },
      { transform: "translateY(0)", opacity: 0 },
    ], { duration: 700, easing: "ease-out", fill: "forwards" }).finished.then(onDone);
  }, 440);
}

// ---------- 上一版：逐格 ----------
const SW = 12, ROWS = 8, BAR_Y = 4, BAR_H = 3, PACK = ["XXXXXX", "X....X", "XXXXXX"];
function bricks(seed, total) {
  let s = seed, out = [], sum = 0; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  while (true) { const w = 2 + Math.floor(rnd() * 7); if (sum + w + (out.length ? 1 : 0) > total) break; sum += w + (out.length ? 1 : 0); out.push(w); }
  return out;
}
function layout(ws, L) {
  const n = ws.length; let E = Math.max(0, ws.reduce((a, b) => a + b, 0) + n - 1 - L);
  const gaps = Array(n - 1).fill(1), w = ws.slice();
  for (let i = 0; i < n - 1 && E > 0; i++) { gaps[i] = 0; E--; }
  for (let i = 0; i < n && E > 0; i++) { const d = Math.min(w[i] - 1, E); w[i] -= d; E -= d; }
  const segs = []; let x = 0;
  for (let i = 0; i < n; i++) {
    const sq = w[i] < ws[i] || (i > 0 && gaps[i - 1] === 0) || (i < n - 1 && gaps[i] === 0);
    segs.push({ x, w: w[i], cls: (sq ? "c" : "k") + (i % 2) }); x += w[i] + (i < n - 1 ? gaps[i] : 0);
  }
  return segs;
}
class Stepper {
  constructor(el, tau) {
    this.el = el; this.tau = tau; this.U = Math.max(30, Math.floor(el.clientWidth / P));
    this.ws = bricks(31, this.U - 2 - SW - 1);
    this.L0 = this.ws.reduce((a, b) => a + b, 0) + this.ws.length - 1; this.Lmin = this.ws.length;
    this.L = this.L0; this.f = 0; this.sprite = "stand"; this.mode = "run"; this.hop = 0; this.dust = 0;
  }
  tick(t) {
    if (this.mode === "run") {
      this.f ^= 1; this.sprite = this.f ? "push" : "stand"; this.dust = 0;
      if (this.f && this.L > this.Lmin + (this.L0 - this.Lmin) * Math.exp(-t / this.tau)) { this.L--; this.dust = 1; }
    } else if (this.mode === "finish") {
      this.sprite = "push"; this.dust = 1;
      if (this.L > 6) this.L = Math.max(6, this.L - Math.max(2, Math.ceil((this.L - 6) / 3))); else { this.mode = "hop"; this.h = 0; }
    } else if (this.mode === "hop") {
      this.sprite = "happy"; this.dust = 0; this.h++; this.hop = this.h === 1 ? -2 : this.h === 2 ? -1 : 0; if (this.h > 5) this.mode = "gone";
    }
    this.draw();
  }
  draw(failed = false) {
    let r = "";
    for (let y = 1; y < ROWS - 1; y++) r += `<rect class="wall" x="0" y="${y}" width="1" height="1"/>`;
    const packed = this.mode === "hop" || this.mode === "gone";
    if (packed) PACK.forEach((row, j) => [...row].forEach((c, i) => { if (c === "X") r += `<rect class="c0" x="${2 + i}" y="${BAR_Y + j}" width="1" height="1"/>`; }));
    else for (const s of layout(this.ws, this.L)) r += `<rect class="${s.cls}" x="${2 + s.x}" y="${BAR_Y}" width="${s.w}" height="${BAR_H}"/>`;
    const sx = 2 + (packed ? 6 : this.L) + (this.sprite === "push" ? 0 : 1);
    for (let x = sx + SW + 2; x < this.U; x += 3) r += `<rect class="tr" x="${x}" y="${BAR_Y + 1}" width="1" height="1"/>`;
    if (this.dust) r += `<rect class="du" x="${sx + SW + 1}" y="${ROWS - 2}" width="1" height="1"/>`;
    if (this.mode !== "gone") SPR[failed ? "melt" : this.sprite].forEach((row, j) => [...row].forEach((c, i) => {
      if (c !== ".") r += `<rect class="${c === "X" ? "b" : "e"}" x="${sx + i}" y="${j + this.hop}" width="1" height="1"/>`;
    }));
    this.el.innerHTML = `<svg viewBox="0 0 ${this.U} ${ROWS}" width="${this.U * P}" height="${ROWS * P}">${r}</svg>`;
  }
}

// ---------- 文案 ----------
const PACK_ICON = (() => {
  let r = ""; ["XXXXXX","X....X","XXXXXX","X....X","XXXXXX"].forEach((row, j) => [...row].forEach((c, i) => { if (c === "X") r += `<rect class="c0" x="${i}" y="${j}" width="1" height="1"/>`; }));
  return `<svg class="icon" viewBox="0 0 6 5" width="12" height="10" style="shape-rendering:crispEdges">${r}</svg>`;
})();
const DONE = `<div class="cd fade-in"><span class="ln"></span><span class="mid">${PACK_ICON}<span class="ttl">以上 38 条消息已压缩</span><span>182K → 约 9.1K tokens · 23s</span><span>·</span><span class="link">在轨迹中查看 ›</span></span><span class="ln"></span></div>`;
const RUN_LABEL = `<span class="mid"><span class="ttl">正在压缩上下文</span><span class="tm">0s</span></span>`;
const FAIL_LABEL = `<span class="mid"><span class="ttl">上下文压缩失败</span><span>请求超时</span><span class="retry">重试</span></span>`;

const PANELS = [
  { name: "乙 · 连续滑动", tag: "不采用", desc: "连续滑动 + 挤压式推动，像普通进度条，没有一挤一压的节奏。",
    notes: ["进度：90s 的缓出曲线，前 10 秒推走一半，之后越来越慢；永远推不到底，留一截等真正完成。", "「中途切回会话」：用负的 animation-delay 直接跳到对应位置，不会从头再推一遍。", "失败：动画原地停住，变红，精灵瘫下。"] },
  { name: "乙 · 逐格", tag: "选定", desc: "一挤、一动、一压：精灵顶一下，靠墙那头的消息挤紧变深，整条短一格。", notes: ["节奏 0.32s 一拍；前面推得快，越往后越推不动。", "完成时一口气压成小方块，精灵跳一下离场。"] },
];

const S = { state: "play", dur: 20 };
let timers = [];
function clearAll() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; }
function panelHTML(p, i) {
  return `<section class="panel" style="order:${i === 1 ? -1 : 0}"><header><b>${p.name}</b><span class="tag">${p.tag}</span><p>${p.desc}</p></header>
    <div class="body"><div class="u">把 web 端的报价缓存改成按地区失效</div>
    <p class="a">改好了 <code>quote-cache.ts</code>，失效键加上了地区前缀；顺手补了两条测试，都过了。</p>
    <div class="slot" data-i="${i}"></div></div><ul class="notes">${p.notes.map(n => `<li>${n}</li>`).join("")}</ul></section>`;
}

function start() {
  clearAll();
  document.getElementById("list").innerHTML = PANELS.map(panelHTML).join("");
  const [smooth, step] = document.querySelectorAll(".slot");
  if (S.state === "history") { smooth.innerHTML = step.innerHTML = DONE.replace(" fade-in", ""); return; }
  const failed = S.state === "failed";
  const offset = S.state === "resume" ? 12 : failed ? 9 : 0;

  smooth.innerHTML = `<div class="cd ${failed ? "failed" : ""}">${smoothStage(failed ? "melt" : "stand", offset)}${failed ? FAIL_LABEL : RUN_LABEL}</div>`;
  if (failed) smooth.querySelector(".ps").classList.add("paused");
  step.innerHTML = `<div class="cd ${failed ? "failed" : ""}"><span class="stage"></span>${failed ? FAIL_LABEL : RUN_LABEL}</div>`;
  const st = new Stepper(step.querySelector(".stage"), S.dur * 0.6);
  if (failed) { st.L = Math.round(st.L0 * .55); st.draw(true); return; }
  st.draw();

  const t0 = performance.now() - offset * 1000;
  const sec = () => (performance.now() - t0) / 1000;
  const tm = setInterval(() => document.querySelectorAll(".tm").forEach(e => e.textContent = Math.floor(sec()) + "s"), 250);
  const stepIv = setInterval(() => st.tick(sec()), 320);
  timers.push(tm, stepIv);
  if (S.state !== "play") return;

  timers.push(setTimeout(() => {
    clearInterval(tm); clearInterval(stepIv);
    finishSmooth(smooth.querySelector(".ps"), () => { smooth.innerHTML = DONE; });
    st.mode = "finish";
    const iv = setInterval(() => { st.tick(0); if (st.mode === "gone") { clearInterval(iv); setTimeout(() => step.innerHTML = DONE, 150); } }, 70);
    timers.push(iv, setTimeout(() => { if (S.state === "play") start(); }, 4500));
  }, S.dur * 1000));
}

// 性能测量用：?bench=smooth|step|a1|none 只渲染一行进行中
const bench = new URLSearchParams(location.search).get("bench");
if (bench) {
  document.body.classList.add("bench");
  const list = document.getElementById("list");
  const A1 = `<style>.sp1{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);border-top-color:transparent;animation:s1 1s linear infinite}@keyframes s1{to{transform:rotate(360deg)}}
    .sw .ln{position:relative;overflow:hidden}.sw .ln::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--operational),transparent);animation:sw 1.6s ease-in-out infinite}@keyframes sw{from{transform:translateX(-100%)}to{transform:translateX(260%)}}</style>
    <div class="cd sw"><span class="ln"></span><span class="mid"><span class="sp1"></span><span class="ttl">正在压缩上下文</span><span class="tm">0s</span></span><span class="ln"></span></div>`;
  list.innerHTML = bench === "smooth" ? `<div class="cd">${smoothStage()}${RUN_LABEL}</div>`
    : bench === "step" ? `<div class="cd"><span class="stage"></span>${RUN_LABEL}</div>` : bench === "a1" ? A1 : RUN_LABEL;
  const t0 = performance.now();
  setInterval(() => document.querySelectorAll(".tm").forEach(e => e.textContent = Math.floor((performance.now() - t0) / 1000) + "s"), 1000);
  if (bench === "step") { const st = new Stepper(list.querySelector(".stage"), 12); st.draw(); setInterval(() => st.tick((performance.now() - t0) / 1000), 320); }
} else {
  document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const k = seg.dataset.k, v = b.dataset.v, root = document.documentElement;
    if (k === "state") { S.state = v; start(); }
    else if (k === "dur") { S.dur = +v; start(); }
    else if (k === "push") root.dataset.push = v;
    else if (k === "theme") root.dataset.theme = v;
    else if (k === "sp") root.dataset.sp = v;
    else if (k === "zoom") { document.getElementById("page").classList.toggle("zoom2", v === "2"); start(); }
  }));
  addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(start, 200); });
  start();
}
</script>
