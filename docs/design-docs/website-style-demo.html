tlLWxpbmVjYXA9InJvdW5kIi8+CiAgPHJlY3QgeD0iOTA4IiB5PSIzNDYiIHdpZHRoPSIxNjgiIGhlaWdodD0iMTI2IiByeD0iMTgiIGZpbGw9IiMxYjFjMTkiLz4KICA8cGF0aCBkPSJNOTUyIDM4OEgxMDM0TTk1MiA0MTZIMTAxNE05NTIgNDQ0SDEwNDAiIHN0cm9rZT0iI2ZmZmVmYSIgc3Ryb2tlLXdpZHRoPSI4IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KICA8dGV4dCB4PSIxNjQiIHk9IjY0MiIgZmlsbD0iIzFiMWMxOSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjM0IiBmb250LXdlaWdodD0iNzAwIiBsZXR0ZXItc3BhY2luZz0iMiI+QUNUU1BBQ0UgLyBDT05URVhUIDAxPC90ZXh0Pgo8L3N2Zz4K","body":"\u003cp>做 Agent 产品时，最容易被低估的不是模型，也不是工具，而是两者之间那层持续变化的 Context。\u003c/p>\n\u003cp>我们经常把它叫作“提示词”，仿佛它只是后台的一大段文本。但一旦 Agent 开始读取仓库、调用 Bash、等待审批、使用 Browser、压缩历史，这个称呼就不再准确。它实际上是一套运行时界面：决定哪些事实可见、哪些能力可用，以及模型如何理解刚刚发生的事情。\u003c/p>\n\u003ch2>看不见的 Context 会制造什么问题\u003c/h2>\n\u003cp>如果用户只能看到最终回复，那么很多故障会变得难以区分：\u003c/p>\n\u003cul>\n\u003cli>模型不知道某条规则，还是知道但没有遵守？\u003c/li>\n\u003cli>工具没有进入本轮 Context，还是模型选择了不调用？\u003c/li>\n\u003cli>历史被压缩后丢失了目标，还是 provider 本身出现了退化？\u003c/li>\n\u003cli>Token 突然上升，是附件、工具 schema，还是重复的工具输出？\u003c/li>\n\u003c/ul>\n\u003cp>这些问题不能只靠“再改一版 prompt”解决。首先要让运行输入成为可观察的对象。\u003c/p>\n\u003ch2>Context 是每次调用前构建出来的\u003c/h2>\n\u003cp>在 ActSpace 中，Context 不是某个模块持有的长字符串。每次模型调用前，Runtime 都会根据当前 session 和 Turn 重新组装：\u003c/p>\n\u003col>\n\u003cli>系统规则、人格和项目级 \u003ccode>AGENTS.md\u003c/code>。\u003c/li>\n\u003cli>已持久化的会话事件。\u003c/li>\n\u003cli>当前对模型可见的工具定义。\u003c/li>\n\u003cli>附件、图片与工具 observation。\u003c/li>\n\u003cli>用户这一次刚刚提交的输入。\u003c/li>\n\u003c/ol>\n\u003cp>这种方式有一个很实际的好处：Context 查看器可以复用相同的 producer，而不是另写一套“看起来差不多”的解释逻辑。\u003c/p>\n\u003ch2>可见性也是产品控制面\u003c/h2>\n\u003cp>不是所有工具都需要永久出现在模型面前。\u003c/p>\n\u003cp>以 Browser 为例，普通编码任务如果每轮都附上完整浏览器命令，会占用 Token，也会增加误调用概率。因此 ActSpace 在新 Turn 中只暴露一个入口；当模型确认确实需要网页操作后，下一次请求才展开完整工具组。\u003c/p>\n\u003cp>这不是单纯的性能优化。它把“当前有哪些能力”变成了可以按场景控制的产品决策。\u003c/p>\n\u003ch2>为缓存安排稳定顺序\u003c/h2>\n\u003cp>Context 还影响成本。支持 prompt caching 的模型会从稳定前缀中获益，所以我们尽量把变化慢、复用高的规则放在前面，把当前时间、工具结果和最新用户输入放在后面。\u003c/p>\n\u003cp>排序不能为了缓存而破坏语义，但在语义等价的前提下，稳定性本身就是 Harness 应该维护的性质。\u003c/p>\n\u003cp>ActSpace 会把 input、output、cache read 和费用记录到每轮用量中。缓存不再是 provider 控制台里的一个抽象百分比，而是能和具体会话、具体 Turn 对上的运行事实。\u003c/p>\n\u003ch2>压缩不是把旧内容变短\u003c/h2>\n\u003cp>长会话最终会接近模型的上下文窗口。最粗糙的做法是把旧消息全部总结一次，但这很容易丢掉约束、文件路径、失败原因和用户已经确认的选择。\u003c/p>\n\u003cp>更可靠的压缩应保留后续执行真正依赖的状态：\u003c/p>\n\u003cul>\n\u003cli>目标和完成标准。\u003c/li>\n\u003cli>已经做过的修改与验证结果。\u003c/li>\n\u003cli>仍未解决的风险。\u003c/li>\n\u003cli>关键工具输出与证据来源。\u003c/li>\n\u003cli>用户明确否决或批准的方向。\u003c/li>\n\u003c/ul>\n\u003cp>工具输出也需要单独治理。只留下摘要可能把一个关键报错稀释掉；完整保留又会快速吞掉窗口。ActSpace 的方向是保留可识别的原始前缀，再追加结构化摘要。\u003c/p>\n\u003ch2>把 Context 当成界面之后\u003c/h2>\n\u003cp>一旦 Context 被当成界面，许多工程取舍会自然变得清楚：\u003c/p>\n\u003cul>\n\u003cli>它需要稳定的数据来源，而不是散落的字符串拼接。\u003c/li>\n\u003cli>它需要可视化与检查入口。\u003c/li>\n\u003cli>它的变化需要和 Turn、工具状态一起被观测。\u003c/li>\n\u003cli>它需要测试，尤其是压缩、恢复和能力披露边界。\u003c/li>\n\u003cli>它也需要设计：层级、命名和成本反馈都会影响用户是否信任 Agent。\u003c/li>\n\u003c/ul>\n\u003cp>模型的能力仍然重要。但在真实产品里，模型每一次能否做对事情，往往取决于我们有没有给它一个清楚、准确、可控制的运行空间。\u003c/p>"},{"title":"ActSpace评估模块的设计思路","slug":"actspace-agent-evaluation","description":"在构建Agent的时候，我们首先会更多从感觉出发，或者说从经验出发","date":"2026-07-19","tag":"Agent Evaluation","group":"工程实践","excerpt":true,"minutes":2,"cover":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDcyMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIGRlc2MiPgogIDx0aXRsZSBpZD0idGl0bGUiPkFjdFNwYWNlIEFnZW50IGV2YWx1YXRpb24gc3lzdGVtPC90aXRsZT4KICA8ZGVzYyBpZD0iZGVzYyI+5pWw5o2u6ZuG44CB6L+Q6KGM6L2o6L+544CB6K+E5YiG5Zmo5ZKM5Z+657q/5oql5ZGK57uE5oiQ6Zet546v6K+E5Lyw57O757ufPC9kZXNjPgogIDxyZWN0IHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjcyMCIgZmlsbD0iI2VhZGJkOSIvPgogIDxwYXRoIGQ9Ik0wIDU1MkMxODAgNDc4IDM3NiA1MzAgNTQ4IDQzOEM3MzIgMzM4IDkzMiAyNTAgMTIwMCAzMDRWNzIwSDBaIiBmaWxsPSIjZDZiZGI4Ii8+CiAgPGNpcmNsZSBjeD0iNjAwIiBjeT0iMzQ0IiByPSIyMzAiIGZpbGw9IiNmZmZkZjgiIHN0cm9rZT0iIzI1MjIyMiIgc3Ryb2tlLXdpZHRoPSI0Ii8+CiAgPGNpcmNsZSBjeD0iNjAwIiBjeT0iMzQ0IiByPSIxMTIiIGZpbGw9IiNjODc5NzAiIHN0cm9rZT0iIzI1MjIyMiIgc3Ryb2tlLXdpZHRoPSI0Ii8+CiAgPHBhdGggZD0iTTU0OCAzNDRMNTg0 构建的经验不一定适用你目前的情况\u003c/p>\n\u003cp>主要的问题在于：我们不知道当前的Agent到底差在哪里，没法去量化Agent执行的细节\u003c/p>\n\u003cp>\u003cstrong>依靠感觉和经验可以让你走起来，但是要走的更远，我们需要一个构建优化的“理由”\u003c/strong>\u003c/p>\n\u003cp>我们可以把思绪拉到Agent评估上面，从现有的数据中构建出来自己的评估数据集，使用公开的数据集进行测试，然后观察执行链路的问题，根据实际执行环境去评估上下文的质量。\u003c/p>\n\u003cp>Agent评估可以帮助我们确定Agent开发方向，同时也可以提供有力的数据给我们，让每一次构建可以更果决\u003c/p>\n\u003cp>一个好用的Agent背后，一定是存在一个合格的Agent评估模块的。\u003c/p>\n\u003cp>我目前正在构建ActSpace这个桌面端Agent，它的Agent评估模块的设计思路我整理出来，希望可以给大家提供一些参考\u003c/p>\n\u003cp>调研分析资料：\u003c/p>\n\u003cul>\n\u003cli>\n\u003cp>《Agent评估体系的构建》：https://mp.weixin.qq.com/s/3VqbQzT9ruRVP9B4jlFAEg\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>《SWE-bench Lite》：https://www.swebench.com/lite.html\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>《ActSpace代码库》：https://github.com/WakeUp-Jin/actspace-agent\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>《Excalidraw文件》：ActSpace评估模块的设计.excalidraw\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch2>一、ActSpace的Agent评估模块设计\u003c/h2>\n\u003cp>我们先从这个模块的输入开始理解吧，这样可能会更容易一些，我设计的这个评估模块总共有三种输入核心：行为评估数据集、内部数据集、外部公开数据集\u003c/p>"},{"title":"多智能体的协作方式-Agent Team和Agent Room","slug":"agent-team-and-agent-room","description":"最近在实践多智能体的设计方式，也准备考虑给ActSpace添加多智能体的功能，主要是多智能体如果设计得当的话，是可以在提高效果的同时节省成本的，这对于很多做应用的团队来说，成本的控制是可以带来极好的用户体验的，我觉得这也是Harness Enginneering的概念之一","date":"2026-07-15","tag":"Multi-Agent","group":"产品思考","excerpt":true,"minutes":2,"cover":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDcyMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIGRlc2MiPgogIDx0aXRsZSBpZD0idGl0bGUiPkFnZW50IFRlYW0gYW5kIEFnZW50IFJvb208L3RpdGxlPgogIDxkZXNjIGlkPSJkZXNjIj7lt6bkvqfmoJHnirblm6LpmJ/lkozlj7Pkvqfnjq/lvaLorqjorrrmiL/pl7TlvaLmiJDkuKTnp43ljY/kvZznu5PmnoQ8L2Rlc2M+CiAgPHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iNzIwIiBmaWxsPSIjZGZlM2QzIi8+CiAgPHBhdGggZD0iTTYwMCAwVjcyMCIgc3Ryb2tlPSIjMjQyNTFmIiBzdHJva2Utd2lkdGg9IjQiLz4KICA8cmVjdCB4PSI3NiIgeT0iNzIiIHdpZHRoPSI0NDgiIGhlaWdodD0iNTM2IiByeD0iMzQiIGZpbGw9IiNmZGZjZjYiIHN0cm9rZT0iIzI0MjUxZiIgc3Ryb2tlLXd nPgo=","body":"\u003cp>最近在实践多智能体的设计方式，也准备考虑给ActSpace添加多智能体的功能，主要是多智能体如果设计得当的话，是可以在提高效果的同时节省成本的，这对于很多做应用的团队来说，成本的控制是可以带来极好的用户体验的，我觉得这也是Harness Enginneering的概念之一\u003c/p>\n\u003cp>在不断的探索的过程中，我有一种新的感觉，多智能体的设计，尤其是协作方面非常的有意思，而且很有挑战性，我也感觉这个也是目前很多成熟Agent在突破的主要方向之一，从ClaudeCode推出来的Agent Team和Dynamic Workflows可以感受到一些\u003c/p>\n\u003cp>下面记录了我在多智能体协作上的部分探索与思考，谨小认知，仅供参考\u003c/p>\n\u003cp>调研资料：\u003c/p>\n\u003cul>\n\u003cli>\n\u003cp>《Is Having Agents in the Room Meant to Be Chaotic?》：https://raft.build/resources/blog/is-having-agents-in-the-room-meant-to-be-chaotic/\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>《multica开源项目》：https://github.com/multica-ai/multica\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>《Model and effort in Claude Code: knowing more vs. trying harder》：https://x.com/ClaudeDevs/status/2074900291062034618\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>《Excalidraw文件的链接》：https://my.feishu.cn/file/E2qKb9DjxoRHOIx6zyvcDplUniv\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch2>一、Agent Team的设计思路\u003c/h2>\n\u003cp>Agent Team是多智能体的协作方式之一，类似于一个组“临时团队”一起攻坚一个复杂的任务，里面会有负责人的角色（Lead）、同时也会存在团队的成员（Teammate），交流关系不仅仅是负责人和成员之间的交流，成员和成员之间同样可以交流\u003c/p>"},{"title":"给Agent接入Browser use的设计思路","slug":"browser-use-integration","description":"让Agent控制浏览器，其实有很多的实现方式，你可以在应用中内嵌一个浏览器，像cursor、codex那样，在应用中就可以打开网页，内部就可以使用tool工具定义实现，然后进行控制读取，但是这种方式是无法继承用户完整的浏览器权限的，无法完整模拟用户去操作浏览器","date":"2026-07-11","tag":"Browser Use","group":"工程实践","excerpt":true,"minutes":3,"cover":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDcyMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIGRlc2MiPgogIDx0aXRsZSBpZD0idGl0bGUiPkJyb3dzZXIgVXNlIGFyY2hpdGVjdHVyZTwvdGl0bGU+CiAgPGRlc2MgaWQ9ImRlc2MiPuaooeWei+OAgeWRveS7pOW8leaTjuOAgeWumuS9jei/kOihjOaXtuWSjOa1j+iniOWZqOaJqeWxlee7hOaIkOWIhuWxgua1j+iniOWZqOezu+e7nzwvZGVzYz4KICA8cmVjdCB3aWR0aD0iMTIwMCIgaGVpZ2h0PSI3MjAiIGZpbGw9IiNkYmU1ZWMiLz4KICA8Y2lyY2xlIGN4PSIxMDI4IiBjeT0iMTI2IiByPSI3MiIgZmlsbD0iI2ZkZmNmOCIvPgogIDxwYXRoIGQ9Ik0wIDU1NkMxOTggNDUyIDM 发的Agent添加Skill支持时，开发的核心步骤：\u003cstrong>发现、解析、使用、管理\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>发现：你的Skill存储在哪里，本地还是云端，项目级和用户级的优先级是什么，如何确定该文件夹是一个Skill\u003c/li>\n\u003cli>解析：将SKILL.md的元信息解析出来\u003c/li>\n\u003cli>使用：Agent如何使用解析出来的元信息，是系统提示词还是工具描述，后续的渐进式披露策略的执行，是使用读取工具还是使用内部的激活工具\u003c/li>\n\u003cli>管理：如何维持加载进入上下文的Skill的有效性，上下文压缩的时候Skill的内容是否需要保护\u003c/li>\n\u003c/ol>\n\u003cp>🌟 \u003cstrong>开发的核心原则也是Skill的核心特点：渐进式披露\u003c/strong>\u003c/p>\n\u003cp>Excalidraw文件：https://my.feishu.cn/file/V5kabOooOo5hZVxmAjCcFilJn5f?from=from_parent_docx\u003c/p>"}],"releases":[{"id":"release-2026-08-06","date":"2026-08-06","title":"更可靠的 HTML 预览","body":"\u003ch3>问题修复\u003c/h3>\n\u003cul>\n\u003cli>修复固定尺寸 HTML 画布在右侧预览区被裁切的问题；文件树展开或面板调整大小后会自动按可用宽度适配。\u003c/li>\n\u003c/ul>"},{"id":"release-2026-08-05","date":"2026-08-05","title":"更顺手的会话输入","body":"\u003ch3>改进\u003c/h3>\n\u003cul>\n\u003cli>当前会话的输入框为空时，可以使用方向键上、下浏览已经发送过的文字输入，快速复用之前的提示。\u003c/li>\n\u003c/ul>\n\u003ch3>问题修复\u003c/h3>\n\u003cul>\n\u003cli>修复未发送文字在进入设置、查看其他页面或切换会话后丢失的问题；每个会话会分别保留自己的临时草稿。\u003c/li>\n\u003cli>修复 480px 等窄窗口中的 Bash 审批卡片被横向裁切，操作按钮现在可以完整显示。\u003c/li>\n\u003c/ul>"},{"id":"release-2026-08-02","date":"2026-08-02","title":"更完整的服务商配置管理","body":"\u003ch3>改进\u003c/h3>\n\u003cul>\n\u003cli>服务商卡片新增完整移除入口，可以一次清除该服务商的全部密钥和连接设置；已有模型、历史会话与用量记录仍会保留。\u003c/li>\n\u003cli>开发版与本地安装版继续共用一份本地配置；API Key 会稳定保存在仅当前用户可读写的本地凭据文件中，旧版凭据在首次启动时自动迁移，更新或切换版本后不再因应用身份变化要求重复填写。\u003c/li>\n\u003c/ul>\n\u003ch3>问题修复\u003c/h3>\n\u003cul>\n\u003cli>修复服务商已启用代理后，编辑其他配置时因代理地址不回显而无法点击保存的问题。\u003c/li>\n\u003c/ul>"},{"id":"release-2026-08-01","date":"2026-08-01","title":"本地 Agent CLI、分析观测与更快的桌面工作台","body":"\u003ch3>新功能\u003c/h3>\n\u003cul>\n\u003cli>新增本地 Agent CLI：\u003ccode>run\u003c/code> 适合一次性任务和脚本自动化，\u003ccode>chat\u003c/code> 提供可恢复的交互会话，两者复用桌面端相同的模型、工具、审批和 Agent 能力。\u003c/li>\n\u003cli>CLI 支持纯文本、JSON 与 JSONL 输出、稳定退出码和本机单文件构建，便于接入终端、CI 或其他本地工作流。\u003c/li>\n\u003cli>分析观测新增会话索引，可以从真实会话进入 Agent Run、Turn 和 LLM Call，查看请求详情、上下文变化和实际工具使用，并在相邻调用之间翻页比较。\u003c/li>\n\u003cli>Composer 支持选择、拖入或粘贴图片；支持图片的模型可以直接读取，文本模型也能按需调用图片分析工具，发送前后都可以在右侧面板打开预览。\u003c/li>\n\u003cli>设置页新增全局快捷键，可以从其他应用快速唤起紧凑窗口，并打开指定会话、默认工作区或项目列表中的第一个工作区。\u003c/li>\n\u003cli>Environment 可以搜索并切换本地分支，也可以直接创建并 checkout 新分支；Review 的 Committed 视图可以浏览最近提交历史。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>此处节选当日新功能。\u003c/em>\u003c/p>"}],"assets":{"cloud":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAGQKADAAQAAAABAAAFNQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgFNQZAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAgICAgICAwICAwQDAwMEBQQEBAQFBwUFBQUFBwgHBwcHBwcICAgICAgICAoKCgoKCgsLCwsLDQ0NDQ0NDQ0NDf/bAEMBAgICAwMDBgMDBg0JBwkNDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDf/dAAQAZP/aAAwDAQACEQMRAD8A/HAYHJpw9aaOetOHTB4xSZ4Y44PJphGKeOnNNPPTipK6DCCDxTgueppAecGl+tFwFC+lNyM45p+R2pAR3pDA9KaW9aWmnHNAxMAc0YOaD60vQcUAGCOKQ56U7k4/Wg8jAp3Encj4PWjA6UppuKQxwFLyeO1NB55qQcGgBu0YoAPbpSgcUCgBcUw+1P8ArTcUAR4yaAvPtS7T0pfSmCAKc4oIzThSEnNIBuMjFJtqQkn3pPSgBmP0p/UUdenalNADSKUccCjvRjFAB+NH40vfmjFACfjSHj1NPxxSYOM0ANz9aXnsaQ9eaMc0AOx70lHWlJyMDrQAEnpSfjSGloAUE9KMfWkFKDjpQAUuaMEUuPWgBfqaQc+tKD2o4+lACcCkJx0o78c0E4OKAEXnrS9BwaUc9aaRjmgBOetH4mlxmgj0oADx05pelJ2ooAXOelAJFFJQA4005pRg8GmmgAzng008cCnUgzzQAw+9KRxinEU3nNADsHFL0oHSj6UCFJJo69aacil9KBij60c5yKTpS+9ACnNRsKcaT6UgGYFHFPxRt5pgMIyOKTHpTyPSjFADQO1HGcdqXFKOOKAEwPSjbnpTse9LjtQA3B <script>
'use strict';
const D=JSON.parse(document.getElementById('demo-data').textContent);
const root=document.documentElement,main=document.querySelector('main');
const descriptions={a:'纸面编辑 · 宋体标题，温暖底色，舒展的阅读节奏',b:'精密工作台 · 清晰网格，紧凑信息，产品界面优先',c:'空间画廊 · 云景横幅，不对称构图，鲜明的章节节奏'};
let skin='a',page='home',slug='',filter='全部',query='',feature=0,observer,releaseObserver;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||root.dataset.input==='keyboard';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route=(p,id='')=>`#${skin}/${p}${id?'/'+id:''}`;
const pic=(key,alt,cls='',lazy=false)=>`<img src="${D.assets[key]}" alt="${alt}" class="${cls}" width="1600" height="934" ${lazy?'loading="lazy"':''}>`;
const date=s=>s.replaceAll('-','.');
const brandWindow=(key='review')=>`<div class="product-window"><div class="window-caption"><span>ActSpace / Workspace</span><span>Context · Review · Usage</span></div>${pic(key,'ActSpace 历史产品界面，供版式预览')}</div>`;
const card=(p,i=0)=>`<a class="blog-card" href="${route('article',p.slug)}"><span class="card-no">${String(i+1).padStart(2,'0')}</span><div class="cover"><img src="${p.cover}" width="900" height="560" alt="${escapeHTML(p.title)}的插图" loading="lazy"></div><div class="card-body"><div class="meta">${date(p.date)}</div><h2>${escapeHTML(p.title)}</h2><div class="category"><span>${escapeHTML(p.tag)}</span><span class="arrow" aria-hidden="true">↗</span></div></div></a>`;
const journal=()=>`<section class="section journal-section wrap reveal"><div class="section-title"><div><p class="eyebrow">From the journal</p><h2>设计背后的思考</h2></div><a class="text-link" href="${route('blog')}">全部文章 <span class="arrow">↗</span></a></div><div class="journal-cards">${D.posts.slice(0,3).map(p=>`<a class="journal-card" href="${route('article',p.slug)}"><img src="${p.cover}" width="900" height="560" alt="${escapeHTML(p.title)}的插图" loading="lazy"><div class="journal-copy"><p class="meta">${date(p.date)} · ${escapeHTML(p.group)}</p><h3>${escapeHTML(p.title)}</h3><span class="text-link">阅读文章 <span class="arrow">↗</span></span></div></a>`).join('')}</div></section>`;
const features=[{name:'Context',title:'看见模型真正看到的。',text:'项目规则、工具定义与会话历史，在同一个界面里检查。理解一次回复，从理解它的上下文开始。',asset:'context'},{name:'Review',title:'让每一次修改都有据可查。',text:'在对话旁边查看文件变更，从执行过程走到实际结果。把阅读、修改和检查放在同一个工作空间。',asset:'review'},{name:'Usage',title:'知道成本花在了哪里。',text:'查看请求与用量记录，追踪输入、输出和缓存。把运行成本与具体工作联系起来。',asset:'usage'}];
function home(){const hero=skin==='a'?`<section class="hero-a wrap"><div><p class="eyebrow">A local space for agents</p><h1>给模型一个<br>真正能行动的空间。</h1><p class="home-lead">ActSpace 是一个本地优先的 Agent 桌面应用。让模型连接工具，让你看清上下文、执行过程与每一次改动。</p><a class="btn" href="#product" data-jump="product">探索工作台 <span aria-hidden="true">↗</span></a></div><figure style="margin:0"><div class="editorial-image">${pic('cloud','','cloud')}<div class="image-index"><span>ACTSPACE<br>FIELD NOTES / 01</span><span>从一个问题<br>到真实的工作。</span></div>${brandWindow()}</div><figcaption class="image-caption"><span>01 / 从对话到工作空间</span><span>历史界面素材</span></figcaption></figure></section>`:skin==='b'?`<section class="hero-b wrap"><p class="eyebrow">Local-first / Agent workspace</p><div class="hero-b-top"><h1>给模型一个<br>真正能行动的空间。</h1><div><p class="home-lead">ActSpace 是一个本地优先的 Agent 桌面应用。让模型连接工具，让你看清上下文、执行过程与每一次改动。</p><a class="btn" href="#product" data-jump="product">探索工作台 <span>↗</span></a></div></div><div class="technical-frame"><aside class="technical-rail"><div><strong>工作空间</strong><div class="rail-item"><span class="rail-index">01 / OBSERVE</span>Context</div><div class="rail-item"><span class="rail-index">02 / INSPECT</span>Review</div><div class="rail-item"><span class="rail-index">03 / UNDERSTAND</span>Usage</div></div><span class="rail-foot small">从输入到结果，<br>过程始终可见。</span></aside>${brandWindow()}</div><div class="image-caption"><span>ACTSPACE / DESKTOP WORKSPACE</span><span>历史界面素材</span></div></section>`:`<section class="hero-c wrap"><div class="hero-c-top"><div><p class="eyebrow">Room to think. Space to act.</p><h1>给模型一个<br>真正能行动的空间。</h1></div><div><p class="home-lead">ActSpace 是一个本地优先的 Agent 桌面应用。让模型连接工具，让你看清上下文、执行过程与每一次改动。</p><a class="text-link" href="#product" data-jump="product">探索工作台 <span class="arrow">↗</span></a></div></div><div class="landscape">${pic('cloud','','cloud')}<div class="landscape-label"><span>ACTSPACE / FIELD 001</span><span>THINK · ACT · OBSERVE</span></div>${brandWindow()}<div class="landscape-quote">让思考，<br>发生在真实世界。<small>Local-first agent workspace</small></div></div><div class="image-caption"><span>一个可以观察、干预和检查的工作空间</span><span>历史界面素材</span></div></section>`;
return hero+`<div class="home-divider wrap"><span class="eyebrow">Built around the work</span><p>模型负责行动，你始终看得清过程。</p><a class="text-link small" href="${route('article',D.posts[0].slug)}">我们的设计思路 <span class="arrow">↗</span></a></div><section id="product" class="section wrap product-story reveal"><div>${skin==='c'?'<div class="gallery-count">01.</div>':'<p class="eyebrow" style="margin-bottom:18px">Inside ActSpace</p>'}<h2>把工作过程<br>放回你的视线里。</h2><div class="feature-nav" role="group" aria-label="查看产品能力">${features.map((f,i)=>`<button class="feature-tab" data-feature="${i}" aria-pressed="${i===feature}"><span class="idx">0${i+1}</span><span class="feature-name">${f.name}<span class="tab-arrow"> ↗</span></span></button>`).join('')}</div></div><div class="feature-panel" aria-live="polite">${featureHTML()}</div></section>`+journal()+`<section class="closing wrap reveal"><div><h2>从你手头的项目开始。</h2><p>在本地运行 ActSpace，给模型一个清楚的工作空间。</p></div><a class="btn" href="https://github.com/wakeup-jin/actspace-agent#readme" target="_blank" rel="noopener">查看项目与上手说明 ↗</a></section>`;}
function featureHTML(){const f=features[feature];return `<div class="visual">${pic(f.asset,`${f.name} 历史界面素材`)}</div><div class="image-caption"><span>0${feature+1} / ${f.name}</span><span>历史界面素材</span></div><div class="feature-description"><h3>${f.title}</h3><p>${f.text}</p></div>`;}
function blog(){return `<div class="wrap"><section class="page-masthead"><div><p class="eyebrow">The ActSpace journal</p><h1>博客与手记</h1></div><p>记录构建 Agent 的过程。<br>关于工具、上下文，以及更好的协作方式。</p></section><div class="blog-toolbar"><div class="filters" role="group" aria-label="文章分类">${['全部','产品思考','工程实践'].map(f=>`<button class="filter" data-filter="${f}" aria-pressed="${f===filter}">${f}</button>`).join('')}</div><label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input aria-label="搜索文章" type="search" placeholder="搜索文章" value="${escapeHTML(query)}"></label></div><p class="results-count" role="status"></p><div class="blog-grid"></div></div>`;}
function filterPosts(){const ps=D.posts.filter(p=>(filter==='全部'||p.group===filter)&&`${p.title} ${p.tag}`.toLowerCase().includes(query.toLowerCase()));document.querySelector('.results-count').textContent=`${ps.length} 篇文章${filter==='全部'?'':' · '+filter}`;document.querySelector('.blog-grid').innerHTML=ps.length?ps.map(card).join(''):'<div class="empty">没有找到匹配的文章。<button data-reset-search>清除搜索与筛选</button></div>';}
function article(){const p=D.posts.find(p=>p.slug===slug)||D.posts[0];const next=D.posts[(D.posts.indexOf(p)+1)%D.posts.length];return `<div class="reading-progress" aria-hidden="true"></div><article class="article-page"><div class="article-shell"><a class="back-link" href="${route('blog')}">← 返回博客</a><img class="article-cover" src="${p.cover}" alt="${escapeHTML(p.title)}的插图" width="900" height="560"><p class="eyebrow" style="margin-bottom:15px">${escapeHTML(p.tag)}</p><h1>${escapeHTML(p.title)}</h1><p class="article-dek">${escapeHTML(p.description)}</p><dl class="article-meta"><div><dt>作者</dt><dd>WakeUp-Jin</dd></div><div><dt>发布日期</dt><dd>${date(p.date)}</dd></div><div><dt>阅读时间</dt><dd>${p.minutes} 分钟${p.excerpt?' · 节选':''}</dd></div></dl>${p.excerpt?'<div class="excerpt-note">本 Demo 展示文章节选，用于比较阅读版式。完整文章可通过文末链接查看。</div>':''}<div class="article-body">${p.body}</div>${p.excerpt?`<a class="text-link" href="https://wakeup-jin.github.io/actspace-agent/blog/${p.slug}/" target="_blank" rel="noopener">阅读完整文章 <span class="arrow">↗</span></a>`:''}<div class="article-end"><div><p class="eyebrow">继续阅读</p><a href="${route('article',next.slug)}">${escapeHTML(next.title)} <span class="arrow">↗</span></a></div><a class="text-link" style="font:12px var(--sans)" href="${route('blog')}">全部文章</a></div></div></article>`;}
function updates(){return `<div class="wrap"><section class="updates-intro"><p class="eyebrow">The changelog</p><div><h1>持续向前，一次一点。</h1><p>这里记录 ActSpace 的每一次改进，<br>以及它们如何让日常工作更顺手。</p></div></section><div class="updates-layout"><aside class="timeline-nav" aria-label="更新日期导航"><div class="timeline-month">八月<span>2026 / AUGUST</span></div><div class="date-links"><span class="timeline-marker" aria-hidden="true"></span>${D.releases.map((r,i)=>`<a class="date-link" href="${route('updates',r.id)}" data-release="${r.id}" ${i===0?'aria-current="date"':''}>${r.date.slice(5).replace('-',' / ')}</a>`).join('')}</div><p class="timeline-hint">沿着时间，看看最近的变化。<br>本页展示 2026 年 8 月历史记录。</p></aside><div class="release-list">${D.releases.map((r,i)=>`<article class="release reveal" id="${r.id}"><div class="release-date"><time datetime="${r.date}">${date(r.date)}</time>${i===0?'<span class="latest">本页最新</span>':''}</div><h2>${escapeHTML(r.title)}</h2>${i===0?'<div class="release-visual"><div class="preview-paper"><div><p class="preview-label">HTML PREVIEW</p><p class="preview-title">留出刚好的空间。</p><p class="small">随窗口适配，完整呈现。</p></div><div class="preview-circle" aria-hidden="true">↔</div></div><p class="preview-label" style="margin-top:12px">更新内容示意</p></div>':''}<div class="release-body">${r.body}</div><a class="release-permalink" href="${route('updates',r.id)}" data-release="${r.id}">定位这条更新 <span class="arrow">↗</span></a></article>`).join('')}</div></div></div>`;}
function syncChrome(){root.dataset.skin=skin;document.querySelectorAll('[data-skin-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.skinChoice===skin)));document.querySelector('.direction-note .number').textContent=`${skin.toUpperCase()} / 0${['a','b','c'].indexOf(skin)+1}`;document.querySelector('.direction-description').textContent=descriptions[skin];document.querySelectorAll('[data-page]').forEach(a=>{a.href=route(a.dataset.page);if(a.closest('.site-nav')&&(a.dataset.page===page||(page==='article'&&a.dataset.page==='blog')))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title=`ActSpace · ${{home:'首页',blog:'博客',article:'文章',updates:'更新日志'}[page]} · ${skin.toUpperCase()} 方案`;}
function render(){observer?.disconnect();releaseObserver?.disconnect();syncChrome();main.innerHTML=({home,blog,article,updates}[page])();main.classList.remove('page-enter');void main.offsetWidth;main.classList.add('page-enter');if(page==='blog')filterPosts();window.scrollTo(0,0);observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');observer.unobserve(e.target)}}),{threshold:.07});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));if(page==='updates')requestAnimationFrame(()=>{syncTimeline();if(slug)jumpRelease(slug,false)});onScroll();}
function readRoute(){const parts=location.hash.slice(1).split('/');const newSkin=['a','b','c'].includes(parts[0])?parts[0]:'a';const newPage=['home','blog','article','updates'].includes(parts[1])?parts[1]:'home';const newSlug=parts[2]||'';if(newSkin===skin&&newPage===page&&newPage==='updates'&&main.children.length){slug=newSlug;if(slug)jumpRelease(slug,true);return;}skin=newSkin;page=newPage;slug=newSlug;render();}
function jumpRelease(id,animate){const target=document.getElementById(id);if(!target)return;target.scrollIntoView({block:'start',behavior:animate&&!reduced()?'smooth':'instant'});target.classList.remove('release-target');void target.offsetWidth;target.classList.add('release-target');}
function syncTimeline(){const sections=[...document.querySelectorAll('.release')];if(!sections.length)return;const anchor=parseInt(getComputedStyle(root).getPropertyValue('--bar'))+(innerWidth<=760?145:170);let active=sections[0];sections.forEach(el=>{if(el.getBoundingClientRect().top<=anchor)active=el});const links=[...document.querySelectorAll('.date-link')];links.forEach(a=>a.setAttribute('aria-current',a.dataset.release===active.id?'date':'false'));const a=links.find(a=>a.dataset.release===active.id),marker=document.querySelector('.timeline-marker');if(a&&marker){marker.style.transform=innerWidth<=760?`translateX(${a.offsetLeft+a.offsetWidth/2-2}px)`:`translateY(${a.offsetTop}px)`;}}
function onScroll(){if(page==='updates')syncTimeline();if(page==='article'){const body=document.querySelector('.article-body'),progress=document.querySelector('.reading-progress');if(body&&progress){const start=body.getBoundingClientRect().top+scrollY-innerHeight*.6,end=body.getBoundingClientRect().bottom+scrollY-innerHeight*.6;progress.style.transform=`scaleX(${Math.max(0,Math.min(1,(scrollY-start)/(end-start)))})`;}}}
document.addEventListener('pointerdown',()=>root.dataset.input='pointer',true);document.addEventListener('keydown',()=>root.dataset.input='keyboard',true);
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();main.focus();main.scrollIntoView({behavior:'instant'});return;}const skinButton=e.target.closest('[data-skin-choice]');if(skinButton){location.hash=`#${skinButton.dataset.skinChoice}/${page}${slug?'/'+slug:''}`;return;}if(e.target.closest('.theme-button')){const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';document.querySelector('.theme-button').setAttribute('aria-label',`切换到${dark?'浅':'深'}色主题`);document.querySelector('.theme-name').textContent=dark?'浅色':'深色';return;}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===f)));filterPosts();return;}if(e.target.closest('[data-reset-search]')){filter='全部';query='';document.querySelector('input[type=search]').value='';document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));filterPosts();return;}const ft=e.target.closest('[data-feature]');if(ft){feature=Number(ft.dataset.feature);document.querySelectorAll('[data-feature]').forEach(b=>b.setAttribute('aria-pressed',String(b===ft)));const panel=document.querySelector('.feature-panel');panel.innerHTML=featureHTML();if(!reduced())panel.animate([{opacity:.3,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:240,easing:'ease-out'});return;}const jump=e.target.closest('[data-jump]');if(jump){e.preventDefault();document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior:reduced()?'instant':'smooth'});return;}const release=e.target.closest('[data-release]');if(release&&release.hash===location.hash){e.preventDefault();jumpRelease(release.dataset.release,true);}});
document.addEventListener('input',e=>{if(e.target.matches('input[type=search]')){query=e.target.value;filterPosts();}});
let scrollQueued=false;window.addEventListener('scroll',()=>{if(!scrollQueued){scrollQueued=true;requestAnimationFrame(()=>{onScroll();scrollQueued=false})}},{passive:true});window.addEventListener('resize',onScroll);window.addEventListener('hashchange',readRoute);readRoute();
</script>
</body></html>
