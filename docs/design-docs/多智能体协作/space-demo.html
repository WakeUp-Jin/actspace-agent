  function ftRows(sc) {
    const rows = [];
    const dirRow = (p, name, depth, root) => `<button type="button" class="ft-row${S.ftOpen.has(p) ? ' open' : ''}${root ? ' root' : ''}" style="padding-left:${10 + depth * 12}px" data-act="ft-dir" data-v="${esc(p)}">${ic('right', 'chev')}${ic('folder', 't')}<span class="nm">${esc(name)}</span></button>`;
    const fileRow = (p, name, depth) => `<button type="button" class="ft-row" style="padding-left:${10 + depth * 12}px" data-act="ft-file" data-v="${esc(p)}" aria-current="${S.ftSel === p}"><span class="sp13"></span>${ic('file', 't')}<span class="nm">${esc(name)}</span></button>`;
    const walk = (nodes, base, depth) => nodes.forEach(nd => {
      const p = base + '/' + nd.n;
      if (!nd.c) { rows.push(fileRow(p, nd.n, depth)); return; }
      rows.push(dirRow(p, nd.n, depth));
      if (S.ftOpen.has(p)) walk(nd.c, p, depth + 1);
    });
    const flat = (nodes, base) => nodes.flatMap(nd => nd.c ? flat(nd.c, base + '/' + nd.n) : [base + '/' + nd.n]);
    const q = S.ftQ.trim().toLowerCase();
    sc.roots.forEach(r => {
      if (q) { flat(FS[r] || [], r).filter(p => p.toLowerCase().includes(q)).forEach(p => rows.push(fileRow(p, p, 0))); return; }
      rows.push(dirRow(r, r, 0, true));
      if (S.ftOpen.has(r)) walk(FS[r] || [], r, 1);
    });
    return rows.join('') || `<div class="empty">没有匹配「${esc(S.ftQ)}」的文件</div>`;
  }
  function renderFiles(sc) {
    return `<div class="ft-head"><label class="ft-filter">${ic('search')}<input id="ftq" placeholder="过滤文件…" value="${esc(S.ftQ)}" aria-label="过滤文件"></label><button type="button" class="ib" data-act="ft-refresh" title="刷新" aria-label="刷新">${ic('refresh')}</button></div>
      <div class="ft-body" id="ftBody">${ftRows(sc)}</div>`;
  }
  function renderFile(t) {
    const parts = t.path.split('/');
    const lines = CODE[parts[parts.length - 1]] || ['// ' + t.path, '// 演示里只放了几份示例文件的内容'];
    return `<div class="ft-bar">${parts.map((x, i) => i === parts.length - 1 ? `<b>${esc(x)}</b>` : `<span>${esc(x)}</span>${ic('right', 'xs')}`).join('')}</div>
      <pre class="code">${lines.map(l => `<span class="l">${esc(l) || ' '}</span>`).join('')}</pre>`;
  }
  // 终端：协调 Agent 不执行命令，这里只给你用；Actor 下能看到它跑过的命令
  function renderTerm(sc) {
    let out;
    if (sc.coord) out = '<span class="dim">Space 终端 · 只给你用，协调 Agent 不会在这里执行命令</span>\n';
    else if (!sc.m) out = '';
    else {
      const runs = sc.m.transcript.filter(b => b.k1 === '运行');
      out = runs.length
        ? runs.map(b => { const [cmd, res] = b.t.split(' · '); return `<span class="p">$</span> ${esc(cmd)}\n${res ? `<span class="dim">${esc(res)}</span>\n` : ''}`; }).join('')
        : `<span class="dim">${esc(nameOf(sc.m.id))} 还没有运行过命令</span>\n`;
      if (sc.m.status === 'wait' && sc.m.approval) out += `<span class="dim"># 等你批准：${esc(sc.m.approval.cmd)}</span>\n`;
    }
    return `<div class="term">${out}<span class="p">~/${esc(sc.dir)} $</span> <span class="cur"></span></div>
      <div class="term-foot">${ic('folder', 'xs')}<span>${esc(sc.dir)}</span><span>·</span><span>${sc.tree ? '工作树 ' + esc(sc.tree) : '本机'}</span><button type="button" class="ib" data-act="term-restart" title="重启终端" aria-label="重启终端">${ic('rotate')}</button></div>`;
  }
  function renderReview(sc) {
    const files = sc.m ? sc.m.transcript.filter(b => b.diff) : [];
    if (!files.length) return `<div class="empty">${ic('branch')}<div>这次还没有改动。</div></div>`;
    const add = files.reduce((s, b) => s + b.diff[0], 0), del = files.reduce((s, b) => s + b.diff[1], 0);
    const diff = (a, d) => `<span class="diff"><span class="a">+${a}</span> <span class="d">−${d}</span></span>`;
    return `<div class="rv-sum">${ic(sc.tree ? 'fork' : 'branch', 'xs')}<span>${esc(sc.branch)} · ${files.length} 个文件</span>${diff(add, del)}</div>
      ${files.map(b => `<button type="button" class="rv-row" data-act="ft-file" data-v="${esc(sc.dir + '/' + b.t)}">${ic('file', 'xs')}<span class="nm">${esc(b.t)}</span>${diff(b.diff[0], b.diff[1])}</button>`).join('')}`;
  }
  function usage(sc) {
    const c = S.view === 'space' ? cur() : null;
    const n = sc.m ? sc.m.transcript.length : sc.coord ? c.msgs.length : (S.chats[S.chatWith] || []).length;
    const parts = [
      { n: '系统提示', v: sc.coord ? 4.8 : 6.2, c: 'var(--line-strong)' },
      { n: c ? 'Space 指令与记忆' : '自己的记忆', v: c ? 1.6 + c.memory.length * .4 : 2.4, c: 'var(--info)' },
      { n: '对话', v: 2 + n * 2.4, c: 'var(--op)' },
      { n: '工具结果', v: sc.m ? sc.m.transcript.filter(b => b.k === 'line').length * 3.1 : sc.coord ? 3.2 : 0, c: 'var(--warn)' }
    ];
    const total = parts.reduce((s, x) => s + x.v, 0);
    return { parts, total, max: 200, pct: Math.round(total / 200 * 100) };
  }
  function renderUsage(sc) {
    const u = usage(sc);
    return `<div class="ctx-total"><span class="n">${u.total.toFixed(1)}k</span><small>共 ${u.max}k · 用了 ${u.pct}%</small></div>
      <div class="ctx-bar">${u.parts.map(x => `<i style="width:${(x.v / u.max * 100).toFixed(2)}%;background:${x.c}"></i>`).join('')}</div>
      ${u.parts.map(x => `<div class="ctx-row"><span class="sw" style="background:${x.c}"></span>${x.n}<span class="v">${x.v.toFixed(1)}k</span></div>`).join('')}`;
  }

  /* ============ 输入框下方的状态行 ============ */
  // 和现有 Composer 一样：左边是事实（分支 · 本机/工作树 · 权限），右边是上下文圆环
  function renderStatus() {
    if (S.view === 'roster') return;
    const sc = scope();
    const f = (icon, t) => `<span class="f">${ic(icon)}<span>${esc(t)}</span></span>`;
    const facts = sc.coord
      ? [f('folder', sc.roots.join(', ')), f('eye', '只读，交事给 Actor')]
      : [f(sc.tree ? 'fork' : 'branch', sc.branch), sc.tree ? f('fork', '工作树') : f('laptop', '本机'),
        `<button type="button" class="perm" data-act="perm">${ic('shieldCheck')}<span>自动</span>${ic('chev', 'xs')}</button>`];
    const u = usage(sc);
    const ring = `<span class="ctx-ring" style="--p:${u.pct}"></span>${u.pct}%`;
    $('statusRow').innerHTML = `<div class="facts">${facts.join('<span class="sep">·</span>')}</div>`
      + (sc.coord ? `<span class="pct" title="上下文已用 ${u.pct}%">${ring}</span>` : `<button type="button" class="pct" data-act="rp-open" data-v="ctx" title="上下文已用 ${u.pct}%，点开看明细">${ring}</button>`);
  }

  // 一行：头像 + 名字 + 说明 + 待办进度（有 todo 时）+ 时间（有时）
  // 分组表示 Actor 现在的状态，说明表示它最近一件事
  function ring(done, total) {
    const C = 2 * Math.PI * 5;
    const off = C * (1 - (total ? done / total : 0));
    return `<svg class="ring" viewBox="0 0 13 13" aria-hidden="true"><circle class="bg" cx="6.5" cy="6.5" r="5"/><circle class="fg" cx="6.5" cy="6.5" r="5" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/></svg>`;
  }
  function describe(m) {
    if (m.status === 'wait' || m.status === 'fail') return { html: `<span>${esc(m.ask || '')}</span>`, txt: m.ask || '' };
    if (m.status === 'run') return { html: `<span>${esc(m.task)}</span>`, txt: m.task };
    if (m.status === 'result') return { html: `${ic('check', 'xs')}<span>${esc(m.task)}</span>`, txt: '完成：' + m.task };
    const t = m.note || (m.last ? '上次：' + m.last : '还没有任务');
    return { html: `<span>${esc(t)}</span>`, txt: t, faint: true };
  }
  function agentRow(m) {
    const d = describe(m);
    const showTodo = m.todo && (m.status === 'run' || m.status === 'wait' || m.status === 'result');
    return `<button type="button" class="arow${m.unread ? ' unread' : ''}" data-act="open-agent" data-id="${m.id}" data-row="${m.id}" aria-current="${S.tab === m.id}" title="${esc(nameOf(m.id) + ' · ' + d.txt)}">
      ${av(m.id, 22, { working: m.status === 'run' })}
      <span class="title">${esc(nameOf(m.id))}</span>
      <span class="sub${d.faint ? ' faint' : ''}">${d.html}</span>
      ${m.unread ? '<span class="unread-dot" aria-label="未读"></span>' : ''}
      ${showTodo ? `<span class="todo" title="待办 ${m.todo[0]}/${m.todo[1]}">${ring(m.todo[0], m.todo[1])}${m.todo[0]}/${m.todo[1]}</span>` : ''}
      ${m.time ? `<span class="time">${esc(m.time)}</span>` : ''}
    </button>`;
  }

  /* ============ 渲染总入口 ============ */
  function render() {
    const app = $('app');
    app.classList.toggle('rp-open', S.rpOpen && S.view !== 'roster');
    app.classList.toggle('solo', S.view !== 'space');
    app.classList.toggle('view-roster', S.view === 'roster');
    renderSidebar();
    renderTabs();
    renderFlow();
    renderPills();
    renderTray();
    renderRight();
    renderObjMenu();
    renderStatus();
    const ph = S.view === 'chat' ? `和${nameOf(S.chatWith)}说…` : S.tab === 'coord' ? '接下来做什么？' : `对${nameOf(S.tab)}说…`;
    $('input').placeholder = ph;
    document.querySelectorAll('.theme-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.theme));
  }

  /* ============ 动效：行在分组间平移 ============ */
  function captureRows() {
    const m = {};
    document.querySelectorAll('[data-row]').forEach(el => { m[el.dataset.row] = el.getBoundingClientRect().top; });
    return m;
  }
  function playRows(before, lit = []) {
    document.querySelectorAll('[data-row]').forEach(el => {
      const id = el.dataset.row;
      if (lit.includes(id)) el.classList.add('lit');
      if (before[id] == null) { el.classList.add('fresh'); return; }
      const dy = before[id] - el.getBoundingClientRect().top;
      if (!dy) return;
      el.classList.add('flip');
      el.style.transform = `translateY(${dy}px)`;
      requestAnimationFrame(() => { el.style.transform = ''; });
      el.addEventListener('transitionend', () => { el.classList.remove('flip'); el.style.transform = ''; }, { once: true });
    });
  }

  /* ============ 打字机 ============ */
  function streamReply(list, idx, onEnd) {
    const m = list[idx];
    if (!m) return;
    m.typing = false; m.shown = 0; m.plain = m.plain || m.t;
    clearInterval(S.timer);
    S.timer = setInterval(() => {
      const msg = list[idx];
      if (!msg || msg.shown == null) { clearInterval(S.timer); return; }
      msg.shown += 3;
      if (msg.shown >= msg.plain.length) { msg.shown = null; clearInterval(S.timer); onEnd && onEnd(msg); }
      S.stream = true;
      render();
    }, 26);
  }
  function scheduleApproval() {
    const sid = S.spaceId, s0 = S;
    setTimeout(() => {
      if (S !== s0 || S.spaceId !== sid) return;
      const c = cur();
      const target = c.members.find(m => m.status === 'run' && !m.approval);
      if (!target) return;
      const before = captureRows();
      target.status = 'wait';
      target.ask = '想跑带覆盖率的测试'; target.time = '刚刚'; if (target.todo) target.todo[0] = 1;
      target.approval = { cmd: 'pnpm test --coverage', why: '需要跑带覆盖率的完整测试，耗时约 2 分钟，会写入 coverage/ 目录。' };
      target.transcript.push({ k: 'approval' });
      render();
      playRows(before);
      const pill = document.querySelector('.pill.warn');
      if (pill && !S.trayOpen) { pill.classList.add('flash'); setTimeout(() => pill.classList.remove('flash'), 1200); }
    }, 3600);
  }

  /* ============ 交互 ============ */
  function send() {
    const el = $('input');
    const text = el.value.trim();
    if (!text) return;
    el.value = ''; el.style.height = 'auto'; $('send').disabled = true; $('composer').classList.remove('stacked');
    if (S.view === 'chat') return sendSolo(text);
    if (S.view !== 'space') return;
    const c = cur();
    c.msgs.push({ k: 'user', t: text });
    // 先找空闲的成熟 Actor；名册里没有合适的，就在这个 Space 里新起一个
    const idle = c.members.find(m => m.status === 'idle' && !actor(m.id).nascent);
    const nid = 'n' + rnd(5);
    S.actors[nid] = { name: '排查现有实现', nascent: true, growImg: 1 + Math.floor(Math.random() * 9), scene: '把现有实现摸清楚。', abilities: [] };
    const short = text.length > 16 ? text.slice(0, 16) + '…' : text;
    const t = idle
      ? `先让新起的 [[${nid}]] 摸清现有实现，[[${idle.id}]] 同步准备测试。`
      : `名册里没有合适的，新起了 [[${nid}]] 先摸清现有实现。`;
    c.msgs.push({ k: 'coord', t, plain: plainOf(t), typing: true });
    const idx = c.msgs.length - 1;
    S.tab = 'coord';
    render();
    const sid = c.id, s0 = S;
    setTimeout(() => {
      if (S !== s0 || S.spaceId !== sid) return;
      streamReply(c.msgs, idx, () => {
        const before = captureRows();
        const lit = [nid];
        if (idle) {
          Object.assign(idle, { status: 'run', task: short, todo: [0, 3], time: '', note: null });
          idle.transcript.push({ k: 'task', t: short, at: '刚刚' }, { k: 'brief', t: '为「' + text + '」准备测试，等排查结论出来再补实现相关的用例。' }, { k: 'text', t: '开始了，先列要覆盖的场景。' });
          lit.push(idle.id);
        }
        c.members.unshift({ id: nid, status: 'run', task: '排查现有实现', todo: [0, 3], dir: c.dirs[0] || 'checkout-web', transcript: [
          { k: 'task', t: '排查现有实现', at: '刚刚' },
          { k: 'brief', t: text },
          { k: 'line', k1: '读取', t: 'src/' },
          { k: 'text', t: '开始了，有结论会交回协调 Agent。' }
        ] });
        render();
        playRows(before, lit);
        scheduleApproval();
      });
    }, 760);
  }
  function sendSolo(text) {
    const id = S.chatWith;
    const list = S.chats[id] = S.chats[id] || [];
    list.push({ k: 'user', t: text });
    list.push({ k: 'actor', t: '收到。这在我的场景里，我先看一下，有结论直接告诉你。', typing: true });
    const idx = list.length - 1;
    S.stream = true;
    render();
    const s0 = S;
    setTimeout(() => { if (S === s0 && S.view === 'chat' && S.chatWith === id) streamReply(list, idx); }, 700);
  }

  function closeTab(id) {
    if (id === 'coord') return;
    const list = tabsOf(cur());
    const i = list.indexOf(id);
    if (i < 0) return;
    list.splice(i, 1);
    // 关掉当前标签：跳到左边那个，没有就回到协调 Agent
    if (S.tab === id) S.tab = list[i - 1] || 'coord';
    render();
  }
  function runAgent(id) {
    const m = member(id);
    if (!m || m.status !== 'wait') return;
    const before = captureRows();
    m.status = 'run'; m.ask = null; m.time = ''; m.denied = false;
    if (m.todo && m.todo[0] < m.todo[1]) m.todo[0]++;
    S.trayIdx = 0;
    if (trayList().length === 0) S.trayOpen = false;
    render();
    playRows(before);
    toast('已批准，' + nameOf(id) + ' 继续了');
  }
  function denyAgent(id) {
    const m = member(id);
    if (!m || m.status !== 'wait') return;
    const before = captureRows();
    m.status = 'idle'; m.last = m.task; m.note = '命令被拒绝，等你给方向'; m.time = '刚刚'; m.denied = true; m.ask = null;
    S.trayIdx = 0;
    if (trayList().length === 0) S.trayOpen = false;
    render();
    playRows(before);
    toast('已拒绝，' + nameOf(id) + ' 等你给别的方向');
  }
  function openAgentTab(id) {
    if (S.view !== 'space') return;
    const m = member(id);
    if (!m) return;
    m.unread = false;
    const list = tabsOf(cur());
    if (!list.includes(id)) list.push(id);
    S.tab = id;
    render();
    // 看过「有结果」之后，它滑到「空闲」
    if (m.status === 'result') {
      const sid = S.spaceId, s0 = S;
      setTimeout(() => {
        if (S !== s0 || S.spaceId !== sid || m.status !== 'result') return;
        const before = captureRows();
        m.status = 'idle'; m.last = m.task; m.task = null;
        render();
        playRows(before);
      }, 1400);
    }
  }

  function keepActor(id, btn) {
    const c = cur();
    const msg = c.msgs.find(x => x.k === 'keep' && x.aid === id);
    const card = btn.closest('.keep');
    if (!msg || !card) return;
    card.classList.add('growing');
    const s0 = S;
    setTimeout(() => {
      if (S !== s0) return;
      const a = actor(id);
      a.nascent = false; a.img = a.growImg; a.abilities = ['环境检查', '健康探测']; a.memN = 1; a.last = '刚刚长成'; a.spaces = 1;
      msg.state = 'kept';
      S.freshCard = id;
      render();
      document.querySelectorAll(`.rp [data-av="${id}"], .tabs [data-av="${id}"]`).forEach(el => el.classList.add('pop'));
      toast(a.name + ' 进入了名册');
    }, 950);
  }

  function openModal(html) {
    $('modalRoot').innerHTML = `<div class="scrim" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  }
  function closeModal() { $('modalRoot').innerHTML = ''; }

  function newSpaceModal() {
    const ids = Object.keys(S.actors).filter(id => !S.actors[id].nascent);
    openModal(`
      <h2>新建 Space <button type="button" class="ib" data-act="close-modal" aria-label="关闭">${ic('x')}</button></h2>
      <div class="field"><span class="lbl">名字</span><input class="input" id="nsName" placeholder="比如：支付链路提速"></div>
      <div class="field"><span class="lbl">要解决的问题</span><input class="input" id="nsGoal" placeholder="一句话，比如：把 checkout 的 p75 降到 200ms 以内"></div>
      <div class="field"><span class="lbl">成员 <small>从名册里选，之后也能加</small></span>
        <div class="pick-crew">${ids.map((id, i) => `<button type="button" data-act="pick-crew" data-id="${id}" aria-pressed="${i < 2}">${av(id, 22)}${esc(nameOf(id))}</button>`).join('')}</div>
      </div>
      <div class="field"><span class="lbl">相关目录 <small>选填</small></span><input class="input" id="nsDirs" placeholder="payments-api, checkout-web"></div>
      <div class="modal-foot">
        <button type="button" class="btn" data-act="close-modal">取消</button>
        <button type="button" class="btn primary" data-act="create-space">创建</button>
      </div>`);
    setTimeout(() => $('nsName')?.focus(), 40);
  }

  function helpModal() {
    openModal(`
      <h2>这是什么 <button type="button" class="ib" data-act="close-modal" aria-label="关闭">${ic('x')}</button></h2>
      <p style="margin:0;font-size:13px;line-height:1.65;color:var(--muted)">Space 把几个 Actor 聚在一起解决一个问题。你只和协调 Agent 说话，它把事交给合适的 Actor；每个 Actor 在中间开成一个标签页。</p>
      <ol class="steps">
        <li>在输入框发一句话，协调 Agent 会交给<b>空闲的 Actor</b>；名册里没有合适的，就<b>新起一个</b>（小球头像，头部写着「归属 Space」）。</li>
        <li>右栏「Actor」里被交到事的那一行会<b>亮一下</b>，头像外出现翡翠绿光环：工作中。</li>
        <li>几秒后有 Actor 要跑命令，<b>琥珀色胶囊</b>亮起。点它展开托盘，就地运行或拒绝。</li>
        <li>点右栏「有结果」里的<b>性能分析</b>，看过之后它会滑到「空闲」。</li>
        <li>协调 Agent 问要不要留下「环境巡检」，点<b>留下</b>，看它长成。</li>
        <li><b>右栏跟着标签页走</b>：协调 Agent 下是 Actor / 库 / 记忆，右上角「+」还能加文件和终端；切到某个 Actor 或一对一对话，右栏就和普通会话一样，从启动页打开文件、Review、上下文、终端。</li>
        <li>左栏顺序和桌面端一致：主操作是新建会话、新建 Space、扩展、Actor 名册，下面是 Space 列表；和 Actor 的一对一对话出现在「工作区」的会话里。</li>
      </ol>
      <p style="margin:0;font-size:12px;color:var(--faint)">数据都是模拟的，刷新或点顶部「重置演示」回到初始状态。</p>
      <div class="modal-foot"><button type="button" class="btn primary" data-act="close-modal">知道了</button></div>`);
  }

  /* ============ 事件 ============ */
  document.addEventListener('click', e => {
    // 点菜单外面就收起
    if (S.tabMenu && !e.target.closest('#tabMenu, #tabMore')) { S.tabMenu = false; updateTabOverflow(); }
    if (S.objMenu && !e.target.closest('#objMenu, #objBtn')) { S.objMenu = false; renderObjMenu(); }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
    if (t.classList.contains('scrim') && e.target !== t) return;
    switch (act) {
      case 'pick-space': if (S.view === 'space' && S.spaceId === id) break; switchSpace(id); S.view = 'space'; S.trayOpen = false; S.trayIdx = 0; $('app').classList.remove('sb-open'); render(); break;
      case 'go-roster': S.view = 'roster'; S.trayOpen = false; $('app').classList.remove('sb-open'); render(); break;
      case 'open-chat':
        S.view = 'chat'; S.chatWith = id; S.chats[id] = S.chats[id] || [];
        S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 3);
        $('app').classList.remove('sb-open');
        render(); $('input').focus(); break;
      case 'pick-tab': S.tab = id; render(); break;
      case 'close-tab': e.stopPropagation(); closeTab(id); break;
      case 'tab-more': S.tabMenu = !S.tabMenu; updateTabOverflow(); break;
      case 'tm-pick': S.tabMenu = false; S.tab = id; render(); break;
      case 'tm-close': closeTab(id); break;
      case 'tm-close-others': cur().openTabs = S.tab === 'coord' ? [] : [S.tab]; S.tabMenu = false; render(); break;
      case 'open-agent': openAgentTab(id); break;
      case 'toggle-rp': S.rpOpen = !S.rpOpen; S.objMenu = false; render(); break;
      case 'open-sb': $('app').classList.add('sb-open'); break;
      case 'back-main': $('app').classList.remove('sb-open'); break;
      case 'obj-menu': S.objMenu = !S.objMenu; renderObjMenu(); break;
      case 'rp-open': S.objMenu = false; openKind(v); render(); break;
      case 'rp-pick': rpCtx().active = id; renderRight(); break;
      case 'rp-close': e.stopPropagation(); closeRpTab(id); renderRight(); break;
      case 'ft-dir': if (S.ftOpen.has(v)) S.ftOpen.delete(v); else S.ftOpen.add(v); renderRight(); break;
      case 'ft-file': S.ftSel = v; openKind('file', { path: v, label: v.split('/').pop() }); renderRight(); break;
      case 'toggle-group': {
        const g = t.closest('.group');
        S.collapsed[v] = !S.collapsed[v];
        g.classList.toggle('closed', S.collapsed[v]);
        t.setAttribute('aria-expanded', String(!S.collapsed[v]));
        break;
      }
      case 'pill-wait': S.trayOpen = !S.trayOpen; renderTray(); renderPills(); break;
      case 'pill-other': S.tab = 'coord'; openKind('agents'); render(); break;
      case 'tray-prev': S.trayIdx = (S.trayIdx - 1 + trayList().length) % trayList().length; renderTray(); break;
      case 'tray-next': S.trayIdx = (S.trayIdx + 1) % trayList().length; renderTray(); break;
      case 'tray-view': S.trayOpen = false; openAgentTab(id); break;
      case 'run-agent': runAgent(id); break;
      case 'deny-agent': denyAgent(id); break;
      case 'keep-actor': keepActor(id, t); break;
      case 'decline-actor': {
        const m = cur().msgs.find(x => x.k === 'keep' && x.aid === id);
        if (m) m.state = 'declined';
        render();
        break;
      }
      case 'undo-mem': {
        const c = cur();
        const m = c.msgs.find(x => x.k === 'mem' && x.mid === id);
        if (m) m.undone = true;
        c.memory = c.memory.filter(x => x.id !== id);
        render();
        toast('撤销了这条记忆');
        break;
      }
      case 'mem-forget': {
        const c = cur();
        c.memory = c.memory.filter(x => x.id !== id);
        renderRight();
        toast('已忘记');
        break;
      }
      case 'send': send(); break;
      case 'new-space': newSpaceModal(); break;
      case 'pick-crew': t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')); break;
      case 'new-chat': toast('演示里只做 Space 和 Actor，普通会话不展开'); break;
      case 'noop-chat': toast('演示里普通会话不展开'); break;
      case 'extensions': toast('演示里不展开扩展页'); break;
      case 'settings': toast('演示里不展开设置页'); break;
      case 'noop-chrome': toast('演示里省略：窗口按钮'); break;
      case 'noop-ws': toast('演示里普通工作区不展开'); break;
      case 'composer-plus': toast('演示里省略：添加附件'); break;
      case 'model': toast('演示里省略：切换模型'); break;
      case 'perm': toast('演示里省略：切换权限'); break;
      case 'ft-refresh': toast('演示里的文件树是固定的'); break;
      case 'term-restart': toast('演示里省略：重启终端'); break;
      case 'reset-demo': {
        clearInterval(S.timer);
        const theme = S.theme;
        S = seed(); S.theme = theme; window.__S = S;
        rpSig = ''; shownTab = null;
        $('input').value = ''; $('input').style.height = 'auto'; $('send').disabled = true; $('composer').classList.remove('stacked');
        closeModal(); render();
        toast('演示已重置');
        break;
      }
      case 'lib-add': toast('演示里省略：从磁盘添加文件'); break;
      case 'lib-open': toast('演示里省略：预览文件'); break;
      case 'edit-instr': toast('演示里省略：编辑指令'); break;
      case 'help': helpModal(); break;
      case 'close-modal': case 'create-space':
        if (act === 'create-space') {
          const name = ($('nsName')?.value || '').trim() || '未命名 Space';
          const goal = ($('nsGoal')?.value || '').trim();
          const dirs = ($('nsDirs')?.value || '').split(/[,，\s]+/).filter(Boolean);
          const crew = [...document.querySelectorAll('[data-act="pick-crew"][aria-pressed="true"]')].map(b => b.dataset.id);
          const nid = 'sp' + rnd(5);
          S.spaces.push({ id: nid, name, goal, img: SPACE_COLORS[S.spaces.length % SPACE_COLORS.length], dirs, instructions: '',
            members: crew.map(aid => ({ id: aid, status: 'idle', dir: dirs[0] || 'checkout-web', transcript: [] })),
            msgs: [], memory: [], library: [] });
          switchSpace(nid); S.view = 'space'; S.trayOpen = false;
          toast('创建了「' + name + '」');
        }
        closeModal();
        render();
        break;
      case 'theme': {
        S.theme = v;
        const root = document.documentElement;
        if (v === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v);
        try { localStorage.setItem('space-demo-theme', v); } catch (_) {}
        render();
        break;
      }
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'input') {
      const el = e.target;
      const comp = $('composer');
      // 现有 Composer：超过一行就从胶囊形切到上下两行，清空前不切回去
      el.style.height = 'auto';
      const multi = el.value.includes('\n') || el.scrollHeight > 40;
      comp.classList.toggle('stacked', !!el.value && (multi || comp.classList.contains('stacked')));
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
      $('send').disabled = !el.value.trim();
    }
    if (e.target.id === 'ftq') { S.ftQ = e.target.value; $('ftBody').innerHTML = ftRows(scope()); }
    if (e.target.id === 'rq') { S.q = e.target.value; renderCards(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'input' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    if (e.key === 'Escape') { S.objMenu = false; renderObjMenu(); closeModal(); $('app').classList.remove('sb-open'); if (S.tabMenu) { S.tabMenu = false; updateTabOverflow(); } }
  });

  /* ============ 星空：生成两层星点 ============ */
  (function stars() {
    let s = 7;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const layer = (n, tile, size) => Array.from({ length: n }, () => {
      const d = (size * (0.5 + r())).toFixed(1);
      return `radial-gradient(${d}px ${d}px at ${Math.round(r() * tile)}px ${Math.round(r() * tile)}px, rgba(238,241,255,${(0.35 + r() * 0.6).toFixed(2)}), transparent)`;
    }).join(',');
    const st = document.createElement('style');
    st.textContent = `.sky::before{background-image:${layer(42, 520, 1.6)};background-size:520px 520px}
      .sky::after{background-image:${layer(16, 760, 2.6)};background-size:760px 760px}`;
    document.head.appendChild(st);
  })();

  /* ============ 启动 ============ */
  try {
    const saved = localStorage.getItem('space-demo-theme');
    if (saved === 'light' || saved === 'dark') { S.theme = saved; document.documentElement.setAttribute('data-theme', saved); }
  } catch (_) {}
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('space')) S.spaceId = h.get('space');
  if (h.get('tab')) { S.tab = h.get('tab'); cur().openTabs = h.get('tab').split(','); S.tab = cur().openTabs.at(-1); }
  if (h.get('tray')) S.trayOpen = true;
  if (h.get('view')) S.view = h.get('view');
  if (h.get('chat')) { S.view = 'chat'; S.chatWith = h.get('chat'); S.recent = [S.chatWith]; }
  if (h.get('theme')) { S.theme = h.get('theme'); document.documentElement.setAttribute('data-theme', S.theme); }
  // #rp=files 之类：打开当前上下文的某个右栏标签；#rp=off 收起右栏；#obj=1 展开「+」菜单
  if (h.get('rp')) {
    if (h.get('rp') === 'off') S.rpOpen = false;
    else if (h.get('rp') === 'empty') { const x = rpCtx(); x.tabs = []; x.active = null; }
    else openKind(h.get('rp'));
  }
  if (h.get('obj')) S.objMenu = true;
  render();
  $('send').disabled = true;
  // 标签栏变宽变窄（窗口缩放、右栏开合）时，重新判断放不放得下，并让当前标签留在视野里
  new ResizeObserver(() => { revealTab(S.tab); updateTabOverflow(); }).observe($('tabs'));
  // 标签栏：滚轮横向滚动，不显示滚动条
  $('tabs').addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    $('tabs').scrollLeft += e.deltaY;
  }, { passive: false });
  $('tabs').addEventListener('scroll', () => updateTabOverflow());
  window.__S = S;
})();
</script>
</html>
