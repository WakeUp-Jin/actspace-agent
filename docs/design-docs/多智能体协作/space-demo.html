<!doctype html>
<!-- 文档状态：已实施的前端演示（2026-10-07）；数据为 mock，不作为 Runtime 事实或接口契约。 -->
<html lang="zh-CN">
<title>Space 工作台</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Space 工作台 demo（2026-10-07 按桌面端现有左栏、输入框、右栏改版）
   左栏：新建会话 → 新建 Space → 扩展 → Actor 名册 → Space 列表 → 已置顶 → 工作区，样式和桌面端现有左栏一致
   中栏：标签页（第一个是协调 Agent，其余是 Space 里的 Actor）；名册页和一对一对话也在这里；输入框是现有 Composer
   右栏：现有右栏的标签体系。协调 Agent 标签页下是 Actor / 库 / 记忆 / 文件 / 终端；Actor 标签页和一对一对话下和普通会话一样
   颜色沿用 Ink & Emerald token：翡翠绿只用于工作中与成功，琥珀只用于等你决定，红只用于出错。
   头像：Space 与协调 Agent 用 Space 图；成熟 Actor 用桌面端现有九张角色图；Space 里生成的 Actor 用五色小球，按 id 固定分配颜色。 */

:root {
  --bg: #f7f7f5; --surface: #ffffff; --subtle: #f1f1ef; --raised: #ffffff; --sidebar: #efefed;
  --selected: #e4e4e1; --hover: #eaeae7; --line: #deded9; --line-strong: #8c8c85;
  --text: #20201e; --muted: #676762; --faint: #72726b; --subtle-text: #85857e;
  --action: #20201e; --action-hover: #343430; --on-action: #ffffff;
  --op: #087a4b; --op-soft: #e5f2ea; --info: #3978b8; --info-soft: #e8f1f9;
  --warn: #91600e; --warn-soft: #f7eedb; --danger: #c74747; --danger-soft: #f8e9e9;
  --overlay: rgba(17, 24, 39, .32);
  --shadow-pop: 0 24px 64px rgba(20, 21, 18, .14);
  --shadow-card: 0 1px 2px rgba(20, 21, 18, .06);
  /* 星空：深色是星点，浅色换成极淡的点阵 */
  --stars-o: 0; --grid-o: 1; --grid-dot: rgba(32, 32, 30, .16); --spark: #3b4a9c;
  /* 现有 Composer 的边框与阴影；对话内容宽 880px */
  --composer-line: rgb(0 0 0 / .07); --composer-line-focus: rgb(0 0 0 / .11);
  --shadow-composer: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px -4px rgb(0 0 0 / .06);
  --shadow-composer-focus: 0 1px 2px rgb(0 0 0 / .05), 0 8px 28px -6px rgb(0 0 0 / .1);
  --cw: 880px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181916; --surface: #242522; --subtle: #292a26; --raised: #30312d; --sidebar: #1e1f1c;
    --selected: #30312d; --hover: #2a2b27; --line: #353630; --line-strong: #787870;
    --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle-text: #787870;
    --action: #f1f1ed; --action-hover: #dbdbd5; --on-action: #181916;
    --op: #36c783; --op-soft: #193a2b; --info: #6ca6da; --info-soft: #1e3345;
    --warn: #d2a14d; --warn-soft: #3e321c; --danger: #e06b6b; --danger-soft: #452525;
    --overlay: rgba(0, 0, 0, .55);
    --shadow-pop: 0 24px 64px rgba(0, 0, 0, .5);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .4);
    --stars-o: 1; --grid-o: 0; --spark: #eef1ff;
    --composer-line: rgb(255 255 255 / .07); --composer-line-focus: rgb(255 255 255 / .12);
    --shadow-composer: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px -6px rgb(0 0 0 / .4);
    --shadow-composer-focus: 0 1px 2px rgb(0 0 0 / .35), 0 10px 32px -6px rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181916; --surface: #242522; --subtle: #292a26; --raised: #30312d; --sidebar: #1e1f1c;
  --selected: #30312d; --hover: #2a2b27; --line: #353630; --line-strong: #787870;
  --text: #f1f1ed; --muted: #b5b5ae; --faint: #96968f; --subtle-text: #787870;
  --action: #f1f1ed; --action-hover: #dbdbd5; --on-action: #181916;
  --op: #36c783; --op-soft: #193a2b; --info: #6ca6da; --info-soft: #1e3345;
  --warn: #d2a14d; --warn-soft: #3e321c; --danger: #e06b6b; --danger-soft: #452525;
  --overlay: rgba(0, 0, 0, .55);
  --shadow-pop: 0 24px 64px rgba(0, 0, 0, .5);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .4);
  --stars-o: 1; --grid-o: 0; --spark: #eef1ff;
  --composer-line: rgb(255 255 255 / .07); --composer-line-focus: rgb(255 255 255 / .12);
  --shadow-composer: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px -6px rgb(0 0 0 / .4);
  --shadow-composer-focus: 0 1px 2px rgb(0 0 0 / .35), 0 10px 32px -6px rgb(0 0 0 / .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.xs { width: 12px; height: 12px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--line-strong) 40%, transparent); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--line-strong) 70%, transparent); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 头像 ---------- */
/* 头像回答「是谁」，状态由分组、光环和文字表达；图片颜色不承担状态含义 */
.av { position: relative; flex: none; display: inline-block; border-radius: 28%; }
.av > img { width: 100%; height: 100%; border-radius: inherit; display: block; object-fit: cover; }
.av16 { width: 16px; height: 16px; border-radius: 4px; } .av18 { width: 18px; height: 18px; border-radius: 5px; }
.av22 { width: 22px; height: 22px; border-radius: 6px; } .av36 { width: 36px; height: 36px; }
.av40 { width: 40px; height: 40px; } .av56 { width: 56px; height: 56px; }
/* 工作中：一圈缓慢转动的翡翠绿光环，替代转圈和状态点 */
@property --ring-a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.av.working::after {
  content: ""; position: absolute; inset: -3px; border-radius: 9px; padding: 1.5px;
  background: conic-gradient(from var(--ring-a), transparent 0 50%, var(--op) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: ring-spin 2.4s linear infinite;
}
.av18.working::after { inset: -2.5px; border-radius: 7px; }
.av36.working::after, .av40.working::after { inset: -3.5px; border-radius: 13px; padding: 2px; }
@keyframes ring-spin { to { --ring-a: 360deg; } }
.av.pop { animation: av-pop .5s cubic-bezier(.3, 1.5, .4, 1) both; }
@keyframes av-pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 星空 ---------- */
.sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 30%, transparent 100%);
  mask-image: radial-gradient(ellipse 70% 62% at 50% 46%, #000 30%, transparent 100%); }
.sky::before, .sky::after { content: ""; position: absolute; inset: -800px; opacity: var(--stars-o); background-repeat: repeat; }
.sky::before { animation: drift-a 200s linear infinite; }
.sky::after { animation: drift-b 300s linear infinite, twinkle 7s ease-in-out infinite; }
.sky .dots { position: absolute; inset: 0; opacity: var(--grid-o); background-image: radial-gradient(circle at 1px 1px, var(--grid-dot) 1px, transparent 1.6px); background-size: 20px 20px; }
@keyframes drift-a { to { transform: translate(520px, 520px); } }
@keyframes drift-b { to { transform: translate(-760px, 760px); } }
@keyframes twinkle { 50% { opacity: calc(var(--stars-o) * .45); } }

/* ---------- 骨架 ---------- */
.app { position: relative; display: grid; grid-template-columns: 260px minmax(0, 1fr) 0px; height: 100%; overflow: hidden; transition: grid-template-columns .26s var(--ease); }
.app.rp-open { grid-template-columns: 260px minmax(0, 1fr) 390px; }
.sb { grid-column: 1; grid-row: 1; } .main { grid-column: 2; grid-row: 1; } .rp { grid-column: 3; grid-row: 1; }
.sb-scrim { display: none; position: absolute; inset: 0; background: var(--overlay); z-index: 19; }
/* 名册页不需要右栏和输入框；一对一对话和普通会话一样有右栏 */
.app.view-roster .dock, .app.view-roster .chrome-right { display: none; }
.app.solo .pills, .app.solo .tray { display: none; }

/* ---------- 左栏：和桌面端现有左栏一致 ---------- */
.sb { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.sb-chrome { height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 14px; flex: none; }
.lights { display: flex; gap: 7px; margin-right: 22px; }
.lights i { width: 12px; height: 12px; border-radius: 99px; background: var(--line); cursor: default; }
.cb { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.cb:hover { background: var(--hover); color: var(--text); }
.cb svg.i { width: 15px; height: 15px; stroke-width: 1.8; }
.cb[aria-pressed="true"], .cb[aria-expanded="true"] { color: var(--text); background: var(--hover); }
.cb.off { opacity: .45; }
.ib { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; position: relative; }
.ib:hover { background: var(--hover); color: var(--text); }

.sb-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 8px 10px 10px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.pa-group { display: flex; flex-direction: column; gap: 1px; }
.pa { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border-radius: 8px; width: 100%; font-size: 13px; font-weight: 500; color: var(--muted); }
.pa:hover { background: var(--hover); color: var(--text); }
.pa[aria-current="true"] { background: var(--selected); color: var(--text); font-weight: 600; }
.pa svg.i { width: 14px; height: 14px; stroke-width: 1.9; }
.pa .kbd, .pa .cnt { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--faint); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.pa .stack { width: 14px; }
.sec { display: flex; flex-direction: column; gap: 2px; }
.sec-head { display: flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 2px 0 8px; font-size: 12px; font-weight: 500; line-height: 16px; color: var(--faint); }
.sec-head .acts { margin-left: auto; display: flex; gap: 4px; opacity: 0; transition: opacity .12s ease; }
.sec-head:hover .acts, .sec-head:focus-within .acts { opacity: 1; }
.sec-head .ib { width: 22px; height: 22px; color: var(--faint); }
.sec-head .ib svg.i { width: 13px; height: 13px; stroke-width: 1.9; }
.demo-tag { height: 16px; padding: 0 5px; border-radius: 4px; background: var(--info-soft); color: var(--info); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; }
/* Space 行 */
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: 8px; width: 100%; color: var(--muted); }
.row:hover { background: var(--hover); color: var(--text); }
.row[aria-current="true"] { background: var(--selected); color: var(--text); }
.row .ico { display: flex; justify-content: center; }
.row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 13px; }
.row .right { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 工作区与会话行 */
.ws-row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 26px; padding: 0 8px; border-radius: 6px; font-size: 13px; color: var(--muted); width: 100%; }
.ws-row:hover { color: var(--text); }
.ws-row svg.i { width: 13px; height: 13px; }
.srow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 36px; padding: 0 8px; border-radius: 8px; width: 100%; color: var(--muted); }
.srow:hover { background: var(--hover); color: var(--text); }
.srow[aria-current="true"] { background: var(--selected); color: var(--text); }
.srow .t { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .tm { font-size: 11px; color: var(--faint); min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
.srow .mk { display: flex; justify-content: center; }
.srow .mk i { width: 6px; height: 6px; border-radius: 99px; background: var(--op); }
.av14 { width: 14px; height: 14px; border-radius: 4px; }
.stack { display: flex; }
.stack .av { box-shadow: 0 0 0 1.5px var(--sidebar); }
.stack .av + .av { margin-left: -6px; }
.stack .av12 { width: 12px; height: 12px; border-radius: 3.5px; }
.badge-warn { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.unread-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--info); flex: none; }

.sb-foot { flex: none; padding: 6px 8px 10px 10px; display: flex; align-items: center; gap: 2px; }
.sb-foot .pa { width: auto; flex: 1; }
.theme-btn { padding: 4px 7px; border-radius: 5px; font-size: 11px; color: var(--faint); }
.theme-btn:hover { background: var(--hover); color: var(--text); }
.theme-btn[aria-pressed="true"] { background: var(--selected); color: var(--text); }

/* ---------- 中栏 ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.tabbar { height: 44px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 2px; padding: 0 8px; min-width: 0; flex: none; transition: padding .26s var(--ease); }
/* 右栏收起时，右上角的开关落在标签栏里，给它留位置 */
.app:not(.rp-open) .tabbar { padding-right: 46px; }
.app.view-roster .tabbar { padding-right: 8px; }
/* 开发中演示：常驻一行 */
.demo-note { flex: none; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); background: var(--info-soft); font-size: 12px; color: var(--muted); }
.demo-note svg.i { width: 14px; height: 14px; color: var(--info); }
.demo-note b { color: var(--text); font-weight: 500; }
.demo-note .link-btn { margin-left: auto; }
.tab-strip { display: flex; align-items: center; gap: 2px; min-width: 0; margin-right: auto; position: relative; }
.tab-lead { flex: none; display: flex; padding: 4px 0 4px 3px; }
.tabs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 4px 3px; }
.tabs::-webkit-scrollbar { display: none; }
/* 放不下时，被挡住的一侧渐隐，提示还有标签 */
.tabs.fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.tabs.fade-l { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px); mask-image: linear-gradient(to right, transparent, #000 28px); }
.tabs.fade-l.fade-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
.ib[aria-expanded="true"] { background: var(--selected); color: var(--text); }
/* 全部标签菜单 */
.tab-menu { position: absolute; top: calc(100% + 2px); right: 0; z-index: 30; width: 260px; max-height: 360px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); box-shadow: var(--shadow-pop); animation: drop .16s var(--ease) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.tm-top { display: flex; align-items: center; width: 100%; height: 30px; padding: 0 8px; margin-bottom: 4px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.tm-top:hover { background: var(--hover); color: var(--text); }
.tm-sep { height: 1px; background: var(--line); margin: 0 4px 4px; }
.tm-row { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 6px 0 8px; border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
.tm-row:hover { background: var(--hover); }
.tm-row.seen { color: var(--muted); }
.tm-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-row .ck { width: 14px; display: flex; color: var(--text); flex: none; }
.tm-row .x { width: 20px; height: 20px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); flex: none; opacity: 0; }
.tm-row:hover .x { opacity: 1; }
.tm-row .x:hover { background: var(--selected); color: var(--text); }
.tab { height: 30px; padding: 0 8px 0 6px; border-radius: 7px; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; flex: none; max-width: 220px; position: relative; cursor: pointer; transition: background .14s var(--ease), color .14s var(--ease); }
.tab:hover { background: var(--hover); color: var(--text); }
.tab[aria-selected="true"] { background: var(--selected); color: var(--text); }
.tab .lbl { overflow: hidden; text-overflow: ellipsis; }
.tab .lbl.lead { font-weight: 600; }
.tab .x { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); flex: none; opacity: 0; transition: opacity .12s ease; }
.tab:hover .x, .tab[aria-selected="true"] .x { opacity: 1; }
.tab .x:hover { background: var(--hover); color: var(--text); }

.flow { flex: 1; overflow-y: auto; min-height: 0; position: relative; }
.column { max-width: calc(var(--cw) + 64px); margin: 0 auto; padding: 22px 32px 8px; display: flex; flex-direction: column; gap: 14px; }

.user-msg { align-self: flex-end; max-width: 88%; border: 1px solid var(--line); border-radius: 12px 12px 4px 12px; background: var(--surface); padding: 9px 14px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; box-shadow: var(--shadow-card); }
.coord-msg { font-size: 14px; line-height: 1.66; }
.coord-msg p { margin: 0; overflow-wrap: anywhere; }
.divider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--faint); padding: 2px 0; font-variant-numeric: tabular-nums; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divider .i { color: var(--op); }
.divider.task { color: var(--muted); }
.aref { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px 0 3px; margin-inline: 1px; border-radius: 6px; background: var(--subtle); font-size: 13px; line-height: 22px; color: var(--text); vertical-align: -1px; transition: background .14s var(--ease); }
.aref:hover { background: var(--hover); }
.mem-note { display: flex; align-items: flex-start; gap: 8px; padding: 7px 12px; border-radius: 8px; background: var(--subtle); font-size: 13px; color: var(--muted); }
.mem-note .i { margin-top: 2px; color: var(--op); flex: none; }
.mem-note .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mem-note .txt b { color: var(--text); font-weight: 500; }
.mem-note.undone .txt { text-decoration: line-through; color: var(--faint); }
.link-btn { font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.link-btn:hover { background: var(--hover); color: var(--text); }

.typing { display: inline-flex; gap: 3px; align-items: center; height: 22px; }
.typing i { width: 5px; height: 5px; border-radius: 99px; background: var(--faint); animation: bounce 1.1s var(--ease) infinite; }
.typing i:nth-child(2) { animation-delay: .14s; } .typing i:nth-child(3) { animation-delay: .28s; }
.caret { display: inline-block; width: 2px; height: 15px; background: var(--text); margin-left: 2px; vertical-align: -2px; animation: blink 1s step-end infinite; }
@keyframes bounce { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
@keyframes blink { 50% { opacity: 0; } }

/* 留下 Space 里生成的 Actor：星尘聚拢成角色 */
.keep { display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-card); }
.keep .txt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.55; }
.keep .txt small { display: block; font-size: 12px; color: var(--faint); }
.keep .acts { display: flex; gap: 6px; flex: none; }
.keep.quiet { background: none; box-shadow: none; border-style: dashed; }
.keep.quiet .txt { color: var(--faint); }
.grow-av { position: relative; width: 40px; height: 40px; flex: none; }
.grow-av img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 28%; }
.grow-av .to { opacity: 0; }
.grow-av.kept .from { opacity: 0; } .grow-av.kept .to { opacity: 1; }
.grow-av .sp { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 99px; background: var(--spark); box-shadow: 0 0 6px var(--spark); opacity: 0; }
.growing .from { animation: g-from .45s var(--ease) forwards; }
.growing .sp { animation: g-conv .6s var(--ease) forwards; animation-delay: calc(var(--i) * 28ms); }
.growing .to { animation: g-to .5s cubic-bezier(.3, 1.5, .4, 1) .42s forwards; }
.growing .acts { opacity: .4; pointer-events: none; }
@keyframes g-from { to { transform: scale(.5); opacity: 0; filter: blur(1px); } }
@keyframes g-conv { 0% { transform: translate(var(--x), var(--y)); opacity: 0; } 35% { opacity: 1; } 100% { transform: none; opacity: 0; } }
@keyframes g-to { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }

/* 空 Space：星空 + 成员 */
.blank-wrap { position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.blank { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 48px 24px; text-align: center; }
.blank h2 { margin: 0; font-size: 17px; font-weight: 600; }
.blank p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 46ch; }
.blank .hint2 { color: var(--faint); font-size: 12px; margin: 0; }
.crew { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.crew button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.crew .av { animation: float 5s ease-in-out infinite; }
.crew button:nth-child(2) .av { animation-delay: -1.6s; } .crew button:nth-child(3) .av { animation-delay: -3.1s; } .crew button:nth-child(4) .av { animation-delay: -.8s; }
@keyframes float { 50% { transform: translateY(-4px); } }

/* ---------- Actor 标签页 ---------- */
.agent-head { flex: none; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 12px; align-items: flex-start; }
.agent-head .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.agent-head .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.agent-head h1 { margin: 0; font-size: 15px; font-weight: 600; }
.agent-head .scene { font-size: 12px; color: var(--muted); }
.agent-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12px; color: var(--faint); }
.agent-head .meta > span { display: inline-flex; align-items: center; gap: 5px; }
.agent-head .meta b { color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { height: 20px; padding: 0 7px; border-radius: 5px; background: var(--subtle); font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; white-space: nowrap; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; }
.status-chip .dot { width: 6px; height: 6px; }
.st-run { background: var(--op-soft); color: var(--op); }
.st-result { background: var(--op-soft); color: var(--op); }
.st-wait { background: var(--warn-soft); color: var(--warn); }
.st-idle { background: var(--subtle); color: var(--muted); }
.st-fail { background: var(--danger-soft); color: var(--danger); }

.brief { border-radius: 8px; background: var(--subtle); padding: 9px 12px; font-size: 13px; line-height: 1.6; }
.brief small { display: block; font-size: 11px; color: var(--faint); margin-bottom: 3px; letter-spacing: .02em; }
.aline { font-size: 12px; color: var(--muted); display: flex; gap: 7px; flex-wrap: wrap; overflow-wrap: anywhere; align-items: baseline; }
.aline .k { color: var(--faint); flex: none; min-width: 34px; }
.aline code { color: var(--text); }
.diff { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.diff .a { color: var(--op); } .diff .d { color: var(--danger); }
.atext { font-size: 14px; line-height: 1.66; overflow-wrap: anywhere; }
.sync { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--faint); }
.sync::before, .sync::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.quiet-empty { color: var(--faint); font-size: 13px; text-align: center; padding: 30px 0; }

.approval-card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow-card); }
.approval-card .ac-head { display: flex; align-items: center; gap: 8px; padding: 10px 13px 6px; font-size: 13px; font-weight: 600; }
.approval-card .ac-head .i { color: var(--warn); flex: none; }
.approval-card pre { margin: 0 13px; padding: 9px 11px; border-radius: 7px; background: var(--subtle); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.approval-card .ac-why { margin: 9px 13px 0; font-size: 12px; color: var(--faint); line-height: 1.55; }
.approval-card .ac-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 11px 13px; }
.approval-card .ac-done { padding: 9px 13px 11px; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }

/* 一对一对话：Actor 自我介绍 */
.solo-intro { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 26px 0 12px; }
.solo-intro h2 { margin: 6px 0 0; font-size: 16px; font-weight: 600; }
.solo-intro p { margin: 0; font-size: 13px; color: var(--muted); max-width: 40ch; }

/* ---------- 名册页 ---------- */
.roster { max-width: 980px; margin: 0 auto; padding: 26px 24px 48px; }
.roster-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.roster-head h1 { margin: 0; font-size: 18px; font-weight: 600; }
.roster-head .n { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.roster-head .search { margin-left: auto; position: relative; width: min(240px, 46%); }
.roster-head .search .i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.roster-head .search input { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 10px 0 28px; outline: none; font-size: 13px; }
.roster-head .search input:focus { border-color: var(--line-strong); }
.roster .lead { margin: 0 0 18px; color: var(--faint); font-size: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: border-color .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease); }
.card:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: var(--shadow-card); }
.card .top { display: flex; gap: 12px; align-items: center; min-width: 0; }
.card .nm { font-size: 14px; font-weight: 600; }
.card .sc { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { font-size: 11px; color: var(--faint); margin-top: auto; }
.card.fresh { animation: card-new 1.8s var(--ease); }
@keyframes card-new { 0% { border-color: var(--op); box-shadow: 0 0 0 3px var(--op-soft); } 100% { border-color: var(--line); box-shadow: none; } }
.cards .none { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--faint); }

/* 输入区：托盘 → 胶囊 → 现有 Composer → 状态行 */
.dock { flex: none; padding: 0 32px 14px; display: flex; flex-direction: column; gap: 0; }
.tray { margin: 0 auto; width: 100%; max-width: var(--cw); border: 1px solid color-mix(in srgb, var(--warn) 25%, var(--line)); border-radius: 12px; background: var(--warn-soft); overflow: hidden; max-height: 0; opacity: 0; border-width: 0; transition: max-height .26s var(--ease), opacity .18s var(--ease), padding .26s var(--ease), margin .26s var(--ease); padding: 0 14px; }
.tray.open { border-width: 1px; max-height: 160px; opacity: 1; padding: 10px 12px 10px 12px; margin-bottom: 8px; }
.tray-row { display: flex; align-items: center; gap: 10px; }
.tray .grow { flex: 1; min-width: 0; }
.tray .t1 { font-size: 13px; font-weight: 500; color: var(--text); }
.tray .t2 { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tray .acts { display: flex; align-items: center; gap: 6px; flex: none; }
.pager { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn { height: 28px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--text); transition: background .14s var(--ease), border-color .14s var(--ease); }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--action); color: var(--on-action); border-color: var(--action); }
.btn.primary:hover { background: var(--action-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.nav { width: 26px; padding: 0; justify-content: center; }

.pills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: var(--cw); margin: 0 auto; padding: 0 0 8px; width: 100%; }
.pill { height: 26px; padding: 0 10px; border-radius: 99px; background: var(--subtle); font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; transition: background .14s var(--ease), color .14s var(--ease), transform .14s var(--ease); }
.pill:hover { background: var(--hover); color: var(--text); }
.pill.warn { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.pill.warn.flash { animation: nudge .5s var(--ease) 2; }
.pill[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--line-strong); }
@keyframes nudge { 50% { transform: translateY(-2px); } }

/* 现有 Composer：单行是胶囊形 [+ | 输入 | 发送]；多行变 18px 圆角，第二行是 + · 模型 · 发送 */
.composer { max-width: var(--cw); margin: 0 auto; width: 100%; border: 1px solid var(--composer-line); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-composer); display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; align-items: center; column-gap: 4px; padding: 8px; min-height: 46px; transition: border-color .12s ease, box-shadow .12s ease; }
.composer:focus-within { border-color: var(--composer-line-focus); box-shadow: var(--shadow-composer-focus); }
.composer textarea { border: 0; outline: none; background: none; resize: none; width: 100%; min-height: 34px; max-height: 200px; line-height: 20px; font-size: 16px; padding: 7px 6px; display: block; }
.composer textarea::placeholder { color: var(--subtle-text); }
.composer.stacked { border-radius: 18px; grid-template-columns: 28px auto minmax(0, 1fr) 28px; row-gap: 4px; }
.composer.stacked textarea { grid-column: 1 / -1; grid-row: 1; }
.composer.stacked .cplus { grid-row: 2; grid-column: 1; }
.composer.stacked .model { display: inline-flex; grid-row: 2; grid-column: 2; }
.composer.stacked .send { grid-row: 2; grid-column: 4; }
.cplus { width: 28px; height: 28px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); }
.cplus:hover { background: var(--hover); color: var(--text); }
.cplus svg.i { width: 17px; height: 17px; stroke-width: 2.1; }
.model { display: none; align-items: center; gap: 4px; height: 32px; padding: 0 6px; border-radius: 99px; font-size: 14px; font-weight: 500; color: var(--muted); }
.model:hover { color: var(--text); }
.send { width: 28px; height: 28px; border-radius: 99px; background: var(--action); color: var(--on-action); display: inline-flex; align-items: center; justify-content: center; flex: none; transition: transform .12s var(--ease), opacity .12s ease; }
.send:hover { background: var(--action-hover); }
.send svg.i { width: 15px; height: 15px; stroke-width: 2.4; }
.send:active { transform: scale(.94); }
.send:disabled { opacity: .35; cursor: default; }
.status-row { max-width: var(--cw); width: 100%; margin: 6px auto 0; min-height: 28px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--faint); }
.status-row .facts { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.status-row .f { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.status-row .f > span { overflow: hidden; text-overflow: ellipsis; }
.status-row .f svg.i { width: 14px; height: 14px; stroke-width: 2; color: var(--subtle-text); }
.status-row .sep { opacity: .6; }
.perm { height: 28px; padding: 0 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--faint); }
.perm:hover { background: var(--hover); color: var(--text); }
.perm svg.i { width: 14px; height: 14px; }
.pct { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px; border-radius: 6px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
button.pct:hover { background: var(--hover); color: var(--text); }
.ctx-ring { width: 15px; height: 15px; border-radius: 99px; background: conic-gradient(var(--muted) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5px); mask: radial-gradient(circle, transparent 4.5px, #000 5px); }

/* 状态点：只出现在胶囊和标签页 */
.dot { width: 7px; height: 7px; border-radius: 99px; display: inline-block; flex: none; }
.dot.run { background: var(--op); animation: pulse 1.4s ease-in-out infinite; }
.dot.wait { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
.dot.result { background: none; border: 1.5px solid var(--op); }
.dot.idle { background: var(--faint); opacity: .55; }
.dot.fail { background: var(--danger); }
@keyframes pulse { 50% { opacity: .4; } }

/* ---------- 右栏：沿用桌面端现有右栏（标签行 + 内容 / 启动页） ---------- */
.rp { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.app:not(.rp-open) .rp { border-left-color: transparent; }
.rp-tabs { min-height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 72px 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.rp-tabs::-webkit-scrollbar { display: none; }
.rp-tabs .empty-lbl { font-size: 13px; font-weight: 500; color: var(--muted); padding: 0 8px; white-space: nowrap; }
.rtab { height: 30px; border-radius: 8px; padding: 0 6px 0 10px; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; flex: none; cursor: pointer; }
.rtab .lbl { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.rtab:hover { background: var(--hover); color: var(--text); }
.rtab[aria-selected="true"] { background: var(--subtle); color: var(--text); font-weight: 500; }
.rtab .x { width: 16px; height: 16px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); opacity: 0; }
.rtab:hover .x { opacity: 1; }
.rtab .x:hover { background: var(--line); color: var(--text); }
.rp-body { flex: 1; overflow-y: auto; min-height: 0; padding: 10px 10px 18px; }
.rp-body.flush { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
/* 窗口右上角：新建对象 + 开合右栏，和现有标题栏一致 */
.chrome-right { position: absolute; top: 11px; right: 12px; z-index: 26; display: flex; gap: 4px; }
.obj-menu { position: absolute; top: 38px; right: 12px; z-index: 31; width: 188px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); box-shadow: var(--shadow-pop); animation: drop .16s var(--ease) both; }
.obj-menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border-radius: 6px; font-size: 13px; color: var(--text); }
.obj-menu button:hover { background: var(--hover); }
.obj-menu svg.i { width: 15px; height: 15px; stroke-width: 1.9; color: var(--muted); }
/* 启动页 */
.launcher { flex: 1; display: flex; flex-direction: column; gap: 1px; padding: 10px; background: var(--surface); overflow-y: auto; }
.launcher .cap { margin: 2px 0 6px; padding: 0 8px; font-size: 12px; color: var(--faint); line-height: 1.6; }
.launcher .cap b { color: var(--muted); font-weight: 500; }
/* 启动页（Space 和普通会话共用，2026-10-07 改）：白底列表，行样式和右栏列表一致，切换标签页时不再整块换底色、换布局 */
.lt { display: grid; grid-template-columns: 16px auto minmax(0, 1fr); align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 7px; width: 100%; font-size: 13px; font-weight: 500; color: var(--text); }
.lt svg.i { width: 15px; height: 15px; stroke-width: 1.8; color: var(--faint); }
.lt small { font-size: 12px; font-weight: 400; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lt:hover { background: var(--hover); }
.lt:hover svg.i { color: var(--muted); }
/* 文件树 */
.ft-head { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 6px; border-bottom: 1px solid var(--line); }
.ft-filter { flex: 1; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; color: var(--faint); }
.ft-filter:hover, .ft-filter:focus-within { background: var(--subtle); }
.ft-filter input { border: 0; outline: 0; background: none; font-size: 12px; width: 100%; }
.ft-filter svg.i { width: 12px; height: 12px; }
.ft-head .ib { width: 24px; height: 24px; } .ft-head .ib svg.i { width: 13px; height: 13px; }
.ft-body { flex: 1; overflow-y: auto; padding: 4px 0; }
.ft-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 8px 4px 0; font-size: 12px; line-height: 16px; color: var(--muted); }
.ft-row:hover { background: var(--hover); color: var(--text); }
.ft-row[aria-current="true"] { background: var(--selected); color: var(--text); font-weight: 600; }
.ft-row svg.i.chev { width: 13px; height: 13px; transition: transform .14s var(--ease); }
.ft-row.open svg.i.chev { transform: rotate(90deg); }
.ft-row .sp13 { width: 13px; flex: none; }
.ft-row svg.i.t { width: 14px; height: 14px; color: var(--faint); }
.ft-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ft-row.root { color: var(--text); font-weight: 500; }
.ft-bar { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--faint); min-width: 0; white-space: nowrap; overflow: hidden; }
.ft-bar b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.ft-bar svg.i { width: 12px; height: 12px; }
.code { margin: 0; padding: 10px 0; font-family: var(--mono); font-size: 12px; line-height: 1.7; counter-reset: ln; overflow: auto; flex: 1; }
.code .l { display: block; padding-right: 14px; white-space: pre; }
.code .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 34px; margin-right: 14px; text-align: right; color: var(--subtle-text); }
/* 终端 */
.term { flex: 1; overflow-y: auto; padding: 10px 12px; font-family: var(--mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.term .p { color: var(--op); }
.term .dim { color: var(--faint); }
.term .cur { display: inline-block; width: 7px; height: 15px; background: var(--text); vertical-align: -3px; animation: blink 1s step-end infinite; }
.term-foot { flex: none; min-height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border-top: 1px solid var(--line); background: var(--subtle); font-size: 11px; color: var(--faint); }
.term-foot .ib { width: 22px; height: 22px; margin-left: auto; } .term-foot .ib svg.i { width: 12px; height: 12px; }
/* Review、上下文 */

    else if (r.right > b.right - 28) strip.scrollLeft += r.right - (b.right - 28);
  }
  // 「全部标签」按钮只在放不下时出现
  function updateTabOverflow() {
    const strip = $('tabs');
    const over = strip.scrollWidth > strip.clientWidth + 1;
    if (!over) S.tabMenu = false;
    $('tabMore').hidden = !over;
    $('tabMore').setAttribute('aria-expanded', String(!!S.tabMenu));
    strip.classList.toggle('fade-l', over && strip.scrollLeft > 1);
    strip.classList.toggle('fade-r', over && strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 1);
    renderTabMenu();
  }
  function renderTabMenu() {
    const menu = $('tabMenu');
    menu.hidden = !S.tabMenu;
    if (!S.tabMenu) { menu.innerHTML = ''; return; }
    const c = cur(), strip = $('tabs'), b = strip.getBoundingClientRect();
    // 能看到的标签灰一点，被挡住的保持正常字色
    const seen = id => {
      const t = strip.querySelector(`[data-id="${id}"]`);
      if (!t) return true;
      const r = t.getBoundingClientRect();
      return r.left >= b.left - 1 && r.right <= b.right + 1;
    };
    const check = id => `<span class="ck">${S.tab === id ? ic('check', 'xs') : ''}</span>`;
    const others = tabsOf(c).filter(id => id !== S.tab);
    menu.innerHTML = `
      ${others.length ? '<button type="button" class="tm-top" data-act="tm-close-others">关闭其他标签</button><div class="tm-sep"></div>' : ''}
      <div class="tm-row seen" data-act="tm-pick" data-id="coord">${check('coord')}${spaceAv(c, 18)}<span class="nm">${esc(c.name)}</span></div>
      ${tabsOf(c).map(id => {
        const m = member(id);
        return `<div class="tm-row${seen(id) ? ' seen' : ''}" data-act="tm-pick" data-id="${id}">${check(id)}${av(id, 18, { working: m.status === 'run' })}<span class="nm">${esc(nameOf(id))}</span>${tabDot(m)}<button type="button" class="x" data-act="tm-close" data-id="${id}" aria-label="关闭">${ic('x', 'xs')}</button></div>`;
      }).join('')}`;
  }

  /* ============ 中栏 ============ */
  function renderFlow() {
    const scroll = $('flow');
    const atBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
    if (S.view === 'roster') { scroll.innerHTML = renderRoster(); renderCards(); return; }
    if (S.view === 'chat') { scroll.innerHTML = renderSoloChat(); if (atBottom || S.stream) scroll.scrollTop = scroll.scrollHeight; S.stream = null; return; }
    const c = cur();
    if (S.tab === 'coord') {
      if (c.msgs.length === 0) { scroll.innerHTML = renderBlank(c); return; }
      scroll.innerHTML = `<div class="column">${c.msgs.map(m => renderMsg(m, c)).join('')}</div>`;
    } else {
      const m = member(S.tab);
      if (!m) { S.tab = 'coord'; return renderFlow(); }
      scroll.innerHTML = `${renderAgentHead(m)}<div class="column">
        ${m.transcript.length ? m.transcript.map(b => renderBlock(b, m)).join('') : `<div class="quiet-empty">在这个 Space 里还没有交给 ${esc(nameOf(m.id))} 的事。</div>`}
      </div>`;
    }
    if (S.stream) { S.stream = null; scroll.scrollTop = scroll.scrollHeight; }
    else if (atBottom) scroll.scrollTop = scroll.scrollHeight;
  }
  function renderMsg(m, c) {
    if (m.k === 'div') return `<div class="divider">${esc(m.t)}</div>`;
    if (m.k === 'user') return `<div class="user-msg">${esc(m.t)}</div>`;
    if (m.k === 'mem') {
      const gone = m.undone;
      return `<div class="mem-note${gone ? ' undone' : ''}">${ic('check')}<span class="txt">记下了「<b>${esc(m.t)}</b>」${gone ? ' · 已撤销' : ''}</span>${gone ? '' : `<button type="button" class="link-btn" data-act="undo-mem" data-id="${m.mid}">撤销</button>`}</div>`;
    }
    if (m.k === 'keep') return renderKeep(m);
    let body;
    if (m.typing) body = `<div class="typing"><i></i><i></i><i></i></div>`;
    else if (m.shown != null) body = `<p>${esc(m.plain.slice(0, m.shown))}<span class="caret"></span></p>`;
    else body = `<p>${renderInline(m.t)}</p>`;
    return `<div class="coord-msg">${body}</div>`;
  }
  // 协调 Agent 只问一次：要不要把这个新起的 Actor 留下
  function renderKeep(m) {
    const a = actor(m.aid);
    const name = esc(a.name);
    const sparks = Array.from({ length: 8 }, (_, i) => {
      const ang = i / 8 * Math.PI * 2;
      return `<i class="sp" style="--i:${i};--x:${(Math.cos(ang) * 26).toFixed(1)}px;--y:${(Math.sin(ang) * 26).toFixed(1)}px"></i>`;
    }).join('');
    const growAv = kept => `<div class="grow-av${kept ? ' kept' : ''}"><img class="from" src="${BALL(m.aid)}" alt=""><img class="to" src="${COMPANION(a.growImg || a.img)}" alt="">${sparks}</div>`;
    if (m.state === 'kept') return `<div class="keep">${growAv(true)}<div class="txt">留下了。<b>${name}</b> 现在在名册里，以后可以直接找它。</div><div class="acts"><button type="button" class="btn ghost" data-act="go-roster">去名册</button></div></div>`;
    if (m.state === 'declined') return `<div class="keep quiet"><div class="txt">没有留下 ${name}，它只留在这个 Space 里。</div></div>`;
    return `<div class="keep" data-keep="${m.aid}">${growAv(false)}
      <div class="txt"><b>${name}</b> 这次做完了，要不要留下它？<small>留下后它会进入名册，以后同类的事可以直接找它。</small></div>
      <div class="acts"><button type="button" class="btn ghost" data-act="decline-actor" data-id="${m.aid}">不用</button><button type="button" class="btn primary" data-act="keep-actor" data-id="${m.aid}">留下</button></div>
    </div>`;
  }
  function renderBlank(c) {
    return `<div class="blank-wrap"><div class="sky"><div class="dots"></div></div>
      <div class="blank">
        ${spaceAv(c, 56)}
        <div><h2>${esc(c.name)}</h2><p>为「${esc(c.goal || '一个还没写下的目标')}」而设</p></div>
        <div class="crew">${c.members.map(m => `<button type="button" data-act="open-agent" data-id="${m.id}">${av(m.id, 40)}${esc(nameOf(m.id))}</button>`).join('')}</div>
        <p class="hint2">说说要做什么，协调 Agent 会交给合适的 Actor。</p>
      </div></div>`;
  }
  function renderAgentHead(m) {
    const a = actor(m.id);
    return `<div class="agent-head">
      ${av(m.id, 40, { working: m.status === 'run' })}
      <div class="main-col">
        <div class="top"><h1>${esc(a.name)}</h1><span class="status-chip st-${m.status}"><span class="dot ${m.status}"></span>${STATUS[m.status]}</span></div>
        <div class="scene">${esc(a.scene)}</div>
        ${a.abilities.length ? `<div class="chips">${a.abilities.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
        <div class="meta">
          <span>${ic('folder', 'xs')} <b>${esc(m.dir)}</b></span>
          ${m.tree ? `<span>${ic('branch', 'xs')} 工作树 <b>${esc(m.tree)}</b></span>` : ''}
          ${a.nascent ? '<span>归属 <b>Space</b></span>' : `<span>${ic('brain', 'xs')} 自己的记忆 <b>${a.memN} 条</b></span>`}
        </div>
      </div>
    </div>`;
  }
  function renderBlock(b, m) {
    if (b.k === 'task') return `<div class="divider task">开始 · ${esc(b.t)} · ${esc(b.at)}</div>`;
    if (b.k === 'done') return `<div class="divider task">${ic('check', 'xs')}完成 · ${esc(b.t)} · ${esc(b.at)}</div>`;
    if (b.k === 'brief') return `<div class="brief"><small>协调 Agent 交来的事</small>${esc(b.t)}</div>`;
    if (b.k === 'line') return `<div class="aline"><span class="k">${esc(b.k1)}</span><code>${esc(b.t)}</code>${b.diff ? `<span class="diff"><span class="a">+${b.diff[0]}</span> <span class="d">−${b.diff[1]}</span></span>` : ''}</div>`;
    if (b.k === 'sync') return `<div class="sync">${esc(b.t)}</div>`;
    if (b.k === 'text') return `<div class="atext">${renderInline(b.t)}</div>`;
    if (b.k === 'approval') {
      if (m.status === 'wait' && m.approval) {
        return `<div class="approval-card">
          <div class="ac-head">${ic('shield')} 想运行一条命令</div>
          <pre>${esc(m.approval.cmd)}</pre>
          <p class="ac-why">${esc(m.approval.why)}</p>
          <div class="ac-acts">
            <button type="button" class="btn" data-act="deny-agent" data-id="${m.id}">拒绝</button>
            <button type="button" class="btn primary" data-act="run-agent" data-id="${m.id}">运行</button>
          </div>
        </div>`;
      }
      const doneTxt = m.denied ? '已拒绝这条命令，等你给别的方向。' : '已批准，继续往下做。';
      return `<div class="approval-card"><div class="ac-done">${ic(m.denied ? 'x' : 'check', 'xs')}${doneTxt}</div></div>`;
    }
    return '';
  }

  /* ============ 名册页 ============ */
  function renderRoster() {
    const n = Object.values(S.actors).filter(a => !a.nascent).length;
    return `<div class="roster">
      <div class="roster-head">
        <h1>Actor 名册</h1><span class="n">${n}</span>
        <label class="search">${ic('search')}<input id="rq" placeholder="找一个 Actor" value="${esc(S.q)}" aria-label="搜索 Actor"></label>
      </div>
      <p class="lead">Actor 在场景中长成。在 Space 里留下一个新起的 Actor，它就会出现在这里。</p>
      <div class="cards" id="cards"></div>
    </div>`;
  }
  function renderCards() {
    const el = $('cards');
    if (!el) return;
    const q = S.q.trim();
    const ids = Object.keys(S.actors).filter(id => {
      const a = S.actors[id];
      if (a.nascent) return false;
      return !q || (a.name + a.scene + a.abilities.join('')).includes(q);
    });
    el.innerHTML = ids.map(id => {
      const a = S.actors[id];
      return `<button type="button" class="card${S.freshCard === id ? ' fresh' : ''}" data-act="open-chat" data-id="${id}">
        <div class="top">${av(id, 56)}<div><div class="nm">${esc(a.name)}</div><div class="sc">${esc(a.scene)}</div></div></div>
        ${a.abilities.length ? `<div class="chips">${a.abilities.slice(0, 3).map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
        <div class="foot">${esc(a.last || '刚刚长成')} · 在 ${a.spaces || 1} 个 Space 里</div>
      </button>`;
    }).join('') || `<div class="none">没有找到「${esc(q)}」</div>`;
    S.freshCard = null;
  }

  /* ============ 一对一对话 ============ */
  function renderSoloChat() {
    const id = S.chatWith, a = actor(id);
    const msgs = S.chats[id] || [];
    const body = msgs.map(m => {
      if (m.k === 'user') return `<div class="user-msg">${esc(m.t)}</div>`;
      let inner;
      if (m.typing) inner = `<div class="typing"><i></i><i></i><i></i></div>`;
      else if (m.shown != null) inner = `<p>${esc(m.plain.slice(0, m.shown))}<span class="caret"></span></p>`;
      else inner = `<p>${esc(m.t)}</p>`;
      return `<div class="coord-msg">${inner}</div>`;
    }).join('');
    return `<div class="column">
      <div class="solo-intro">${av(id, 56)}<h2>${esc(a.name)}</h2><p>${esc(a.scene)}</p>
        ${a.abilities.length ? `<div class="chips" style="justify-content:center">${a.abilities.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
      </div>
      ${body}
    </div>`;
  }

  /* ============ 胶囊 ============ */
  function renderPills() {
    const c = cur();
    if (S.view !== 'space' || c.msgs.length === 0) { $('pills').innerHTML = ''; return; }
    const n = st => c.members.filter(m => m.status === st).length;
    const waitOthers = c.members.filter(m => m.status === 'wait' && m.id !== S.tab).length;
    const parts = [];
    if (waitOthers) parts.push(`<button type="button" class="pill warn" data-act="pill-wait" aria-pressed="${S.trayOpen}"><span class="dot wait"></span>${waitOthers} 等你决定</button>`);
    ['fail', 'run', 'result', 'idle'].forEach(st => { if (n(st)) parts.push(`<button type="button" class="pill" data-act="pill-other"><span class="dot ${st}"></span>${n(st)} ${STATUS[st]}</button>`); });
    $('pills').innerHTML = parts.join('');
  }

  /* ============ 审批托盘 ============ */
  // 正在看的那个 Actor 的审批已经在眼前，托盘里不再重复
  const trayList = () => pending().filter(m => m.id !== S.tab);
  function renderTray() {
    const list = S.view === 'space' ? trayList() : [];
    const open = S.trayOpen && list.length > 0;
    $('tray').classList.toggle('open', open);
    if (!open) { $('trayBody').innerHTML = ''; $('trayActs').innerHTML = ''; $('trayAv').innerHTML = ''; return; }
    S.trayIdx = Math.min(S.trayIdx, list.length - 1);
    const m = list[S.trayIdx];
    $('trayAv').innerHTML = av(m.id, 22);
    $('trayBody').innerHTML = `<div class="t1">${esc(nameOf(m.id))} 想运行一条命令</div><div class="t2">${esc(m.approval.cmd)}</div>`;
    $('trayActs').innerHTML = `
      ${list.length > 1 ? `<button type="button" class="btn nav" data-act="tray-prev" aria-label="上一个">${ic('left', 'xs')}</button><span class="pager">${S.trayIdx + 1}/${list.length}</span><button type="button" class="btn nav" data-act="tray-next" aria-label="下一个">${ic('right', 'xs')}</button>` : ''}
      <button type="button" class="btn ghost" data-act="tray-view" data-id="${m.id}">查看</button>
      <button type="button" class="btn" data-act="deny-agent" data-id="${m.id}">拒绝</button>
      <button type="button" class="btn primary" data-act="run-agent" data-id="${m.id}">运行</button>`;
  }

  /* ============ 右栏 ============ */
  // 沿用桌面端现有右栏的标签体系，只是协调 Agent 换一组标签
  const KIND = {
    agents: { label: 'Actor', icon: 'users', desc: 'Space 里每个 Actor 在做什么' },
    lib: { label: '库', icon: 'lib', desc: 'Actor 产出和你放进去的文件' },
    mem: { label: '记忆', icon: 'brain', desc: '指令和 Space 记忆' },
    files: { label: '文件', menu: '工作区文件', icon: 'folderTree', desc: '浏览工作目录' },
    term: { label: '终端', icon: 'terminal', desc: '在这个目录里开终端' },
    sub: { label: '子 Agent', icon: 'bot', desc: '这次对话派出的一次性助手' },
    review: { label: 'Review', icon: 'branch', desc: '这次的改动' },
    ctx: { label: '上下文', icon: 'eye', desc: '上下文用了多少' },
    viz: { label: '可视化回复', icon: 'chat', desc: '图表、页面形式的回复' },
    file: { label: '文件', icon: 'file' }
  };
  // 协调 Agent：Actor / 库 / 记忆，加上只给你用的文件和终端；没有可视化回复、上下文、Review、子 Agent
  const COORD_KINDS = ['agents', 'lib', 'mem', 'files', 'term'];
  // Actor 标签页和一对一对话：和普通会话完全一样（启动页磁贴与「+」菜单的顺序照搬现有右栏）
  const SESSION_TILES = ['sub', 'files', 'review', 'ctx', 'term', 'viz'];
  const SESSION_MENU = ['files', 'review', 'term', 'viz', 'ctx'];
  const isCoord = () => S.view === 'space' && S.tab === 'coord';
  const ctxKey = () => S.view === 'chat' ? 'chat:' + S.chatWith : S.view === 'space' ? S.spaceId + ':' + S.tab : null;
  function rpCtx() {
    const k = ctxKey();
    if (!k) return null;
    if (!S.rpCtx[k]) S.rpCtx[k] = isCoord()
      ? { tabs: [{ id: 'agents', kind: 'agents' }, { id: 'lib', kind: 'lib' }, { id: 'mem', kind: 'mem' }], active: 'agents' }
      : S.view === 'space' ? actorDefaults(member(S.tab))
      : { tabs: [{ id: 'files', kind: 'files' }], active: 'files' };
    return S.rpCtx[k];
  }
  // 切到 Actor 时右栏直接有内容，不落到空启动页：有改动开 Review，没有就开文件；都带上终端
  function actorDefaults(m) {
    const first = m && m.transcript.some(b => b.diff) ? 'review' : 'files';
    return { tabs: [{ id: first, kind: first }, { id: 'term', kind: 'term' }], active: first };
  }
  function openKind(kind, extra) {
    const x = rpCtx();
    if (!x) return;
    const id = extra && extra.path ? 'file:' + extra.path : kind;
    if (!x.tabs.some(t => t.id === id)) x.tabs.push({ id, kind, ...extra });
    x.active = id;
    S.rpOpen = true;
  }
  function closeRpTab(id) {
    const x = rpCtx();
    const i = x ? x.tabs.findIndex(t => t.id === id) : -1;
    if (i < 0) return;
    x.tabs.splice(i, 1);
    if (x.active === id) x.active = (x.tabs[i - 1] || x.tabs[0] || {}).id || null;
  }
  // 当前上下文在哪个目录：协调 Agent 看 Space 的相关目录，Actor 看自己的目录或工作树
  function scope() {
    if (S.view === 'chat') return { roots: ['payments-api'], dir: 'payments-api', branch: 'main' };
    const c = cur();
    if (S.tab === 'coord') { const roots = c.dirs.length ? c.dirs : ['checkout-web']; return { roots, dir: roots[0], coord: true }; }
    const m = member(S.tab);
    return { roots: [m.dir], dir: m.dir, branch: m.tree || 'main', tree: m.tree, m };
  }

  let rpSig = '';
  function renderRight() {
    const on = S.rpOpen && S.view !== 'roster';
    $('objBtn').hidden = !on;
    $('rpBtn').setAttribute('aria-pressed', String(on));
    if (!on) { rpSig = ''; return; }
    const x = rpCtx(), sc = scope();
    const tab = x.tabs.find(t => t.id === x.active);
    const kind = tab ? tab.kind : 'launcher';
    $('rpTabs').innerHTML = x.tabs.length
      ? x.tabs.map(t => `<div class="rtab" role="tab" data-act="rp-pick" data-id="${esc(t.id)}" aria-selected="${t.id === x.active}" title="${esc(t.path || KIND[t.kind].label)}"><span class="lbl">${esc(t.label || KIND[t.kind].label)}</span><button type="button" class="x" data-act="rp-close" data-id="${esc(t.id)}" aria-label="关闭">${ic('x', 'xs')}</button></div>`).join('')
      : '<span class="empty-lbl">对象</span>';
    // 文件树、终端这类不随对话变化的内容，没变就不重绘，免得流式输出时打断过滤框输入
    const sig = [ctxKey(), x.active, x.tabs.length, [...S.ftOpen].join(), S.ftSel, sc.m ? sc.m.status + sc.m.transcript.length : ''].join('|');
    if (sig === rpSig && !['agents', 'lib', 'mem', 'review', 'ctx'].includes(kind)) return;
    rpSig = sig;
    const body = $('rpBody'), c = cur();
    body.className = 'rp-body' + (['launcher', 'files', 'file', 'term'].includes(kind) ? ' flush' : '');
    body.innerHTML =
      kind === 'launcher' ? renderLauncher()
      : kind === 'agents' ? renderAgents(c)
      : kind === 'lib' ? renderLib(c)
      : kind === 'mem' ? renderMem(c)
      : kind === 'files' ? renderFiles(sc)
      : kind === 'file' ? renderFile(tab)
      : kind === 'term' ? renderTerm(sc)
      : kind === 'review' ? renderReview(sc)
      : kind === 'ctx' ? renderUsage(sc)
      : kind === 'sub' ? `<div class="empty">${ic('bot')}<div>这次对话还没有子 Agent。<br>子 Agent 是一次性的只读助手，和 Space 里的 Actor 是两回事。</div></div>`
      : `<div class="empty">${ic('chat')}<div>还没有可视化回复。</div></div>`;
  }
  function renderObjMenu() {
    const menu = $('objMenu');
    const open = S.objMenu && S.rpOpen && S.view !== 'roster';
    menu.hidden = !open;
    $('objBtn').setAttribute('aria-expanded', String(!!open));
    if (!open) { menu.innerHTML = ''; return; }
    const kinds = isCoord() ? COORD_KINDS : SESSION_MENU;
    menu.innerHTML = kinds.map(k => `<button type="button" data-act="rp-open" data-v="${k}">${ic(KIND[k].icon)}<span>${KIND[k].menu || KIND[k].label}</span></button>`).join('');
  }
  function renderLauncher() {
    const coord = isCoord();
    const kinds = coord ? COORD_KINDS : SESSION_TILES;
    const cap = coord
      ? '协调 Agent 的右栏：<b>Actor、库、记忆</b>，再加只给你用的<b>文件</b>和<b>终端</b>。'
      : '和打开一个普通会话时的右栏一样。';
    return `<div class="launcher"><p class="cap">${cap}</p>${kinds.map(k => `<button type="button" class="lt" data-act="rp-open" data-v="${k}">${ic(KIND[k].icon)}<span>${KIND[k].label}</span><small>${KIND[k].desc}</small></button>`).join('')}</div>`;
  }

  function renderAgents(c) {
    return ORDER.map(st => {
      const list = c.members.filter(m => m.status === st);
      if (!list.length) return '';
      const closed = !!S.collapsed[st];
      return `<div class="group${closed ? ' closed' : ''}" data-group="${st}">
        <button type="button" class="group-head" data-act="toggle-group" data-v="${st}" aria-expanded="${!closed}">
          <span class="chev">${ic('chev', 'xs')}</span><span>${STATUS[st]}</span><span class="n">${list.length}</span>
        </button>
        <div class="group-body"><div class="group-inner">${list.map(agentRow).join('')}</div></div>
      </div>`;
    }).join('') || `<div class="empty">${ic('users')}<div>这个 Space 还没有成员。</div></div>`;
  }
  function renderLib(c) {
    const arts = c.library.filter(f => f.kind === 'artifact');

  /* ---------- 文件 ---------- */
  const FS = {

  const CODE = {
    'service.ts': [
      "import { db } from '../db';",
      "import type { Quote, QuoteItem } from './types';",
      '',
      'export async function quote(items: QuoteItem[], region: string): Promise<Quote> {',
      '  // 一次按 SKU 批量查价格，替代逐个查询',
      '  const skus = items.map((it) => it.sku);',
      '  const prices = await db.priceTable.findMany({',
      '    where: { sku: { in: skus }, region },',
      '  });',
      '  const bySku = new Map(prices.map((p) => [p.sku, p]));',
      '  const lines = items.map((it) => ({',
      '    sku: it.sku,',
      '    qty: it.qty,',
      '    unit: bySku.get(it.sku)?.amount ?? 0,',
      '  }));',
      '  return { region, lines, total: lines.reduce((s, l) => s + l.unit * l.qty, 0) };',
      '}'
    ],
    'useQuote.ts': [
      "import { useEffect, useState } from 'react';",
      "import { fetchQuote, type Quote } from '../api';",
      '',
      'const TTL = 30_000;',
      'const cache = new Map<string, { at: number; value: Quote }>();',
      '',
      'export function useQuote(cartKey: string) {',
      '  const [quote, setQuote] = useState<Quote | null>(null);',
      '  useEffect(() => {',
      '    const hit = cache.get(cartKey);',
      '    if (hit && Date.now() - hit.at < TTL) return setQuote(hit.value);',
      '    fetchQuote(cartKey).then((value) => {',
      '      cache.set(cartKey, { at: Date.now(), value });',
      '      setQuote(value);',
      '    });',
