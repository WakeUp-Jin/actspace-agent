name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run base CI checks
        run: ./scripts/ci.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23.0.0
        with:
          globs: |
            **/*.md

  workspace-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go for Browser Bridge
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugins/browser-bridge/apps/cli/go.mod
          cache-dependency-path: |
            plugins/browser-bridge/apps/cli/go.mod
            plugins/browser-bridge/packages/protocol/go.mod

      - name: Typecheck
        run: pnpm typecheck

      - name: Browser Bridge contract checks
        run: pnpm check:browser

      - name: Browser Bridge Go tests
        working-directory: plugins/browser-bridge
        run: go test ./packages/protocol/... ./apps/cli/...

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
