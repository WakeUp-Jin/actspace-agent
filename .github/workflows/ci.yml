name: CI

# 代码变更的工程门禁。每个 PR 都跑的仓库卫生检查在 base-checks.yml。
# 仓库是 public，标准 GitHub 托管 runner 不计费；这里的拆分只为缩短反馈时间。
#
# 工作流级不带路径过滤：每个 PR 都会触发，末尾的 ci-gate（「CI 汇总」）因此每次都报告结果，
# 可以设为 main ruleset 的 required status check。纯文档 PR 由 changes job 判定后跳过全部工程 job，
# 只跑 changes 与 ci-gate 两个几秒钟的 job。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 连续推送只保留最后一次；main 上的每个 push 都完整跑完。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 判断这次 PR 是否只改了文档。忽略的路径与原先工作流级 paths-ignore 相同；
  # push 到 main 和手动触发不做判断，全部 job 照常跑。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # PR 触发时检出的是 merge commit：第一父提交是 base，第二父提交是 PR head，取两层就能比较。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          code=false
          # -z 原样输出路径（中文文件名不转义）；--no-renames 让「代码文件改名成文档」也算代码改动。
          while IFS= read -r -d '' file; do
            case "${file}" in
              docs/* | *.md | .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE.md) ;;
              *)
                echo "非文档改动：${file}"
                code=true
                break
                ;;
            esac
          done < <(git diff --name-only --no-renames -z HEAD^1 HEAD)
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  # 下面四个 job 互不依赖，各自 install → 恢复 tsc 缓存 → pnpm build:deps，总时长取最长的那个。
  # 共用步骤在 .github/actions/setup-workspace；build:deps 走 tsc -b 项目引用图，缓存命中时只重编改动过的包。
  lint-typecheck:
    name: Lint 与类型检查
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # build:deps 会重新生成 tsconfig.build.json，所以图是否过期要在它之前检查。
      - name: Check desktop build graph
        run: pnpm check:desktop-build-graph

      - name: Check Agent contract matrix
        run: pnpm run gen:contract-matrix --check

      - name: Lint
        run: pnpm lint

      # 先 tsc -b 全部 packages（既是构建也是类型检查），再对 apps 和图外的两个包跑 tsc --noEmit。
      - name: Typecheck
        run: pnpm typecheck

  test-process:
    name: 仓库脚本与进程级测试
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # 进程级测试会真的拉起 Agent Host，工具 grep / glob 直接调 rg；ubuntu-latest 不预装。
      - uses: ./.github/actions/install-ripgrep

      - name: Build workspace dependencies
        run: pnpm build:deps

      # test:agent-host:process 等直接 spawn apps/cli/dist/cli.js，依赖已由 build:deps 产出，这里只编 CLI 自己。
      - name: Build Agent CLI
        run: pnpm --filter @actspace/agent-cli build

      - name: Test
        run: pnpm test:scripts

  test-packages:
    name: 包测试
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # tool-fs-search 的 grep / glob 直接调 rg，它的测试需要真实二进制；ubuntu-latest 不预装。
      - uses: ./.github/actions/install-ripgrep

      - name: Build workspace dependencies
        run: pnpm build:deps

      # desktop 单独一个分片 job；其余包在这里跑。
      # 只带排除式 --filter 时 pnpm 会把 workspace 根（actspace）也选进来，根的 test 会递归回 pnpm -r test，所以要一并排除。
      - name: Test
        run: pnpm -r --if-present --filter '!@actspace/desktop' --filter '!actspace' test

  test-desktop:
    name: 桌面端测试 (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # main 进程的 runtime-v2 输出引用测试会经真实 Runtime 调 rg 搜索落盘的大输出；ubuntu-latest 不预装。
      - uses: ./.github/actions/install-ripgrep

      - name: Build workspace dependencies
        run: pnpm build:deps

      # desktop 单包 300 多个测试文件、CPU 时间 6 min 以上，单台 4 vCPU runner 要 2 min 多；按文件数对半切到两台。
      - name: Test
        run: pnpm --filter @actspace/desktop exec vitest run --shard=${{ matrix.shard }}/2

  build:
    name: 构建
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 打包脚本会 go build 浏览器桥 CLI（scripts/package-browser-components.mjs）。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'pull_request'
        with:
          go-version-file: browser-bridge/apps/cli/go.mod
          cache-dependency-path: |
            browser-bridge/apps/cli/go.mod
            browser-bridge/packages/protocol/go.mod

      # 只在 main 上验证打包脚本还能跑通，不上传产物；正式产物由 release.yml 负责。
      - name: Package desktop (smoke)
        if: github.event_name != 'pull_request'
        run: ./scripts/release-package.sh

  site:
    name: 官网
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check site
        run: pnpm check:site

      - name: Test site
        run: pnpm test:site

      - name: Build site
        env:
          SITE_URL: https://example.com
          SITE_BASE: /
        run: pnpm build:site

  browser-bridge:
    name: Browser Bridge
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browser-bridge/apps/cli/go.mod
          cache-dependency-path: |
            browser-bridge/apps/cli/go.mod
            browser-bridge/packages/protocol/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Browser Bridge contract checks
        run: pnpm check:browser

      - name: Browser Bridge Go tests
        working-directory: browser-bridge
        run: go test ./packages/protocol/... ./apps/cli/...

      # release.yml 会在 macOS / Windows runner 上 go build 这个 CLI；这里提前交叉编译，
      # 省得 Unix-only 的 syscall 用法要等到发布流水线才暴露。
      - name: Browser Bridge cross-compile
        working-directory: browser-bridge/apps/cli
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .

  # 汇总 job：每个 PR 都会运行并报告一次结果，是 ci.yml 里唯一适合设为 required status check 的 job。
  # 被 changes 判定跳过的 job 结果是 skipped，算通过；任何一个 failure 或 cancelled 都让它失败。
  # 用 always() 而不是 !cancelled()：运行被取消时这个 job 也要跑并失败，否则 skipped 会被 ruleset 当成通过。
  ci-gate:
    name: CI 汇总
    needs:
      - changes
      - lint-typecheck
      - test-process
      - test-packages
      - test-desktop
      - build
      - site
      - browser-bridge
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "${NEEDS}"

      - name: Fail when any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::有 job 失败或被取消，见本次运行的 job 列表"
          exit 1
