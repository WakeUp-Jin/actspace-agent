name: CI

# 代码变更的工程门禁。不带路径过滤、每个 PR 都跑的仓库卫生检查在 base-checks.yml。
# 仓库是 public，标准 GitHub 托管 runner 不计费；这里的拆分只为缩短反馈时间。
#
# 只改文档的 PR 和 main 上只改文档的 push 都不触发，所以这里的 job 不能设为必需检查（见 docs/CICD.md）。
# 规则按顺序求值，后面的覆盖前面的：先全选，再排掉没有任何 job 会读的文档，最后把 docs/ 里被构建或检查
# 读取的文件加回来。别处的 Markdown（官网内容、内置 skill、prompt、测试夹具）是构建和测试的输入，不排除。
# 让某个 job 读 docs/ 下的新文件时，要把它加到最后一段，否则只改它的提交不会跑 CI。
on:
  pull_request:
    paths: &code-paths
      - '**'
      - '!docs/**'
      - '!**/README.md'
      - '!*.md'
      - '!.agents/**/*.md'
      - '!apps/site/*.md'
      - '!browser-bridge/docs/**'
      - '!browser-bridge/skill/SKILL.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/PULL_REQUEST_TEMPLATE.md'
      # 官网的开发计划页和更新日志页
      - 'docs/roadmap.md'
      - 'docs/releases/feature-release-notes.md'
      # pnpm check:browser
      - 'docs/design-docs/browser/agent-browser-use-command-surface.md'
      # pnpm run gen:contract-matrix --check
      - 'docs/design-docs/agent-plugin-runtime/agent-contract-matrix.generated.md'
  push:
    branches:
      - main
    paths: *code-paths
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 连续推送只保留最后一次；main 上的每个 push 都完整跑完。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 下面四个 job 互不依赖，各自 install → 恢复 tsc 缓存 → pnpm build:deps，总时长取最长的那个。
# 共用步骤在 .github/actions/setup-workspace；build:deps 走 tsc -b 项目引用图，缓存命中时只重编改动过的包。
jobs:
  lint-typecheck:
    name: Lint 与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # build:deps 会重新生成 tsconfig.build.json，所以图是否过期要在它之前检查。
      - name: Check desktop build graph
        run: pnpm check:desktop-build-graph

      - name: Check Agent contract matrix
        run: pnpm run gen:contract-matrix --check

      - name: Lint
        run: pnpm lint

      # 先 tsc -b 全部 packages（既是构建也是类型检查），再对 apps 和图外的两个包跑 tsc --noEmit。
      - name: Typecheck
        run: pnpm typecheck

  test-process:
    name: 仓库脚本与进程级测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # 进程级测试会真的拉起 Agent Host，工具 grep / glob 直接调 rg；ubuntu-latest 不预装。
      - uses: ./.github/actions/install-ripgrep

      - name: Build workspace dependencies
        run: pnpm build:deps

      # test:agent-host:process 等直接 spawn apps/cli/dist/cli.js，依赖已由 build:deps 产出，这里只编 CLI 自己。
      - name: Build Agent CLI
        run: pnpm --filter @actspace/agent-cli build

      - name: Test
        run: pnpm test:scripts

  test-packages:
    name: 包测试 (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # tool-fs-search 的 grep / glob 直接调 rg，它的测试需要真实二进制；ubuntu-latest 不预装。
      - uses: ./.github/actions/install-ripgrep

      - name: Build workspace dependencies
        run: pnpm build:deps

      # desktop 单独一个分片 job；其余包分两台跑。第 1 片是下面列出的目录，第 2 片是剩下的全部：
      # 两片的 filter 由同一份清单生成，一正一反，所以新增的包目录不用登记，自动落在第 2 片。
      # 测试只读 build:deps 的产物，包之间没有先后依赖，--no-sort 让 pnpm 不必按依赖拓扑一批一批地等。
      # 第 2 片同时只跑 2 个包（pnpm 默认 4 个）：它是四十多个小包，已知的时间敏感用例都在里面；每个包的 vitest 自己还要开
      # 最多 3 个 worker，4 个包一起跑时十几个进程抢 4 个核。降到 2 个之后各包快一倍，整片的时间不变。
      # 第 1 片用默认并发：它的时间集中在 apps/cli、apps/web、packages/core/runtime 三个各要 20 s 上下的包上，
      # 只开 2 个时它们排成两条队，这一步从 50 s 涨到 74 s。
      # 只带排除式 --filter 时 pnpm 会把 workspace 根（actspace）也选进来，根的 test 会递归回 pnpm -r test，所以要一并排除。
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          args=()
          for dir in './packages/core/**' './packages/context/**' './apps/*'; do
            if [ "$SHARD" = 1 ]; then args+=(--filter "$dir"); else args+=(--filter "!$dir"); fi
          done
          if [ "$SHARD" = 2 ]; then args+=(--workspace-concurrency=2); fi
          pnpm -r --no-sort --if-present "${args[@]}" --filter '!@actspace/desktop' --filter '!actspace' test

  test-desktop:
    name: 桌面端测试 (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # main 进程的 runtime-v2 输出引用测试会经真实 Runtime 调 rg 搜索落盘的大输出；ubuntu-latest 不预装。
      - uses: ./.github/actions/install-ripgrep

      - name: Build workspace dependencies
        run: pnpm build:deps

      # desktop 单包 300 多个测试文件、CPU 时间 6 min 以上，单台 4 vCPU runner 要 2 min 多；按文件数切到三台。
      # 片数只由上面的 matrix 决定，这里和 job 名都取 strategy.job-total。
      - name: Test
        run: pnpm --filter @actspace/desktop exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR 上验证发布路径能把 desktop、CLI、Web 都构建出来。
      - name: Build
        if: github.event_name == 'pull_request'
        run: pnpm build

      # main 上（和手动触发时）换成下面三步：打包脚本的第一步就是 pnpm build 里的 desktop 构建，
      # 之后再补 CLI 和 Web。构建的内容和 PR 上一样，只是 desktop 不用构建两遍。
      # 打包脚本会 go build 浏览器桥 CLI（scripts/package-browser-components.mjs）。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'pull_request'
        with:
          go-version-file: browser-bridge/apps/cli/go.mod
          cache-dependency-path: |
            browser-bridge/apps/cli/go.mod
            browser-bridge/packages/protocol/go.mod

      # 验证打包脚本还能跑通，不上传产物；正式产物由 release.yml 负责。
      - name: Package desktop (smoke)
        if: github.event_name != 'pull_request'
        run: ./scripts/release-package.sh

      - name: Build CLI and Web
        if: github.event_name != 'pull_request'
        run: pnpm build:cli-web

  site:
    name: 官网
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 这里只做别的 job 不做的那一步。官网的 astro check 已经在「Lint 与类型检查」的 pnpm typecheck 里
      # （apps/site 的 typecheck 和 check 是同一条命令），单元测试在「包测试」的 pnpm -r test 里。
      - name: Build site
        env:
          SITE_URL: https://example.com
          SITE_BASE: /
        run: pnpm build:site

  browser-bridge:
    name: Browser Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # 缓存 key 只在第一次没命中时保存一次，之后不再更新。这里比「构建」和 release.yml 多算一个 go.work，
      # 让这个 job 有自己的 key：它要缓存的是 go test 和两个交叉编译目标的产物，那两处只编本机的 CLI，
      # 共用一个 key 时谁先存谁占住，另一边每次都从头编。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browser-bridge/apps/cli/go.mod
          cache-dependency-path: |
            browser-bridge/go.work
            browser-bridge/apps/cli/go.mod
            browser-bridge/packages/protocol/go.mod

      # 这个 job 里有两处自己起 go 的地方：check-browser-command-registry.mjs 的 go run，和 apps/cli 测试里
      # ensureDevHostWrapper 的 go build。环境里没有 GOCACHE 时它们都把编译产物放进临时目录，等于绕开上面恢复的缓存
      # 把 CLI 从头再编一遍。这里把 go 的默认缓存位置写进环境，让它们和 go test、交叉编译共用同一份。
      - name: Point nested Go builds at the restored cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      # 恢复出来的缓存文件带着保存那天的修改时间，而 go 每次构建结束时会删掉 5 天没用过的缓存条目。
      # 缓存存下 5 天之后，这个 job 的第一条 go 命令一跑完，go test 和交叉编译要用的条目就被删掉了，等于白恢复。
      # 这里把条目的时间刷新成现在。只跑一条 go 命令的 job（「构建」、release.yml）不受影响。
      - name: Keep restored Go cache entries from being trimmed
        run: |
          if [ -d "$GOCACHE" ]; then find "$GOCACHE" -exec touch {} +; fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Browser Bridge contract checks
        run: pnpm check:browser

      - name: Browser Bridge Go tests
        working-directory: browser-bridge
        run: go test ./packages/protocol/... ./apps/cli/...

      # release.yml 会在 macOS / Windows runner 上 go build 这个 CLI；这里提前交叉编译，
      # 省得 Unix-only 的 syscall 用法要等到发布流水线才暴露。
      - name: Browser Bridge cross-compile
        working-directory: browser-bridge/apps/cli
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
