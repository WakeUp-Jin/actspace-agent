name: CI

# 代码变更的工程门禁。不带路径过滤、每个 PR 都跑的仓库卫生检查在 base-checks.yml。
# 仓库是 public，标准 GitHub 托管 runner 不计费；这里的拆分只为缩短反馈时间。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 连续推送只保留最后一次；main 上的每个 push 都完整跑完。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-test:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install ripgrep
        # tool-fs-search 的 grep / glob 直接调 rg，它的测试需要真实二进制；ubuntu-latest 不预装。
        run: sudo apt-get install -y --no-install-recommends ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Agent contract matrix
        run: pnpm run gen:contract-matrix --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # test:agent-host:process 等进程级测试直接 spawn apps/cli/dist/cli.js，runner 上没有现成的 dist。
      - name: Build Agent CLI for process tests
        run: pnpm --filter '@actspace/agent-cli...' build

      - name: Test
        run: pnpm test

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 打包脚本会 go build 浏览器桥 CLI（scripts/package-browser-components.mjs）。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'pull_request'
        with:
          go-version-file: browser-bridge/apps/cli/go.mod
          cache-dependency-path: |
            browser-bridge/apps/cli/go.mod
            browser-bridge/packages/protocol/go.mod

      # 只在 main 上验证打包脚本还能跑通，不上传产物；正式产物由 release.yml 负责。
      - name: Package desktop (smoke)
        if: github.event_name != 'pull_request'
        run: ./scripts/release-package.sh

  site:
    name: 官网
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check site
        run: pnpm check:site

      - name: Test site
        run: pnpm test:site

      - name: Build site
        env:
          SITE_URL: https://example.com
          SITE_BASE: /
        run: pnpm build:site

  browser-bridge:
    name: Browser Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: browser-bridge/apps/cli/go.mod
          cache-dependency-path: |
            browser-bridge/apps/cli/go.mod
            browser-bridge/packages/protocol/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Browser Bridge contract checks
        run: pnpm check:browser

      - name: Browser Bridge Go tests
        working-directory: browser-bridge
        run: go test ./packages/protocol/... ./apps/cli/...

      # release.yml 会在 macOS / Windows runner 上 go build 这个 CLI；这里提前交叉编译，
      # 省得 Unix-only 的 syscall 用法要等到发布流水线才暴露。
      - name: Browser Bridge cross-compile
        working-directory: browser-bridge/apps/cli
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
