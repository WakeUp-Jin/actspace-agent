name: 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要创建的 release tag，例如 v0.1.0
        required: true
      title:
        description: 给人看的发布标题
        required: false

permissions:
  contents: read

jobs:
  package-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包 release 制品
        env:
          ACTSPACE_MAC_CODESIGN_IDENTITY: ${{ secrets.ACTSPACE_MAC_CODESIGN_IDENTITY }}
          ACTSPACE_MAC_NOTARIZE: ${{ secrets.ACTSPACE_MAC_NOTARIZE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release-package.sh

      - name: 生成 SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: 上传 release 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/actspace-desktop-*.tar.gz
            dist/actspace-desktop-*.dmg
            dist/release-manifest.json
            dist/sbom.spdx.json

      - name: 生成 build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/actspace-desktop-*.tar.gz
            dist/actspace-desktop-*.dmg

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title || inputs.tag }}
          files: |
            dist/actspace-desktop-*.tar.gz
            dist/actspace-desktop-*.dmg
            dist/release-manifest.json
            dist/sbom.spdx.json
