name: Agent CLI managed package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/cli/**
      - packages/**
      - scripts/package-agent-cli.mjs
      - scripts/test-agent-cli-package.mjs
      - scripts/test/agent-cli-process.test.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/agent-cli-binaries.yml

permissions:
  contents: read

concurrency:
  group: agent-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  managed-esm:
    name: managed ESM package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # 固定在 CLI 支持的最低 Node 大版本上验证 managed package。
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:agent-cli
      - run: pnpm test:agent-cli:process
      - run: pnpm test:agent-cli:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actspace-agent-managed-${{ runner.arch }}
          path: artifacts/agent-cli-managed/
          if-no-files-found: error
          # 只是给评审下载看一眼；正式产物走 release，不占 Actions 存储额度。
          retention-days: 3
