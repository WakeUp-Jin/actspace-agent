name: Agent CLI managed package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/cli/**
      - packages/**
      - scripts/package-agent-cli.mjs
      - scripts/test-agent-cli-package.mjs
      - scripts/test/agent-cli-process.test.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  managed-esm:
    name: managed ESM package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:agent-cli
      - run: pnpm test:agent-cli:process
      - run: pnpm test:agent-cli:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actspace-agent-managed-${{ runner.arch }}
          path: artifacts/agent-cli-managed/
          if-no-files-found: error
          retention-days: 14
