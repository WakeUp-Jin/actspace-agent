name: 文档

# 只改文档时跑的轻量检查，与 ci.yml 的 paths-ignore 互补。
on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.markdownlint.json'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/check-docs.sh'
      - 'scripts/check-current-docs.mjs'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-checks:
    name: 文档检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ripgrep
        # scripts/check-secrets.sh 依赖 rg；ubuntu-latest 镜像不预装。
        run: sudo apt-get install -y --no-install-recommends ripgrep

      - name: Run base CI checks
        run: ./scripts/ci.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
