name: 仓库基础检查

# 不带路径过滤的 PR 工作流：每个 PR 都会产生「仓库基础检查」这一个 check，
# 因此可以安全设为 main ruleset 的 required status check。ci.yml 的「CI 汇总」同理。
# 其他带工作流级 paths 过滤的工作流只在相关文件改动时触发，设为必需会把不相关的 PR 卡死。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: 仓库基础检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/check-secrets.sh 依赖 rg；ubuntu-latest 镜像不预装。
      - uses: ./.github/actions/install-ripgrep

      - name: Run base CI checks
        run: ./scripts/ci.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
